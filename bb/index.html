<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Blast</title>
    <link rel="stylesheet" href="style.css">
    <!-- Mobile Friendly -->
    <link rel="stylesheet" href="/mobile-friendly.css">
</head>
<body>
    <div class="game-container">
        <div class="header glass-panel">
            <div class="top-bar">
                <h1>Block Blast</h1>
                <button id="settings-btn" class="icon-btn">⚙️</button>
            </div>
            <div class="stats-container">
                <div class="score-container">
                    <span class="label">Score</span>
                    <span id="score">0</span>
                </div>
                <div class="score-container">
                    <span class="label">Best</span>
                    <span id="high-score">0</span>
                </div>
                <div id="combo-container" class="score-container hidden">
                    <span class="label">Combo</span>
                    <span id="combo-multiplier">x1</span>
                </div>
            </div>
        </div>

        <div id="game-board" class="grid glass-panel"></div>

        <div class="controls-container">
            <div id="piece-tray" class="tray">
                <div class="piece-slot" id="slot-0"></div>
                <div class="piece-slot" id="slot-1"></div>
                <div class="piece-slot" id="slot-2"></div>
            </div>
            
            <div class="power-ups">
                <button id="powerup-hammer" class="power-up-btn" title="Hammer: Remove a block">
                    <span class="icon">🔨</span>
                    <span class="count" id="hammer-count">3</span>
                </button>
                <button id="powerup-refresh" class="power-up-btn" title="Refresh: Get new pieces">
                    <span class="icon">🔄</span>
                    <span class="count" id="refresh-count">3</span>
                </button>
            </div>
        </div>

        <div id="game-over" class="modal hidden">
            <div class="modal-content glass-panel">
                <h2>Game Over!</h2>
                <p>Your score: <span id="final-score">0</span></p>
                <div id="new-best-msg" class="hidden">New Best! 🏆</div>
                <button id="restart-btn" class="primary-btn">Play Again</button>
            </div>
        </div>

        <div id="settings-modal" class="modal hidden">
            <div class="modal-content glass-panel">
                <h2>Settings</h2>
                <div class="setting-item">
                    <span>Sound Effects</span>
                    <label class="switch">
                        <input type="checkbox" id="sound-toggle" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="setting-item">
                    <span>Theme</span>
                    <div class="theme-options">
                        <button class="theme-btn active" data-theme="default" title="Midnight"></button>
                        <button class="theme-btn" data-theme="cyberpunk" title="Cyberpunk"></button>
                        <button class="theme-btn" data-theme="forest" title="Forest"></button>
                    </div>
                </div>
                <button id="close-settings" class="primary-btn">Close</button>
            </div>
        </div>
    </div>
    <script src="/vendor/confetti.browser.min.js"></script>
    <script src="script.js"></script>
    <script>(function(){const v=Date.now();document.write('<script src="/global-header.js?v='+v+'"><\/script>');})();</script>
    <script src="/accounts/account-widget.js" defer data-account-api="https://accounts-system.b4rjxr9lk.workers.dev" data-account-autoscore="true" data-account-sync="blockBlast_highScore:best-score:Best score:remote|blockBlast_theme:theme:Theme:remote|blockBlast_sound:sound:Sound:remote"></script>
</body>
</html>
