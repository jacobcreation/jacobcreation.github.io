<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Cache Busting Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Image Generator</title>
    <link href="/fonts/fonts.css" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
    <!-- Mobile Friendly -->
    <link rel="stylesheet" href="/mobile-friendly.css">
</head>

<body>

    <div class="container">

        <header>
            <div class="logo-badge">
                <span class="logo-dot"></span>
                AI Image Generator
            </div>
            <h1>AI <span>Image</span> Generator</h1>
            <p class="subtitle">Type an idea and generate a polished image.</p>
        </header>

        <div class="input-card">
            <div class="model-row">
                <label class="input-label" for="modelSelect">Model</label>
                <select id="modelSelect">
                    <optgroup label="🟢 NVIDIA NIM (Hosted)">
                        <option value="nim/black-forest-labs/flux.1-schnell" selected>FLUX.1 Schnell — fast & sharp</option>
                        <option value="nim/black-forest-labs/flux.1-dev">FLUX.1 Dev — maximum quality</option>
                    </optgroup>
                    <optgroup label="⚡ FLUX (Hugging Face)">
                        <option value="black-forest-labs/FLUX.1-schnell">FLUX.1 Schnell — fallback</option>
                    </optgroup>
                    <optgroup label="☁️ Cloudflare AI">
                        <option value="@cf/black-forest-labs/flux-1-schnell">FLUX.1 Schnell</option>
                        <option value="@cf/black-forest-labs/flux-2-dev">FLUX.2 Dev — detailed & realistic</option>
                        <option value="@cf/black-forest-labs/flux-2-klein-4b">FLUX.2 Klein 4B — ultra fast</option>
                        <option value="@cf/black-forest-labs/flux-2-klein-9b">FLUX.2 Klein 9B — quality & speed</option>
                        <option value="@cf/leonardo/lucid-origin">Lucid Origin — prompt-accurate</option>
                        <option value="@cf/leonardo/phoenix-1.0">Phoenix 1.0 — coherent text</option>
                        <option value="@cf/black-forest-labs/flux-1-dev">FLUX.1 Dev</option>
                        <option value="@cf/black-forest-labs/flux-1-klein-4b">FLUX.1 Klein 4B</option>
                        <option value="@cf/black-forest-labs/flux-1-klein-9b">FLUX.1 Klein 9B</option>
                        <option value="@cf/bytedance/stable-diffusion-xl-lightning">SDXL Lightning</option>
                        <option value="@cf/lykon/dreamshaper-8-lcm">Dreamshaper 8 LCM</option>
                        <option value="@cf/stabilityai/stable-diffusion-xl-base-1.0">SDXL Base 1.0</option>
                    </optgroup>
                </select>
            </div>

            <label class="input-label" for="prompt">Your image idea</label>
            <div class="input-row" style="flex-wrap: wrap;">
                <input id="prompt" type="text" placeholder='e.g. "cat sitting by a sunny window"' maxlength="200" />
                <button id="genBtn" onclick="generate()">Generate ✦</button>
            </div>
        </div>

        <div id="errorMsg" class="error"></div>

        <div class="meme-area" id="memeArea">
            <div class="placeholder" id="placeholder">
                <span class="placeholder-emoji">🖼️</span>
                <p class="placeholder-text">Your image will appear here</p>
            </div>
            <div class="spinner-wrap" id="spinnerWrap">
                <div class="spinner"></div>
                <span class="spinner-label" id="spinnerLabel">Generating your image...</span>
            </div>
            <img id="memeImg" alt="Generated image" style="display:none" />
            <div id="memeBg" role="img" aria-label="Generated image"></div>
        </div>

        <div class="enhanced-pill" id="enhancedPill">
            <strong>✦ enhanced:</strong><span id="enhancedText"></span>
        </div>

        <div class="actions">
            <button class="btn accent" id="dlBtn" onclick="downloadMeme()" disabled>↓ Download</button>
            <button class="btn" onclick="regenerate()" id="regenBtn" disabled>↺ Regenerate</button>
            <button class="btn" onclick="sharePrompt()" id="shareBtn" disabled>⎘ Copy link</button>
        </div>

        <div class="history-section" id="histSection">
            <div class="history-header">
                <span class="history-title">Recent images (session only)</span>
                <button class="clear-btn" onclick="clearHistory()">clear all</button>
            </div>
            <div class="hist-grid" id="histGrid"></div>
        </div>

        <footer>
            Powered by <a href="https://huggingface.co" target="_blank">HuggingFace</a> — Private & Secure
        </footer>

    </div>

    <button onclick="unlockUnlimited()" style="position: fixed; bottom: 5px; right: 5px; width: 15px; height: 15px; background: transparent; border: none; cursor: default; z-index: 9999;" aria-label="hidden"></button>

    <script src="app.js"></script>
<script>(function(){const v=Date.now();document.write('<script src="/global-header.js?v='+v+'"><\/script>');})();</script>
    <script src="/accounts/account-widget.js" defer data-account-api="https://accounts-system.b4rjxr9lk.workers.dev" data-account-sync="meme_history:history:Image history:remote|unlimited_mode:unlimited-mode:Unlimited mode:remote"></script>
</body>

</html>
