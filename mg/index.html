<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator - JacobCreation</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg1: #0b1020;
            --bg2: #0a1633;
            --card: rgba(255, 255, 255, 0.08);
            --card2: rgba(255, 255, 255, 0.12);
            --border: rgba(255, 255, 255, 0.14);
            --text: #eaf2ff;
            --muted: rgba(234, 242, 255, 0.75);
            --blue: #4ea1ff;
            --blue2: #2d6bff;
            --shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
            --shadow2: 0 10px 22px rgba(0, 0, 0, 0.28);
            --radius: 18px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Poppins", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            color: var(--text);
            min-height: 100vh;
            background:
                radial-gradient(1200px 600px at 20% 10%, rgba(78, 161, 255, 0.30), transparent 55%),
                radial-gradient(900px 600px at 90% 15%, rgba(45, 107, 255, 0.22), transparent 55%),
                linear-gradient(135deg, var(--bg1), var(--bg2));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 28px 18px 60px;
            width: 100%;
            text-align: center;
        }

        h1 {
            margin: 0 0 40px;
            font-size: 2.2rem;
            line-height: 1.1;
            letter-spacing: 0.2px;
        }

        .options {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .option {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            min-height: 100px;
            padding: 20px 40px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.05));
            box-shadow: var(--shadow);
            text-decoration: none;
            color: var(--text);
            font-weight: 700;
            font-size: 1.2rem;
            transition: transform 0.18s ease, background 0.18s ease, border 0.18s ease;
        }

        .option:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.22);
        }

        .option-image {
            background: linear-gradient(135deg, rgba(78, 161, 255, 0.25), rgba(45, 107, 255, 0.18));
        }

        .option-video {
            background: linear-gradient(135deg, rgba(240, 147, 251, 0.25), rgba(245, 87, 108, 0.18));
        }

        .icon {
            font-size: 2rem;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8rem;
            }

            .options {
                flex-direction: column;
            }

            .option {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <main>
        <h1>What would you like to generate?</h1>
        <div class="options">
            <a href="https://jacobcreation.github.io/mg/image/" class="option option-image">
                <span class="icon">🖼️</span>
                Image Generating
            </a>
            <a href="https://jacobcreation.github.io/mg/video/" class="option option-video">
                <span class="icon">🎬</span>
                Video Generating
            </a>
        </div>
    </main>
<script>(function(){const v=Date.now();document.write('<script src="/global-header.js?v='+v+'"><\/script>');})();</script>
</body>

</html>
