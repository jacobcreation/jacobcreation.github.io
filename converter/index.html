<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Cache Busting Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JacobConvert - File Converter</title>

  <!-- Fonts -->
  <link href="/fonts/fonts.css" rel="stylesheet">
  <link href="/fonts/fonts.css" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main>
    <div class="hero-section">
      <h1>JacobConvert</h1>
      <p>Powerful file conversion powered by CloudConvert</p>
    </div>

    <div class="card">
      <div class="row">
        <div class="input-group">
          <label for="from">From</label>
          <input id="from" placeholder="auto (from extension)">
        </div>
        <div class="input-group">
          <label for="to">To</label>
          <input id="to" placeholder="choose format below">
        </div>
        <button id="convert" disabled>🚀 Convert Now</button>
      </div>

      <span class="formats-label">Recommended Formats</span>
      <div id="categories"></div>

      <div id="drop" class="drop">
        <div class="drop-text">Drop a file here or</div>
        <label class="drop-btn" for="file">📁 Choose File
          <input id="file" type="file">
        </label>
      </div>

      <p id="status"></p>
    </div>
  </main>

  <footer>© 2026 JacobCreation • Built by Jacob 💙</footer>

  <script src="app.js"></script>
<script>(function(){const v=Date.now();document.write('<script src="/global-header.js?v='+v+'"><\/script>');})();</script>
    <script src="/accounts/account-widget.js" defer data-account-api="https://accounts-system.b4rjxr9lk.workers.dev"></script>
</body>

</html>
