<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Orbit Clicker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header class="stats-panel">
            <div class="stat">
                <span class="label">Energy</span>
                <span id="energy-count" class="value">0</span>
            </div>
            <div class="stat">
                <span class="label">Per Second</span>
                <span id="energy-per-second" class="value">0</span>
            </div>
        </header>

        <main class="game-area">
            <div id="orb-container">
                <div id="main-orb" class="orb"></div>
            </div>
        </main>

        <aside class="shop-panel">
            <h2>Upgrades</h2>
            <div id="upgrades-list">
                <!-- Upgrades will be dynamically injected here -->
            </div>
        </aside>
    </div>
    <script src="script.js"></script>
    <script>(function(){const v=Date.now();document.write('<script src="/global-header.js?v='+v+'"><\/script>');})();</script>
    <script src="/accounts/account-widget.js" defer data-account-api="https://accounts-system.b4rjxr9lk.workers.dev"></script>
</body>
</html>
