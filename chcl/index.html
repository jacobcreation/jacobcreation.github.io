<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chess Clock</title>

<style>
:root{
  --bg:#2b2f33;
  --panel-dark:#3a3f44;
  --panel-light:#4a4f55;
  --active:#7fa650;
  --text:#ffffff;
  --muted:#b0b6bb;
}
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
.app{
  max-width:600px;
  margin:auto;
  height:100dvh;
  display:grid;
  grid-template-rows:1fr auto 1fr;
}
.panel{
  display:grid;
  place-items:center;
  user-select:none;
  touch-action:manipulation;
  background:var(--panel-dark);
}
.panel.bottom{background:var(--panel-light)}
.panel.active{background:var(--active)}
.time{
  font-size:clamp(3rem,9vw,4.8rem);
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.name{font-size:.9rem;color:var(--muted);margin-bottom:6px}
.delay{
  font-size:.8rem;
  color:#e5f3d3;
}
.blink{animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}

.controls{
  background:#1f2327;
  padding:10px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.controls button,input{
  padding:12px;
  border-radius:8px;
  border:none;
  background:#2c3136;
  color:var(--text);
  font-weight:600;
}
.primary{background:var(--active);color:#0d1a0d}
.warn{background:#a33c3c}
.row{
  grid-column:1/-1;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
}
.footer{
  grid-column:1/-1;
  text-align:center;
  font-size:.8rem;
  color:var(--muted);
}
</style>
</head>

<body>
<div class="app">

  <!-- PLAYER A -->
  <div class="panel active" id="panelA">
    <div>
      <div class="name">Player 1</div>
      <div class="time" id="timeA">05:00</div>
      <div class="delay" id="delayA"></div>
    </div>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <button class="primary" id="playPause">▶ Play</button>
    <button class="warn" id="reset">Reset</button>

    <div class="row">
      <input id="base" type="number" value="5" min="1" placeholder="Min">
      <input id="inc" type="number" value="0" min="0" placeholder="Inc">
      <input id="delayInput" type="number" value="0" min="0" placeholder="Delay">
    </div>

    <div class="footer" id="moves">Moves: 0</div>
  </div>

  <!-- PLAYER B -->
  <div class="panel bottom" id="panelB">
    <div>
      <div class="name">Player 2</div>
      <div class="time" id="timeB">05:00</div>
      <div class="delay" id="delayB"></div>
    </div>
  </div>

</div>

<script>
let base=300, inc=0, delay=0;
let aTime=300, bTime=300;
let active="A";
let running=false;
let last=0;
let raf=null;
let moves=0;

let delayLeftA=0;
let delayLeftB=0;

const $=id=>document.getElementById(id);

function fmt(s){
  s=Math.max(0,s);
  return String(Math.floor(s/60)).padStart(2,'0')+":"+String(Math.floor(s%60)).padStart(2,'0');
}

function render(){
  timeA.textContent=fmt(aTime);
  timeB.textContent=fmt(bTime);

  delayA.textContent = active==="A" && delayLeftA>0 ? `Delay: ${delayLeftA.toFixed(1)}` : "";
  delayB.textContent = active==="B" && delayLeftB>0 ? `Delay: ${delayLeftB.toFixed(1)}` : "";

  timeA.classList.toggle("blink",aTime<=10&&aTime>0);
  timeB.classList.toggle("blink",bTime<=10&&bTime>0);

  panelA.classList.toggle("active",active==="A");
  panelB.classList.toggle("active",active==="B");

  playPause.textContent = running ? "⏸ Pause" : "▶ Play";
  movesEl.textContent = "Moves: " + moves;
}

function loop(t){
  if(!running) return;
  raf = requestAnimationFrame(loop);

  const d=(t-last)/1000;
  if(d<0.1) return;
  last=t;

  if(active==="A"){
    if(delayLeftA>0){
      delayLeftA = Math.max(0, delayLeftA - d);
    } else {
      aTime -= d;
    }
  } else {
    if(delayLeftB>0){
      delayLeftB = Math.max(0, delayLeftB - d);
    } else {
      bTime -= d;
    }
  }

  if(aTime<=0 || bTime<=0){
    running=false;
  }

  render();
}

function togglePlay(){
  if(running){
    running=false;
    cancelAnimationFrame(raf);
    raf=null;
    render();
    return;
  }

  base = +baseInput.value * 60;
  inc  = +incInput.value;
  delay = +delayInput.value;

  if(aTime===0 || bTime===0){
    aTime=bTime=base;
    active="A";
    moves=0;
  }

  running=true;
  last=performance.now();
  raf=requestAnimationFrame(loop);
  render();
}

function reset(){
  running=false;
  cancelAnimationFrame(raf);
  raf=null;

  base = +baseInput.value * 60;
  delay = +delayInput.value;

  aTime=bTime=base;
  delayLeftA=delayLeftB=0;
  active="A";
  moves=0;
  render();
}

function tap(side){
  if(!running || active!==side) return;

  if(side==="A"){
    aTime += inc;
    active="B";
    delayLeftB = delay;
  } else {
    bTime += inc;
    active="A";
    delayLeftA = delay;
  }

  moves++;
  navigator.vibrate?.(15);
  last=performance.now();
  render();
}

/* INIT */
const panelA=$("panelA"), panelB=$("panelB");
const timeA=$("timeA"), timeB=$("timeB");
const delayA=$("delayA"), delayB=$("delayB");
const baseInput=$("base"), incInput=$("inc"), delayInput=$("delayInput");
const playPause=$("playPause");
const movesEl=$("moves");

render();

/* EVENTS */
panelA.onclick=()=>tap("A");
panelB.onclick=()=>tap("B");
playPause.onclick=togglePlay;
$("reset").onclick=reset;
</script>
</body>
</html>
