<title>Chess Clock</title>

<style>
:root{
  --bg:#2b2f33;
  --panel-dark:#3a3f44;

  --text:#ffffff;
  --muted:#b0b6bb;
}
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;
  background:var(--bg);

  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
.app{
  max-width:600px;
  margin:auto;
  height:100dvh;
  display:grid;

}

.panel{
  display:grid;
  place-items:center;
  user-select:none;
  touch-action:manipulation;

}

.panel.active{

}

}

  animation:blink 1s steps(2,start) infinite;
}
@keyframes blink{to{visibility:hidden}}

/* CONTROLS */

  padding:10px;

  gap:8px;
}
.controls button,
.controls input{

}

  text-align:center;

<script>
let base=300,inc=0;
let aTime=300,bTime=300;
let active="A";
let ticking=false,last=0;
let moves=0;

const $=id=>document.getElementById(id);

function fmt(s){
  s=Math.max(0,s);
  return String(Math.floor(s/60)).padStart(2,'0')+":"+String(Math.floor(s%60)).padStart(2,'0');
}

function render(){
  timeA.textContent=fmt(aTime);
  timeB.textContent=fmt(bTime);
  timeA.classList.toggle("blink",aTime<=10&&aTime>0);
  timeB.classList.toggle("blink",bTime<=10&&bTime>0);
  panelA.classList.toggle("active",active==="A");
  panelB.classList.toggle("active",active==="B");
  movesEl.textContent="Moves: "+moves;
}

function loop(t){
  if(!ticking)return;
  requestAnimationFrame(loop);
  let d=(t-last)/1000;
  if(d<0.15)return;
  if(active==="A")aTime-=d;
  else bTime-=d;
  last=t;
  if(aTime<=0||bTime<=0)ticking=false;
  render();
}

function start(){
  if(ticking)return;
  base=+baseInput.value*60;
  inc=+incInput.value;
  if(!aTime||!bTime){
    aTime=bTime=base;
  }
  ticking=true;
  last=performance.now();
  loop(last);
}

function pause(){ticking=false}

function reset(){
  ticking=false;
  aTime=bTime=+baseInput.value*60;
  active="A";
  moves=0;
  render();
}

function tap(side){
  if(!ticking||active!==side)return;
  if(side==="A"){
    aTime+=inc;
    active="B";
  }else{
    bTime+=inc;
    active="A";
  }
  moves++;
  navigator.vibrate?.(15);
  last=performance.now();
  render();
}

render();

/* EVENTS */
panelA.onclick=()=>tap("A");
panelB.onclick=()=>tap("B");
$("start").onclick=start;
$("pause").onclick=pause;
$("reset").onclick=reset;
