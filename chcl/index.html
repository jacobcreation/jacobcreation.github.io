<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chess Clock</title>

<style>
:root{
  --bg:#2b2f33;
  --panel-dark:#3a3f44;
  --panel-light:#4a4f55;
  --active:#7fa650; /* chess.com green */
  --text:#ffffff;
  --muted:#b0b6bb;
}
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
.app{
  max-width:600px;
  margin:auto;
  height:100dvh;
  display:grid;
  grid-template-rows:1fr auto 1fr;
}

/* PANELS */
.panel{
  display:grid;
  place-items:center;
  user-select:none;
  touch-action:manipulation;
  background:var(--panel-dark);
}
.panel.bottom{background:var(--panel-light)}
.panel.active{
  background:var(--active);
}
.time{
  font-size:clamp(3rem,9vw,4.8rem);
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.name{
  font-size:.9rem;
  color:var(--muted);
  margin-bottom:6px;
}
.blink{
  animation:blink 1s steps(2,start) infinite;
}
@keyframes blink{to{visibility:hidden}}

/* CONTROLS */
.controls{
  background:#1f2327;
  padding:10px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.controls button,
.controls input{
  padding:12px;
  border-radius:8px;
  border:none;
  background:#2c3136;
  color:var(--text);
  font-weight:600;
}
.controls button.primary{
  background:var(--active);
  color:#0d1a0d;
}
.controls button.warn{
  background:#a33c3c;
}
.row{
  grid-column:1/-1;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.footer{
  grid-column:1/-1;
  text-align:center;
  font-size:.8rem;
  color:var(--muted);
}
</style>
</head>

<body>
<div class="app">

  <!-- PLAYER A -->
  <div class="panel active" id="panelA">
    <div>
      <div class="name">Player 1</div>
      <div class="time" id="timeA">05:00</div>
    </div>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <button class="primary" id="start">Start</button>
    <button id="pause">Pause</button>
    <button class="warn" id="reset">Reset</button>

    <div class="row">
      <input type="number" id="base" min="1" value="5" placeholder="Minutes">
      <input type="number" id="inc" min="0" value="0" placeholder="Increment">
    </div>

    <div class="footer" id="moves">Moves: 0</div>
  </div>

  <!-- PLAYER B -->
  <div class="panel bottom" id="panelB">
    <div>
      <div class="name">Player 2</div>
      <div class="time" id="timeB">05:00</div>
    </div>
  </div>

</div>

<script>
let base=300,inc=0;
let aTime=300,bTime=300;
let active="A";
let ticking=false,last=0;
let moves=0;

const $=id=>document.getElementById(id);

function fmt(s){
  s=Math.max(0,s);
  return String(Math.floor(s/60)).padStart(2,'0')+":"+String(Math.floor(s%60)).padStart(2,'0');
}

function render(){
  timeA.textContent=fmt(aTime);
  timeB.textContent=fmt(bTime);
  timeA.classList.toggle("blink",aTime<=10&&aTime>0);
  timeB.classList.toggle("blink",bTime<=10&&bTime>0);
  panelA.classList.toggle("active",active==="A");
  panelB.classList.toggle("active",active==="B");
  movesEl.textContent="Moves: "+moves;
}

function loop(t){
  if(!ticking)return;
  requestAnimationFrame(loop);
  let d=(t-last)/1000;
  if(d<0.15)return;
  if(active==="A")aTime-=d;
  else bTime-=d;
  last=t;
  if(aTime<=0||bTime<=0)ticking=false;
  render();
}

function start(){
  if(ticking)return;
  base=+baseInput.value*60;
  inc=+incInput.value;
  if(!aTime||!bTime){
    aTime=bTime=base;
  }
  ticking=true;
  last=performance.now();
  loop(last);
}

function pause(){ticking=false}

function reset(){
  ticking=false;
  aTime=bTime=+baseInput.value*60;
  active="A";
  moves=0;
  render();
}

function tap(side){
  if(!ticking||active!==side)return;
  if(side==="A"){
    aTime+=inc;
    active="B";
  }else{
    bTime+=inc;
    active="A";
  }
  moves++;
  navigator.vibrate?.(15);
  last=performance.now();
  render();
}

/* INIT */
const panelA=$("panelA"),panelB=$("panelB");
const timeA=$("timeA"),timeB=$("timeB");
const baseInput=$("base"),incInput=$("inc");
const movesEl=$("moves");

render();

/* EVENTS */
panelA.onclick=()=>tap("A");
panelB.onclick=()=>tap("B");
$("start").onclick=start;
$("pause").onclick=pause;
$("reset").onclick=reset;
</script>
</body>
</html>
