<!DOCTYPE html>
<!-- Created with https://packager.turbowarp.org/ -->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: blob:">
  <title>Minecraft</title>

  <style>
    body {
      color: #ffffff;
      font-family: sans-serif;
      overflow: hidden;
      margin: 0;
      padding: 0;
      background: #000;
    }

    #app, #loading, #error, #launch {
      position: absolute;
      inset: 0;
    }

    .screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      user-select: none;
      background: black;
    }

    /* MOBILE BLOCK SCREEN */
    #mobile-block {
      position: fixed;
      inset: 0;
      background: black;
      color: white;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 99999;
      padding: 20px;
    }

    #mobile-block h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    #mobile-block p {
      font-size: 20px;
      opacity: 0.85;
    }

    .progress-bar-outer {
      border: 1px solid white;
      height: 10px;
      width: 200px;
    }

    .progress-bar-inner {
      height: 100%;
      width: 0;
      background: white;
    }
  </style>

  <meta name="theme-color" content="#000000">
</head>

<body>

<!-- MOBILE BLOCK MESSAGE -->
<div id="mobile-block">
  <div>
    <h1>Sorry!</h1>
    <p>This isn’t mobile-friendly.</p>
    <p>Please try it on a PC or laptop.</p>
  </div>
</div>

<!-- APP -->
<div id="app"></div>

<!-- LOADING -->
<div id="loading" class="screen">
  <div class="progress-bar-outer">
    <div class="progress-bar-inner" id="loading-inner"></div>
  </div>
</div>

<!-- ERROR -->
<div id="error" class="screen" hidden>
  <h1>Error</h1>
  <pre id="error-message"></pre>
</div>

<!-- 🚫 MOBILE CHECK (BLOCKS EVERYTHING) -->
<script>
  function isMobile() {
    return (
      /Android|iPhone|iPad|iPod|Opera Mini|IEMobile/i.test(navigator.userAgent)
      || window.innerWidth < 768
    );
  }

  if (isMobile()) {
    document.getElementById("mobile-block").style.display = "flex";
    document.getElementById("app").style.display = "none";
    document.getElementById("loading").style.display = "none";
    throw new Error("Mobile devices are not supported");
  }
</script>

<!-- TURBOWARP RUNTIME -->
<script src="script.js"></script>

<script>
  const loadingInner = document.getElementById('loading-inner');

  function setProgress(p) {
    loadingInner.style.width = (p * 100) + '%';
  }

  try {
    setProgress(0.1);

    const scaffolding = new Scaffolding.Scaffolding();
    scaffolding.width = 480;
    scaffolding.height = 360;
    scaffolding.resizeMode = "preserve-ratio";
    scaffolding.usePackagedRuntime = true;
    scaffolding.setup();
    scaffolding.appendTo(document.getElementById('app'));

    window.scaffolding = scaffolding;
    const vm = scaffolding.vm;

    setProgress(0.5);

    const xhr = new XMLHttpRequest();
    xhr.responseType = "arraybuffer";
    xhr.onload = async () => {
      await scaffolding.loadProject(xhr.response);
      setProgress(1);
      document.getElementById("loading").style.display = "none";
      scaffolding.start();
    };
    xhr.open("GET", "./project.zip");
    xhr.send();

  } catch (e) {
    document.getElementById("error").hidden = false;
    document.getElementById("error-message").textContent = e.toString();
  }
</script>

</body>
</html>
