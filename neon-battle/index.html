<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Cache Busting Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Battle - Overdrive</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* --- STYLES & UI THEME --- */
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.15), inset 0 0 20px rgba(0, 255, 255, 0.05);
            border-radius: 12px;
            overflow: hidden;
            cursor: crosshair;
            border: 1px solid rgba(0, 255, 255, 0.1);
        }

        canvas {
            display: block;
            background-color: transparent;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hidden {
            display: none !important;
        }

        #top-hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        #hud-left {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #score-display {
            font-size: 36px;
            font-weight: 700;
            color: #0ff;
            text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
            letter-spacing: 2px;
        }
        
        #level-display {
            font-size: 24px;
            font-weight: 700;
            color: #f0f;
            text-shadow: 0 0 10px #f0f;
            letter-spacing: 1px;
        }

        #coins-display {
            font-size: 36px;
            font-weight: 700;
            color: #fa0;
            text-shadow: 0 0 10px #fa0, 0 0 20px #fa0;
            letter-spacing: 2px;
        }

        #cooldowns {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
            max-width: 650px;
        }

        .indicator {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            background: rgba(0, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #0ff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            transition: all 0.2s;
            letter-spacing: 1px;
        }

        .indicator.cooldown {
            color: #666;
            border-color: #444;
            box-shadow: none;
            background: rgba(255, 255, 255, 0.05);
        }

        .indicator.locked {
            color: #888;
            border-color: #444;
            background: rgba(0, 0, 0, 0.6);
            box-shadow: none;
        }

        .indicator.can-afford {
            color: #ffaa00;
            border-color: #ffaa00;
            animation: pulseAfford 1s infinite;
        }

        @keyframes pulseAfford {
            0% { box-shadow: 0 0 5px #ffaa00; }
            50% { box-shadow: 0 0 15px #ffaa00; }
            100% { box-shadow: 0 0 5px #ffaa00; }
        }

        .screen {
            background: rgba(5, 5, 5, 0.9);
            padding: 50px 70px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid rgba(0, 255, 255, 0.3);
            pointer-events: auto;
            backdrop-filter: blur(8px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 30px rgba(0, 255, 255, 0.1);
        }

        h1 {
            margin-top: 0;
            color: #fff;
            text-shadow: 0 0 15px #0ff, 0 0 30px #0ff;
            font-size: 56px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        p {
            color: #ccc;
            font-size: 22px;
            margin-bottom: 35px;
            letter-spacing: 1px;
        }

        button {
            background: linear-gradient(45deg, rgba(0,255,255,0.1), rgba(0,255,255,0.2));
            color: #0ff;
            border: 2px solid #0ff;
            padding: 15px 40px;
            font-size: 22px;
            font-family: 'Rajdhani', sans-serif;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        button:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 30px #0ff, 0 0 60px #0ff;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="1000" height="700"></canvas>

        <div id="ui-layer">
            <div id="top-hud">
                <div id="hud-left">
                    <div id="score-display">SCORE: 0</div>
                    <div id="level-display">LEVEL: 1 (0/20 KILLS)</div>
                    <div id="coins-display">COINS: 0</div>
                </div>
                <div id="cooldowns">
                    <div id="spell-1" class="indicator">1: NOVA</div>
                    <div id="spell-2" class="indicator">2: SHIELD</div>
                    <div id="spell-3" class="indicator">3: CLONES</div>
                    <div id="spell-4" class="indicator">4: FREEZE</div>
                    <div id="dash-indicator" class="indicator">SHIFT: DASH</div>
                </div>
            </div>

            <!-- Start Menu -->
            <div id="start-screen" class="screen">
                <h1>Neon Overdrive</h1>
                <p>WASD to Move &bull; Mouse to Aim &bull; Click to Shoot <br><br> SHIFT to Dash &bull; Keys 1-4 to Buy/Use Spells with Coins <br><br> P to Pause</p>
                <button id="start-btn">Initialize</button>
            </div>

            <!-- Pause Menu -->
            <div id="pause-screen" class="screen hidden">
                <h1>PAUSED</h1>
                <p>System Interrupted</p>
                <button id="resume-btn">Resume</button>
            </div>

            <!-- Game Over Menu -->
            <div id="game-over-screen" class="screen hidden">
                <h1 style="color: #f0f; text-shadow: 0 0 15px #f0f, 0 0 30px #f0f;">System Failure</h1>
                <p>Final Score: <span id="final-score" style="color:#fff; font-weight:bold; font-size: 28px;">0</span></p>
                <button id="restart-btn" style="border-color: #f0f; color: #f0f; box-shadow: 0 0 15px rgba(255,0,255,0.3);">Reboot Sequence</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * --- UTILITIES ---
         */
        function distance(x1, y1, x2, y2) {
            return Math.hypot(x2 - x1, y2 - y1);
        }

        /**
         * --- CLASSES ---
         */

        class Coin {
            constructor(x, y, value) {
                this.x = x;
                this.y = y;
                this.value = value;
                this.radius = 6;
                this.color = '#ffaa00';
                this.lifeTime = 12000;
                this.flash = 0;
            }
            update(dt, player) {
                this.lifeTime -= dt;
                this.flash += dt;
                
                // Magnet effect if close
                const dist = distance(this.x, this.y, player.x, player.y);
                if (dist < 120) {
                    const angle = Math.atan2(player.y - this.y, player.x - this.x);
                    this.x += Math.cos(angle) * 10;
                    this.y += Math.sin(angle) * 10;
                }
            }
            draw(ctx) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = (Math.sin(this.flash/150) > 0) ? '#fff' : this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.closePath();
            }
        }

        class Player {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 16;
                this.speed = 4.5;
                this.maxHealth = 100;
                this.health = this.maxHealth;
                this.color = '#0ff';
                this.lastShot = 0;
                this.fireRate = 160;
                this.angle = 0;

                // Dash mechanics
                this.dashCooldown = 1500;
                this.lastDash = -this.dashCooldown;
                this.isDashing = false;
                this.dashTime = 0;
                this.dashDuration = 150;
                this.dashSpeed = 15;
                this.dashDx = 0;
                this.dashDy = 0;
                this.novaRadius = 250;
            }

            update(keys, canvas, dt, game) {
                let dx = 0;
                let dy = 0;

                if (keys['w'] || keys['W'] || keys['ArrowUp']) dy -= 1;
                if (keys['s'] || keys['S'] || keys['ArrowDown']) dy += 1;
                if (keys['a'] || keys['A'] || keys['ArrowLeft']) dx -= 1;
                if (keys['d'] || keys['D'] || keys['ArrowRight']) dx += 1;

                if (dx !== 0 && dy !== 0) {
                    const length = Math.sqrt(dx * dx + dy * dy);
                    dx /= length;
                    dy /= length;
                }

                const now = performance.now();
                const moveDt = dt / 16.66; // Normalize to 60fps

                // Natural Health Regeneration
                if (this.health < this.maxHealth && this.health > 0) {
                    this.health += dt * 0.005; // 5 HP per second
                    if (this.health > this.maxHealth) this.health = this.maxHealth;
                }

                // Calculate angle to mouse
                this.angle = Math.atan2(game.mouse.y - this.y, game.mouse.x - this.x);

                // Dash Trigger
                if (keys['Shift'] && now - this.lastDash > this.dashCooldown && (dx !== 0 || dy !== 0)) {
                    this.isDashing = true;
                    this.dashTime = this.dashDuration;
                    this.lastDash = now;
                    this.dashDx = dx;
                    this.dashDy = dy;
                }

                // Apply Movement
                if (this.isDashing) {
                    this.dashTime -= dt;
                    if (this.dashTime <= 0) {
                        this.isDashing = false;
                    } else {
                        this.x += this.dashDx * this.dashSpeed * moveDt;
                        this.y += this.dashDy * this.dashSpeed * moveDt;
                        // Trail effect
                        if (Math.random() > 0.3) {
                            game.particles.push(new Particle(this.x, this.y, this.color, 0.5, 0.05, 0));
                        }
                    }
                } else {
                    this.x += dx * this.speed * moveDt;
                    this.y += dy * this.speed * moveDt;
                }

                // Constrain to canvas bounds - improved with small buffer to prevent sub-pixel sticking
                const buffer = 1;
                this.x = Math.max(this.radius + buffer, Math.min(canvas.width - this.radius - buffer, this.x));
                this.y = Math.max(this.radius + buffer, Math.min(canvas.height - this.radius - buffer, this.y));
            }

            draw(ctx) {
                // Laser sight
                ctx.beginPath();
                const barrelX = this.x + Math.cos(this.angle) * (this.radius + 12);
                const barrelY = this.y + Math.sin(this.angle) * (this.radius + 12);
                ctx.moveTo(barrelX, barrelY);
                ctx.lineTo(this.x + Math.cos(this.angle) * 2000, this.y + Math.sin(this.angle) * 2000);
                ctx.lineWidth = 1;
                ctx.strokeStyle = 'rgba(0, 255, 255, 0.15)';
                ctx.stroke();
                ctx.closePath();

                // Gun Barrel
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(barrelX, barrelY);
                ctx.lineWidth = 8;
                ctx.strokeStyle = '#fff';
                ctx.stroke();
                ctx.closePath();

                // Outer glow
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = this.isDashing ? 30 : 15;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.closePath();

                // Core
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 0.6, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
                ctx.closePath();
                ctx.shadowBlur = 0;

                // Draw Health Bar
                const barWidth = 46;
                const barHeight = 6;
                const healthPercent = Math.max(0, this.health / this.maxHealth);

                ctx.fillStyle = 'rgba(255, 0, 0, 0.5)';
                ctx.fillRect(this.x - barWidth / 2, this.y - this.radius - 15, barWidth, barHeight);
                ctx.fillStyle = '#0f0';
                ctx.shadowBlur = 5;
                ctx.shadowColor = '#0f0';
                ctx.fillRect(this.x - barWidth / 2, this.y - this.radius - 15, barWidth * healthPercent, barHeight);
                ctx.shadowBlur = 0;
            }
        }

        class Ally {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 10;
                this.color = '#0ff';
                this.speed = 6.5;
                this.fireRate = 450; 
                this.lastShot = performance.now();
                this.target = null;
                // Clones now stay forever
            }

            update(dt, game) {
                // Separation: avoid overlapping with other allies
                game.allies.forEach(other => {
                    if (other === this) return;
                    const d = distance(this.x, this.y, other.x, other.y);
                    const minSep = this.radius + other.radius + 15;
                    if (d < minSep) {
                        const angle = Math.atan2(this.y - other.y, this.x - other.x);
                        const force = (minSep - d) * 0.1;
                        this.x += Math.cos(angle) * force;
                        this.y += Math.sin(angle) * force;
                    }
                });

                // Target acquisition
                if (!this.target || this.target.health <= 0 || !game.enemies.includes(this.target)) {
                    this.target = null;
                    let minDist = Infinity;
                    game.enemies.forEach(e => {
                        const d = distance(this.x, this.y, e.x, e.y);
                        if (d < minDist) { minDist = d; this.target = e; }
                    });
                }

                if (this.target) {
                    const dist = distance(this.x, this.y, this.target.x, this.target.y);
                    const angle = Math.atan2(this.target.y - this.y, this.target.x - this.x);
                    
                    // Maintain optimal firing distance
                    if (dist > 150) {
                        this.x += Math.cos(angle) * this.speed;
                        this.y += Math.sin(angle) * this.speed;
                    } else if (dist < 100) {
                        this.x -= Math.cos(angle) * this.speed;
                        this.y -= Math.sin(angle) * this.speed;
                    }

                    // Shoot
                    if (performance.now() - this.lastShot > this.fireRate) {
                        game.projectiles.push(new Projectile(this.x, this.y, this.target.x, this.target.y));
                        this.lastShot = performance.now();
                    }
                } else {
                    // Follow Player if no targets
                    const dist = distance(this.x, this.y, game.player.x, game.player.y);
                    if (dist > 80) {
                        const angle = Math.atan2(game.player.y - this.y, game.player.x - this.x);
                        this.x += Math.cos(angle) * this.speed;
                        this.y += Math.sin(angle) * this.speed;
                    }
                }

                // Add random particles for thruster effect
                if (Math.random() > 0.6) {
                    game.particles.push(new Particle(this.x, this.y, '#0ff', 0.5, 0.05, 0));
                }
            }

            draw(ctx) {
                // Triangle ship shape
                ctx.save();
                ctx.translate(this.x, this.y);
                if (this.target) {
                    ctx.rotate(Math.atan2(this.target.y - this.y, this.target.x - this.x));
                } else {
                    ctx.rotate(Math.atan2(0, 0)); // default forward
                }

                ctx.beginPath();
                ctx.moveTo(15, 0);
                ctx.lineTo(-10, -10);
                ctx.lineTo(-5, 0);
                ctx.lineTo(-10, 10);
                ctx.closePath();

                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        class Enemy {
            constructor(x, y, speedMult, healthMult, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 'basic', 'fast', 'tank'
                this.lastAttack = 0;

                if (type === 'fast') {
                    this.radius = 10;
                    this.speed = (Math.random() * 2 + 3.5) * speedMult;
                    this.maxHealth = 15 * healthMult;
                    this.color = '#0f0';
                    this.damage = 10;
                    this.attackRate = 600;
                    this.scoreValue = 150;
                } else if (type === 'tank') {
                    this.radius = 26;
                    this.speed = (Math.random() * 0.5 + 1) * speedMult;
                    this.maxHealth = 90 * healthMult;
                    this.color = '#f50'; // Orange
                    this.damage = 30;
                    this.attackRate = 1500;
                    this.scoreValue = 300;
                } else {
                    this.radius = 15;
                    this.speed = (Math.random() * 1.5 + 1.5) * speedMult;
                    this.maxHealth = 35 * healthMult;
                    this.color = '#f0f';
                    this.damage = 15;
                    this.attackRate = 1000;
                    this.scoreValue = 100;
                }

                this.health = this.maxHealth;
            }

            update(player, game) {
                const speedMult = game.spells.freeze.active ? 0.25 : 1;
                const angle = Math.atan2(player.y - this.y, player.x - this.x);
                this.x += Math.cos(angle) * this.speed * speedMult;
                this.y += Math.sin(angle) * this.speed * speedMult;
            }

            draw(ctx) {
                ctx.beginPath();
                // Different shapes for variety
                if (this.type === 'tank') {
                    ctx.rect(this.x - this.radius, this.y - this.radius, this.radius * 2, this.radius * 2);
                } else {
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                }

                ctx.fillStyle = this.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.closePath();
                ctx.shadowBlur = 0;

                // Core detail
                ctx.beginPath();
                if (this.type === 'tank') {
                    ctx.rect(this.x - this.radius * 0.5, this.y - this.radius * 0.5, this.radius, this.radius);
                } else {
                    ctx.arc(this.x, this.y, this.radius * 0.5, 0, Math.PI * 2);
                }
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.fill();
                ctx.closePath();

                // Draw Health Bar
                const barWidth = this.radius * 2;
                const barHeight = 4;
                const healthPercent = Math.max(0, this.health / this.maxHealth);

                ctx.fillStyle = 'rgba(255, 0, 0, 0.4)';
                ctx.fillRect(this.x - barWidth / 2, this.y - this.radius - 12, barWidth, barHeight);
                ctx.fillStyle = '#f00';
                ctx.fillRect(this.x - barWidth / 2, this.y - this.radius - 12, barWidth * healthPercent, barHeight);
            }
        }

        class Projectile {
            constructor(x, y, targetX, targetY) {
                this.x = x;
                this.y = y;
                this.radius = 5;
                this.speed = 18;
                this.damage = 18;
                this.color = '#ff0';

                const angle = Math.atan2(targetY - y, targetX - x);
                this.vx = Math.cos(angle) * this.speed;
                this.vy = Math.sin(angle) * this.speed;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
            }

            draw(ctx) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();

                // Trail
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x - this.vx * 1.5, this.y - this.vy * 1.5);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.closePath();
                ctx.shadowBlur = 0;
            }

            isOutOfBounds(canvas) {
                return (
                    this.x < -50 || this.x > canvas.width + 50 ||
                    this.y < -50 || this.y > canvas.height + 50
                );
            }
        }

        // Enhanced Particle System
        class Particle {
            constructor(x, y, color, speedMult = 1, decayRate = 0.02, startAlpha = 1) {
                this.x = x;
                this.y = y;
                this.radius = Math.random() * 4 + 1;
                this.color = color;

                const angle = Math.random() * Math.PI * 2;
                const speed = (Math.random() * 6 + 2) * speedMult;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;

                this.alpha = startAlpha;
                this.decay = Math.random() * decayRate + (decayRate / 2);
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        /**
         * --- GAME STATE MANAGER ---
         */
        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');

                this.ui = {
                    startScreen: document.getElementById('start-screen'),
                    pauseScreen: document.getElementById('pause-screen'),
                    gameOverScreen: document.getElementById('game-over-screen'),
                    scoreDisplay: document.getElementById('score-display'),
                    levelDisplay: document.getElementById('level-display'),
                    coinsDisplay: document.getElementById('coins-display'),
                    finalScore: document.getElementById('final-score'),
                    startBtn: document.getElementById('start-btn'),
                    resumeBtn: document.getElementById('resume-btn'),
                    restartBtn: document.getElementById('restart-btn')
                };

                this.bindEvents();
                this.reset();
            }

            reset() {
                this.player = new Player(this.canvas.width / 2, this.canvas.height / 2);
                this.enemies = [];
                this.projectiles = [];
                this.particles = [];
                this.novaEffects = [];
                this.allies = [];
                this.coinsList = [];

                this.keys = {};
                this.mouse = {
                    x: this.canvas.width / 2,
                    y: this.canvas.height / 2,
                    isDown: false
                };

                this.score = 0;
                this.coins = 0;
                this.state = 'menu';
                this.paused = false;

                this.level = 1;
                this.killsInLevel = 0;
                this.killsRequired = 20;

                this.lastTime = 0;
                this.enemySpawnTimer = 0;
                this.difficultyTimer = 0;

                this.spawnInterval = 1200;
                this.enemySpeedMult = 1;
                this.enemyHealthMult = 1;

                this.shakeTime = 0;
                this.shakeIntensity = 0;

                // Reset Spells - All start locked except dash
                this.spells = {
                    nova:   { key: '1', cost: 5, unlocked: false, cooldown: 8000, lastUse: -8000, active: false, name: 'NOVA' },
                    shield: { key: '2', cost: 10, unlocked: false, cooldown: 15000, lastUse: -15000, hits: 0, maxHits: 10, active: false, name: 'SHIELD' },
                    clones: { key: '3', cost: 15, unlocked: false, cooldown: 18000, lastUse: -18000, active: false, name: 'CLONES' },
                    freeze: { key: '4', cost: 25, unlocked: false, cooldown: 22000, lastUse: -22000, duration: 6000, timeActive: 0, active: false, name: 'FREEZE' }
                };

                this.updateUI();
                this.draw();
            }

            bindEvents() {
                window.addEventListener('keydown', e => {
                    this.keys[e.key] = true;
                    if ((e.key === 'p' || e.key === 'P' || e.key === 'Escape') && this.state === 'playing') {
                        this.togglePause();
                    }
                    // Prevent scrolling with arrows
                    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                        e.preventDefault();
                    }
                });
                window.addEventListener('keyup', e => this.keys[e.key] = false);
                window.addEventListener('blur', () => this.keys = {});

                this.canvas.addEventListener('mousemove', e => {
                    const rect = this.canvas.getBoundingClientRect();
                    this.mouse.x = e.clientX - rect.left;
                    this.mouse.y = e.clientY - rect.top;
                });

                this.canvas.addEventListener('mousedown', () => {
                    if (this.state === 'playing' && !this.paused) this.mouse.isDown = true;
                });
                window.addEventListener('mouseup', () => this.mouse.isDown = false);

                this.ui.startBtn.addEventListener('click', () => this.start());
                this.ui.resumeBtn.addEventListener('click', () => this.togglePause());
                this.ui.restartBtn.addEventListener('click', () => {
                    this.ui.restartBtn.style.transform = 'scale(0.95)';
                    setTimeout(() => this.ui.restartBtn.style.transform = 'none', 100);
                    this.start();
                });
            }

            togglePause() {
                this.paused = !this.paused;
                if (this.paused) {
                    this.ui.pauseScreen.classList.remove('hidden');
                } else {
                    this.ui.pauseScreen.classList.add('hidden');
                    this.lastTime = performance.now(); // Prevent large dt jump
                    requestAnimationFrame((time) => this.loop(time));
                }
            }

            start() {
                this.reset();
                this.state = 'playing';
                this.ui.startScreen.classList.add('hidden');
                this.ui.pauseScreen.classList.add('hidden');
                this.ui.gameOverScreen.classList.add('hidden');
                this.updateScore(0);
                this.updateLevelUI();
                this.updateCoinsUI();

                // Initial 5 clones
                for (let i = 0; i < 5; i++) {
                    const ax = this.player.x + (Math.random() - 0.5) * 150;
                    const ay = this.player.y + (Math.random() - 0.5) * 150;
                    this.allies.push(new Ally(ax, ay));
                    this.createExplosion(ax, ay, '#0ff', 20, 2);
                }

                this.lastTime = performance.now();
                requestAnimationFrame((time) => this.loop(time));
            }

            gameOver() {
                this.state = 'gameover';
                this.ui.gameOverScreen.classList.remove('hidden');
                this.ui.finalScore.textContent = this.score;
            }

            updateScore(points) {
                this.score += points;
                this.ui.scoreDisplay.textContent = `SCORE: ${this.score}`;
            }

            updateLevelUI() {
                this.ui.levelDisplay.textContent = `LEVEL: ${this.level} (${this.killsInLevel}/${this.killsRequired} KILLS)`;
            }

            levelUp() {
                this.level++;
                this.killsInLevel = 0;
                this.killsRequired = Math.floor(this.killsRequired * 1.5);
                
                // Difficulty increase
                this.spawnInterval = Math.max(200, this.spawnInterval * 0.85);
                this.enemySpeedMult += 0.15;
                this.enemyHealthMult += 0.25;

                this.triggerShake(500, 20);
                this.createExplosion(this.player.x, this.player.y, '#f0f', 50, 3);
                
                // Flash message effect could be added here
                this.updateLevelUI();
            }

            updateCoinsUI() {
                this.ui.coinsDisplay.textContent = `COINS: ${this.coins}`;
            }

            updateUI() {
                const now = performance.now();
                
                // Dash UI
                const dashEl = document.getElementById('dash-indicator');
                if (now - this.player.lastDash > this.player.dashCooldown) {
                    dashEl.className = 'indicator';
                    dashEl.textContent = 'SHIFT: DASH';
                } else {
                    dashEl.className = 'indicator cooldown';
                    dashEl.textContent = 'CHARGING...';
                }
                
                // Spells UI
                for (const key in this.spells) {
                    const spell = this.spells[key];
                    const el = document.getElementById(`spell-${spell.key}`);
                    if (!el) continue;

                    if (!spell.unlocked) {
                        el.className = 'indicator locked';
                        if (this.coins >= spell.cost) {
                            el.classList.add('can-afford');
                        }
                        el.textContent = `${spell.key}: BUY ${spell.name} (${spell.cost}C)`;
                    } else {
                        const isReady = now - spell.lastUse > spell.cooldown;
                        if (spell.active && key === 'shield') {
                            el.className = 'indicator';
                            el.textContent = `${spell.key}: SHIELD HP: ${spell.hits}`;
                        } else if (isReady) {
                            el.className = 'indicator';
                            el.textContent = `${spell.key}: ${spell.name}`;
                        } else {
                            el.className = 'indicator cooldown';
                            el.textContent = `${spell.key}: CHARGING...`;
                        }
                    }
                }
            }

            triggerShake(duration, intensity) {
                this.shakeTime = duration;
                this.shakeIntensity = intensity;
            }

            triggerNova() {
                this.triggerShake(400, 15);
                this.novaEffects.push({
                   x: this.player.x, y: this.player.y,
                   radius: this.player.radius, maxRadius: this.player.novaRadius, alpha: 1
                });
                for (let i = this.enemies.length - 1; i >= 0; i--) {
                    const enemy = this.enemies[i];
                    if (distance(enemy.x, enemy.y, this.player.x, this.player.y) <= this.player.novaRadius) {
                        enemy.health -= 150;
                        this.createExplosion(enemy.x, enemy.y, '#0ff', 15, 1.5);
                    }
                }
            }

            triggerClones() {
                for (let i = 0; i < 5; i++) {
                    const ax = this.player.x + (Math.random() - 0.5) * 100;
                    const ay = this.player.y + (Math.random() - 0.5) * 100;
                    this.allies.push(new Ally(ax, ay));
                    this.createExplosion(ax, ay, '#0ff', 20, 2);
                }
            }

            spawnEnemy() {
                let x, y;
                if (Math.random() < 0.5) {
                    x = Math.random() < 0.5 ? -40 : this.canvas.width + 40;
                    y = Math.random() * this.canvas.height;
                } else {
                    x = Math.random() * this.canvas.width;
                    y = Math.random() < 0.5 ? -40 : this.canvas.height + 40;
                }

                const rand = Math.random();
                let type = 'basic';
                if (rand > 0.85) type = 'tank';
                else if (rand > 0.55) type = 'fast';

                this.enemies.push(new Enemy(x, y, this.enemySpeedMult, this.enemyHealthMult, type));
            }

            createExplosion(x, y, color, amount = 15, speedMult = 1) {
                for (let i = 0; i < amount; i++) {
                    this.particles.push(new Particle(x, y, color, speedMult));
                }
            }

            update(dt) {
                if (this.state !== 'playing' || this.paused) return;

                const now = performance.now();

                // --- SPELL PURCHASING & TRIGGERS ---
                for (const key in this.spells) {
                    const spell = this.spells[key];
                    if (this.keys[spell.key]) {
                        if (!spell.unlocked) {
                            if (this.coins >= spell.cost) {
                                this.coins -= spell.cost;
                                spell.unlocked = true;
                                this.updateCoinsUI();
                                this.createExplosion(this.player.x, this.player.y, '#ffaa00', 30, 2);
                                this.keys[spell.key] = false; // debounce
                            }
                        } else {
                            if (now - spell.lastUse > spell.cooldown) {
                                spell.lastUse = now;
                                if (key === 'nova') this.triggerNova();
                                else if (key === 'clones') this.triggerClones();
                                else if (key === 'freeze') {
                                    spell.active = true; spell.timeActive = spell.duration;
                                    this.triggerShake(300, 5);
                                }
                                else if (key === 'shield') {
                                    spell.active = true; spell.hits = spell.maxHits;
                                    this.triggerShake(100, 3);
                                }
                            }
                        }
                    }
                }

                // Update Spell States
                if (this.spells.freeze.active) {
                    this.spells.freeze.timeActive -= dt;
                    if (this.spells.freeze.timeActive <= 0) this.spells.freeze.active = false;
                }

                this.updateUI();

                if (this.shakeTime > 0) this.shakeTime -= dt;

                // Player Input & Movement
                if (this.mouse.isDown && now - this.player.lastShot > this.player.fireRate) {
                    this.projectiles.push(new Projectile(this.player.x, this.player.y, this.mouse.x, this.mouse.y));
                    this.player.lastShot = now;
                    this.triggerShake(50, 2);
                }
                this.player.update(this.keys, this.canvas, dt, this);

                // Update Coins
                // (Physical coins removed, automatic on kill instead)

                // Update Allies
                for (let i = this.allies.length - 1; i >= 0; i--) {
                    const ally = this.allies[i];
                    ally.update(dt, this);
                }

                // Nova Visual Effects Expansion
                for (let i = this.novaEffects.length - 1; i >= 0; i--) {
                    const effect = this.novaEffects[i];
                    effect.radius += dt * 1.2;
                    effect.alpha -= dt * 0.002;
                    if (effect.alpha <= 0 || effect.radius >= effect.maxRadius) {
                        this.novaEffects.splice(i, 1);
                    }
                }

                // Projectiles
                for (let i = this.projectiles.length - 1; i >= 0; i--) {
                    const p = this.projectiles[i];
                    p.update();
                    if (p.isOutOfBounds(this.canvas)) {
                        this.projectiles.splice(i, 1);
                    }
                }

                // Particles
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.update();
                    if (p.alpha <= 0) {
                        this.particles.splice(i, 1);
                    }
                }

                // Enemies & Collisions
                for (let i = this.enemies.length - 1; i >= 0; i--) {
                    const enemy = this.enemies[i];
                    enemy.update(this.player, this);

                    // If shield is active, heavily damage enemies nearby
                    if (this.spells.shield.active && distance(enemy.x, enemy.y, this.player.x, this.player.y) < this.player.radius + enemy.radius + 40) {
                        enemy.health -= 5; // continuous shred damage
                        this.createExplosion(enemy.x, enemy.y, '#0ff', 2, 0.5);
                    }

                    // Enemy hits Player
                    const dist = distance(enemy.x, enemy.y, this.player.x, this.player.y);
                    if (dist < enemy.radius + this.player.radius - 4) {
                        if (performance.now() - enemy.lastAttack > enemy.attackRate) {
                            if (!this.player.isDashing) {
                                if (this.spells.shield.active) {
                                    this.spells.shield.hits--;
                                    enemy.lastAttack = performance.now();
                                    this.createExplosion(this.player.x, this.player.y, '#0ff', 10, 1);
                                    this.triggerShake(100, 5);
                                    if (this.spells.shield.hits <= 0) {
                                        this.spells.shield.active = false;
                                        this.createExplosion(this.player.x, this.player.y, '#0ff', 30, 2);
                                    }
                                } else {
                                    this.player.health -= enemy.damage;
                                    enemy.lastAttack = performance.now();
                                    this.createExplosion(this.player.x, this.player.y, '#f00', 15, 1.5);
                                    this.triggerShake(200, 10);

                                    if (this.player.health <= 0) {
                                        this.createExplosion(this.player.x, this.player.y, this.player.color, 60, 2);
                                        this.gameOver();
                                    }
                                }
                            }
                        }
                    }

                    // Projectile hits Enemy
                    for (let j = this.projectiles.length - 1; j >= 0; j--) {
                        const p = this.projectiles[j];
                        if (distance(enemy.x, enemy.y, p.x, p.y) < enemy.radius + p.radius) {
                            enemy.health -= p.damage;
                            this.createExplosion(p.x, p.y, p.color, 8, 0.5);
                            this.projectiles.splice(j, 1);
                            break;
                        }
                    }

                    // Handle enemy death
                    if (enemy.health <= 0) {
                        this.createExplosion(enemy.x, enemy.y, enemy.color, 25, 1.2);
                        this.updateScore(enemy.scoreValue);
                        
                        // Level progression
                        this.killsInLevel++;
                        if (this.killsInLevel >= this.killsRequired) {
                            this.levelUp();
                        } else {
                            this.updateLevelUI();
                        }

                        // Automatic coins
                        let coinAmount = enemy.type === 'tank' ? 6 : (enemy.type === 'fast' ? 2 : 1);
                        this.coins += coinAmount;
                        this.updateCoinsUI();
                        
                        this.enemies.splice(i, 1);
                    }
                }

                // Spawning
                this.enemySpawnTimer += dt;
                if (this.enemySpawnTimer > this.spawnInterval) {
                    this.spawnEnemy();
                    this.enemySpawnTimer = 0;
                }
            }

            draw() {
                this.ctx.fillStyle = 'rgba(10, 10, 12, 1)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                this.ctx.save();

                if (this.spells.freeze.active) {
                    this.ctx.fillStyle = 'rgba(0, 50, 255, 0.1)';
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                }

                if (this.shakeTime > 0) {
                    const dx = (Math.random() - 0.5) * this.shakeIntensity;
                    const dy = (Math.random() - 0.5) * this.shakeIntensity;
                    this.ctx.translate(dx, dy);
                }

                this.ctx.strokeStyle = 'rgba(0, 255, 255, 0.05)';
                this.ctx.lineWidth = 1;
                for (let i = 0; i < this.canvas.width; i += 60) {
                    this.ctx.beginPath(); this.ctx.moveTo(i, 0); this.ctx.lineTo(i, this.canvas.height); this.ctx.stroke();
                }
                for (let i = 0; i < this.canvas.height; i += 60) {
                    this.ctx.beginPath(); this.ctx.moveTo(0, i); this.ctx.lineTo(this.canvas.width, i); this.ctx.stroke();
                }

                this.novaEffects.forEach(effect => {
                    this.ctx.beginPath();
                    this.ctx.arc(effect.x, effect.y, effect.radius, 0, Math.PI * 2);
                    this.ctx.lineWidth = 10 * Math.max(0, effect.alpha);
                    this.ctx.strokeStyle = `rgba(0, 255, 255, ${Math.max(0, effect.alpha)})`;
                    this.ctx.stroke();
                    this.ctx.closePath();
                    
                    this.ctx.beginPath();
                    this.ctx.arc(effect.x, effect.y, effect.radius, 0, Math.PI * 2);
                    this.ctx.fillStyle = `rgba(0, 255, 255, ${Math.max(0, effect.alpha * 0.15)})`;
                    this.ctx.fill();
                    this.ctx.closePath();
                });

                if (this.spells.shield.active && this.state === 'playing') {
                    this.ctx.beginPath();
                    this.ctx.arc(this.player.x, this.player.y, this.player.radius + 40, 0, Math.PI * 2);
                    this.ctx.lineWidth = 5;
                    this.ctx.strokeStyle = '#0ff';
                    this.ctx.shadowBlur = 20;
                    this.ctx.shadowColor = '#0ff';
                    this.ctx.setLineDash([20, 20]);
                    this.ctx.lineDashOffset = -performance.now() / 15;
                    this.ctx.stroke();
                    this.ctx.closePath();
                    this.ctx.setLineDash([]);
                    this.ctx.shadowBlur = 0;
                }

                this.particles.forEach(p => p.draw(this.ctx));
                this.projectiles.forEach(p => p.draw(this.ctx));
                this.enemies.forEach(e => e.draw(this.ctx));
                this.allies.forEach(a => a.draw(this.ctx));

                if (this.state === 'playing') {
                    this.player.draw(this.ctx);
                }

                this.ctx.restore();
            }

            loop(currentTime) {
                if (this.state !== 'playing' || this.paused) {
                    this.draw();
                    return;
                }

                const dt = currentTime - this.lastTime;
                this.lastTime = currentTime;

                this.update(dt);
                this.draw();

                requestAnimationFrame(time => this.loop(time));
            }
        }

        window.onload = () => {
            new Game();
        };
    </script>
