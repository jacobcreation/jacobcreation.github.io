<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Cache Busting Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Battle - Overdrive</title>
    <link href="/fonts/fonts.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="1000" height="700"></canvas>

        <div id="ui-layer">
            <div id="top-hud">
                <div id="hud-left">
                    <div id="score-display">SCORE: 0</div>
                    <div id="level-display">LEVEL: 1 (0/20 KILLS)</div>
                    <div id="coins-display">COINS: 0</div>
                </div>
                <div id="cooldowns">
                    <div id="spell-1" class="indicator">1: NOVA</div>
                    <div id="spell-2" class="indicator">2: SHIELD</div>
                    <div id="spell-3" class="indicator">3: CLONES</div>
                    <div id="spell-4" class="indicator">4: FREEZE</div>
                    <div id="dash-indicator" class="indicator">SHIFT: DASH</div>
                </div>
            </div>

            <!-- Start Menu -->
            <div id="start-screen" class="screen">
                <h1>Neon Overdrive</h1>
                <p>WASD to Move &bull; Mouse to Aim &bull; Click to Shoot <br><br> SHIFT to Dash &bull; Keys 1-4 to Buy/Use Spells with Coins <br><br> P to Pause</p>
                <button id="start-btn">Initialize</button>
            </div>

            <!-- Pause Menu -->
            <div id="pause-screen" class="screen hidden">
                <h1>PAUSED</h1>
                <p>System Interrupted</p>
                <button id="resume-btn">Resume</button>
            </div>

            <!-- Game Over Menu -->
            <div id="game-over-screen" class="screen hidden">
                <h1 style="color: #f0f; text-shadow: 0 0 15px #f0f, 0 0 30px #f0f;">System Failure</h1>
                <p>Final Score: <span id="final-score" style="color:#fff; font-weight:bold; font-size: 28px;">0</span></p>
                <button id="restart-btn" style="border-color: #f0f; color: #f0f; box-shadow: 0 0 15px rgba(255,0,255,0.3);">Reboot Sequence</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>(function(){const v=Date.now();document.write('<script src="/global-header.js?v='+v+'"><\/script>');})();</script>
    <script src="/accounts/account-widget.js" defer data-account-api="https://accounts-system.b4rjxr9lk.workers.dev"></script>
</body>

</html>
