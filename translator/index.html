<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="AI-powered translator using Cloudflare Workers" />

    <title>Translator - JacobCreation</title>

    <link rel="icon" href="/favicon.png" type="image/png" />

    <link href="/fonts/fonts.css" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
    <!-- Mobile Friendly -->
    <link rel="stylesheet" href="/mobile-friendly.css">
</head>

<body>
    <main>
        <a class="back-link" href="/">← Back to Home</a>

        <div class="hero-card">
            <h1>🌍 Translator</h1>
            <p class="subtitle">AI-powered translation using Meta's m2m100 model — supports 100+ languages.</p>

            <div class="translator-grid">
                <div class="lang-col">
                    <select class="lang-select" id="sourceLang"></select>
                    <div class="text-area-wrap">
                        <textarea class="text-area" id="sourceText" placeholder="Enter text to translate…" rows="5"></textarea>
                        <span class="char-count" id="sourceCount">0</span>
                    </div>
                </div>

                <button class="swap-btn" id="swapBtn" title="Swap languages">⇄</button>

                <div class="lang-col">
                    <select class="lang-select" id="targetLang"></select>
                    <div class="text-area-wrap">
                        <textarea class="text-area output" id="outputText" placeholder="Translation will appear here…" rows="5" readonly></textarea>
                        <span class="char-count" id="outputCount">0</span>
                    </div>
                </div>
            </div>

            <div class="actions">
                <button class="btn btn-primary" id="translateBtn">Translate</button>
                <button class="btn btn-ghost" id="recordBtn">🎤 Record</button>
                <button class="btn btn-ghost" id="clearBtn">Clear</button>
                <button class="btn btn-danger" id="copyBtn">Copy Result</button>
            </div>

            <div class="status" id="status"></div>
        </div>
    </main>

    <footer>
        © 2026 JacobCreation • Powered by Cloudflare Workers AI
    </footer>

    <script src="app.js"></script>
    <script src="/accounts/account-widget.js" defer data-account-api="https://accounts-system.b4rjxr9lk.workers.dev"></script>
</body>

</html>
