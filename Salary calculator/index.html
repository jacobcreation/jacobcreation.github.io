<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Philippine Peso Salary Calculator (2025 Official + Hourly)</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f9f9f9; margin:40px; }
    .container { max-width:900px; margin:auto; background:#fff; padding:20px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1); }
    h2 { text-align:center; color:#2d8cff; }
    label { font-weight:bold; display:block; margin-top:10px; }
    input { width:100%; padding:8px; margin-top:5px; border:1px solid #ccc; border-radius:5px; }
    button { margin-top:15px; padding:10px; width:100%; background:#2d8cff; color:#fff; border:none; border-radius:5px; cursor:pointer; }
    button:hover { background:#1a6fd1; }
    .result { margin-top:20px; padding:15px; background:#f1faff; border-radius:8px; }
    table { width:100%; border-collapse:collapse; margin-top:10px; }
    th, td { border:1px solid #ccc; padding:8px; text-align:right; }
    th { background:#eaf3ff; text-align:left; }
    .net { font-weight:bold; color:#2d8cff; }
    .tiles { display:flex; flex-wrap:wrap; gap:12px; margin-top:20px; }
    .tile { flex:1; min-width:200px; background:#f9fbff; border:1px solid #ccc; border-radius:8px; padding:12px; }
    .tile h3 { margin:0 0 8px; font-size:1rem; }
    .tile .big { font-size:1.3rem; font-weight:bold; color:#2d8cff; }
  </style>
</head>
<body>
<div class="container">
  <h2>₱ Salary Calculator (2025 Official + Hourly)</h2>
  <form id="salaryForm">
    <label for="hourly">Hourly Rate (₱)</label>
    <input type="number" id="hourly" placeholder="e.g. 120">

    <label for="regularHours">Regular Hours per Week</label>
    <input type="number" id="regularHours" placeholder="e.g. 40">

    <label for="overtimeHours">Overtime Hours per Week</label>
    <input type="number" id="overtimeHours" placeholder="e.g. 5">

    <label for="otMultiplier">Overtime Multiplier</label>
    <input type="number" id="otMultiplier" value="1.25">

    <label for="allowance">Monthly Allowances (₱)</label>
    <input type="number" id="allowance" value="0">

    <button type="submit">Calculate</button>
    <button type="button" id="resetBtn">Reset</button>
  </form>

  <div class="result" id="output" style="display:none;">
    <h3>Results</h3>
    <div class="tiles">
      <div class="tile"><h3>Weekly Gross</h3><div class="big" id="weeklyGross"></div></div>
      <div class="tile"><h3>Monthly Gross</h3><div class="big" id="monthlyGross"></div></div>
      <div class="tile"><h3>Annual Gross</h3><div class="big" id="annualGross"></div></div>
      <div class="tile"><h3>Weekly Net</h3><div class="big" id="weeklyNet"></div></div>
      <div class="tile"><h3>Monthly Net</h3><div class="big" id="monthlyNet"></div></div>
    </div>

    <table>
      <tr><th>Gross Pay (Monthly)</th><td id="gross"></td></tr>
      <tr><th>SSS (EE share)</th><td id="sss"></td></tr>
      <tr><th>PhilHealth (EE share)</th><td id="philhealth"></td></tr>
      <tr><th>Pag-IBIG</th><td id="pagibig"></td></tr>
      <tr><th>Withholding Tax</th><td id="tax"></td></tr>
      <tr><th class="net">Net Pay (Monthly)</th><td class="net" id="net"></td></tr>
    </table>
  </div>
</div>

<script>
function formatPHP(amount) {
  return "₱" + amount.toFixed(2);
}

document.getElementById("salaryForm").addEventListener("submit", function(e){
  e.preventDefault();
  const rate = parseFloat(document.getElementById("hourly").value) || 0;
  const regH = parseFloat(document.getElementById("regularHours").value) || 0;
  const otH = parseFloat(document.getElementById("overtimeHours").value) || 0;
  const otM = parseFloat(document.getElementById("otMultiplier").value) || 1.25;
  const allowance = parseFloat(document.getElementById("allowance").value) || 0;

  // Weekly gross
  const weeklyGross = (rate * regH) + (rate * otH * otM);
  const monthlyGross = weeklyGross * 4.333 + allowance;
  const annualGross = weeklyGross * 52 + allowance * 12;

  // --- Official 2025 deductions ---
  // SSS: 7.5% of MSC (floor ₱5,000, ceiling ₱35,000)
  let msc = Math.min(Math.max(monthlyGross, 5000), 35000);
  let sss = msc * 0.075;

  // PhilHealth: 5% premium split equally, floor ₱10,000, ceiling ₱100,000
  let phBase = Math.min(Math.max(monthlyGross, 10000), 100000);
  let philhealth = phBase * 0.05 / 2;

  // Pag-IBIG: 2% capped at ₱200
  let pagibig = Math.min(monthlyGross * 0.02, 200);

  // Taxable income
  let taxable = monthlyGross - (sss + philhealth + pagibig);

  // TRAIN law withholding tax (monthly)
  let tax = 0;
  if (taxable <= 20833) {
    tax = 0;
  } else if (taxable <= 33333) {
    tax = (taxable - 20833) * 0.20;
  } else if (taxable <= 66667) {
    tax = 2500 + (taxable - 33333) * 0.25;
  } else if (taxable <= 166667) {
    tax = 10833 + (taxable - 66667) * 0.30;
  } else if (taxable <= 666667) {
    tax = 40833 + (taxable - 166667) * 0.32;
  } else {
    tax = 200833 + (taxable - 666667) * 0.35;
  }

  const monthlyNet = monthlyGross - (sss + philhealth + pagibig + tax);
  const weeklyNet = monthlyNet / 4.333;

  // --- Display results ---
  document.getElementById("output").style.display = "block";
  document.getElementById("weeklyGross").textContent = formatPHP(weeklyGross);
  document.getElementById("monthlyGross").textContent = formatPHP(monthlyGross);
  document.getElementById("annualGross").textContent = formatPHP(annualGross);
  document.getElementById("weeklyNet").textContent = formatPHP(weeklyNet);
  document.getElementById("monthlyNet").textContent = formatPHP(monthlyNet);

  document.getElementById("gross").textContent = formatPHP(monthlyGross);
  document.getElementById("sss").textContent = formatPHP(sss);
  document.getElementById("philhealth").textContent = formatPHP(philhealth);
  document.getElementById("pagibig").textContent = formatPHP(pagibig);
  document.getElementById("tax").textContent = formatPHP(tax);
  document.getElementById("net").textContent = formatPHP(monthlyNet);
});

document.getElementById("resetBtn").addEventListener("click", function(){
  document.getElementById("salaryForm").reset();
  document.getElementById("output").style.display = "none";
});
</script
