<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Cache Busting Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
  <meta charset="UTF-8">
  <title>Salary Calculator (2025 Official + Prototype Style)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Estimate weekly, monthly, and annual pay with overtime, holidays, night differential, bonuses, and allowance support.">

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="container">
    <h2>₱ Salary Calculator (2025 PH Official)</h2>

    <form id="salaryForm">
      <div class="grid">
        <div class="form-group"><label for="hourly">Hourly rate (₱)</label><input type="number" id="hourly"
            placeholder="e.g. 120"></div>
        <div class="form-group"><label for="regularHours">Regular hours/week</label><input type="number"
            id="regularHours" placeholder="e.g. 40"></div>
        <div class="form-group"><label for="overtimeHours">Overtime hours/week</label><input type="number"
            id="overtimeHours" placeholder="e.g. 5"></div>
        <div class="form-group"><label for="otMultiplier">OT multiplier</label><input type="number" id="otMultiplier"
            value="1.25"></div>
        <div class="form-group"><label for="holidayHours">Holiday hours/week</label><input type="number"
            id="holidayHours" value="0"></div>
        <div class="form-group"><label for="holidayRate">Holiday rate multiplier</label><input type="number"
            id="holidayRate" value="2.0">
        </div>
        <div class="form-group"><label for="nightHours">Night hours/week</label><input type="number" id="nightHours"
            value="0"></div>
        <div class="form-group"><label for="nightPercent">Night diff %</label><input type="number" id="nightPercent"
            value="0.10"></div>
        <div class="form-group"><label for="allowance">Monthly allowances (₱)</label><input type="number" id="allowance"
            value="0"></div>
        <div class="form-group"><label for="bonus">Monthly bonuses (₱)</label><input type="number" id="bonus" value="0">
        </div>
      </div>



      <div class="btns">
        <button type="submit">Calculate</button>
        <button type="button" class="secondary" id="resetBtn">Reset</button>

        <button type="button" class="chip" id="preset40h">Standard 40h week</button>
        <button type="button" class="chip" id="addOT">+5 OT hours</button>
        <button type="button" class="chip" id="holidayMode">Holiday mode</button>
        <button type="button" class="chip" id="nightShift">Night shift</button>
        <button type="button" class="chip" id="surpriseBonus">Surprise bonus 🎉</button>
        <button type="button" class="chip" id="toggleBreakdown">Toggle breakdown</button>
        <button type="button" class="chip" id="viewWeekly">View: Weekly</button>
        <button type="button" class="chip" id="viewMonthly">View: Monthly</button>
        <button type="button" class="chip" id="viewAnnual">View: Annual</button>
        <button type="button" class="chip" id="printBtn">Print</button>
      </div>
    </form>

    <div id="output" class="hidden">
      <div class="tiles">
        <div class="tile" id="tileWeeklyGross">
          <h3>Weekly gross</h3>
          <div class="big" id="weeklyGross"></div>
        </div>
        <div class="tile" id="tileMonthlyGross">
          <h3>Monthly gross</h3>
          <div class="big" id="monthlyGross"></div>
        </div>
        <div class="tile" id="tileAnnualGross">
          <h3>Annual gross</h3>
          <div class="big" id="annualGross"></div>
        </div>
        <div class="tile" id="tileWeeklyNet">
          <h3>Weekly net</h3>
          <div class="big" id="weeklyNet"></div>
        </div>
        <div class="tile" id="tileMonthlyNet">
          <h3>Monthly net</h3>
          <div class="big" id="monthlyNet"></div>
        </div>
        <div class="tile" id="tileAnnualNet">
          <h3>Annual net (incl. 13th)</h3>
          <div class="big" id="annualNet"></div>
        </div>
      </div>

      <div class="breakdown" id="breakdown">
        <h3>Breakdown</h3>
        <p id="details"></p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>(function(){const v=Date.now();document.write('<script src="../global-header.js?v='+v+'"><\/script>');})();</script>

    <script src="/accounts/account-widget.js" defer data-account-api="https://accounts-system.b4rjxr9lk.workers.dev"></script>
</body>

</html>
