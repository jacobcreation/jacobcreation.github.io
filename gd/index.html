<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Geometry Dash</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;font-family:'Segoe UI',Arial,sans-serif}
canvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%;background:#1a1a2e;z-index:0}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script src="../global-header.js"></script>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Audio
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function initAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
}

function playTone(freq, duration, type = 'square', vol = 0.15) {
  try {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

function playJump() { playTone(440, 0.1, 'square', 0.1); }
function playDeath() { playTone(150, 0.4, 'sawtooth', 0.15); playTone(100, 0.5, 'square', 0.1); }
function playComplete() {
  [523,659,784,1047].forEach((f,i)=>setTimeout(()=>playTone(f,0.2,'square',0.1),i*100));
}
function playClick() { playTone(600, 0.05, 'square', 0.08); }
function playCoin() { playTone(880, 0.1, 'sine', 0.12); playTone(1100, 0.15, 'sine', 0.08); }

// ============ GAME STATE ============
const STATE = { MENU:0, LEVEL_SELECT:1, PLAYING:2, GAME_OVER:3, LEVEL_COMPLETE:4, SETTINGS:5 };

let state = STATE.MENU;
let currentLevel = 0;
let score = 0;
let deaths = 0;
let completedLevels = JSON.parse(localStorage.getItem('gd_completed')||'[]');
let highScores = JSON.parse(localStorage.getItem('gd_scores')||'{}');
let totalCoins = parseInt(localStorage.getItem('gd_coins')||'0');
let selectedSkin = parseInt(localStorage.getItem('gd_skin')||'0');
let selectedConfig = parseInt(localStorage.getItem('gd_config')||'1');
let particles = [];
let gameTime = 0;
let frameCount = 0;
let combo = 0;
let maxCombo = 0;

// Unlock skins
let unlockedSkins = JSON.parse(localStorage.getItem('gd_unlockedSkins')||'[0,1]');
// 0=blue,1=green,2=red,3=purple,4=gold,5=cyan,6=pink,7=rainbow,8=neon,9=dark,10=white,11=orange,12=lime,13=magenta,14=transformer
const SKIN_COLORS = [
  '#4a9eff','#4eff4a','#ff4a4a','#b44aff','#ffd700','#00ffff','#ff69b4','#ff00ff','#00ff88','#2d2d2d','#ffffff','#ff8800','#88ff00','#ff0088','#ff4444'
];
const SKIN_NAMES = ['Blue','Green','Red','Purple','Gold','Cyan','Pink','Rainbow','Neon','Dark','White','Orange','Lime','Magenta','Crimson'];
const SKIN_COST = [0,0,0,50,100,75,60,200,150,80,30,50,50,60,120];
const GAME_CONFIGS = [
  { name: 'CHILL', speedScale: 0.34, airMult: 1.4, gravity: 0.56, jumpForce: -11 },
  { name: 'NORMAL', speedScale: 0.45, airMult: 2, gravity: 0.52, jumpForce: -12.5 },
  { name: 'FAST', speedScale: 0.58, airMult: 2.2, gravity: 0.52, jumpForce: -12.5 },
  { name: 'WIDE JUMP', speedScale: 0.45, airMult: 3, gravity: 0.48, jumpForce: -12.5 }
];
function activeConfig() {
  return GAME_CONFIGS[selectedConfig] || GAME_CONFIGS[1];
}

// ============ LEVEL DATA ============
// Each level: name, theme color, ground color, bg color, speed, obstacles array
function generateLevel(num) {
  const levels = [
    {
      name: 'First Steps',
      theme: '#4a9eff',
      bg1: '#1a1a2e',
      bg2: '#16213e',
      ground: '#2a2a4a',
      groundTop: '#4a9eff',
      speed: 4,
      musicPitch: 1,
      obstacles: []
    },
    {
      name: 'Green Hills',
      theme: '#4eff4a',
      bg1: '#1a2e1a',
      bg2: '#163e16',
      ground: '#2a4a2a',
      groundTop: '#4eff4a',
      speed: 4.5,
      musicPitch: 1.1,
      obstacles: []
    },
    {
      name: 'Fire Escape',
      theme: '#ff4a4a',
      bg1: '#2e1a1a',
      bg2: '#3e1616',
      ground: '#4a2a2a',
      groundTop: '#ff4a4a',
      speed: 5,
      musicPitch: 1.2,
      obstacles: []
    },
    {
      name: 'Purple Night',
      theme: '#b44aff',
      bg1: '#1a1a2e',
      bg2: '#2a163e',
      ground: '#3a2a4a',
      groundTop: '#b44aff',
      speed: 5.5,
      musicPitch: 1.3,
      obstacles: []
    },
    {
      name: 'Gold Rush',
      theme: '#ffd700',
      bg1: '#2e2a1a',
      bg2: '#3e3616',
      ground: '#4a4a2a',
      groundTop: '#ffd700',
      speed: 6,
      musicPitch: 1.4,
      obstacles: []
    },
    {
      name: 'Cyan Wave',
      theme: '#00ffff',
      bg1: '#1a2e2e',
      bg2: '#163e3e',
      ground: '#2a4a4a',
      groundTop: '#00ffff',
      speed: 6.5,
      musicPitch: 1.5,
      obstacles: []
    },
    {
      name: 'Pink Paradise',
      theme: '#ff69b4',
      bg1: '#2e1a2e',
      bg2: '#3e163e',
      ground: '#4a2a4a',
      groundTop: '#ff69b4',
      speed: 7,
      musicPitch: 1.6,
      obstacles: []
    },
    {
      name: 'Neon Blast',
      theme: '#00ff88',
      bg1: '#0a1a14',
      bg2: '#0d261c',
      ground: '#1a3a2a',
      groundTop: '#00ff88',
      speed: 7.5,
      musicPitch: 1.7,
      obstacles: []
    },
    {
      name: 'Dark Inferno',
      theme: '#ff4400',
      bg1: '#1a0a0a',
      bg2: '#2a0a0a',
      ground: '#3a1a0a',
      groundTop: '#ff4400',
      speed: 8,
      musicPitch: 1.8,
      obstacles: []
    },
    {
      name: 'Final Frontier',
      theme: '#ff00ff',
      bg1: '#0a0a1a',
      bg2: '#1a0a1a',
      ground: '#2a0a2a',
      groundTop: '#ff00ff',
      speed: 9,
      musicPitch: 2.0,
      obstacles: []
    }
  ];
  return generateObstacles(levels[num], num);
}

function generateObstacles(level, idx) {
  const obs = [];
  const speed = level.speed;
  const difficulty = 1 + idx * 0.15;
  const minBlockGap = 12;
  const addBlock = block => {
    const blockStart = block.x;
    const blockEnd = block.x + block.w;
    const hasRoom = !obs.some(other => {
      if (other.type !== 'block') return false;
      const otherStart = other.x;
      const otherEnd = other.x + other.w;
      return blockStart < otherEnd + minBlockGap && blockEnd + minBlockGap > otherStart;
    });
    if (hasRoom) obs.push(block);
  };
  // Ground segments
  let x = 0;
  const groundH = 80;
  const levelLength = 6000 + idx * 500;
  const jumpH = -220;

  // Generate pattern blocks
  while (x < levelLength) {
    const gap = 300 + Math.random() * 200 / difficulty;
    x += gap;

    // Regular obstacles
    if (x < levelLength - 200) {
      // Pillar
      if (Math.random() < 0.5 + idx * 0.05) {
        const h = 30 + Math.random() * 100 * (0.5 + idx * 0.1);
        addBlock({ x, y: H - groundH - h, w: 30 + Math.random() * 30, h, type: 'block', scored: false });
      }
      // Spike
      if (Math.random() < 0.4 + idx * 0.05) {
        const spikeY = H - groundH - 30;
        for (let s = 0; s < 1 + Math.floor(Math.random() * 3); s++) {
          obs.push({ x: x + s * 35 + Math.random() * 40, y: spikeY, w: 25, h: 30, type: 'spike', scored: false });
        }
      }
      // Double obstacle
      if (Math.random() < 0.2 + idx * 0.04) {
        const h = 60 + Math.random() * 80;
        addBlock({ x: x + 40, y: H - groundH - h, w: 25, h, type: 'block', scored: false });
        addBlock({ x: x + 80, y: H - groundH - h - 30, w: 25, h: h + 30, type: 'block', scored: false });
      }
      // Moving obstacle
      if (Math.random() < 0.15 + idx * 0.03) {
        obs.push({ x, y: H - groundH - 50, w: 25, h: 50, type: 'moving', moveY: 30, moveSpeed: 2, scored: false });
      }
    }

    // Gap in ground
    if (Math.random() < 0.2 + idx * 0.05 && x > 500) {
      const gapW = 80 + Math.random() * 120;
      obs.push({ x, y: H - groundH + 10, w: gapW, h: groundH, type: 'gap', scored: false });
    }

    // Coin
    if (Math.random() < 0.3) {
      obs.push({ x: x + 50 + Math.random() * 100, y: H - groundH - 80 - Math.random() * 100, w: 20, h: 20, type: 'coin', scored: false });
    }

    // Gravity portal
    if (Math.random() < 0.08 + idx * 0.02 && idx > 2) {
      obs.push({ x, y: H/2 - 30, w: 20, h: 60, type: 'portal_gravity', scored: false });
    }

    // Speed portal
    if (Math.random() < 0.06 + idx * 0.01 && idx > 1) {
      obs.push({ x, y: H/2 - 20, w: 15, h: 40, type: 'portal_speed', scored: false });
    }

    x += 150 + Math.random() * 100;
  }

  obs.push({ x: levelLength, y: H - groundH - 40, w: 60, h: 80, type: 'finish', scored: false });
  level.obstacles = obs;
  level.groundH = groundH;
  level.jumpH = jumpH;
  level.length = levelLength;
  return level;
}

// ============ PLAYER ============
const player = {
  x: 150, y: 0, w: 30, h: 30,
  vy: 0, gravity: activeConfig().gravity, jumpForce: activeConfig().jumpForce,
  grounded: false, jumping: false,
  rotation: 0, rotSpeed: 5,
  trail: [],
  invincible: false,
  invTimer: 0,
  gravityDir: 1,
  alive: true,
  speedMult: 1,
  hasDoubleJump: false,
  doubleJumpUsed: false,
  isShip: false,
  shipTimer: 0,
  size: 1,
  glowIntensity: 0,
};

function resetPlayer() {
  const cfg = activeConfig();
  player.x = 150;
  player.y = H - 140;
  player.vy = 0;
  player.gravity = cfg.gravity;
  player.jumpForce = cfg.jumpForce;
  player.grounded = false;
  player.jumping = false;
  player.rotation = 0;
  player.trail = [];
  player.invincible = false;
  player.invTimer = 0;
  player.gravityDir = 1;
  player.alive = true;
  player.speedMult = 1;
  player.doubleJumpUsed = false;
  player.isShip = false;
  player.shipTimer = 0;
  player.size = 1;
  player.glowIntensity = 0;
}

// ============ CAMERA ============
const camera = { x: 0 };

// ============ INPUT ============
const keys = {};
let touchActive = false;
const pointer = { x: -9999, y: -9999, down: false };

function updatePointer(e) {
  const rect = canvas.getBoundingClientRect();
  pointer.x = (e.clientX - rect.left) / rect.width * W;
  pointer.y = (e.clientY - rect.top) / rect.height * H;
}

document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','KeyW'].includes(e.code)) {
    e.preventDefault();
    handleJump();
  }
  if (e.code === 'Escape') handleEscape();
  if (e.code === 'KeyR') handleRetry();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  initAudio();
  touchActive = true;
  handleJump();
  handleTouchMenu(e);
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  touchActive = false;
}, { passive: false });

canvas.addEventListener('mousemove', e => {
  updatePointer(e);
});

canvas.addEventListener('mousedown', e => {
  updatePointer(e);
  pointer.down = true;
  initAudio();
  handleJump();
  handleMouseMenu(e);
});

canvas.addEventListener('mouseup', e => {
  updatePointer(e);
  pointer.down = false;
});

canvas.addEventListener('mouseleave', () => {
  pointer.x = -9999;
  pointer.y = -9999;
  pointer.down = false;
});

// ============ INPUT HANDLERS ============
function handleJump() {
  if (state === STATE.PLAYING && player.alive) {
    if (player.grounded) {
      player.vy = player.jumpForce * player.gravityDir;
      player.grounded = false;
      player.jumping = true;
      playJump();
      player.rotSpeed = 8;
      combo++;
      if (combo > maxCombo) maxCombo = combo;
    } else if (player.hasDoubleJump && !player.doubleJumpUsed) {
      player.vy = player.jumpForce * player.gravityDir;
      player.doubleJumpUsed = true;
      playJump();
      playTone(550, 0.1, 'sine', 0.08);
    }
  }
}

function handleEscape() {
  if (state === STATE.PLAYING) { state = STATE.MENU; }
  else if (state === STATE.GAME_OVER) { state = STATE.MENU; }
  else if (state === STATE.LEVEL_COMPLETE) { state = STATE.LEVEL_SELECT; }
}

function handleRetry() {
  if (state === STATE.GAME_OVER || state === STATE.PLAYING) {
    startLevel(currentLevel);
  }
}

function handleTouchMenu(e) {
  const t = e.touches[0];
  if (!t) return;
  const rect = canvas.getBoundingClientRect();
  const mx = (t.clientX - rect.left) / rect.width * W;
  const my = (t.clientY - rect.top) / rect.height * H;
  handleMenuClick(mx, my);
}

function handleMouseMenu(e) {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / rect.width * W;
  const my = (e.clientY - rect.top) / rect.height * H;
  handleMenuClick(mx, my);
}

function handleMenuClick(mx, my) {
  if (state === STATE.PLAYING) return;

  if (state === STATE.MENU) menuClick(mx, my);
  else if (state === STATE.LEVEL_SELECT) levelSelectClick(mx, my);
  else if (state === STATE.SETTINGS) settingsClick(mx, my);
  else if (state === STATE.GAME_OVER) gameOverClick(mx, my);
  else if (state === STATE.LEVEL_COMPLETE) completeClick(mx, my);
}

// ============ MENU ============
const buttons = [];

function menuClick(mx, my) {
  playClick();
  const btnW = 260, btnH = 55;
  const cx = W/2, cy = H/2;
  if (inRect(mx, my, cx - btnW/2, cy - 50, btnW, btnH)) {
    currentLevel = 0; startLevel(0);
  } else if (inRect(mx, my, cx - btnW/2, cy + 30, btnW, btnH)) {
    state = STATE.LEVEL_SELECT;
  } else if (inRect(mx, my, cx - btnW/2, cy + 110, btnW, btnH)) {
    state = STATE.SETTINGS;
  }
}

function levelSelectClick(mx, my) {
  const cols = Math.min(5, Math.floor(W / 120));
  const rows = Math.ceil(10 / cols);
  const cellW = Math.min(110, (W - 60) / cols);
  const cellH = 80;
  const gridW = cols * cellW + (cols-1) * 8;
  const startX = (W - gridW) / 2;
  const startY = 120;

  for (let i = 0; i < 10; i++) {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const bx = startX + col * (cellW + 8);
    const by = startY + row * (cellH + 8);
    if (inRect(mx, my, bx, by, cellW, cellH)) {
      playClick();
      if (completedLevels.includes(i) || i === 0 || i <= Math.max(...completedLevels, -1) + 1) {
        currentLevel = i;
        startLevel(i);
      }
      return;
    }
  }
  // Back button
  if (inRect(mx, my, 20, 20, 100, 40)) {
    playClick();
    state = STATE.MENU;
  }
}

function settingsClick(mx, my) {
  for (const option of getConfigButtons()) {
    if (inRect(mx, my, option.x, option.y, option.w, option.h)) {
      playClick();
      selectedConfig = option.index;
      localStorage.setItem('gd_config', selectedConfig);
      return;
    }
  }

  // Skin selection
  const cols = 5;
  const cellW = Math.min(80, (W - 60) / cols);
  const cellH = 100;
  const gridW = cols * cellW + (cols-1) * 8;
  const startX = (W - gridW) / 2;
  const startY = 120;

  for (let i = 0; i < SKIN_COLORS.length; i++) {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const bx = startX + col * (cellW + 8);
    const by = startY + row * (cellH + 8);
    if (inRect(mx, my, bx, by, cellW, cellH)) {
      playClick();
      if (unlockedSkins.includes(i)) {
        selectedSkin = i;
        localStorage.setItem('gd_skin', i);
      } else if (totalCoins >= SKIN_COST[i]) {
        totalCoins -= SKIN_COST[i];
        unlockedSkins.push(i);
        localStorage.setItem('gd_coins', totalCoins);
        localStorage.setItem('gd_unlockedSkins', JSON.stringify(unlockedSkins));
        selectedSkin = i;
        localStorage.setItem('gd_skin', i);
        playCoin();
      } else {
        playDeath();
      }
      return;
    }
  }
  // Back
  if (inRect(mx, my, 20, 20, 100, 40)) {
    playClick();
    state = STATE.MENU;
  }
}

function getConfigButtons() {
  const cols = Math.min(4, Math.max(1, Math.floor((W - 40) / 130)));
  const btnW = Math.min(120, (W - 60) / cols);
  const btnH = 38;
  const gap = 10;
  const rows = Math.ceil(SKIN_COLORS.length / 5);
  const y = 120 + rows * (100 + 8) + 30;
  const gridW = cols * btnW + (cols - 1) * gap;
  const startX = (W - gridW) / 2;

  return GAME_CONFIGS.map((config, index) => {
    const col = index % cols;
    const row = Math.floor(index / cols);
    return {
      index,
      config,
      x: startX + col * (btnW + gap),
      y: y + row * (btnH + gap),
      w: btnW,
      h: btnH
    };
  });
}

function gameOverClick(mx, my) {
  if (inRect(mx, my, W/2 - 100, H/2 + 40, 200, 50)) {
    playClick();
    startLevel(currentLevel);
  } else if (inRect(mx, my, W/2 - 100, H/2 + 110, 200, 50)) {
    playClick();
    state = STATE.MENU;
  }
}

function completeClick(mx, my) {
  const btnW = 200, btnH = 50;
  const cy = H/2;
  if (inRect(mx, my, W/2 - btnW - 60, cy + 80, btnW, btnH)) {
    playClick();
    currentLevel++;
    if (currentLevel < 10) startLevel(currentLevel);
    else { state = STATE.LEVEL_SELECT; }
  } else if (inRect(mx, my, W/2 + 60, cy + 80, btnW, btnH)) {
    playClick();
    state = STATE.LEVEL_SELECT;
  }
}

function inRect(mx, my, x, y, w, h) {
  return mx >= x && mx <= x + w && my >= y && my <= y + h;
}

// ============ GAME FUNCTIONS ============
let currentLevelData = null;
let bgStars = [];
for (let i = 0; i < 100; i++) {
  bgStars.push({ x: Math.random() * 2000, y: Math.random() * H, s: 0.5 + Math.random() * 1.5, b: 0.3 + Math.random() * 0.7 });
}

function startLevel(idx) {
  state = STATE.PLAYING;
  currentLevelData = generateLevel(idx);
  resetPlayer();
  player.y = H - currentLevelData.groundH - player.h;
  camera.x = 0;
  particles = [];
  combo = 0;
  maxCombo = 0;
  gameTime = 0;
  score = Math.max(0, idx * 100);
}

function updatePlaying() {
  if (!currentLevelData || !player.alive) return;
  gameTime += 1/60;
  frameCount++;

  const speed = currentLevelData.speed * player.speedMult;
  const groundH = currentLevelData.groundH;
  const prevX = player.x;
  const prevY = player.y;

  // Player physics
  if (!player.isShip) {
    player.vy += player.gravity * player.gravityDir;
  } else {
    player.vy += player.gravity * 0.5 * player.gravityDir;
  }

  const cfg = activeConfig();
  player.x += speed * cfg.speedScale * (player.grounded ? 1 : cfg.airMult);
  player.y += player.vy;

  // Ground collision
  if (player.gravityDir === 1) {
    if (player.y + player.h >= H - groundH) {
      player.y = H - groundH - player.h;
      player.vy = 0;
      if (!player.grounded) { player.grounded = true; player.doubleJumpUsed = false; combo = 0; }
      player.grounded = true;
    }
  } else {
    if (player.y <= groundH) {
      player.y = groundH;
      player.vy = 0;
      if (!player.grounded) { player.grounded = true; player.doubleJumpUsed = false; combo = 0; }
      player.grounded = true;
    }
  }

  // Ceiling for normal gravity
  if (player.gravityDir === 1 && player.y < 0) { player.y = 0; player.vy = 0; }
  if (player.gravityDir === -1 && player.y + player.h > H) { player.y = H - player.h; player.vy = 0; }

  // Rotation
  if (player.grounded) {
    player.rotation += player.rotSpeed;
    if (player.rotation > 360) player.rotation -= 360;
  } else {
    player.rotation += player.rotSpeed * 1.5;
  }

  // Trail
  if (frameCount % 3 === 0) {
    player.trail.push({ x: player.x + player.w/2, y: player.y + player.h/2, life: 1, size: 4 + Math.random() * 6 });
    if (player.trail.length > 30) player.trail.shift();
  }
  player.trail.forEach(t => { t.life -= 0.03; t.size *= 0.97; });
  player.trail = player.trail.filter(t => t.life > 0);

  // Camera
  camera.x = player.x - W * 0.3;
  if (camera.x < 0) camera.x = 0;

  // Player glow
  if (player.glowIntensity < 1) player.glowIntensity += 0.02;

  // Obstacle collision
  const px = player.x, py = player.y, pw = player.w, ph = player.h;
  const pMidX = px + pw/2;
  const pMidY = py + ph/2;

  for (const obs of currentLevelData.obstacles) {
    if (obs.type === 'gap') {
      // Check if player is over gap (no ground)
      if (px + pw > obs.x && px < obs.x + obs.w && player.gravityDir === 1) {
        // No ground - player falls through
        // Only trigger if player is on ground level
        if (player.y + player.h >= H - currentLevelData.groundH) {
          // Falling through gap
        }
      }
    }

    if (obs.type === 'block') {
      const hitsBlock = px + pw * 0.7 > obs.x && px + pw * 0.3 < obs.x + obs.w &&
          py + ph * 0.7 > obs.y && py + ph * 0.3 < obs.y + obs.h;
      const landsOnTop = player.gravityDir === 1 && player.vy >= 0 &&
          prevY + ph <= obs.y + 8 &&
          px + pw * 0.75 > obs.x && px + pw * 0.25 < obs.x + obs.w &&
          py + ph >= obs.y && py < obs.y;
      const landsOnBottom = player.gravityDir === -1 && player.vy <= 0 &&
          prevY >= obs.y + obs.h - 8 &&
          px + pw * 0.75 > obs.x && px + pw * 0.25 < obs.x + obs.w &&
          py <= obs.y + obs.h && py + ph > obs.y + obs.h;

      if (landsOnTop) {
        player.y = obs.y - ph;
        player.vy = 0;
        player.grounded = true;
        player.doubleJumpUsed = false;
        combo = 0;
      } else if (landsOnBottom) {
        player.y = obs.y + obs.h;
        player.vy = 0;
        player.grounded = true;
        player.doubleJumpUsed = false;
        combo = 0;
      } else if (hitsBlock && !player.invincible) {
        die();
        return;
      }
    }

    if (obs.type === 'spike') {
      if (px + pw * 0.7 > obs.x && px + pw * 0.3 < obs.x + obs.w &&
          py + ph * 0.7 > obs.y && py + ph * 0.3 < obs.y + obs.h) {
        if (!player.invincible) {
          die();
          return;
        }
      }
    }

    if (obs.type === 'moving') {
      obs.y = obs.y + Math.sin(gameTime * obs.moveSpeed) * 0.5;
      if (px + pw * 0.7 > obs.x && px + pw * 0.3 < obs.x + obs.w &&
          py + ph * 0.7 > obs.y && py + ph * 0.3 < obs.y + obs.h) {
        if (!player.invincible) { die(); return; }
      }
    }

    if (obs.type === 'coin') {
      if (!obs.scored && Math.abs(pMidX - (obs.x + obs.w/2)) < 30 && Math.abs(pMidY - (obs.y + obs.h/2)) < 30) {
        obs.scored = true;
        totalCoins++;
        localStorage.setItem('gd_coins', totalCoins);
        playCoin();
        score += 50;
      }
    }

    if (obs.type === 'portal_gravity') {
      if (Math.abs(pMidX - (obs.x + obs.w/2)) < 25 && Math.abs(pMidY - (obs.y + obs.h/2)) < 40) {
        player.gravityDir *= -1;
        player.vy = 0;
        playTone(300, 0.3, 'sine', 0.1);
        obs.scored = true;
      }
    }

    if (obs.type === 'portal_speed') {
      if (Math.abs(pMidX - (obs.x + obs.w/2)) < 20 && Math.abs(pMidY - (obs.y + obs.h/2)) < 30) {
        player.speedMult = player.speedMult === 1 ? 1.5 : 1;
        playTone(500, 0.2, 'sine', 0.1);
        obs.scored = true;
      }
    }

    if (obs.type === 'finish') {
      const crossedFinishLine = prevX + pw <= obs.x && px + pw >= obs.x;
      const overlapsFinish = px + pw * 0.7 > obs.x && px < obs.x + obs.w &&
          py + ph * 0.7 > obs.y && py + ph * 0.3 < obs.y + obs.h;
      const withinFinishZone = py < H && py + ph > 0;

      if ((crossedFinishLine && withinFinishZone) || overlapsFinish) {
        levelComplete();
        return;
      }
    }
  }

  // Keep player in bounds
  if (player.y > H + 50 || player.y < -100) { die(); return; }
  // Off left side
  if (player.x < camera.x - 100) { die(); return; }
}

function die() {
  if (!player.alive) return;
  player.alive = false;
  deaths++;
  playDeath();
  // Explosion particles
  for (let i = 0; i < 40; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 6;
    const color = SKIN_COLORS[selectedSkin];
    const colors = [color, '#ff4444', '#ffaa00', '#ffffff', '#ff00ff'];
    particles.push({
      x: player.x + player.w/2, y: player.y + player.h/2,
      vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 2,
      life: 1, decay: 0.008 + Math.random() * 0.015,
      size: 3 + Math.random() * 8,
      color: colors[Math.floor(Math.random() * colors.length)],
      type: 'explosion'
    });
  }
  // Screen shake particles
  for (let i = 0; i < 15; i++) {
    particles.push({
      x: player.x + player.w/2 + (Math.random()-0.5)*60,
      y: player.y + player.h/2 + (Math.random()-0.5)*60,
      vx: (Math.random()-0.5) * 8, vy: (Math.random()-0.5) * 8,
      life: 1, decay: 0.02,
      size: 2 + Math.random() * 4,
      color: '#ffffff',
      type: 'spark'
    });
  }
  state = STATE.GAME_OVER;
}

function levelComplete() {
  state = STATE.LEVEL_COMPLETE;
  playComplete();
  if (!completedLevels.includes(currentLevel)) {
    completedLevels.push(currentLevel);
    localStorage.setItem('gd_completed', JSON.stringify(completedLevels));
  }
  const coinsEarned = 50 + currentLevel * 20;
  totalCoins += coinsEarned;
  localStorage.setItem('gd_coins', totalCoins);
  highScores[currentLevel] = Math.max(highScores[currentLevel] || 0, score + currentLevel * 100);
  localStorage.setItem('gd_scores', JSON.stringify(highScores));
  score += currentLevel * 100;

  // Completion particles
  for (let i = 0; i < 60; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 4;
    particles.push({
      x: W/2, y: H/2,
      vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 1,
      life: 1, decay: 0.005 + Math.random() * 0.008,
      size: 3 + Math.random() * 8,
      color: ['#ffd700','#ff4444','#4a9eff','#4eff4a','#ff00ff'][Math.floor(Math.random()*5)],
      type: 'celebration'
    });
  }
}

// ============ RENDER ============
function drawBackground() {
  if (!currentLevelData) return;
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, currentLevelData.bg1);
  grad.addColorStop(1, currentLevelData.bg2);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Stars
  ctx.save();
  ctx.globalAlpha = 0.5;
  for (const star of bgStars) {
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = star.b * 0.4;
    let sx = (star.x - camera.x * 0.1) % (W + 100);
    if (sx < 0) sx += W + 100;
    ctx.fillRect(sx, star.y, star.s, star.s);
  }
  ctx.restore();

  // Mountains
  ctx.fillStyle = currentLevelData.bg2;
  ctx.globalAlpha = 0.3;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 5) {
    const wx = x + camera.x * 0.2;
    const y = H - 60 - Math.sin(wx * 0.005) * 40 - Math.sin(wx * 0.012) * 25;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H);
  ctx.fill();
  ctx.globalAlpha = 1;

  // Ground
  const groundH = currentLevelData.groundH;
  ctx.fillStyle = currentLevelData.ground;
  ctx.fillRect(0, H - groundH, W, groundH);
  ctx.fillStyle = currentLevelData.groundTop;
  ctx.fillRect(0, H - groundH, W, 4);
  // Ground pattern
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  for (let x = -(camera.x % 30); x < W; x += 30) {
    ctx.fillRect(x, H - groundH + 10, 1, groundH - 20);
  }
}

function drawObstacles() {
  if (!currentLevelData) return;
  ctx.save();
  for (const obs of currentLevelData.obstacles) {
    const sx = obs.x - camera.x;
    if (sx + obs.w < -50 || sx > W + 50) continue;

    if (obs.type === 'block') {
      ctx.fillStyle = currentLevelData.theme;
      ctx.shadowColor = currentLevelData.theme;
      ctx.shadowBlur = 10;
      ctx.fillRect(sx, obs.y, obs.w, obs.h);
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillRect(sx + 3, obs.y + 3, obs.w * 0.3, obs.h - 6);
      ctx.shadowBlur = 0;
      // Border
      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.lineWidth = 1;
      ctx.strokeRect(sx, obs.y, obs.w, obs.h);
    } else if (obs.type === 'spike') {
      ctx.fillStyle = '#ff4444';
      ctx.shadowColor = '#ff4444';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      const sw = obs.w, sh = obs.h;
      ctx.moveTo(sx, obs.y + sh);
      ctx.lineTo(sx + sw/2, obs.y);
      ctx.lineTo(sx + sw, obs.y + sh);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
    } else if (obs.type === 'gap') {
      ctx.fillStyle = '#000';
      ctx.fillRect(sx, obs.y, obs.w, obs.h);
    } else if (obs.type === 'coin') {
      if (!obs.scored) {
        const bob = Math.sin(gameTime * 3 + obs.x) * 5;
        ctx.fillStyle = '#ffd700';
        ctx.shadowColor = '#ffd700';
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.arc(sx + obs.w/2, obs.y + obs.h/2 + bob, obs.w/2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(sx + obs.w/2 - 3, obs.y + obs.h/2 + bob - 3, 4, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (obs.type === 'moving') {
      ctx.fillStyle = currentLevelData.theme;
      ctx.shadowColor = currentLevelData.theme;
      ctx.shadowBlur = 10;
      ctx.fillRect(sx, obs.y, obs.w, obs.h);
      ctx.shadowBlur = 0;
    } else if (obs.type === 'portal_gravity') {
      ctx.fillStyle = '#ff00ff';
      ctx.shadowColor = '#ff00ff';
      ctx.shadowBlur = 20;
      const gw = obs.w, gh = obs.h;
      ctx.fillRect(sx, obs.y, gw, gh);
      ctx.fillStyle = '#fff';
      ctx.shadowBlur = 0;
      ctx.font = '20px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('⟳', sx + gw/2, obs.y + gh/2 + 7);
    } else if (obs.type === 'portal_speed') {
      ctx.fillStyle = '#00ffff';
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 20;
      ctx.fillRect(sx, obs.y, obs.w, obs.h);
      ctx.fillStyle = '#fff';
      ctx.shadowBlur = 0;
      ctx.font = '16px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('>>', sx + obs.w/2, obs.y + obs.h/2 + 6);
    } else if (obs.type === 'finish') {
      const pulse = Math.sin(gameTime * 4) * 0.2 + 0.8;
      ctx.fillStyle = `rgba(255,215,0,${pulse})`;
      ctx.shadowColor = '#ffd700';
      ctx.shadowBlur = 30;
      ctx.fillRect(sx, obs.y, obs.w, obs.h);
      ctx.fillStyle = '#fff';
      ctx.shadowBlur = 0;
      ctx.font = '30px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('🏁', sx + obs.w/2, obs.y + obs.h/2 + 10);
    }
  }
  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawPlayer() {
  ctx.save();
  const px = player.x - camera.x;
  const py = player.y;
  const pw = player.w * player.size;
  const ph = player.h * player.size;
  const cx = px + player.w/2;
  const cy = py + player.h/2;

  // Trail
  for (const t of player.trail) {
    ctx.globalAlpha = t.life * 0.5;
    ctx.fillStyle = SKIN_COLORS[selectedSkin];
    ctx.beginPath();
    ctx.arc(t.x - camera.x, t.y, t.size * t.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Player glow
  const skinColor = SKIN_COLORS[selectedSkin];
  ctx.shadowColor = skinColor;
  ctx.shadowBlur = 20 + player.glowIntensity * 10;

  // Player body
  ctx.translate(px + pw/2, py + ph/2);
  ctx.rotate(player.rotation * Math.PI / 180);

  // Cube body
  const s = player.size;
  ctx.fillStyle = skinColor;
  ctx.fillRect(-pw/2, -ph/2, pw, ph);

  // Inner detail
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fillRect(-pw/2 + 4, -ph/2 + 4, pw * 0.7, ph * 0.3);
  ctx.fillRect(-pw/2 + 4, ph/2 - 8, pw * 0.5, 4);

  // Eye
  if (!player.isShip) {
    ctx.fillStyle = '#fff';
    ctx.fillRect(pw/2 - 10, -6, 8, 10);
    ctx.fillStyle = '#222';
    ctx.fillRect(pw/2 - 8, -4, 5, 6);
    // Mouth
    ctx.fillStyle = '#fff';
    ctx.fillRect(pw/2 - 8, 6, 7, 3);
  } else {
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(6, 0, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(8, 0, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawParticles() {
  ctx.save();
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = p.size * 2;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
  ctx.restore();
}

function updateParticles() {
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.05;
    p.life -= p.decay;
    p.size *= 0.99;
  }
  particles = particles.filter(p => p.life > 0);
}

function drawHUD() {
  if (!currentLevelData) return;
  ctx.save();

  // Progress bar
  const barW = Math.min(W - 40, 300);
  const barH = 8;
  const barX = W/2 - barW/2;
  const barY = 20;
  const progress = Math.min(1, (player.x) / currentLevelData.length);

  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(barX, barY, barW, barH);

  ctx.fillStyle = currentLevelData.theme;
  ctx.shadowColor = currentLevelData.theme;
  ctx.shadowBlur = 8;
  ctx.fillRect(barX + 2, barY + 2, (barW - 4) * progress, barH - 4);
  ctx.shadowBlur = 0;

  // Timer
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 14px Arial';
  ctx.textAlign = 'left';
  ctx.fillText(`⏱ ${gameTime.toFixed(1)}s`, 20, 60);

  // Coins
  ctx.fillStyle = '#ffd700';
  ctx.fillText(`🪙 ${totalCoins}`, 20, 85);

  // Deaths
  ctx.fillStyle = '#ff6666';

    ctx.textAlign = 'right';
    ctx.globalAlpha = Math.min(1, combo / 5);
    ctx.fillText(`🔥 ${combo}x`, W - 20, 80);

  }

  // Skin indicator (mobile tap area hint at bottom)

  ctx.font = '12px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('⬇ Tap / Space to jump ⬇', W/2, H - 15);

  ctx.restore();
}

function drawLevelSelect() {
  ctx.save();
  // Background
  const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W*0.7);
  grad.addColorStop(0, '#1a1a2e');
  grad.addColorStop(1, '#0a0a1a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 32px Arial';
  ctx.fillText('SELECT LEVEL', W/2, 70);

  const cols = Math.min(5, Math.floor(W / 120));
  const cellW = Math.min(110, (W - 60) / cols);
  const cellH = 80;
  const gridW = cols * cellW + (cols-1) * 8;
  const startX = (W - gridW) / 2;
  const startY = 120;

  for (let i = 0; i < 10; i++) {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const bx = startX + col * (cellW + 8);
    const by = startY + row * (cellH + 8);
    const unlocked = completedLevels.includes(i) || i === 0 || i <= Math.max(...completedLevels, -1) + 1;
    const color = unlocked ? ['#4a9eff','#4eff4a','#ff4a4a','#b44aff','#ffd700','#00ffff','#ff69b4','#00ff88','#ff4400','#ff00ff'][i] : '#444';

    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(bx, by, cellW, cellH);
    ctx.fillStyle = color;
    ctx.shadowColor = unlocked ? color : 'transparent';
    ctx.shadowBlur = 10;
    ctx.fillRect(bx + 2, by + 2, cellW - 4, cellH - 4);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px Arial';
    ctx.fillText(`${i+1}`, bx + cellW/2, by + cellH/2 - 8);
    ctx.font = '10px Arial';
    ctx.fillStyle = unlocked ? '#ddd' : '#666';
    ctx.fillText(['First Steps','Green Hills','Fire Escape','Purple Night','Gold Rush','Cyan Wave','Pink Paradise','Neon Blast','Dark Inferno','Final Frontier'][i].substring(0,12), bx + cellW/2, by + cellH/2 + 15);

    if (!unlocked) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(bx, by, cellW, cellH);
      ctx.fillStyle = '#ff4444';
      ctx.font = '20px Arial';
      ctx.fillText('🔒', bx + cellW/2, by + cellH/2 + 7);
    }

    // Stars for score
    if (highScores[i]) {
      ctx.fillStyle = '#ffd700';
      ctx.font = '12px Arial';
      ctx.fillText('★', bx + cellW - 15, by + 15);
    }
  }

  // Back button
  ctx.fillStyle = '#666';
  drawButton(20, 20, 100, 40, '', '#666');
  ctx.fillStyle = '#fff';
  ctx.font = '14px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('⬅ BACK', 70, 46);

  ctx.restore();
}

function drawSettings() {
  ctx.save();
  const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W*0.7);
  grad.addColorStop(0, '#1a1a2e');
  grad.addColorStop(1, '#0a0a1a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 32px Arial';
  ctx.fillText('🎨 SKIN SHOP', W/2, 70);

  ctx.fillStyle = '#ffd700';
  ctx.font = '20px Arial';
  ctx.fillText(`🪙 ${totalCoins} Coins`, W/2, 105);

  const cols = 5;
  const cellW = Math.min(80, (W - 60) / cols);
  const cellH = 100;
  const gridW = cols * cellW + (cols-1) * 8;
  const startX = (W - gridW) / 2;
  const startY = 120;

  for (let i = 0; i < SKIN_COLORS.length; i++) {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const bx = startX + col * (cellW + 8);
    const by = startY + row * (cellH + 8);
    const owned = unlockedSkins.includes(i);
    const selected = i === selectedSkin;

    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(bx, by, cellW, cellH);

    // Color preview
    ctx.fillStyle = SKIN_COLORS[i];
    ctx.shadowColor = SKIN_COLORS[i];
    ctx.shadowBlur = selected ? 20 : 5;
    ctx.fillRect(bx + 10, by + 5, cellW - 20, 30);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#fff';
    ctx.font = '10px Arial';
    ctx.fillText(SKIN_NAMES[i], bx + cellW/2, by + 55);

    if (owned) {
      if (selected) {
        ctx.fillStyle = '#ffd700';
        ctx.font = '12px Arial';
        ctx.fillText('✓ SELECTED', bx + cellW/2, by + 75);
      } else {
        ctx.fillStyle = '#4eff4a';
        ctx.font = '10px Arial';
        ctx.fillText('OWNED', bx + cellW/2, by + 75);
      }
    } else {
      ctx.fillStyle = '#ffaa00';
      ctx.font = '10px Arial';
      ctx.fillText(`${SKIN_COST[i]}🪙`, bx + cellW/2, by + 65);
      ctx.fillStyle = totalCoins >= SKIN_COST[i] ? '#4eff4a' : '#ff4444';
      ctx.font = '9px Arial';
      ctx.fillText(totalCoins >= SKIN_COST[i] ? 'BUY' : 'LOCKED', bx + cellW/2, by + 80);
    }
  }

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px Arial';
  ctx.fillText('GAME CONFIG', W/2, getConfigButtons()[0].y - 12);
  for (const option of getConfigButtons()) {
    const selected = option.index === selectedConfig;
    drawButton(option.x, option.y, option.w, option.h, option.config.name, selected ? '#ffd700' : '#4a9eff', selected ? '#ffd700' : '#4a9eff');
  }

  // Back button
  ctx.fillStyle = '#666';
  drawButton(20, 20, 100, 40, '', '#666');
  ctx.fillStyle = '#fff';
  ctx.font = '14px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('⬅ BACK', 70, 46);

  ctx.restore();
}

function drawGameOver() {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.shadowColor = '#ff4444';
  ctx.shadowBlur = 20;
  ctx.fillStyle = '#ff4444';
  ctx.font = 'bold 48px Arial';
  ctx.fillText('YOU DIED!', W/2, H/2 - 60);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#fff';
  ctx.font = '18px Arial';
  ctx.fillText(`Deaths: ${deaths}  |  Combo: ${maxCombo}x`, W/2, H/2 + 10);

  drawButton(W/2 - 100, H/2 + 40, 200, 50, '🔄 RETRY (R)', '#ff4444');
  drawButton(W/2 - 100, H/2 + 110, 200, 50, '🏠 MENU (ESC)', '#666');

  ctx.restore();
}

function drawLevelComplete() {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.shadowColor = '#ffd700';
  ctx.shadowBlur = 30;
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 48px Arial';
  ctx.fillText('LEVEL COMPLETE!', W/2, H/2 - 80);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#fff';
  ctx.font = '20px Arial';
  ctx.fillText(`Score: ${score + currentLevel * 100}  |  Time: ${gameTime.toFixed(1)}s  |  Deaths: ${deaths}`, W/2, H/2 - 20);
  ctx.fillStyle = '#ffd700';
  ctx.fillText(`+${50 + currentLevel * 20} 🪙 Coins Earned`, W/2, H/2 + 15);

  if (currentLevel < 9) {
    drawButton(W/2 - 260, H/2 + 80, 200, 50, '▶ NEXT LEVEL', '#4eff4a');
  }
  drawButton(W/2 + 60, H/2 + 80, 200, 50, '📋 LEVELS', '#666');

  ctx.restore();
}

function chamferPath(x, y, w, h, cut = 10) {
  const c = Math.min(cut, w / 4, h / 3);
  ctx.beginPath();
  ctx.moveTo(x + c, y);
  ctx.lineTo(x + w - c, y);
  ctx.lineTo(x + w, y + c);
  ctx.lineTo(x + w, y + h - c);
  ctx.lineTo(x + w - c, y + h);
  ctx.lineTo(x + c, y + h);
  ctx.lineTo(x, y + h - c);
  ctx.lineTo(x, y + c);
  ctx.closePath();
}

function drawButton(x, y, w, h, text, color, shadowColor) {
  ctx.save();
  const hovered = inRect(pointer.x, pointer.y, x, y, w, h);
  const pressed = hovered && pointer.down;
  if (pressed) y += 2;
  const glow = shadowColor || color;
  const grad = ctx.createLinearGradient(x, y, x, y + h);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.08, color);
  grad.addColorStop(0.58, color);
  grad.addColorStop(1, '#111827');

  chamferPath(x + 5, y + 6, w, h, 12);
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fill();

  chamferPath(x, y, w, h, 12);
  ctx.shadowColor = glow;
  ctx.shadowBlur = hovered ? 28 : 18;
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.shadowBlur = 0;

  chamferPath(x + 4, y + 4, w - 8, Math.max(8, h * 0.28), 7);
  ctx.fillStyle = 'rgba(255,255,255,0.24)';
  ctx.fill();

  chamferPath(x, y, w, h, 12);
  ctx.strokeStyle = hovered ? '#fff' : 'rgba(255,255,255,0.75)';
  ctx.lineWidth = hovered ? 3 : 2;
  ctx.stroke();

  chamferPath(x + 4, y + 4, w - 8, h - 8, 8);
  ctx.strokeStyle = glow;
  ctx.globalAlpha = 0.5;
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.globalAlpha = 1;

  ctx.fillStyle = '#fff';
  ctx.shadowColor = 'rgba(0,0,0,0.65)';
  ctx.shadowBlur = 4;
  ctx.font = 'bold 16px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x + w/2, y + h/2);
  ctx.restore();
}

// ============ MAIN LOOP ============
function update() {
  updateParticles();

  if (state === STATE.PLAYING) updatePlaying();
}

function render() {
  ctx.clearRect(0, 0, W, H);

  switch (state) {
    case STATE.MENU:
      drawMenu();
      break;
    case STATE.LEVEL_SELECT:
      drawLevelSelect();
      break;
    case STATE.SETTINGS:
      drawSettings();
      break;
    case STATE.PLAYING:
      drawBackground();
      drawObstacles();
      drawPlayer();
      drawParticles();
      drawHUD();
      break;
    case STATE.GAME_OVER:
      drawBackground();
      drawObstacles();
      drawParticles();
      drawGameOver();
      break;
    case STATE.LEVEL_COMPLETE:
      drawBackground();
      drawObstacles();
      drawParticles();
      drawLevelComplete();
      break;
  }
}

function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

// Keyboard shortcuts for menus
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && state === STATE.MENU) {
    e.preventDefault();
    currentLevel = 0;
    startLevel(0);
  }
  if (e.code === 'Enter' && state === STATE.GAME_OVER) {
    startLevel(currentLevel);
  }
});

// Initialize first level data for background preview
currentLevelData = generateLevel(0);
gameLoop();
</script>
