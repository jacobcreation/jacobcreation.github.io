<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pac-Man</title>
<link rel="stylesheet" href="styles.css">
    <!-- Mobile Friendly -->
    <link rel="stylesheet" href="/mobile-friendly.css">
</head>
<body>
<div class="game-container">
  <div class="header">
    <div class="score-label">SCORE: <span id="score">0</span></div>
    <div class="lives-label">LIVES: <span id="lives">3</span></div>
  </div>
  
  <canvas id="gameCanvas"></canvas>
  
  <div id="startOverlay" class="overlay">
    <h2>PAC-MAN</h2>
    <p>USE ARROWS OR SWIPE TO MOVE<br>EAT ALL DOTS TO WIN</p>
    <button id="startBtn">START GAME</button>
  </div>

  <div id="gameOverOverlay" class="overlay" style="display: none;">
    <h2 id="gameOverTitle">GAME OVER</h2>
    <p>FINAL SCORE: <span id="finalScore">0</span></p>
    <button id="restartBtn">RESTART</button>
  </div>

  <div class="controls">
    <div class="control-btn btn-up" data-dir="up">▲</div>
    <div class="control-btn btn-left" data-dir="left">◀</div>
    <div class="control-btn btn-right" data-dir="right">▶</div>
    <div class="control-btn btn-down" data-dir="down">▼</div>
  </div>
</div>
<script src="app.js"></script>
    <script>(function(){const v=Date.now();document.write('<script src="/global-header.js?v='+v+'"><\/script>');})();</script>
    <script src="/accounts/account-widget.js" defer data-account-api="https://accounts-system.b4rjxr9lk.workers.dev"></script>
</body>
</html>
