<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
    <!-- Mobile Friendly -->
    <link rel="stylesheet" href="/mobile-friendly.css">
</head>
<body>
  <div class="calculator">
    <div class="history" id="history"></div>
    <div class="display" id="display">0</div>
    <div class="memory" id="memory-indicator"></div>
    <div class="buttons">
      <button class="btn memory-btn" data-action="mc">MC</button>
      <button class="btn memory-btn" data-action="mr">MR</button>
      <button class="btn memory-btn" data-action="mplus">M+</button>
      <button class="btn memory-btn" data-action="mminus">M−</button>
      <button class="btn" data-action="undo">⌫</button>
      <button class="btn" data-action="clear">CE</button>
      <button class="btn" data-action="all-clear">C</button>
      <button class="btn operator" data-action="divide">÷</button>
      <button class="btn" data-action="7">7</button>
      <button class="btn" data-action="8">8</button>
      <button class="btn" data-action="9">9</button>
      <button class="btn operator" data-action="multiply">×</button>
      <button class="btn" data-action="4">4</button>
      <button class="btn" data-action="5">5</button>
      <button class="btn" data-action="6">6</button>
      <button class="btn operator" data-action="subtract">−</button>
      <button class="btn" data-action="1">1</button>
      <button class="btn" data-action="2">2</button>
      <button class="btn" data-action="3">3</button>
      <button class="btn operator" data-action="add">+</button>
      <button class="btn" data-action="negate">±</button>
      <button class="btn" data-action="0">0</button>
      <button class="btn" data-action="decimal">.</button>
      <button class="btn equals" data-action="equals">=</button>
    </div>
  </div>
  <script src="script.js"></script>
  <script>(function(){const v=Date.now();document.write('<script src="/global-header.js?v='+v+'"><\/script>');})();</script>
    <script src="/accounts/account-widget.js" defer data-account-api="https://accounts-system.b4rjxr9lk.workers.dev"></script>
</body>
</html>
