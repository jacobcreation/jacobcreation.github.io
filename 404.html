<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#000000">

    <!-- iOS PWA Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="JacobCreation">
    <link rel="apple-touch-icon" href="/favicon.png">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Oops! The page you're looking for doesn't exist. Explore more fun projects at JacobCreation." />

    <title>404 - Page Not Found | JacobCreation</title>

    <!-- ✅ Favicon setup -->
    <link rel="icon" href="/favicon.png" type="image/png" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg1: #0b1020;
            --bg2: #0a1633;
            --card: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.14);
            --text: #eaf2ff;
            --muted: rgba(234, 242, 255, 0.75);
            --blue: #4ea1ff;
            --blue2: #2d6bff;
            --red: #ff2d2d;
            --shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
            --radius: 18px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Poppins", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            color: var(--text);
            min-height: 100vh;
            background:
                radial-gradient(1200px 600px at 20% 10%, rgba(78, 161, 255, 0.30), transparent 55%),
                radial-gradient(900px 600px at 90% 15%, rgba(45, 107, 255, 0.22), transparent 55%),
                linear-gradient(135deg, var(--bg1), var(--bg2));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .mascot {
            width: 100%;
            max-width: 300px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(78, 161, 255, 0.4));
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-family: "Orbitron", sans-serif;
            font-size: 4rem;
            margin: 0;
            background: linear-gradient(90deg, var(--blue), var(--red));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(78, 161, 255, 0.3);
            line-height: 1;
        }

        h2 {
            font-size: 1.5rem;
            margin: 10px 0 20px;
            color: var(--text);
        }

        p {
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #071122;
            background: linear-gradient(135deg, var(--blue), var(--blue2));
            padding: 14px 28px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 10px 24px rgba(45, 107, 255, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(45, 107, 255, 0.4);
        }

        footer {
            margin-top: 40px;
            color: rgba(234, 242, 255, 0.5);
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="/404-mascot.png" alt="JacobCreation Mascot" class="mascot">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>
            Oops! It looks like you've ventured into uncharted territory. 
            The page you're looking for doesn't exist or has been moved.
        </p>
        <a href="/" class="btn">🚀 Return to Base</a>
    </div>

    <footer>
        © 2026 JacobCreation • Built by Jacob 💙
    </footer>

    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/service-worker.js");
        }
    </script>
</body>

</html>
