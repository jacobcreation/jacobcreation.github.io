<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Cache Busting Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Chat with JacobBot AI using multiple live AI providers." />

  <title>JacobBot AI - JacobCreation</title>

  <link rel="icon" href="https://jacobcreation.github.io/favicon.png" type="image/png" />

  <link href="https://jacobcreation.github.io/fonts/fonts.css" rel="stylesheet">
  
  <script src="https://jacobcreation.github.io/vendor/marked.min.js"></script>

  <style>
    :root {
      --bg1: #0b1020;
      --bg2: #0a1633;
      --card: rgba(255, 255, 255, 0.08);
      --card2: rgba(255, 255, 255, 0.12);
      --border: rgba(255, 255, 255, 0.14);
      --text: #eaf2ff;
      --muted: rgba(234, 242, 255, 0.75);
      --blue: #4ea1ff;
      --blue2: #2d6bff;
      --shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
      --shadow2: 0 10px 22px rgba(0, 0, 0, 0.28);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Poppins", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(1200px 600px at 20% 10%, rgba(78, 161, 255, 0.30), transparent 55%),
        radial-gradient(900px 600px at 90% 15%, rgba(45, 107, 255, 0.22), transparent 55%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      display: flex;
      flex-direction: column;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(10px);
      background: rgba(10, 16, 32, 0.65);
      border-bottom: 1px solid rgba(255, 255, 255, 0.10);
    }

    .header-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: inherit;
      gap: 10px;
      font-weight: 800;
      letter-spacing: 0.2px;
      font-size: 1.15rem;
      white-space: nowrap;
    }

    .logo-badge {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, #1e90ff, #ff2d2d);
      box-shadow: 0 10px 24px rgba(30, 144, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.20);
      font-weight: 900;
      color: white;
    }

    .logo-text {
      font-family: "Orbitron", sans-serif;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #1e90ff, #ff2d2d);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow:
        0 0 14px rgba(30, 144, 255, 0.35),
        0 0 14px rgba(255, 45, 45, 0.25);
    }

    nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    nav a {
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
      font-size: 0.92rem;
      padding: 9px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      transition: transform 0.18s ease, background 0.18s ease, border 0.18s ease;
    }

    nav a:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.10);
      border-color: rgba(255, 255, 255, 0.22);
    }

    main {
      padding: 28px 18px 60px;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      flex: 1;
      display: flex;
      justify-content: center;
    }

    .container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }

    .chat-panel {
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.05));
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: 700px;
      width: min(100%, 820px);
    }

    /* ─── Chat Header ─── */
    .chat-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      display: flex;
      gap: 10px;
      flex-shrink: 0;
      align-items: flex-start;
    }

    .chat-avatar {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--card2);
      display: grid;
      place-items: center;
      font-size: 20px;
      border: 1px solid var(--border);
      flex-shrink: 0;
      margin-top: 2px;
    }

    .chat-header-right {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    /* Top row: name + action buttons side by side */
    .chat-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .chat-title strong {
      font-size: 0.95rem;
      color: var(--text);
      display: block;
      white-space: nowrap;
    }

    .mem-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .mem-mini-btn {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 7px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mem-mini-btn:hover {
      background: var(--card2);
      transform: translateY(-1px);
    }

    /* Model select row sits below title row */
    .model-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .model-select {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 0.7rem;
      outline: none;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
      max-width: 100%;
    }

    .model-select:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--blue);
      color: var(--text);
    }

    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .bubble {
      max-width: 85%;
      border-radius: 18px;
      padding: 12px 16px;
      font-size: 0.95rem;
      line-height: 1.5;
      position: relative;
      animation: bubbleIn 0.3s ease-out;
    }

    .bubble.bot {
      align-self: flex-start;
      background: var(--card2);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .bubble.user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--blue), var(--blue2));
      color: #071122;
      font-weight: 600;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 12px rgba(45, 107, 255, 0.2);
    }

    /* ─── FIXED Chat Input ─── */
    .chat-input {
      padding: 14px;
      background: rgba(255, 255, 255, 0.02);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .chat-input input {
      flex: 1;
      min-width: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      color: var(--text);
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .chat-input input:focus {
      border-color: var(--blue);
    }

    .btn-send {
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--blue), var(--blue2));
      color: #071122;
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      height: 42px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.2s;
    }

    .btn-send:hover {
      transform: scale(1.03);
    }


    .pill {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .pill:hover {
      background: var(--card2);
    }

    footer {
      border-top: 1px solid rgba(255, 255, 255, 0.10);
      background: rgba(10, 16, 32, 0.55);
      backdrop-filter: blur(10px);
      padding: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(10px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 1080px) {
      .chat-panel {
        width: 100%;
        height: 600px;
      }

      main {
        padding-top: 20px;
      }
    }
  </style>
</head>

<body>

  <main>
    <div class="container">

      <!-- Chatbox -->
      <section class="chat-panel">
        <header class="chat-header">
          <div class="chat-avatar">🤝</div>

          <div class="chat-header-right">
            <!-- Row 1: Name + action buttons -->
            <div class="chat-title-row">
              <div class="chat-title">
                <strong>JacobBot AI</strong>
              </div>
              <div class="mem-actions">
                <button class="mem-mini-btn" type="button" id="clearChatBtn" title="Clear Chat">🗑️</button>
                <button class="mem-mini-btn" type="button" id="downloadMemBtn" title="Download Memory">⬇️</button>
                <button class="mem-mini-btn" type="button" id="uploadMemBtn" title="Upload Memory">⬆️</button>
                <button class="mem-mini-btn" type="button" id="uploadImgBtn" title="Attach Image">🖼️</button>
                <input type="file" id="memFileInput" accept="application/json" style="display:none;">
                <input type="file" id="imgFileInput" accept="image/*" style="display:none;">
              </div>
            </div>

            <!-- Row 2: Model selector -->
            <div class="model-row">
              <select id="modelSelect" class="model-select">
                <optgroup label="Llama Series (Meta)">
                  <option value="@cf/meta/llama-3.2-3b-instruct" selected>Llama 3.2 3B (Default)</option>
                  <option value="@cf/meta/llama-3.2-1b-instruct">Llama 3.2 1B (Tiny)</option>
                  <option value="@cf/meta/llama-3.3-70b-instruct-fp8-fast">Llama 3.3 70B (Smart)</option>
                </optgroup>
                <optgroup label="Groq (Ultra-Fast)">
                  <option value="groq/llama-3.3-70b-versatile">Llama 3.3 70B (Groq)</option>
                  <option value="groq/llama-3.1-8b-instant">Llama 3.1 8B (Groq)</option>
                  <option value="groq/openai/gpt-oss-120b">GPT OSS 120B (Groq)</option>
                  <option value="groq/openai/gpt-oss-20b">GPT OSS 20B (Groq)</option>
                </optgroup>
                <optgroup label="Cerebras (Inference Speed King)">
                  <option value="cerebras/gpt-oss-120b">GPT OSS 120B (Cerebras)</option>
                  <option value="cerebras/zai-glm-4.7">GLM 4.7 Preview (Cerebras)</option>
                </optgroup>
                <optgroup label="NVIDIA NIM">
                  <option value="nvidia/nvidia/llama-3.1-nemotron-nano-8b-v1">Nemotron Nano 8B (NVIDIA)</option>
                  <option value="nvidia/nvidia/llama-3.3-nemotron-super-49b-v1.5">Nemotron Super 49B (NVIDIA)</option>
                  <option value="nvidia/nvidia/nemotron-3-super-120b-a12b">Nemotron 3 Super 120B (NVIDIA)</option>
                  <option value="nvidia/openai/gpt-oss-120b">GPT OSS 120B (NVIDIA)</option>
                  <option value="nvidia/openai/gpt-oss-20b">GPT OSS 20B (NVIDIA)</option>
                  <option value="nvidia/qwen/qwen3-coder-480b-a35b-instruct">Qwen3 Coder 480B (NVIDIA)</option>
                </optgroup>
                <optgroup label="Google Gemini / Gemma">
                  <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                  <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash-Lite</option>
                  <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
                  <option value="@cf/google/gemma-4-26b-a4b-it">Gemma 4 26B</option>
                </optgroup>
                <optgroup label="Mistral / Mixtral">
                  <option value="@cf/mistral/mistral-small-3.1-24b-instruct">Mistral Small 3.1 24B</option>
                </optgroup>
                <optgroup label="Specialized">
                  <option value="@cf/openai/gpt-oss-20b">GPT OSS 20B (Reasoning)</option>
                  <option value="@cf/qwen/qwen3-30b-a3b-fp8">Qwen3 30B A3B</option>
                  <option value="@cf/qwen/qwen2.5-coder-32b-instruct">Qwen2.5 Coder 32B</option>
                  <option value="@cf/deepseek-ai/deepseek-r1-distill-qwen-32b">DeepSeek R1 Distill Qwen 32B</option>
                </optgroup>
              </select>
            </div>

            <!-- Row 3: Note -->
            <div class="tiny-note">
              ⚠️ I can read your image NOW 👀 but after refresh I won't remember it 🙂
            </div>
          </div>
        </header>

        <div class="chat-body" id="chatBody">
          <div class="bubble bot">Hi! How can I help today?</div>
        </div>

        <form class="chat-input" id="chatForm">
          <input id="chatText" type="text" placeholder="Type your message..." autocomplete="off" />
          <button class="btn-send" type="submit" id="sendBtn">Send</button>
        </form>

      </section>

    </div>
  </main>

  <footer>
    © 2026 JacobCreation • Built by Jacob 💙
  </footer>

  <script>
    const ENDPOINT = "https://chatbot-ai.b4rjxr9lk.workers.dev/";
    const SITE_NAME = "jacobcreation";

    const chatBody = document.getElementById("chatBody");
    const chatForm = document.getElementById("chatForm");
    const chatText = document.getElementById("chatText");

    const dlBtn = document.getElementById("downloadMemBtn");
    const ulBtn = document.getElementById("uploadMemBtn");
    const memFile = document.getElementById("memFileInput");

    const imgBtn = document.getElementById("uploadImgBtn");
    const imgFile = document.getElementById("imgFileInput");
    const clearBtn = document.getElementById("clearChatBtn");

    let currentImage = null;

    loadHistory();

    function getSessionId() {
      let id = localStorage.getItem("jc_session");
      if (!id) {
        id = crypto.randomUUID();
        localStorage.setItem("jc_session", id);
      }
      return id;
    }

    function renderMarkdown(text) {
      if (window.marked && typeof window.marked.parse === "function") {
        return window.marked.parse(text);
      }
      const escaped = String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
      return escaped.replace(/\n/g, "<br>");
    }

    function addBubble(text, who = "bot", typing = false) {
      const div = document.createElement("div");
      div.className = `bubble ${who}`;
      
      if (who === "bot") {
          if (typing) {
              div.innerHTML = "";
              chatBody.appendChild(div);
              let i = 0;
              const words = text.split(" ");
              const interval = setInterval(() => {
                  if (i < words.length) {
                      div.innerHTML = renderMarkdown(words.slice(0, i + 1).join(" "));
                      div.querySelectorAll("p").forEach(p => p.style.margin = "0 0 10px 0");
                      chatBody.scrollTop = chatBody.scrollHeight;
                      i++;
                  } else {
                      clearInterval(interval);
                  }
              }, 40);
          } else {
              div.innerHTML = renderMarkdown(text);
              div.querySelectorAll("p").forEach(p => p.style.margin = "0 0 10px 0");
              chatBody.appendChild(div);
          }
      } else {
          div.innerText = text;
          chatBody.appendChild(div);
      }
      
      chatBody.scrollTop = chatBody.scrollHeight;
      return div;
    }

    async function loadHistory() {
        try {
            const res = await fetch(ENDPOINT, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "download", sessionId: getSessionId() })
            });
            const data = await res.json();
            if (data.history && data.history.length > 0) {
                chatBody.innerHTML = "";
                data.history.forEach(m => {
                    addBubble(m.content, m.role === "assistant" ? "bot" : "user", false);
                });
            }
        } catch (e) {
            console.error("Failed to load history:", e);
        }
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      let msg = chatText.value.trim();

      if (!msg && !currentImage) return;
      if (!msg && currentImage) msg = "Please analyze this image.";

      if (currentImage) {
        addBubble("🖼️ [Image attached]\n" + msg, "user");
      } else {
        addBubble(msg, "user");
      }
      chatText.value = "";

      const typingDiv = document.createElement("div");
      typingDiv.className = "bubble bot";
      typingDiv.textContent = "Thinking... 💭";
      chatBody.appendChild(typingDiv);
      chatBody.scrollTop = chatBody.scrollHeight;

      try {
        const modelSelect = document.getElementById("modelSelect");
        const payload = {
            action: "chat",
            site: SITE_NAME,
            sessionId: getSessionId(),
            message: msg,
            model: modelSelect ? modelSelect.value : "@cf/meta/llama-3.2-3b-instruct"
        };

        if (currentImage) {
            payload.image = currentImage;
            currentImage = null;
        }

        const res = await fetch(ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!res.ok) throw new Error(data.error || "Network response was not ok");

        typingDiv.remove();
        if (data.reply) {
            addBubble(data.reply, "bot", true);
        } else {
            addBubble("I'm not sure what to say.");
        }

      } catch (err) {
        // console.error(err);  // Removed for production
        addBubble("Error: " + err.message + " 🧠", "bot");
      }
    });

    clearBtn.addEventListener("click", async () => {
        if (!confirm("Clear chat history?")) return;
        try {
            await fetch(ENDPOINT, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "clear", sessionId: getSessionId() })
            });
            chatBody.innerHTML = "";
            addBubble("Memory cleared! Starting fresh. ✨");
        } catch (e) {
            console.error(e);
            addBubble("Failed to clear chat history from server.");
        }
    });

    dlBtn.addEventListener("click", async () => {
      try {
        const res = await fetch(ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "download", sessionId: getSessionId() })
        });

        const data = await res.json();
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = `memory-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        addBubble("Memory downloaded! Keep it safe. 💾");

      } catch (err) {
        console.error(err);
        addBubble("Failed to download memory.");
      }
    });

    ulBtn.addEventListener("click", () => { memFile.click(); });
    imgBtn.addEventListener("click", () => { imgFile.click(); });

    imgFile.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const base64String = event.target.result.split(',')[1];
        currentImage = { mimeType: file.type, data: base64String };
        addBubble("Image attached! Type a message to ask about it. 🖼️", "bot");
      };
      reader.readAsDataURL(file);
      imgFile.value = "";
    });

    memFile.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (event) => {
        try {
          const jsonContent = JSON.parse(event.target.result);
          addBubble("Uploading memory... 📤");

          const res = await fetch(ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              action: "upload",
              sessionId: getSessionId(),
              history: jsonContent.history || []
            })
          });

          if (res.ok) {
            addBubble("Memory restored successfully! 🧠✨");
          } else {
            addBubble("Server rejected the memory.");
          }

        } catch (err) {
          console.error(err);
          addBubble("Invalid memory file. Corrupt JSON?");
        }
      };

      reader.readAsText(file);
      memFile.value = "";
    });


  </script>

  <script>
    (function () {
      const script = document.createElement("script");
      script.src = `https://jacobcreation.github.io/global-header.js?v=${Date.now()}`;
      document.body.appendChild(script);
    })();
  </script>
    <script src="https://jacobcreation.github.io/accounts/account-widget.js" defer data-account-api="https://accounts-system.b4rjxr9lk.workers.dev"></script>
</body>

</html>
