<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Chat with our helper and play fun minigames like Snake, Tetris, and Chess!" />

  <title>Chat + Minigames - JacobCreation</title>

  <!-- ✅ Favicon setup -->
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="icon" href="/favicon.png" type="image/png" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --blue: #1e90ff;
      --blue-dark: #104e8b;
      --bg-gradient: linear-gradient(135deg, #f0f8ff, #e6f2ff);
      --text: #333;
      --muted: #6b7280;
      --card-bg: #ffffff;
      --accent: #1e90ff;
      --accent-dark: #104e8b;
      --soft: #eaf6ff;
      --radius: 20px;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
    }

    body {
      font-family: "Poppins", Arial, sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      background: linear-gradient(90deg, var(--blue), var(--blue-dark));
      color: white;
      padding: 15px 0;
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 1000;
      display: block;
    }

    .header-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding: 0 14px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 2em;
      font-weight: 700;
    }

    header nav a {
      background: var(--blue);
      color: white;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.9em;
      font-weight: 600;
      transition: background 0.3s ease, transform 0.2s ease;
      display: inline-block;
    }

    header nav a:hover {
      background: var(--blue-dark);
      transform: translateY(-2px);
    }

    main {
      padding: 40px 20px;
      width: 100%;
      max-width: 1100px;
      flex: 1;
      display: flex;
      justify-content: center;
      box-sizing: border-box;
    }

    .container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }

    /* Chat panel */
    .chat-panel {
      width: 340px;
      height: 500px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .chat-header {
      background: linear-gradient(135deg, #fff, var(--soft));
      padding: 12px 14px;
      font-weight: 700;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--blue-dark);
      flex-shrink: 0;
    }

    .chat-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--soft);
      display: grid;
      place-items: center;
      font-size: 20px;
      border: 1px solid #dbeafe;
      flex-shrink: 0;
    }

    .chat-header-right {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .chat-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .chat-title {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-title strong {
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-subtitle {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Memory buttons moved to header */
    .mem-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .mem-mini-btn {
      border: 1px solid #dbeafe;
      background: #ffffff;
      color: var(--blue-dark);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
      font-family: inherit;
      white-space: nowrap;
    }

    .mem-mini-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(30, 144, 255, 0.18);
      background: #f8fbff;
    }

    .mem-mini-btn:active {
      transform: translateY(0px) scale(0.98);
    }

    .chat-body {
      flex: 1;
      overflow: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: transparent;
    }

    .bubble {
      max-width: 80%;
      border-radius: 24px;
      padding: 12px 16px;
      line-height: 1.4;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      animation: bubbleIn .4s cubic-bezier(.25, .8, .25, 1.2);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bubble.bot {
      background: var(--soft);
      align-self: flex-start;
      color: #333;
    }

    .bubble.user {
      background: var(--blue);
      color: white;
      align-self: flex-end;
    }

    .chat-input {
      border-top: 1px solid #f0f0f0;
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      background: transparent;
      flex-shrink: 0;
    }

    .chat-input input {
      border: 1px solid #e5e7eb;
      border-radius: 999px;
      padding: 10px 14px;
      outline: none;
      transition: box-shadow .15s ease, border-color .15s ease;
      font-family: inherit;
      min-width: 0;
    }

    .chat-input input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(30, 144, 255, 0.2);
    }

    .send-btn {
      border: none;
      border-radius: 999px;
      padding: 10px 16px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s ease, background .3s ease, box-shadow .3s ease;
      font-family: inherit;
    }

    .send-btn:hover {
      transform: scale(1.05);
      background: var(--accent-dark);
      box-shadow: 0 0 12px rgba(30, 144, 255, 0.4);
    }

    .send-btn:active {
      transform: scale(0.95);
    }

    .primary {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 8px 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform .15s ease, background .3s ease, box-shadow .3s ease;
      font-family: inherit;
    }

    .primary:hover {
      background: var(--accent-dark);
      transform: scale(1.05);
      box-shadow: 0 0 12px rgba(30, 144, 255, 0.4);
    }

    .primary:active {
      transform: scale(0.95);
    }

    /* Game panel */
    .game-panel {
      width: 640px;
      height: 500px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .game-tabs {
      display: flex;
      border-bottom: 1px solid #eee;
      overflow-x: auto;
    }

    .game-tabs button {
      flex: 1;
      min-width: 80px;
      padding: 12px;
      border: none;
      background: #f9fafb;
      cursor: pointer;
      font-weight: 600;
      color: var(--muted);
      transition: background .3s ease, color .3s ease;
      position: relative;
      font-family: inherit;
    }

    .game-tabs button.active {
      background: #fff;
      color: var(--accent);
    }

    .game-tabs button.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: var(--accent);
      animation: slideIn .3s ease;
    }

    .game-tabs button:hover {
      background: var(--soft);
    }

    .game-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      position: relative;
      overflow: auto;
    }

    .game-area>* {
      animation: fadeIn .4s ease;
    }

    .panel-title {
      position: absolute;
      top: 8px;
      left: 12px;
      font-size: 14px;
      color: var(--muted);
      font-weight: 600;
    }

    canvas {
      background: #fdfdfd;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
      border: 1px solid #eee;
    }

    .control-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .pill {
      border: 1px solid #e5e7eb;
      border-radius: 999px;
      padding: 6px 15px;
      background: #fff;
      font-size: 0.9em;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    footer {
      width: 100%;
      background: var(--blue-dark);
      color: white;
      text-align: center;
      padding: 15px 0;
      font-size: 0.9em;
      margin-top: auto;
    }

    @keyframes bubbleIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes slideIn {
      from {
        width: 0;
      }

      to {
        width: 100%;
      }
    }

    @keyframes ripple {
      0% {
        box-shadow: 0 0 0 0 rgba(30, 144, 255, 0.6);
      }

      100% {
        box-shadow: 0 0 0 12px rgba(30, 144, 255, 0);
      }
    }

    .ripple {
      animation: ripple .6s ease;
    }

    @media (max-width: 900px) {

      .chat-panel,
      .game-panel {
        width: 100%;
        height: auto;
        min-height: 400px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-container">
      <div class="logo">🌟 JacobCreation</div>
      <nav>
        <a href="https://jacobcreation.github.io/">Home</a>
        <a href="https://jacobcreation.github.io/about">About</a>
        <a href="https://jacobcreation.github.io/downloads">🎮 Play Offline</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">

      <!-- Chatbox -->
      <section class="chat-panel">
        <header class="chat-header">
          <div class="chat-avatar">🤝</div>

          <div class="chat-header-right">
            <div class="chat-title-row">
              <div class="chat-title">
                <strong>Friendly Helper</strong>
                <div class="chat-subtitle">Ask anything—I'll answer kindly.</div>
              </div>

              <!-- ✅ Memory buttons moved here -->
              <div class="mem-actions">
                <button class="mem-mini-btn" type="button" id="downloadMemBtn">⬇️</button>
                <button class="mem-mini-btn" type="button" id="uploadMemBtn">⬆️</button>
                <input type="file" id="memFileInput" accept="application/json" style="display:none;">
              </div>
            </div>
          </div>
        </header>

        <div class="chat-body" id="chatBody" aria-live="polite">
          <div class="bubble bot">Hi! How can I help today?</div>
        </div>

        <form class="chat-input" id="chatForm" autocomplete="off">
          <input id="chatText" type="text" placeholder="Type your message..." />
          <button class="send-btn" type="submit">Send</button>
        </form>
      </section>

      <!-- Games -->
      <section class="game-panel">
        <div class="game-tabs">
          <button class="active" data-game="clicker">Clicker</button>
          <button data-game="memory">Memory</button>
          <button data-game="snake">Snake</button>
          <button data-game="pong">Pong</button>
          <button data-game="tetris">Tetris</button>
          <button data-game="chess">Chess</button>
        </div>

        <div class="game-area" id="gameArea">
          <div class="panel-title" id="panelTitle">Clicker</div>
          <div id="clicker" style="width:100%; height:100%; display:flex; justify-content:center; align-items:center;">
            <iframe src="https://scratch.mit.edu/projects/891171793/embed" style="width:100%; height:100%; border:none;"
              allowfullscreen></iframe>
          </div>
        </div>
      </section>

    </div>
  </main>

  <footer>
    © 2026 JacobCreation. All rights reserved.
  </footer>

  <script>
    /* Chat endpoint */
    const ENDPOINT = 'https://chatbot-ai.b4rjxr9lk.workers.dev/';

    const chatBody = document.getElementById('chatBody');
    const chatForm = document.getElementById('chatForm');
    const chatText = document.getElementById('chatText');

    const downloadMemBtn = document.getElementById("downloadMemBtn");
    const uploadMemBtn = document.getElementById("uploadMemBtn");
    const memFileInput = document.getElementById("memFileInput");

    /* Per-user Session ID */
    function getSessionId() {
      let id = localStorage.getItem("jacobcreation_session");
      if (!id) {
        id = (crypto.randomUUID)
          ? crypto.randomUUID()
          : String(Date.now()) + Math.random().toString(16).slice(2);
        localStorage.setItem("jacobcreation_session", id);
      }
      return id;
    }

    function addBubble(text, who = 'bot') {
      const div = document.createElement('div');
      div.className = `bubble ${who}`;
      div.textContent = text;
      chatBody.appendChild(div);
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    // Download memory
    downloadMemBtn.addEventListener("click", async () => {
      try {
        const res = await fetch(ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "download",
            sessionId: getSessionId()
          })
        });

        if (!res.ok) {
          let txt = await res.text();
          throw new Error("Download failed: " + res.status + " " + txt);
        }

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "memories.json";
        document.body.appendChild(a);
        a.click();
        a.remove();

        URL.revokeObjectURL(url);

        addBubble("Downloaded memories.json ✅", "bot");
      } catch (err) {
        console.error(err);
        addBubble("Download failed 😬", "bot");
      }
    });

    // Upload memory
    uploadMemBtn.addEventListener("click", () => {
      memFileInput.click();
    });

    memFileInput.addEventListener("change", async () => {
      const file = memFileInput.files[0];
      if (!file) return;

      try {
        const text = await file.text();
        const history = JSON.parse(text);

        const res = await fetch(ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "upload",
            sessionId: getSessionId(),
            history
          })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.reply || "Upload failed");

        addBubble("Memory uploaded! ✅", "bot");
      } catch (err) {
        console.error(err);
        addBubble("Upload failed 😬 Make sure it's a valid memories.json file.", "bot");
      } finally {
        memFileInput.value = "";
      }
    });

    // Chat send
    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const msg = chatText.value.trim();
      if (!msg) return;

      addBubble(msg, 'user');
      chatText.value = '';

      try {
        const res = await fetch(ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: "chat",
            message: msg,
            sessionId: getSessionId()
          })
        });

        if (!res.ok) throw new Error('Network error: ' + res.status);

        const data = await res.json();
        addBubble(data.reply || "No reply 😅", "bot");
      } catch (err) {
        addBubble('Hmm, I hit a snag. Please try again in a moment.');
        console.error(err);
      }
    });

    /* Tabs */
    const tabs = document.querySelectorAll('.game-tabs button');
    const gameArea = document.getElementById('gameArea');
    const panelTitle = document.getElementById('panelTitle');

    tabs.forEach(btn => {
      btn.addEventListener('click', () => {
        tabs.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        showGame(btn.dataset.game);
      });
    });

    function showGame(name) {
      panelTitle.textContent = name.charAt(0).toUpperCase() + name.slice(1);
      gameArea.innerHTML = `<div class="panel-title">${panelTitle.textContent}</div>`;
      if (name === 'clicker') renderClicker();
      if (name === 'memory') renderMemory();
      if (name === 'snake') renderSnake();
      if (name === 'pong') renderPong();
      if (name === 'tetris') renderTetris();
      if (name === 'chess') renderChess();
    }

    /* Clicker (Scratch embed) */
    function renderClicker() {
      const iframe = document.createElement('iframe');
      iframe.src = 'https://scratch.mit.edu/projects/891171793/embed';
      iframe.style.width = '100%';
      iframe.style.height = '100%';
      iframe.style.border = 'none';
      iframe.allowFullscreen = true;

      const wrapper = document.createElement('div');
      wrapper.style.width = '100%';
      wrapper.style.height = '100%';
      wrapper.style.display = 'flex';
      wrapper.style.justifyContent = 'center';
      wrapper.style.alignItems = 'center';

      wrapper.appendChild(iframe);
      gameArea.appendChild(wrapper);
    }

    /* Memory */
    function renderMemory() {
      const div = document.createElement('div');
      div.style.maxWidth = '480px';
      div.innerHTML = `
        <div class="control-row">
          <button class="primary" id="memReset">Shuffle</button>
          <span class="pill">Pairs: <span id="pairs">0</span>/8</span>
        </div>
        <div id="grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px; margin-top:15px"></div>`;
      gameArea.appendChild(div);

      const icons = ['🍓', '🍊', '🍋', '🍉', '🍇', '🍒', '🥝', '🥥'];
      const deck = [...icons, ...icons].sort(() => Math.random() - 0.5);
      const grid = div.querySelector('#grid');

      let first = null, lock = false, found = 0;

      deck.forEach(val => {
        const card = document.createElement('button');
        card.className = 'pill';
        card.style.height = '70px';
        card.style.fontSize = '24px';
        card.dataset.val = val;
        card.textContent = '❓';
        card.style.background = '#f0f8ff';

        card.addEventListener('click', () => {
          if (lock || card.textContent !== '❓') return;
          card.textContent = val;

          if (!first) {
            first = card;
          } else {
            lock = true;
            if (first.dataset.val === val) {
              found++;
              document.getElementById('pairs').textContent = found;
              setTimeout(() => {
                first.style.opacity = '0.6';
                card.style.opacity = '0.6';
                lock = false;
                first = null;
              }, 300);
            } else {
              setTimeout(() => {
                first.textContent = '❓';
                card.textContent = '❓';
                lock = false;
                first = null;
              }, 600);
            }
          }
        });

        grid.appendChild(card);
      });

      div.querySelector('#memReset').addEventListener('click', () => showGame('memory'));
    }

    /* Snake (Scratch embed) */
    function renderSnake() {
      const iframe = document.createElement('iframe');
      iframe.src = 'https://scratch.mit.edu/projects/1234815493/embed';
      iframe.style.width = '100%';
      iframe.style.height = '100%';
      iframe.style.border = 'none';
      iframe.allowFullscreen = true;

      const wrapper = document.createElement('div');
      wrapper.style.width = '100%';
      wrapper.style.height = '100%';
      wrapper.style.display = 'flex';
      wrapper.style.justifyContent = 'center';
      wrapper.style.alignItems = 'center';

      wrapper.appendChild(iframe);
      gameArea.appendChild(wrapper);
    }

    /* Pong */
    function renderPong() {
      const canvas = document.createElement('canvas');
      canvas.width = 480;
      canvas.height = 320;
      gameArea.appendChild(canvas);

      const ctx = canvas.getContext('2d');
      let paddle = { x: 10, y: 120, w: 10, h: 80 };
      let ball = { x: 240, y: 160, vx: 3, vy: 2, r: 6 };

      canvas.style.width = '100%';
      canvas.style.maxWidth = '480px';
      canvas.style.height = 'auto';
      canvas.style.touchAction = 'none';

      const moveHandler = e => {
        const rect = canvas.getBoundingClientRect();
        const scaleY = canvas.height / rect.height;

        let clientY;
        if (e.touches && e.touches.length > 0) {
          clientY = e.touches[0].clientY;
          e.preventDefault();
        } else {
          clientY = e.clientY;
        }

        const relativeY = (clientY - rect.top) * scaleY;
        paddle.y = Math.min(canvas.height - paddle.h, Math.max(0, relativeY - paddle.h / 2));
      };

      canvas.addEventListener('mousemove', moveHandler);
      canvas.addEventListener('touchmove', moveHandler, { passive: false });

      function loop() {
        if (!document.body.contains(canvas)) return;

        ball.x += ball.vx;
        ball.y += ball.vy;

        if (ball.y < ball.r || ball.y > canvas.height - ball.r) ball.vy *= -1;
        if (ball.x > canvas.width - ball.r) ball.vx *= -1;

        if (ball.x < paddle.x + paddle.w && ball.y > paddle.y && ball.y < paddle.y + paddle.h) {
          ball.vx = Math.abs(ball.vx) + 0.4;
          ball.vy += (Math.random() * 2 - 1);
          ball.x = paddle.x + paddle.w + ball.r;
        }

        if (ball.x < -20) {
          ball = { x: 240, y: 160, vx: 3, vy: 2, r: 6 };
        }

        draw();
        requestAnimationFrame(loop);
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#1e90ff';
        ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
        ctx.fillStyle = '#104e8b';
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();
      }

      loop();
    }

    /* Tetris (Scratch embed) */
    function renderTetris() {
      const iframe = document.createElement('iframe');
      iframe.src = 'https://scratch.mit.edu/projects/313865242/embed';
      iframe.style.width = '100%';
      iframe.style.height = '100%';
      iframe.style.border = 'none';
      iframe.allowFullscreen = true;

      const wrapper = document.createElement('div');
      wrapper.style.width = '100%';
      wrapper.style.height = '100%';
      wrapper.style.display = 'flex';
      wrapper.style.justifyContent = 'center';
      wrapper.style.alignItems = 'center';

      wrapper.appendChild(iframe);
      gameArea.appendChild(wrapper);
    }

    /* Chess placeholder */
    function renderChess() {
      const div = document.createElement("div");
      div.className = "pill";
      div.textContent = "Chess is currently disabled in this build. Tell me if you want me to re-add the full chess engine safely 😄";
      gameArea.appendChild(div);
    }
  </script>

</body>
