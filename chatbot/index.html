<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Chat with our helper and play fun minigames like Snake, Tetris, and Chess!" />

  <title>Chat + Minigames - JacobCreation</title>

  <!-- ✅ Favicon setup -->
  <link rel="icon" href="/favicon.png" type="image/png" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg1: #0b1020;
      --bg2: #0a1633;
      --card: rgba(255, 255, 255, 0.08);
      --card2: rgba(255, 255, 255, 0.12);
      --border: rgba(255, 255, 255, 0.14);
      --text: #eaf2ff;
      --muted: rgba(234, 242, 255, 0.75);
      --blue: #4ea1ff;
      --blue2: #2d6bff;
      --shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
      --shadow2: 0 10px 22px rgba(0, 0, 0, 0.28);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Poppins", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(1200px 600px at 20% 10%, rgba(78, 161, 255, 0.30), transparent 55%),
        radial-gradient(900px 600px at 90% 15%, rgba(45, 107, 255, 0.22), transparent 55%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(10px);
      background: rgba(10, 16, 32, 0.65);
      border-bottom: 1px solid rgba(255, 255, 255, 0.10);
    }

    .header-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: inherit;
      gap: 10px;
      font-weight: 800;
      letter-spacing: 0.2px;
      font-size: 1.15rem;
      white-space: nowrap;
    }

    .logo-badge {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, #1e90ff, #ff2d2d);
      box-shadow: 0 10px 24px rgba(30, 144, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.20);
      font-weight: 900;
      color: white;
    }

    .logo-text {
      font-family: "Orbitron", sans-serif;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #1e90ff, #ff2d2d);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow:
        0 0 14px rgba(30, 144, 255, 0.35),
        0 0 14px rgba(255, 45, 45, 0.25);
    }

    nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    nav a {
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
      font-size: 0.92rem;
      padding: 9px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      transition: transform 0.18s ease, background 0.18s ease, border 0.18s ease;
    }

    nav a:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.10);
      border-color: rgba(255, 255, 255, 0.22);
    }

    /* Main */
    main {
      padding: 28px 18px 60px;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      flex: 1;
      display: flex;
      justify-content: center;
    }

    .container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }

    /* Panels */
    .chat-panel,
    .game-panel {
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.05));
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: 600px;
    }

    .chat-panel {
      width: 380px;
    }

    .game-panel {
      width: 660px;
    }

    /* Chat Elements */
    .chat-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      display: flex;
      gap: 12px;
      flex-shrink: 0;
    }

    .chat-avatar {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--card2);
      display: grid;
      place-items: center;
      font-size: 22px;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .chat-header-right {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .chat-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .chat-title strong {
      font-size: 1rem;
      color: var(--text);
      display: block;
    }

    .chat-subtitle {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .mem-actions {
      display: flex;
      gap: 6px;
    }

    .mem-mini-btn {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mem-mini-btn:hover {
      background: var(--card2);
      transform: translateY(-2px);
    }

    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .bubble {
      max-width: 85%;
      border-radius: 18px;
      padding: 12px 16px;
      font-size: 0.95rem;
      line-height: 1.5;
      position: relative;
      animation: bubbleIn 0.3s ease-out;
    }

    .bubble.bot {
      align-self: flex-start;
      background: var(--card2);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .bubble.user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--blue), var(--blue2));
      color: #071122;
      font-weight: 600;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 12px rgba(45, 107, 255, 0.2);
    }

    .chat-input {
      padding: 14px;
      background: rgba(255, 255, 255, 0.02);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }

    .chat-input input {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      color: var(--text);
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .chat-input input:focus {
      border-color: var(--blue);
    }

    .btn-send {
      background: linear-gradient(135deg, var(--blue), var(--blue2));
      color: #071122;
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .btn-send:hover {
      transform: scale(1.03);
    }

    /* Game Elements */
    .game-tabs {
      display: flex;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .game-tabs button {
      flex: 1;
      min-width: 90px;
      padding: 14px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      border-bottom: 3px solid transparent;
      font-family: inherit;
    }

    .game-tabs button:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.03);
    }

    .game-tabs button.active {
      color: var(--blue);
      border-bottom-color: var(--blue);
      background: rgba(78, 161, 255, 0.05);
    }

    .game-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
    }

    .pill {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .pill:hover {
      background: var(--card2);
    }

    footer {
      border-top: 1px solid rgba(255, 255, 255, 0.10);
      background: rgba(10, 16, 32, 0.55);
      backdrop-filter: blur(10px);
      padding: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    @keyframes bubbleIn {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.95);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 1080px) {

      .chat-panel,
      .game-panel {
        width: 100%;
        height: 500px;
      }

      main {
        padding-top: 20px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-container">
      <a href="/" class="logo">
        <span class="logo-badge">J</span>
        <span class="logo-text">JacobCreation</span>
      </a>

      <nav>
        <a href="/about">About</a>
        <a href="/downloads/">🎮 Play Offline</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">

      <!-- Chatbox -->
      <section class="chat-panel">
        <header class="chat-header">
          <div class="chat-avatar">🤝</div>

          <div class="chat-header-right">
            <div class="chat-title-row">
              <div class="chat-title">
                <strong>Friendly Helper</strong>
                <div class="chat-subtitle">Ask anything—I'll answer kindly.</div>
              </div>

              <div class="mem-actions">
                <button class="mem-mini-btn" type="button" id="downloadMemBtn">⬇️</button>
                <button class="mem-mini-btn" type="button" id="uploadMemBtn">⬆️</button>
                <button class="mem-mini-btn" type="button" id="uploadImgBtn">🖼️</button>

                <input type="file" id="memFileInput" accept="application/json" style="display:none;">
                <input type="file" id="imgFileInput" accept="image/*" style="display:none;">
              </div>
            </div>

            <div class="tiny-note">
              ⚠️ I can read your image NOW 👀 but after refresh I won’t remember the image itself 🙂
            </div>
          </div>
        </header>

        <div class="chat-body" id="chatBody">
          <div class="bubble bot">Hi! How can I help today?</div>
        </div>

        <!-- THIS IS THE IMPORTANT PART -->
        <!-- NO FORM. ONLY DIV. -->
        <!-- Fixed: Changed div to form and added ID expected by JS -->
        <form class="chat-input" id="chatForm">
          <input id="chatText" type="text" placeholder="Type your message..." autocomplete="off" />
          <button class="btn-send" type="submit" id="sendBtn">Send</button>
        </form>

      </section>

      <!-- Games -->
      <section class="game-panel">
        <div class="game-tabs" id="gameTabs">
          <button class="active" data-game="clicker">Clicker</button>
          <button data-game="memory">Memory</button>
          <button data-game="snake">Snake</button>
          <button data-game="pong">Pong</button>
          <button data-game="tetris">Tetris</button>
          <button data-game="chess">Chess</button>
        </div>

        <div class="game-area" id="gameArea">
          <div id="clicker" style="width:100%; height:100%;">
            <iframe src="https://scratch.mit.edu/projects/891171793/embed" style="width:100%; height:100%; border:none;"
              allowfullscreen>
            </iframe>
          </div>
        </div>
      </section>

    </div>
  </main>

  <footer>
    © 2026 JacobCreation • Built by Jacob 💙
  </footer>

  <!-- <script> STARTS HERE -->


  <script>
    // ---------------------------------------------------------
    //  CONFIGURATION
    // ---------------------------------------------------------
    const ENDPOINT = "https://chatbot-ai.b4rjxr9lk.workers.dev/"; // Correct with subdomain
    const SITE_NAME = "jacobcreation";

    // ---------------------------------------------------------
    //  DOM ELEMENTS
    // ---------------------------------------------------------
    const chatBody = document.getElementById("chatBody");
    const chatForm = document.getElementById("chatForm"); // The form element
    const chatText = document.getElementById("chatText"); // The input
    // const sendId = document.getElementById("sendBtn");

    const dlBtn = document.getElementById("downloadMemBtn");
    const ulBtn = document.getElementById("uploadMemBtn");
    const memFile = document.getElementById("memFileInput");

    const imgBtn = document.getElementById("uploadImgBtn");
    const imgFile = document.getElementById("imgFileInput");

    let currentImage = null; // Store pending image upload

    // ---------------------------------------------------------
    //  SESSION MANAGEMENT
    // ---------------------------------------------------------
    function getSessionId() {
      let id = localStorage.getItem("jc_session");
      if (!id) {
        id = crypto.randomUUID();
        localStorage.setItem("jc_session", id);
      }
      return id;
    }

    // ---------------------------------------------------------
    //  UI HELPERS
    // ---------------------------------------------------------
    function addBubble(text, who = "bot") {
      const div = document.createElement("div");
      div.className = `bubble ${who}`;
      div.innerText = text; // Safer than textContent for basic text
      chatBody.appendChild(div);
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    // ---------------------------------------------------------
    //  CHAT LOGIC
    // ---------------------------------------------------------
    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      let msg = chatText.value.trim();
      
      if (!msg && !currentImage) return;
      if (!msg && currentImage) {
          msg = "Please analyze this image.";
      }

      // 1. Show User Message
      if (currentImage) {
        addBubble("🖼️ [Image attached]\n" + msg, "user");
      } else {
        addBubble(msg, "user");
      }
      chatText.value = "";

      // 2. Show Typing Indicator
      const typingDiv = document.createElement("div");
      typingDiv.className = "bubble bot";
      typingDiv.textContent = "Thinking... 💭";
      chatBody.appendChild(typingDiv);
      chatBody.scrollTop = chatBody.scrollHeight;

      try {
        // 3. Send to Worker
        const payload = {
            action: "chat",
            site: SITE_NAME,
            sessionId: getSessionId(),
            message: msg
        };

        if (currentImage) {
            payload.image = currentImage;
            currentImage = null; // Clear after sending
        }

        const res = await fetch(ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error("Network response was not ok");

        const data = await res.json();

        // 4. Remove Typing & Show Reply
        typingDiv.remove();
        addBubble(data.reply || "I'm not sure what to say.");

      } catch (err) {
        console.error(err);
        typingDiv.remove();
        addBubble("Error connecting to brain. 🧠�", "bot");
        addBubble("Error connecting to brain. 🧠", "bot");
      }
    });

    // ---------------------------------------------------------
    //  MEMORY MANAGEMENT (Download/Upload)
    // -----------------------------------------    // -------- Download Memory --------
    dlBtn.addEventListener("click", async () => {
      try {
        const res = await fetch(ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "download", // Matching worker
            sessionId: getSessionId()
          })
        });

        const data = await res.json();
        // Worker returns { history: [], facts: {} }
        // Create downloadable JSON file
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = `memory-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        addBubble("Memory downloaded! Keep it safe. 💾");

      } catch (err) {
        console.error(err);
        addBubble("Failed to download memory.");
      }
    });

    // UPLOAD PREPARATIONS
    ulBtn.addEventListener("click", () => {
      memFile.click(); // Trigger hidden file input
    });

    // IMAGE UPLOAD LOGIC
    imgBtn.addEventListener("click", () => {
      imgFile.click();
    });

    imgFile.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const base64String = event.target.result.split(',')[1];
        currentImage = {
          mimeType: file.type,
          data: base64String
        };
        addBubble("Image attached! Type a message to ask about it. 🖼️", "bot");
      };
      reader.readAsDataURL(file);
      imgFile.value = ""; // Reset
    });

    // UPLOAD EXECUTION
    memFile.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (event) => {
        try {
          const jsonContent = JSON.parse(event.target.result);

          addBubble("Uploading memory... 📤");

          const res = await fetch(ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              action: "upload", // Matching worker
              sessionId: getSessionId(),
              history: jsonContent.history || [] // Worker expects 'history' array
            })
          });

          if (res.ok) {
            addBubble("Memory restored successfully! 🧠✨");
          } else {
            addBubble("Server rejected the memory.");
          }

        } catch (err) {
          console.error(err);
          addBubble("Invalid memory file. Corrupt JSON?");
        }
      };

      reader.readAsText(file);
      // Reset input so you can upload same file again if needed
      memFile.value = "";
    });

    // ---------------------------------------------------------
    //  GAME TAB SWITCHING
    // ---------------------------------------------------------
    // Simple Tab Switching Logic
    const gameTabsContainer = document.getElementById("gameTabs");
    const gameArea = document.getElementById("gameArea");

    gameTabsContainer.addEventListener("click", (e) => {
      if (e.target.tagName !== "BUTTON") return;

      // 1. Update Active Tab
      const buttons = gameTabsContainer.querySelectorAll("button");
      buttons.forEach(b => b.classList.remove("active"));
      e.target.classList.add("active");

      // 2. Load Content based on Game Name
      const gameName = e.target.getAttribute("data-game");
      loadGameContent(gameName);
    });

    function loadGameContent(gameName) {
      gameArea.innerHTML = ""; // Clear current game

      switch (gameName) {
        case "clicker":
          gameArea.innerHTML = `
            <iframe src="https://scratch.mit.edu/projects/891171793/embed" 
              style="width:100%; height:100%; border:none;" allowfullscreen></iframe>`;
          break;

        case "chess":
          gameArea.innerHTML = `
            <iframe src="/chess/index.html" 
              style="width:100%; height:100%; border:none;" allowfullscreen></iframe>`;
          break;

        case "tetris":
          gameArea.innerHTML = `
            <iframe src="/Tetris/index.html" 
              style="width:100%; height:100%; border:none;" allowfullscreen></iframe>`;
          break;

        case "snake":
          // Assuming you have a snake game at /snake/index.html
          gameArea.innerHTML = `
            <iframe src="/snake/index.html" 
              style="width:100%; height:100%; border:none;" allowfullscreen></iframe>`;
          break;

        case "pong":
          initPongGame();
          break;

        case "memory":
          initMemoryGame();
          break;

        default:
          gameArea.innerHTML = "Select a game to play!";
      }
    }

    // ---------------------------------------------------------
    //  EMBEDDED PONG GAME
    // ---------------------------------------------------------
    function initPongGame() {
      gameArea.innerHTML = `
        <div style="position:relative; width:100%; height:100%; display:flex; flex-direction:column; align-items:center;">
           <div id="pongScore" style="font-size:1.5rem; font-weight:800; margin-bottom:5px; color:var(--blue);">0 : 0</div>
           <canvas id="pongCanvas" width="500" height="300" style="background:#000; border:3px solid var(--blue); max-width:100%; cursor:none;"></canvas>
           <div style="margin-top:10px; font-size:0.8rem; color:var(--muted);">Mouse/Touch to move paddle</div>
        </div>
      `;

      const canvas = document.getElementById("pongCanvas");
      const ctx = canvas.getContext("2d");
      const scoreDisplay = document.getElementById("pongScore");

      let p1Score = 0;
      let p2Score = 0;

      const ball = { x: 250, y: 150, radius: 7, dx: 4, dy: 4, speed: 4 };
      const p1 = { x: 10, y: 125, w: 10, h: 50 };
      const p2 = { x: 480, y: 125, w: 10, h: 50 };

      function resetBall() {
        ball.x = canvas.width / 2;
        ball.y = canvas.height / 2;
        ball.speed = 4;
        ball.dx = -ball.dx;
      }

      function drawRect(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(x, y, w, h);
      }

      function drawCircle(x, y, r, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2, false);
        ctx.closePath();
        ctx.fill();
      }

      canvas.addEventListener("mousemove", (e) => {
        let rect = canvas.getBoundingClientRect();
        p1.y = e.clientY - rect.top - p1.h / 2;
      });

      function update() {
        ball.x += ball.dx;
        ball.y += ball.dy;

        // Wall collision
        if (ball.y + ball.radius > canvas.height || ball.y - ball.radius < 0) {
          ball.dy = -ball.dy;
        }

        // Paddle collision
        let player = (ball.x < canvas.width / 2) ? p1 : p2;
        if (collision(ball, player)) {
          let collidePoint = ball.y - (player.y + player.h / 2);
          collidePoint = collidePoint / (player.h / 2);
          let angleRad = (Math.PI / 4) * collidePoint;
          let direction = (ball.x < canvas.width / 2) ? 1 : -1;
          ball.dx = direction * ball.speed * Math.cos(angleRad);
          ball.dy = ball.speed * Math.sin(angleRad);
          ball.speed += 0.2;
        }

        // AI Paddle
        p2.y += (ball.y - (p2.y + p2.h / 2)) * 0.1;

        // Score
        if (ball.x - ball.radius < 0) {
          p2Score++;
          resetBall();
        } else if (ball.x + ball.radius > canvas.width) {
          p1Score++;
          resetBall();
        }
        scoreDisplay.innerText = `${p1Score} : ${p2Score}`;
      }

      function collision(b, p) {
        p.top = p.y;
        p.bottom = p.y + p.h;
        p.left = p.x;
        p.right = p.x + p.w;

        b.top = b.y - b.radius;
        b.bottom = b.y + b.radius;
        b.left = b.x - b.radius;
        b.right = b.x + b.radius;

        return b.right > p.left && b.bottom > p.top && b.left < p.right && b.top < p.bottom;
      }

      function render() {
        drawRect(0, 0, canvas.width, canvas.height, "#000"); // Clear
        drawRect(p1.x, p1.y, p1.w, p1.h, "#fff");
        drawRect(p2.x, p2.y, p2.w, p2.h, "#fff");
        drawCircle(ball.x, ball.y, ball.radius, varToHex('--blue') || "#4ea1ff");
      }

      function varToHex(variable) {
        return getComputedStyle(document.documentElement).getPropertyValue(variable).trim();
      }

      function game() {
        if (!document.getElementById("pongCanvas")) return; // Stop if tab changed
        update();
        render();
        requestAnimationFrame(game);
      }
      game();
    }

    // ---------------------------------------------------------
    //  EMBEDDED MEMORY GAME
    // ---------------------------------------------------------
    function initMemoryGame() {
      gameArea.innerHTML = '';

      const grid = document.createElement('div');
      grid.id = "memBoard";
      grid.style.cssText = "display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; width:100%; max-width:400px; margin:auto;";

      const restartBtn = document.createElement('div');
      restartBtn.style.textAlign = "center";
      restartBtn.style.marginTop = "10px";
      restartBtn.innerHTML = `<button class="pill" id="restartMemBtn">Restart</button>`;

      gameArea.appendChild(grid);
      gameArea.appendChild(restartBtn);

      document.getElementById('restartMemBtn').addEventListener('click', initMemoryGame);

      const icons = ["🍎", "🍎", "🍌", "🍌", "🍇", "🍇", "🍉", "🍉", "🍒", "🍒", "🥝", "🥝", "🍍", "🍍", "🥭", "🥭"];

      // Shuffle
      for (let i = icons.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [icons[i], icons[j]] = [icons[j], icons[i]];
      }

      let flippedCards = [];
      let matchedCount = 0;

      icons.forEach((icon, idx) => {
        const card = document.createElement("div");
        card.style.cssText = `
          background: var(--card2); height: 80px; border-radius: 12px; 
          display: flex; align-items: center; justify-content: center; 
          font-size: 2rem; cursor: pointer; user-select: none; transition: transform 0.2s;
          border: 1px solid var(--border);
        `;
        card.dataset.val = icon;
        card.dataset.idx = idx;
        card.innerText = "❓"; // Face down

        card.addEventListener("click", () => {
          // Logic: Check if card is flipped or matched
          if (card.innerText !== "❓" || flippedCards.length >= 2) return;

          card.innerText = icon;
          card.style.background = "#fff";
          card.style.transform = "scale(1.05)";
          flippedCards.push(card);

          if (flippedCards.length === 2) {
            const [c1, c2] = flippedCards;
            if (c1.dataset.val === c2.dataset.val) {
              // Match
              c1.style.background = "rgba(45, 107, 255, 0.2)";
              c2.style.background = "rgba(45, 107, 255, 0.2)";
              flippedCards = []; // Reset flipped array
              matchedCount += 2;

              if (matchedCount === icons.length) {
                setTimeout(() => alert("You Won! 🎉"), 500);
              }
            } else {
              // No Match
              setTimeout(() => {
                c1.innerText = "❓"; c1.style.background = "var(--card2)"; c1.style.transform = "scale(1)";
                c2.innerText = "❓"; c2.style.background = "var(--card2)"; c2.style.transform = "scale(1)";
                flippedCards = []; // Reset flipped array
              }, 800);
            }
          }
        });

        grid.appendChild(card);
      });
    }

  </script>
