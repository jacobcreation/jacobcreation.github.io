<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Cache Busting Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Chat with JacobBot AI using multiple live AI providers." />

  <title>JacobBot AI - JacobCreation</title>

  <link rel="icon" href="https://jacobcreation.github.io/favicon.png" type="image/png" />

  <link href="https://jacobcreation.github.io/fonts/fonts.css" rel="stylesheet">
  
  <script src="https://jacobcreation.github.io/vendor/marked.min.js"></script>

  <style>
    :root {
      --bg1: #0b1020;
      --bg2: #0a1633;
      --card: rgba(255, 255, 255, 0.08);
      --card2: rgba(255, 255, 255, 0.12);
      --border: rgba(255, 255, 255, 0.14);
      --text: #eaf2ff;
      --muted: rgba(234, 242, 255, 0.75);
      --blue: #4ea1ff;
      --blue2: #2d6bff;
      --shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
      --shadow2: 0 10px 22px rgba(0, 0, 0, 0.28);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Poppins", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(1200px 600px at 20% 10%, rgba(78, 161, 255, 0.30), transparent 55%),
        radial-gradient(900px 600px at 90% 15%, rgba(45, 107, 255, 0.22), transparent 55%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      display: flex;
      flex-direction: column;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(10px);
      background: rgba(10, 16, 32, 0.65);
      border-bottom: 1px solid rgba(255, 255, 255, 0.10);
    }

    .header-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: inherit;
      gap: 10px;
      font-weight: 800;
      letter-spacing: 0.2px;
      font-size: 1.15rem;
      white-space: nowrap;
    }

    .logo-badge {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, #1e90ff, #ff2d2d);
      box-shadow: 0 10px 24px rgba(30, 144, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.20);
      font-weight: 900;
      color: white;
    }

    .logo-text {
      font-family: "Orbitron", sans-serif;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #1e90ff, #ff2d2d);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow:
        0 0 14px rgba(30, 144, 255, 0.35),
        0 0 14px rgba(255, 45, 45, 0.25);
    }

    nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    nav a {
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
      font-size: 0.92rem;
      padding: 9px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      transition: transform 0.18s ease, background 0.18s ease, border 0.18s ease;
    }

    nav a:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.10);
      border-color: rgba(255, 255, 255, 0.22);
    }

    main {
      padding: 28px 18px 60px;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      flex: 1;
      display: flex;
      justify-content: center;
    }

    .container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }

    .chat-panel {
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.05));
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: 700px;
      width: min(100%, 820px);
    }

    /* ─── Chat Header ─── */
    .chat-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      display: flex;
      gap: 10px;
      flex-shrink: 0;
      align-items: flex-start;
    }

    .chat-avatar {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--card2);
      display: grid;
      place-items: center;
      font-size: 20px;
      border: 1px solid var(--border);
      flex-shrink: 0;
      margin-top: 2px;
    }

    .chat-header-right {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    /* Top row: name + action buttons side by side */
    .chat-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .chat-title strong {
      font-size: 0.95rem;
      color: var(--text);
      display: block;
      white-space: nowrap;
    }

    .mem-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .mem-mini-btn {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 7px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mem-mini-btn:hover {
      background: var(--card2);
      transform: translateY(-1px);
    }

    /* Model select row sits below title row */
    .model-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .model-select {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 0.7rem;
      outline: none;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
      max-width: 100%;
    }

    .model-search {
      flex: 1 1 220px;
      min-width: 180px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.76rem;
      outline: none;
      font-family: inherit;
    }

    .model-select:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--blue);
      color: var(--text);
    }

    .control-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 4px;
    }

    .control-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .control-field label {
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(234, 242, 255, 0.7);
    }

    .control-field select,
    .control-field input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 0.78rem;
      font-family: inherit;
      outline: none;
    }

    .quick-prompts {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .prompt-chip {
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease;
    }

    .prompt-chip:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.11);
    }

    .tiny-note {
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.4;
    }

    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .bubble {
      max-width: 85%;
      border-radius: 18px;
      padding: 12px 16px;
      font-size: 0.95rem;
      line-height: 1.5;
      position: relative;
      animation: bubbleIn 0.3s ease-out;
    }

    .bubble.bot {
      align-self: flex-start;
      background: var(--card2);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .bubble.user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--blue), var(--blue2));
      color: #071122;
      font-weight: 600;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 12px rgba(45, 107, 255, 0.2);
    }

    .bubble-attachment {
      display: block;
      width: min(100%, 260px);
      max-height: 240px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 10px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      background: rgba(255, 255, 255, 0.16);
    }

    .bubble.user .bubble-attachment {
      border-color: rgba(7, 17, 34, 0.18);
      background: rgba(7, 17, 34, 0.08);
    }

    .bubble-text:empty {
      display: none;
    }

    /* ─── FIXED Chat Input ─── */
    .chat-input {
      padding: 14px;
      background: rgba(255, 255, 255, 0.02);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: stretch;
    }

    .composer-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .chat-input input {
      flex: 1;
      min-width: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      color: var(--text);
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .chat-input input:focus {
      border-color: var(--blue);
    }

    .composer-attachment {
      display: none;
      align-items: center;
      gap: 10px;
      width: fit-content;
      max-width: 100%;
      padding: 7px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.08);
    }

    .composer-attachment.active {
      display: flex;
    }

    .composer-attachment img {
      width: 74px;
      height: 74px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      flex-shrink: 0;
    }

    .attachment-meta {
      min-width: 0;
      max-width: 220px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      color: var(--text);
      font-size: 0.82rem;
      line-height: 1.25;
    }

    .attachment-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 700;
    }

    .composer-attachment.file-mode img {
      display: none;
    }

    .attachment-note {
      color: var(--muted);
      font-size: 0.72rem;
    }

    .remove-attachment {
      width: 30px;
      height: 30px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.10);
      color: var(--text);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      flex-shrink: 0;
    }

    .btn-send {
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--blue), var(--blue2));
      color: #071122;
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      height: 42px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.2s;
    }

    .btn-send:hover {
      transform: scale(1.03);
    }


    .pill {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .pill:hover {
      background: var(--card2);
    }

    footer {
      border-top: 1px solid rgba(255, 255, 255, 0.10);
      background: rgba(10, 16, 32, 0.55);
      backdrop-filter: blur(10px);
      padding: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(10px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 1080px) {
      .chat-panel {
        width: 100%;
        height: 600px;
      }

      main {
        padding-top: 20px;
      }
    }

    @media (max-width: 720px) {
      .control-grid {
        grid-template-columns: 1fr;
      }

      .composer-row {
        flex-wrap: wrap;
      }

      .btn-send,
      .chat-input input {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main>
    <div class="container">

      <!-- Chatbox -->
      <section class="chat-panel">
        <header class="chat-header">
          <div class="chat-avatar">🤝</div>

          <div class="chat-header-right">
            <!-- Row 1: Name + action buttons -->
            <div class="chat-title-row">
              <div class="chat-title">
                <strong>JacobBot AI</strong>
              </div>
              <div class="mem-actions">
                <button class="mem-mini-btn" type="button" id="clearChatBtn" title="Clear Chat">🗑️</button>
                <button class="mem-mini-btn" type="button" id="downloadMemBtn" title="Download Memory">⬇️</button>
                <button class="mem-mini-btn" type="button" id="uploadMemBtn" title="Upload Memory">⬆️</button>
                <button class="mem-mini-btn" type="button" id="uploadImgBtn" title="Attach Image">🖼️</button>
                <button class="mem-mini-btn" type="button" id="uploadFileBtn" title="Attach File">📎</button>
                <input type="file" id="memFileInput" accept="application/json" style="display:none;">
                <input type="file" id="imgFileInput" accept="image/*" style="display:none;">
                <input type="file" id="docFileInput" accept=".txt,.md,.json,.csv,.js,.ts,.html,.css,.xml,.yml,.yaml,.log,text/plain,text/markdown,application/json,text/csv" style="display:none;">
              </div>
            </div>

            <!-- Row 2: Model selector -->
            <div class="model-row">
              <input id="modelSearch" class="model-search" type="text" placeholder="Search models..." autocomplete="off" />
              <select id="modelSelect" class="model-select">
                <optgroup label="Llama Series (Meta)">
                  <option value="@cf/meta/llama-3.2-3b-instruct" selected>Llama 3.2 3B (Default)</option>
                  <option value="@cf/meta/llama-3.2-1b-instruct">Llama 3.2 1B (Tiny)</option>
                  <option value="@cf/meta/llama-3.3-70b-instruct-fp8-fast">Llama 3.3 70B (Smart)</option>
                  <option value="@cf/meta/llama-4-scout-17b-16e-instruct">Llama 4 Scout 17B</option>
                </optgroup>
                <optgroup label="Groq (Ultra-Fast)">
                  <option value="groq/llama-3.3-70b-versatile">Llama 3.3 70B (Groq)</option>
                  <option value="groq/llama-3.1-8b-instant">Llama 3.1 8B (Groq)</option>
                  <option value="groq/openai/gpt-oss-120b">GPT OSS 120B (Groq)</option>
                  <option value="groq/openai/gpt-oss-20b">GPT OSS 20B (Groq)</option>
                  <option value="groq/deepseek-r1-distill-llama-70b">DeepSeek R1 Distill 70B (Groq)</option>
                </optgroup>
                <optgroup label="Cerebras (Inference Speed King)">
                  <option value="cerebras/gpt-oss-120b">GPT OSS 120B (Cerebras)</option>
                  <option value="cerebras/zai-glm-4.7">GLM 4.7 Preview (Cerebras)</option>
                </optgroup>
                <optgroup label="NVIDIA NIM">
                  <option value="nvidia/nvidia/llama-3.1-nemotron-nano-8b-v1">Nemotron Nano 8B (NVIDIA)</option>
                  <option value="nvidia/nvidia/llama-3.3-nemotron-super-49b-v1.5">Nemotron Super 49B (NVIDIA)</option>
                  <option value="nvidia/nvidia/nemotron-3-super-120b-a12b">Nemotron 3 Super 120B (NVIDIA)</option>
                  <option value="nvidia/openai/gpt-oss-120b">GPT OSS 120B (NVIDIA)</option>
                  <option value="nvidia/openai/gpt-oss-20b">GPT OSS 20B (NVIDIA)</option>
                  <option value="nvidia/qwen/qwen3-coder-480b-a35b-instruct">Qwen3 Coder 480B (NVIDIA)</option>
                </optgroup>
                <optgroup label="Google Gemini / Gemma">
                  <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                  <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash-Lite</option>
                  <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
                  <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
                  <option value="@cf/google/gemma-4-26b-a4b-it">Gemma 4 26B</option>
                </optgroup>
                <optgroup label="Mistral / Mixtral">
                  <option value="@cf/mistralai/mistral-small-3.1-24b-instruct">Mistral Small 3.1 24B</option>
                  <option value="@cf/mistral/mistral-7b-instruct-v0.2-lora">Mistral 7B Instruct</option>
                </optgroup>
                <optgroup label="Specialized">
                  <option value="@cf/openai/gpt-oss-20b">GPT OSS 20B (Reasoning)</option>
                  <option value="@cf/openai/gpt-oss-120b">GPT OSS 120B (Reasoning)</option>
                  <option value="@cf/qwen/qwen3-30b-a3b-fp8">Qwen3 30B A3B</option>
                  <option value="@cf/qwen/qwen2.5-coder-32b-instruct">Qwen2.5 Coder 32B</option>
                  <option value="@cf/deepseek-ai/deepseek-r1-distill-qwen-32b">DeepSeek R1 Distill Qwen 32B</option>
                </optgroup>
              </select>
            </div>

            <div class="control-grid">
              <div class="control-field">
                <label for="presetSelect">Preset</label>
                <select id="presetSelect">
                  <option value="default">Balanced Assistant</option>
                  <option value="coder">Code Helper</option>
                  <option value="teacher">Explainer</option>
                  <option value="brainstorm">Brainstormer</option>
                  <option value="concise">Concise Mode</option>
                </select>
              </div>
              <div class="control-field">
                <label for="replyLengthSelect">Reply Length</label>
                <select id="replyLengthSelect">
                  <option value="medium">Medium</option>
                  <option value="short">Short</option>
                  <option value="long">Long</option>
                </select>
              </div>
              <div class="control-field">
                <label for="memoryNoteInput">Remember</label>
                <input id="memoryNoteInput" type="text" placeholder="Call me Jacob, I use JS..." />
              </div>
            </div>

            <div class="quick-prompts" id="quickPrompts">
              <button class="prompt-chip" type="button" data-prompt="Summarize the last part of our chat and give me the next best action.">Next Step</button>
              <button class="prompt-chip" type="button" data-prompt="Review my idea, point out risks, then improve it.">Critique It</button>
              <button class="prompt-chip" type="button" data-prompt="Explain this simply, then give one practical example.">Explain Simply</button>
              <button class="prompt-chip" type="button" data-prompt="Turn this into a clean checklist I can follow.">Make Checklist</button>
            </div>

            <!-- Row 3: Note -->
            <div class="tiny-note">
              Images, text files, saved memory notes, and provider/model choices now stick with the conversation better.
            </div>
          </div>
        </header>

        <div class="chat-body" id="chatBody">
          <div class="bubble bot">Hi! How can I help today?</div>
        </div>

        <form class="chat-input" id="chatForm">
          <div class="composer-attachment" id="composerAttachment" aria-live="polite">
            <img id="composerAttachmentImg" alt="Attached image preview" />
            <div class="attachment-meta">
              <span class="attachment-name" id="composerAttachmentName"></span>
              <span class="attachment-note">Ready to send with your message</span>
            </div>
            <button class="remove-attachment" type="button" id="removeAttachmentBtn" title="Remove image">×</button>
          </div>
          <div class="composer-row">
            <input id="chatText" type="text" placeholder="Type your message..." autocomplete="off" />
            <button class="btn-send" type="submit" id="sendBtn">Send</button>
          </div>
        </form>

      </section>

    </div>
  </main>

  <footer>
    © 2026 JacobCreation • Built by Jacob 💙
  </footer>

  <script>
    const ENDPOINT = "https://chatbot-ai.b4rjxr9lk.workers.dev/";
    const SITE_NAME = "jacobcreation";

    const chatBody = document.getElementById("chatBody");
    const chatForm = document.getElementById("chatForm");
    const chatText = document.getElementById("chatText");

    const dlBtn = document.getElementById("downloadMemBtn");
    const ulBtn = document.getElementById("uploadMemBtn");
    const memFile = document.getElementById("memFileInput");

    const imgBtn = document.getElementById("uploadImgBtn");
    const imgFile = document.getElementById("imgFileInput");
    const fileBtn = document.getElementById("uploadFileBtn");
    const docFile = document.getElementById("docFileInput");
    const clearBtn = document.getElementById("clearChatBtn");
    const composerAttachment = document.getElementById("composerAttachment");
    const composerAttachmentImg = document.getElementById("composerAttachmentImg");
    const composerAttachmentName = document.getElementById("composerAttachmentName");
    const removeAttachmentBtn = document.getElementById("removeAttachmentBtn");
    const modelSelect = document.getElementById("modelSelect");
    const modelSearch = document.getElementById("modelSearch");
    const presetSelect = document.getElementById("presetSelect");
    const replyLengthSelect = document.getElementById("replyLengthSelect");
    const memoryNoteInput = document.getElementById("memoryNoteInput");
    const quickPrompts = document.getElementById("quickPrompts");

    const SETTINGS_KEY = "jc_chatbot_settings_v2";
    const LEGACY_MODEL_REDIRECTS = {
      "cerebras/qwen-3-235b-a22b-instruct-2507": "cerebras/gpt-oss-120b",
      "@cf/mistral/mistral-small-3.1-24b-instruct": "@cf/mistralai/mistral-small-3.1-24b-instruct",
      "@cf/mistralai/mistral-7b-instruct-v0.2-lora": "@cf/mistral/mistral-7b-instruct-v0.2-lora",
      "@cf/qwen/qwen2.5-72b-instruct": "@cf/qwen/qwen3-30b-a3b-fp8",
      "@cf/deepseek-ai/deepseek-r1-distill-llama-70b": "@cf/deepseek-ai/deepseek-r1-distill-qwen-32b"
    };
    let currentAttachment = null;
    const allModelOptions = Array.from(modelSelect.querySelectorAll("option")).map((option) => ({
      value: option.value,
      label: option.textContent,
      group: option.parentElement?.label || "Models"
    }));

    function normalizeModelSelection(value) {
      return LEGACY_MODEL_REDIRECTS[value] || value;
    }

    restoreSettings();
    loadHistory();

    function restoreSettings() {
      try {
        const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
        if (saved.model) modelSelect.value = normalizeModelSelection(saved.model);
        if (saved.preset) presetSelect.value = saved.preset;
        if (saved.replyLength) replyLengthSelect.value = saved.replyLength;
        saveSettings();
      } catch (error) {
        console.warn("Failed to restore chatbot settings", error);
      }
    }

    function saveSettings() {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify({
        model: normalizeModelSelection(modelSelect.value),
        preset: presetSelect.value,
        replyLength: replyLengthSelect.value
      }));
    }

    function getSessionId() {
      let id = localStorage.getItem("jc_session");
      if (!id) {
        id = crypto.randomUUID();
        localStorage.setItem("jc_session", id);
      }
      return id;
    }

    function renderMarkdown(text) {
      if (window.marked && typeof window.marked.parse === "function") {
        return window.marked.parse(text);
      }
      const escaped = String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
      return escaped.replace(/\n/g, "<br>");
    }

    function addBubble(text, who = "bot", typing = false, attachment = null) {
      const div = document.createElement("div");
      div.className = `bubble ${who}`;
      
      if (who === "bot") {
          if (typing) {
              div.innerHTML = "";
              chatBody.appendChild(div);
              let i = 0;
              const words = text.split(" ");
              const interval = setInterval(() => {
                  if (i < words.length) {
                      div.innerHTML = renderMarkdown(words.slice(0, i + 1).join(" "));
                      div.querySelectorAll("p").forEach(p => p.style.margin = "0 0 10px 0");
                      chatBody.scrollTop = chatBody.scrollHeight;
                      i++;
                  } else {
                      clearInterval(interval);
                  }
              }, 40);
          } else {
              div.innerHTML = renderMarkdown(text);
              div.querySelectorAll("p").forEach(p => p.style.margin = "0 0 10px 0");
              chatBody.appendChild(div);
          }
      } else {
          if (attachment && attachment.dataUrl) {
            const img = document.createElement("img");
            img.className = "bubble-attachment";
            img.src = attachment.dataUrl;
            img.alt = attachment.name ? `Attached image: ${attachment.name}` : "Attached image";
            div.appendChild(img);
          }

          const textNode = document.createElement("div");
          textNode.className = "bubble-text";
          textNode.innerText = text;
          div.appendChild(textNode);
          chatBody.appendChild(div);
      }
      
      chatBody.scrollTop = chatBody.scrollHeight;
      return div;
    }

    function updateComposerAttachment() {
      if (!currentAttachment) {
        composerAttachment.classList.remove("active");
        composerAttachment.classList.remove("file-mode");
        composerAttachmentImg.removeAttribute("src");
        composerAttachmentName.textContent = "";
        return;
      }

      if (currentAttachment.kind === "image" && currentAttachment.dataUrl) {
        composerAttachmentImg.src = currentAttachment.dataUrl;
        composerAttachment.classList.remove("file-mode");
      } else {
        composerAttachmentImg.removeAttribute("src");
        composerAttachment.classList.add("file-mode");
      }

      composerAttachmentName.textContent = currentAttachment.name || (currentAttachment.kind === "file" ? "File" : "Image");
      composerAttachment.classList.add("active");
    }

    function clearComposerAttachment() {
      currentAttachment = null;
      updateComposerAttachment();
      imgFile.value = "";
      docFile.value = "";
    }

    function updateModelFilter() {
      const query = modelSearch.value.trim().toLowerCase();
      const currentValue = modelSelect.value;
      if (!query) {
        Array.from(modelSelect.querySelectorAll("optgroup")).forEach((group) => {
          group.hidden = false;
          Array.from(group.children).forEach((option) => {
            option.hidden = false;
          });
        });
        modelSelect.value = currentValue;
        return;
      }

      Array.from(modelSelect.querySelectorAll("optgroup")).forEach((group) => {
        let anyVisible = false;
        Array.from(group.children).forEach((option) => {
          const matches = `${option.textContent} ${option.value}`.toLowerCase().includes(query);
          option.hidden = !matches;
          if (matches) anyVisible = true;
        });
        group.hidden = !anyVisible;
      });

      const visibleOption = Array.from(modelSelect.querySelectorAll("option")).find((option) => !option.hidden);
      if (visibleOption && modelSelect.selectedOptions[0]?.hidden) {
        modelSelect.value = visibleOption.value;
      }
    }

    async function loadHistory() {
        try {
            const res = await fetch(ENDPOINT, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "download", sessionId: getSessionId() })
            });
            const data = await res.json();
            if (data.history && data.history.length > 0) {
                chatBody.innerHTML = "";
                data.history.forEach(m => {
                    addBubble(m.content, m.role === "assistant" ? "bot" : "user", false);
                });
            }
        } catch (e) {
            console.error("Failed to load history:", e);
        }
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      let msg = chatText.value.trim();

      if (!msg && !currentAttachment) return;
      if (!msg && currentAttachment?.kind === "image") msg = "Please analyze this image.";
      if (!msg && currentAttachment?.kind === "file") msg = `Please analyze this file: ${currentAttachment.name}`;

      const attachedItem = currentAttachment;
      addBubble(msg, "user", false, attachedItem?.kind === "image" ? attachedItem : null);
      chatText.value = "";
      clearComposerAttachment();

      const typingDiv = document.createElement("div");
      typingDiv.className = "bubble bot";
      typingDiv.textContent = "Thinking... 💭";
      chatBody.appendChild(typingDiv);
      chatBody.scrollTop = chatBody.scrollHeight;

      try {
        const payload = {
            action: "chat",
            site: SITE_NAME,
            sessionId: getSessionId(),
            message: msg,
            model: modelSelect ? modelSelect.value : "@cf/meta/llama-3.2-3b-instruct",
            preset: presetSelect.value,
            replyLength: replyLengthSelect.value,
            memoryNote: memoryNoteInput.value.trim()
        };

        if (attachedItem?.kind === "image") {
          payload.image = {
            mimeType: attachedItem.mimeType,
            data: attachedItem.data
          };
        }

        if (attachedItem?.kind === "file") {
          payload.file = {
            mimeType: attachedItem.mimeType,
            data: attachedItem.data,
            name: attachedItem.name,
            text: attachedItem.text
          };
        }

        const res = await fetch(ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!res.ok) throw new Error(data.error || "Network response was not ok");

        typingDiv.remove();
        if (data.reply) {
            addBubble(data.reply, "bot", true);
        } else {
            addBubble("I'm not sure what to say.");
        }
        if (data.memorySaved) {
          addBubble(`Saved to memory: ${data.memorySaved}`, "bot");
        }
        memoryNoteInput.value = "";
        saveSettings();

      } catch (err) {
        typingDiv.remove();
        // console.error(err);  // Removed for production
        addBubble("Error: " + err.message + " 🧠", "bot");
      }
    });

    clearBtn.addEventListener("click", async () => {
        if (!confirm("Clear chat history?")) return;
        try {
            await fetch(ENDPOINT, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "clear", sessionId: getSessionId() })
            });
            chatBody.innerHTML = "";
            addBubble("Memory cleared! Starting fresh. ✨");
        } catch (e) {
            console.error(e);
            addBubble("Failed to clear chat history from server.");
        }
    });

    dlBtn.addEventListener("click", async () => {
      try {
        const res = await fetch(ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "download", sessionId: getSessionId() })
        });

        const data = await res.json();
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = `memory-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        addBubble("Memory downloaded! Keep it safe. 💾");

      } catch (err) {
        console.error(err);
        addBubble("Failed to download memory.");
      }
    });

    ulBtn.addEventListener("click", () => { memFile.click(); });
    imgBtn.addEventListener("click", () => { imgFile.click(); });
    fileBtn.addEventListener("click", () => { docFile.click(); });
    removeAttachmentBtn.addEventListener("click", clearComposerAttachment);
    modelSearch.addEventListener("input", updateModelFilter);
    modelSelect.addEventListener("change", saveSettings);
    presetSelect.addEventListener("change", saveSettings);
    replyLengthSelect.addEventListener("change", saveSettings);

    quickPrompts.addEventListener("click", (event) => {
      const chip = event.target.closest(".prompt-chip");
      if (!chip) return;
      chatText.value = chip.dataset.prompt || "";
      chatText.focus();
    });

    imgFile.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const dataUrl = event.target.result;
        const base64String = dataUrl.split(',')[1];
        currentAttachment = {
          kind: "image",
          mimeType: file.type,
          data: base64String,
          dataUrl,
          name: file.name
        };
        updateComposerAttachment();
        chatText.focus();
      };
      reader.readAsDataURL(file);
    });

    docFile.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const text = typeof event.target.result === "string" ? event.target.result : "";
        currentAttachment = {
          kind: "file",
          mimeType: file.type || "text/plain",
          data: btoa(unescape(encodeURIComponent(text))).slice(0, 350000),
          text: text.slice(0, 12000),
          name: file.name
        };
        updateComposerAttachment();
        chatText.focus();
      };
      reader.readAsText(file);
    });

    memFile.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (event) => {
        try {
          const jsonContent = JSON.parse(event.target.result);
          addBubble("Uploading memory... 📤");

          const res = await fetch(ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              action: "upload",
              sessionId: getSessionId(),
              history: jsonContent.history || [],
              facts: jsonContent.facts || {}
            })
          });

          if (res.ok) {
            addBubble("Memory restored successfully! 🧠✨");
          } else {
            addBubble("Server rejected the memory.");
          }

        } catch (err) {
          console.error(err);
          addBubble("Invalid memory file. Corrupt JSON?");
        }
      };

      reader.readAsText(file);
      memFile.value = "";
    });

    updateModelFilter();


  </script>

    })();
  </script>
