<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Chat with our helper and play fun minigames like Snake, Tetris, and Chess!" />

  <title>Chat + Minigames - JacobCreation</title>

  <!-- ✅ Favicon setup (from index.html) -->
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="icon" href="/favicon.png" type="image/png" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    /* ✅ JacobCreation Theme Variables */
    :root {
      --blue: #1e90ff;
      --blue-dark: #104e8b;
      --bg-gradient: linear-gradient(135deg, #f0f8ff, #e6f2ff);
      /* From index.html */
      --text: #333;
      --muted: #6b7280;
      --card-bg: #ffffff;
      --accent: #1e90ff;
      /* Replaces Pink */
      --accent-dark: #104e8b;
      /* Replaces Dark Pink */
      --soft: #eaf6ff;
      /* Replaces Light Orange with Light Blue */
      --radius: 20px;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
    }

    body {
      font-family: "Poppins", Arial, sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* Center content like index.html */
    }

    /* Header Styles (from index.html) */
    header {
      width: 100%;
      background: linear-gradient(90deg, var(--blue), var(--blue-dark));
      color: white;
      padding: 15px 0;
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 1000;
      /* Ensure header items align properly */
      display: block;
    }

    .header-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-size: 2em;
      font-weight: 700;
    }

    header nav a {
      background: var(--blue);
      color: white;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.9em;
      font-weight: 600;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    header nav a:hover {
      background: var(--blue-dark);
      transform: translateY(-2px);
    }

    /* Main Layout */
    main {
      padding: 40px 20px;
      width: 100%;
      max-width: 1100px;
      /* Slightly wider for the two panels */
      flex: 1;
      display: flex;
      justify-content: center;
      /* Center the container */
      box-sizing: border-box;
    }

    .container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }

    /* Chat panel */
    .chat-panel {
      width: 340px;
      height: 500px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .chat-header {
      background: linear-gradient(135deg, #fff, var(--soft));
      padding: 12px 14px;
      font-weight: 700;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--blue-dark);
      flex-shrink: 0;
    }

    .chat-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--soft);
      display: grid;
      place-items: center;
      font-size: 20px;
      border: 1px solid #dbeafe;
    }

    .chat-body {
      flex: 1;
      overflow: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: transparent;
    }

    .bubble {
      max-width: 80%;
      border-radius: 24px;
      padding: 12px 16px;
      line-height: 1.4;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      animation: bubbleIn .4s cubic-bezier(.25, .8, .25, 1.2);
    }

    .bubble.bot {
      background: var(--soft);
      align-self: flex-start;
      color: #333;
    }

    .bubble.user {
      background: var(--blue);
      color: white;
      align-self: flex-end;
    }

    .chat-input {
      border-top: 1px solid #f0f0f0;
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      background: transparent;
      flex-shrink: 0;
    }

    .chat-input input {
      border: 1px solid #e5e7eb;
      border-radius: 999px;
      padding: 10px 14px;
      outline: none;
      transition: box-shadow .15s ease, border-color .15s ease;
      font-family: inherit;
      min-width: 0;
    }

    .chat-input input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(30, 144, 255, 0.2);
    }

    .send-btn {
      border: none;
      border-radius: 999px;
      padding: 10px 16px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s ease, background .3s ease, box-shadow .3s ease;
      font-family: inherit;
    }

    .send-btn:hover {
      transform: scale(1.05);
      background: var(--accent-dark);
      box-shadow: 0 0 12px rgba(30, 144, 255, 0.4);
    }

    .send-btn:active {
      transform: scale(0.95);
    }

    /* Game panel */
    .game-panel {
      width: 640px;
      height: 500px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .game-tabs {
      display: flex;
      border-bottom: 1px solid #eee;
      overflow-x: auto;
    }

    .game-tabs button {
      flex: 1;
      min-width: 80px;
      padding: 12px;
      border: none;
      background: #f9fafb;
      cursor: pointer;
      font-weight: 600;
      color: var(--muted);
      transition: background .3s ease, color .3s ease;
      position: relative;
      font-family: inherit;
    }

    .game-tabs button.active {
      background: #fff;
      color: var(--accent);
    }

    .game-tabs button.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: var(--accent);
      animation: slideIn .3s ease;
    }

    .game-tabs button:hover {
      background: var(--soft);
    }

    .game-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      position: relative;
      overflow: auto;
    }

    .game-area>* {
      animation: fadeIn .4s ease;
    }

    .panel-title {
      position: absolute;
      top: 8px;
      left: 12px;
      font-size: 14px;
      color: var(--muted);
      font-weight: 600;
    }

    canvas {
      background: #fdfdfd;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
      border: 1px solid #eee;
    }

    .control-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
    }

    .pill {
      border: 1px solid #e5e7eb;
      border-radius: 999px;
      padding: 6px 15px;
      background: #fff;
      font-size: 0.9em;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .primary {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 8px 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform .15s ease, background .3s ease, box-shadow .3s ease;
      font-family: inherit;
    }

    .primary:hover {
      background: var(--accent-dark);
      transform: scale(1.05);
      box-shadow: 0 0 12px rgba(30, 144, 255, 0.4);
    }

    .primary:active {
      transform: scale(0.95);
    }

    /* Footer Styles (from index.html) */
    footer {
      width: 100%;
      background: var(--blue-dark);
      color: white;
      text-align: center;
      padding: 15px 0;
      font-size: 0.9em;
      margin-top: auto;
    }

    /* Animations */
    @keyframes bubbleIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes slideIn {
      from {
        width: 0;
      }

      to {
        width: 100%;
      }
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.2);
        color: var(--accent);
      }

      100% {
        transform: scale(1);
      }
    }

    .pulse {
      animation: pulse .4s ease;
    }

    @keyframes ripple {
      0% {
        box-shadow: 0 0 0 0 rgba(30, 144, 255, 0.6);
      }

      100% {
        box-shadow: 0 0 0 12px rgba(30, 144, 255, 0);
      }
    }

    .ripple {
      animation: ripple .6s ease;
    }

    @media (max-width: 900px) {

      .chat-panel,
      .game-panel {
        width: 100%;
        height: auto;
        min-height: 400px;
      }
    }
  </style>
</head>

<body>

  <!-- ✅ JacobCreation Header -->
  <header>
    <div class="header-container">
      <div class="logo">🌟 JacobCreation</div>
      <nav>
        <a href="https://jacobcreation.github.io/">Home</a>
        <a href="https://jacobcreation.github.io/about">About</a>
        <a href="https://jacobcreation.github.io/downloads">🎮 Play Offline</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <!-- Chatbox -->
      <section class="chat-panel">
        <header class="chat-header">
          <div class="chat-avatar">🤝</div>
          <div>
            <div>Friendly Helper</div>
            <div style="font-size:12px;color:var(--muted)">Ask anything—I'll answer kindly.</div>
          </div>
        </header>
        <div class="chat-body" id="chatBody" aria-live="polite">
          <div class="bubble bot">Hi! How can I help today?</div>
        </div>
        <form class="chat-input" id="chatForm" autocomplete="off">
          <input id="chatText" type="text" placeholder="Type your message..." />
          <button class="send-btn" type="submit">Send</button>
        </form>
      </section>

      <!-- Games -->
      <section class="game-panel">
        <div class="game-tabs">
          <button class="active" data-game="clicker">Clicker</button>
          <button data-game="memory">Memory</button>
          <button data-game="snake">Snake</button>
          <button data-game="pong">Pong</button>
          <button data-game="tetris">Tetris</button>
          <button data-game="chess">Chess</button>
        </div>
        <div class="game-area" id="gameArea">
          <div class="panel-title" id="panelTitle">Clicker</div>
          <div id="clicker" style="text-align:center">
            <h3 style="margin:6px 0; color: var(--blue-dark);">Clicker Game</h3>
            <p>Score: <span id="clickScore" style="font-weight:bold; font-size:1.2em;">0</span></p>
            <button class="primary" onclick="incrementClicker()">Click me!</button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- ✅ JacobCreation Footer -->
  <footer>
    © 2026 JacobCreation. All rights reserved.
  </footer>

  <script>
    /* Chat endpoint */
    const ENDPOINT = 'https://chatbot-ai.b4rjxr9lk.workers.dev/';
    const chatBody = document.getElementById('chatBody');
    const chatForm = document.getElementById('chatForm');
    const chatText = document.getElementById('chatText');

    /* Mobile Detection */
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    if (isMobile) {
      console.log("Mobile device detected");
      document.body.classList.add('mobile-detected');
      // Optional: Could show a message or adjust UI further
    }

    function addBubble(text, who = 'bot') {
      const div = document.createElement('div');
      div.className = `bubble ${who}`;
      div.textContent = text;
      chatBody.appendChild(div);
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = chatText.value.trim();
      if (!msg) return;
      addBubble(msg, 'user'); chatText.value = '';
      try {
        const res = await fetch(ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg })
        });
        if (!res.ok) throw new Error('Network error: ' + res.status);
        const data = await res.json();
        console.log('Worker response:', data);
        addBubble(data.reply || data.text || (typeof data === 'string' ? data : JSON.stringify(data)));
      } catch (err) {
        addBubble('Hmm, I hit a snag. Please try again in a moment.');
        console.error(err);
      }
    });

    /* Tabs */
    const tabs = document.querySelectorAll('.game-tabs button');
    const gameArea = document.getElementById('gameArea');
    const panelTitle = document.getElementById('panelTitle');
    tabs.forEach(btn => {
      btn.addEventListener('click', () => {
        tabs.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        showGame(btn.dataset.game);
      });
    });
    function showGame(name) {
      panelTitle.textContent = name.charAt(0).toUpperCase() + name.slice(1);
      gameArea.innerHTML = `<div class="panel-title">${panelTitle.textContent}</div>`;
      if (name === 'clicker') renderClicker();
      if (name === 'memory') renderMemory();
      if (name === 'snake') renderSnake();
      if (name === 'pong') renderPong();
      if (name === 'tetris') renderTetris();
      if (name === 'chess') renderChess();
    }

    /* Clicker */
    let clickScore = 0;
    function renderClicker() {
      const div = document.createElement('div');
      div.style.textAlign = 'center';
      div.innerHTML = `
    <h3 style="margin:6px 0; color: var(--blue-dark);">Clicker Game</h3>
    <p>Score: <span id="clickScore" style="font-weight:bold; font-size:1.2em;">0</span></p>
    <button class="primary" onclick="incrementClicker()">Click me!</button>`;
      gameArea.appendChild(div); clickScore = 0;
    }
    function incrementClicker() {
      clickScore++;
      const scoreEl = document.getElementById('clickScore');
      scoreEl.textContent = clickScore;
      scoreEl.classList.add('pulse');
      setTimeout(() => scoreEl.classList.remove('pulse'), 400);
    }

    /* Memory */
    function renderMemory() {
      const div = document.createElement('div');
      div.style.maxWidth = '480px';
      div.innerHTML = `
    <div class="control-row">
      <button class="primary" id="memReset">Shuffle</button>
      <span class="pill">Pairs: <span id="pairs">0</span>/8</span>
    </div>
    <div id="grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px; margin-top:15px"></div>`;
      gameArea.appendChild(div);
      const icons = ['🍓', '🍊', '🍋', '🍉', '🍇', '🍒', '🥝', '🥥'];
      const deck = [...icons, ...icons].sort(() => Math.random() - 0.5);
      const grid = div.querySelector('#grid');
      let first = null, lock = false, found = 0;
      deck.forEach(val => {
        const card = document.createElement('button');
        card.className = 'pill'; card.style.height = '70px'; card.style.fontSize = '24px';
        card.dataset.val = val; card.textContent = '❓';
        card.style.background = '#f0f8ff'; // Light blue back
        card.addEventListener('click', () => {
          if (lock || card.textContent !== '❓') return;
          card.textContent = val;
          if (!first) { first = card; }
          else {
            lock = true;
            if (first.dataset.val === val) {
              found++; document.getElementById('pairs').textContent = found;
              setTimeout(() => { first.style.opacity = '0.6'; card.style.opacity = '0.6'; lock = false; first = null; }, 300);
            } else {
              setTimeout(() => { first.textContent = '❓'; card.textContent = '❓'; lock = false; first = null; }, 600);
            }
          }
        });
        grid.appendChild(card);
      });
      div.querySelector('#memReset').addEventListener('click', () => showGame('memory'));
    }

    /* Snake */
    function renderSnake() {
      // Clear game area (handled by showGame mostly, but good to be sure if we add logic later)
      // embed Scratch project
      const iframe = document.createElement('iframe');
      // User provided https://scratch.mit.edu/projects/1234815493/editor
      // We convert to embed URL: https://scratch.mit.edu/projects/1234815493/embed
      iframe.src = 'https://scratch.mit.edu/projects/1234815493/embed';
      iframe.style.width = '100%';
      iframe.style.height = '100%';
      iframe.style.border = 'none';
      iframe.allowFullscreen = true;

      // Wrapper to ensure it fits well
      const wrapper = document.createElement('div');
      wrapper.style.width = '100%';
      wrapper.style.height = '100%';
      wrapper.style.display = 'flex';
      wrapper.style.justifyContent = 'center';
      wrapper.style.alignItems = 'center';

      wrapper.appendChild(iframe);
      gameArea.appendChild(wrapper);
    }

    /* Pong */
    function renderPong() {
      const canvas = document.createElement('canvas');
      canvas.width = 480; canvas.height = 320; gameArea.appendChild(canvas);
      const ctx = canvas.getContext('2d');
      let paddle = { x: 10, y: 120, w: 10, h: 80 }, ball = { x: 240, y: 160, vx: 3, vy: 2, r: 6 };

      /* Canvas Responsive Scaling */
      canvas.style.width = '100%';
      canvas.style.maxWidth = '480px';
      canvas.style.height = 'auto'; // Maintain aspect ratio
      canvas.style.touchAction = 'none'; // Prevent scrolling

      const moveHandler = e => {
        const rect = canvas.getBoundingClientRect();
        // Calculate scale factor (canvas internal height / display height)
        const scaleY = canvas.height / rect.height;

        let clientY;
        if (e.touches && e.touches.length > 0) {
          clientY = e.touches[0].clientY;
          e.preventDefault();
        } else {
          clientY = e.clientY;
        }

        // Map display coordinate to canvas coordinate
        const relativeY = (clientY - rect.top) * scaleY;
        paddle.y = Math.min(canvas.height - paddle.h, Math.max(0, relativeY - paddle.h / 2));
      };

      canvas.addEventListener('mousemove', moveHandler);
      canvas.addEventListener('touchmove', moveHandler, { passive: false });

      function loop() {
        if (!document.body.contains(canvas)) return; // Stop if gone

        ball.x += ball.vx; ball.y += ball.vy;
        if (ball.y < ball.r || ball.y > canvas.height - ball.r) ball.vy *= -1;
        if (ball.x > canvas.width - ball.r) { ball.vx *= -1; }
        if (ball.x < paddle.x + paddle.w && ball.y > paddle.y && ball.y < paddle.y + paddle.h) {
          ball.vx = Math.abs(ball.vx) + 0.4;
          ball.vy += (Math.random() * 2 - 1);
          ball.x = paddle.x + paddle.w + ball.r;
        }
        if (ball.x < -20) { ball = { x: 240, y: 160, vx: 3, vy: 2, r: 6 }; }
        draw();
        requestAnimationFrame(loop);
      }
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#1e90ff'; ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h); // Blue Paddle
        ctx.fillStyle = '#104e8b'; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill(); // Dark Blue Ball
      }
      loop();
    }

    /* Tetris */
    function renderTetris() {
      const iframe = document.createElement('iframe');
      // Updated to Scratch project embed
      iframe.src = 'https://scratch.mit.edu/projects/313865242/embed';
      iframe.style.width = '100%';
      iframe.style.height = '100%';
      iframe.style.border = 'none';
      iframe.allowFullscreen = true;

      const wrapper = document.createElement('div');
      wrapper.style.width = '100%';
      wrapper.style.height = '100%';
      wrapper.style.display = 'flex';
      wrapper.style.justifyContent = 'center';
      wrapper.style.alignItems = 'center';

      wrapper.appendChild(iframe);
      gameArea.appendChild(wrapper);
    }

    /* Chess (320x320 board, controls stacked) */
    function renderChess() {
      const container = document.createElement('div');
      container.style.display = 'grid';
      container.style.gridTemplateColumns = '1fr';
      container.style.gap = '12px';
      container.style.alignItems = 'start';

      const boardEl = document.createElement('div');
      boardEl.style.display = 'grid';
      boardEl.style.gridTemplateColumns = 'repeat(8,40px)';
      boardEl.style.gridTemplateRows = 'repeat(8,40px)';
      boardEl.style.width = '320px'; boardEl.style.height = '320px';
      boardEl.style.borderRadius = '12px';
      boardEl.style.overflow = 'hidden';
      boardEl.style.boxShadow = '0 4px 14px rgba(0,0,0,0.08)';

      const controls = document.createElement('div');
      controls.innerHTML = `
    <div class="control-row">
      <label class="pill">Difficulty:
        <select id="chessDiff" class="pill">
          <option value="1">800</option>
          <option value="2" selected>1200</option>
          <option value="3">1600</option>
        </select>
      </label>
      <button class="primary" id="chessNew">New game</button>
    </div>
    <div class="pill" id="chessStatus" style="margin-top:10px; display:inline-block;">White to move</div>
  `;

      container.appendChild(boardEl);
      container.appendChild(controls);
      gameArea.appendChild(container);

      const PIECES = { 'P': '♙', 'N': '♘', 'B': '♗', 'R': '♖', 'Q': '♕', 'K': '♔', 'p': '♟', 'n': '♞', 'b': '♝', 'r': '♜', 'q': '♛', 'k': '♚' };
      const START = [
        ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'],
        ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'],
        ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R']
      ];
      let board = START.map(r => r.slice());
      let whiteToMove = true;
      let selected = null;
      let lastMove = null;
      let depth = 2;
      const status = controls.querySelector('#chessStatus');
      controls.querySelector('#chessDiff').addEventListener('change', e => { depth = parseInt(e.target.value, 10); });
      controls.querySelector('#chessNew').addEventListener('click', () => { board = START.map(r => r.slice()); whiteToMove = true; selected = null; lastMove = null; render(); status.textContent = 'White to move'; });

      function render() {
        boardEl.innerHTML = '';
        for (let r = 0; r < 8; r++) {
          for (let c = 0; c < 8; c++) {
            const cell = document.createElement('button');
            cell.style.width = '40px'; cell.style.height = '40px';
            cell.style.border = 'none'; cell.style.fontSize = '22px'; cell.style.cursor = 'pointer';

            cell.style.background = ((r + c) % 2 === 0) ? '#fff' : '#cae8ff'; // White vs Light Blue
            cell.style.color = '#1f2937';

            if (selected && selected.r === r && selected.c === c) { cell.style.boxShadow = 'inset 0 0 0 3px #1e90ff'; }
            if (lastMove && (lastMove.tr === r && lastMove.tc === c || lastMove.sr === r && lastMove.sc === c)) { cell.classList.add('ripple'); setTimeout(() => cell.classList.remove('ripple'), 600); }
            cell.addEventListener('click', () => onCell(r, c));

          }
        }
      }
      const isWhite = p => p && p === p.toUpperCase(), isBlack = p => p && p === p.toLowerCase();
      const inBounds = (r, c) => r >= 0 && r < 8 && c >= 0 && c < 8;

      function onCell(r, c) {
        const p = board[r][c];
        if (!whiteToMove) return;
        if (selected) {
          const moves = legalMoves(selected.r, selected.c);
          const can = moves.some(m => m.r === r && m.c === c);

            doMove({ sr: selected.r, sc: selected.c, tr: r, tc: c });

          } else {
            selected = (p && isWhite(p)) ? { r, c } : null;
            render();
          }
        } else {
          selected = (p && isWhite(p)) ? { r, c } : null;
          render();
        }
      }
      function move(sr, sc, tr, tc) {
        const p = board[sr][sc];
        board[tr][tc] = p; board[sr][sc] = '';
        if (p === 'P' && tr === 0) board[tr][tc] = 'Q';
        if (p === 'p' && tr === 7) board[tr][tc] = 'q';
      }
      function doMove(m) { move(m.sr, m.sc, m.tr, m.tc); lastMove = { ...m }; }

      // ... (Identical Chess Logic below, omitting no changes needed) ...
      function legalMoves(r, c) {
        const p = board[r][c]; if (!p) return []; const white = isWhite(p);
        const dirs = []; let moves = [];
        if (p.toUpperCase() === 'P') {
          const dir = white ? -1 : 1; const start = white ? 6 : 1;
          if (inBounds(r + dir, c) && !board[r + dir][c]) moves.push({ r: r + dir, c });
          if (r === start && !board[r + dir][c] && !board[r + 2 * dir][c]) moves.push({ r: r + 2 * dir, c });
          for (const dc of [-1, 1]) {
            const rr = r + dir, cc = c + dc;
            if (inBounds(rr, cc)) {
              const t = board[rr][cc];
              if (t && (white ? isBlack(t) : isWhite(t))) moves.push({ r: rr, c: cc });
            }

        } else if (p.toUpperCase() === 'N') {
          [[2, 1], [2, -1], [-2, 1], [-2, -1], [1, 2], [1, -2], [-1, 2], [-1, -2]].forEach(([dr, dc]) => {
            const rr = r + dr, cc = c + dc; if (inBounds(rr, cc)) { const t = board[rr][cc]; if (!t || (white ? isBlack(t) : isWhite(t))) moves.push({ r: rr, c: cc }); }
          });
        } else if (p.toUpperCase() === 'B' || p.toUpperCase() === 'R' || p.toUpperCase() === 'Q') {
          if (p.toUpperCase() !== 'R') { dirs.push([1, 1], [1, -1], [-1, 1], [-1, -1]); }
          if (p.toUpperCase() !== 'B') { dirs.push([1, 0], [-1, 0], [0, 1], [0, -1]); }
          dirs.forEach(([dr, dc]) => {
            let rr = r + dr, cc = c + dc;
            while (inBounds(rr, cc)) {
              const t = board[rr][cc];
              if (!t) { moves.push({ r: rr, c: cc }); }
              else { if (white ? isBlack(t) : isWhite(t)) moves.push({ r: rr, c: cc }); break; }
              rr += dr; cc += dc;
            }
          });
        } else if (p.toUpperCase() === 'K') {
          for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue; const rr = r + dr, cc = c + dc;
            if (inBounds(rr, cc)) { const t = board[rr][cc]; if (!t || (white ? isBlack(t) : isWhite(t))) moves.push({ r: rr, c: cc }); }
          }
        }
        moves = moves.filter(m => {
          const saved = board[m.r][m.c], piece = board[r][c];
          board[m.r][m.c] = piece; board[r][c] = '';
          const ok = !isInCheck(white);
          board[r][c] = piece; board[m.r][m.c] = saved;
          return ok;
        });
        return moves;
      }
      function findKing(white) {
        for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) { const p = board[r][c]; if (p && (white ? p === 'K' : p === 'k')) return { r, c }; }
        return null;
      }
      function pseudoMoves(r, c) {
        const p = board[r][c]; if (!p) return []; const white = isWhite(p);
        const dirs = []; const moves = [];
        if (p.toUpperCase() === 'P') {
          const dir = white ? -1 : 1; const start = white ? 6 : 1;
          if (inBounds(r + dir, c) && !board[r + dir][c]) moves.push({ r: r + dir, c });
          if (r === start && !board[r + dir][c] && !board[r + 2 * dir][c]) moves.push({ r: r + 2 * dir, c });
          for (const dc of [-1, 1]) {
            const rr = r + dir, cc = c + dc;
            if (inBounds(rr, cc)) {
              const t = board[rr][cc];
              if (t && (white ? isBlack(t) : isWhite(t))) moves.push({ r: rr, c: cc });
            }
          }
        } else if (p.toUpperCase() === 'N') {
          [[2, 1], [2, -1], [-2, 1], [-2, -1], [1, 2], [1, -2], [-1, 2], [-1, -2]].forEach(([dr, dc]) => {
            const rr = r + dr, cc = c + dc; if (inBounds(rr, cc)) { const t = board[rr][cc]; if (!t || (white ? isBlack(t) : isWhite(t))) moves.push({ r: rr, c: cc }); }
          });
        } else if (p.toUpperCase() === 'B' || p.toUpperCase() === 'R' || p.toUpperCase() === 'Q') {
          if (p.toUpperCase() !== 'R') { dirs.push([1, 1], [1, -1], [-1, 1], [-1, -1]); }
          if (p.toUpperCase() !== 'B') { dirs.push([1, 0], [-1, 0], [0, 1], [0, -1]); }
          dirs.forEach(([dr, dc]) => {
            let rr = r + dr, cc = c + dc;
            while (inBounds(rr, cc)) {
              const t = board[rr][cc];
              if (!t) { moves.push({ r: rr, c: cc }); }
              else { if (white ? isBlack(t) : isWhite(t)) moves.push({ r: rr, c: cc }); break; }
              rr += dr; cc += dc;
            }
          });
        } else if (p.toUpperCase() === 'K') {
          for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue; const rr = r + dr, cc = c + dc;
            if (inBounds(rr, cc)) { const t = board[rr][cc]; if (!t || (white ? isBlack(t) : isWhite(t))) moves.push({ r: rr, c: cc }); }
          }
        }
        return moves;
      }
      function isInCheck(white) {
        const k = findKing(white); if (!k) return false;
        for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
          const p = board[r][c]; if (!p) continue;
          if (white ? isBlack(p) : isWhite(p)) {
            const moves = pseudoMoves(r, c);
            if (moves.some(m => m.r === k.r && m.c === k.c)) return true;
          }
        }
        return false;
      }
      function generateMoves(forWhite) {
        const moves = [];
        for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
          const p = board[r][c]; if (!p) continue;
          if (forWhite ? isWhite(p) : isBlack(p)) {
            const lm = legalMoves(r, c);
            lm.forEach(m => moves.push({ sr: r, sc: c, tr: m.r, tc: m.c }));
          }

        return moves;

      function apply(m) {
        const saved = { piece: board[m.sr][m.sc], cap: board[m.tr][m.tc], last: lastMove };
        doMove(m); return saved;
      }
      function undo(m, saved) {
        board[m.sr][m.sc] = saved.piece; board[m.tr][m.tc] = saved.cap; lastMove = saved.last;
      }
      const values = { 'P': 100, 'N': 320, 'B': 330, 'R': 500, 'Q': 900, 'K': 20000 };
      function evaluate() {
        let score = 0;
        for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
          const p = board[r][c]; if (!p) continue; const v = values[p.toUpperCase()] || 0; score += isWhite(p) ? v : -v;
        }
        score += generateMoves(true).length * 2; score -= generateMoves(false).length * 2; return score;
      }
      function minimax(d, alpha, beta, maximizing) {
        if (d === 0) return { score: evaluate() };
        const moves = generateMoves(maximizing);
        if (moves.length === 0) {
          const inCheck = isInCheck(maximizing);
          return { score: inCheck ? (maximizing ? -20000 : 20000) : 0 };
        }
        let best = { score: maximizing ? -Infinity : Infinity, move: null };
        moves.sort((a, b) => { const capA = board[a.tr][a.tc] ? 1 : 0; const capB = board[b.tr][b.tc] ? 1 : 0; return capB - capA; });
        for (const m of moves) {
          const saved = apply(m);
          const res = minimax(d - 1, alpha, beta, !maximizing);
          undo(m, saved);
          const sc = res.score;
          if (maximizing) { if (sc > best.score) { best = { score: sc, move: m }; } alpha = Math.max(alpha, sc); if (beta <= alpha) break; }
          else { if (sc < best.score) { best = { score: sc, move: m }; } beta = Math.min(beta, sc); if (beta <= alpha) break; }
        }
        return best;
      }
      function aiMove() {
        const best = minimax(depth, -Infinity, Infinity, false); // Black
        if (!best.move) { status.textContent = isInCheck(false) ? 'White wins!' : 'Draw.'; return; }
        apply(best.move);
        whiteToMove = true; render();
        if (generateMoves(true).length === 0) { status.textContent = isInCheck(true) ? 'Black wins!' : 'Draw.'; }
        else { status.textContent = 'White to move'; }
      }
      render();
    }
