<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Map • Leaflet + OSM</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background: #0b0f1a;
      color: #e6edf3;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }

    #app {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100%;
    }

    header {
      padding: 0.75rem 1rem;
      background: #111827;
      border-bottom: 1px solid #1f2937;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    header h1 {
      margin: 0;
      font-size: 1rem;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    #map {
      height: 100%;
      width: 100%;
    }

    .status {
      position: absolute;
      z-index: 1000;
      top: 0.75rem;
      right: 0.75rem;
      background: rgba(17, 24, 39, 0.88);
      border: 1px solid #1f2937;
      border-radius: 10px;
      padding: 0.7rem 0.85rem;
      font-size: 0.85rem;
      backdrop-filter: blur(6px);
      min-width: 250px;
    }

    .status strong {
      color: #fff;
    }

    .btn {
      display: inline-block;
      padding: 0.45rem 0.7rem;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #0f172a;
      color: #e6edf3;
      cursor: pointer;
      font-size: 0.85rem;
      margin-right: 0.35rem;
      margin-top: 0.35rem;
    }

    .btn:hover {
      background: #111827;
    }

    .leaflet-container {
      background: #0b0f1a;
    }

    .hidden {
      display: none;
    }

    .searchRow {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .searchRow input {
      flex: 1;
      padding: 0.45rem 0.6rem;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #0b1224;
      color: #e6edf3;
      outline: none;
      font-size: 0.85rem;
    }

    .mini {
      opacity: 0.85;
      font-size: 0.8rem;
      margin-top: 0.35rem;
      line-height: 1.25rem;
    }

    .warn {
      color: #fbbf24;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div id="app">
    <header>
      <h1>Live Map • Leaflet + OpenStreetMap</h1>
    </header>

    <div id="map"></div>

    <!-- Status overlay -->
    <div class="status" id="status">
      <div><strong>Status:</strong> <span id="statusText">Initializing…</span></div>

      <div id="coords" class="mini hidden"></div>
      <div id="extra" class="mini hidden"></div>

      <div class="searchRow">
        <input id="searchInput" placeholder="Search place (needs OpenCage key)" />
        <button class="btn" id="searchBtn" title="Search location">Search</button>
      </div>

      <div style="margin-top:0.5rem;">
        <button class="btn" id="recenterBtn" title="Recenter on your latest position">Recenter</button>
        <button class="btn" id="toggleTilesBtn" title="Toggle light/dark map">Dark Map</button>
        <button class="btn" id="clearPinsBtn" title="Remove dropped pins">Clear Pins</button>
      </div>

      <div class="mini" id="hintText">
        Tip: click on the map to drop a pin 📍
      </div>
    </div>
  </div>

  <!-- Leaflet JS (NOT defer now, we will load it safely) -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>
    // -----------------------------
    // Tiny bot blocking (user-agent)
    // -----------------------------
    // NOTE: This is NOT real security, just a small filter.
    const ua = (navigator.userAgent || "").toLowerCase();
    const botPatterns = [
      "bot", "spider", "crawl", "slurp", "bingpreview", "facebookexternalhit",
      "embedly", "quora link preview", "skypeuripreview", "whatsapp", "telegrambot",
      "discordbot", "twitterbot", "linkedinbot", "pinterest", "redditbot", "crawler"
    ];
    const isBot = botPatterns.some(p => ua.includes(p));

    const statusTextEl = document.getElementById("statusText");
    const coordsEl = document.getElementById("coords");
    const extraEl = document.getElementById("extra");

    const recenterBtn = document.getElementById("recenterBtn");
    const toggleTilesBtn = document.getElementById("toggleTilesBtn");
    const clearPinsBtn = document.getElementById("clearPinsBtn");

    const searchInput = document.getElementById("searchInput");
    const searchBtn = document.getElementById("searchBtn");

    if (isBot) {
      statusTextEl.textContent = "Blocked: suspected automated agent.";
      document.getElementById("map").innerHTML = "";
      document.getElementById("hintText").innerHTML = "<span class='warn'>Bots blocked</span>";
    } else {
      safeStart();
    }

    // -----------------------------
    // OpenCage (geocoding search)
    // -----------------------------
    // Put your OpenCage key here:
    const OPENCAGE_API_KEY = "3ff7094f176242cf915d8decfdda6766";


    async function geocodeAddress(address) {
      if (!OPENCAGE_API_KEY || OPENCAGE_API_KEY.includes("YOUR_OPENCAGE_API_KEY_HERE")) {
        statusTextEl.textContent = "Search needs OpenCage API key.";
        return null;
      }

      const url = new URL("https://api.opencagedata.com/geocode/v1/json");
      url.searchParams.set("q", address);
      url.searchParams.set("key", OPENCAGE_API_KEY);
      url.searchParams.set("limit", "1");
      url.searchParams.set("no_annotations", "1");

      const res = await fetch(url.toString());
      if (!res.ok) throw new Error("Geocoding failed: " + res.status);

      const data = await res.json();
      const result = data?.results?.[0];

      if (!result?.geometry) return null;

      return {
        lat: result.geometry.lat,
        lng: result.geometry.lng,
        label: result.formatted || address
      };
    }

    // -----------------------------
    // Map + live geolocation
    // -----------------------------
    let map;
    let userMarker;
    let accuracyCircle;
    let lastPosition = null;

    let lightTiles, darkTiles;
    let usingDark = false;

    const droppedPins = [];

    function safeStart() {
      // Make sure Leaflet exists
      if (typeof L === "undefined") {
        statusTextEl.textContent = "Leaflet failed to load 😬";
        return;
      }
      initMap();
    }

    function initMap() {
      statusTextEl.textContent = "Loading map…";

      map = L.map("map", {
        zoomControl: true,
        attributionControl: true
      }).setView([0, 0], 2);

      // Light tiles (default)
      lightTiles = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
      });

      // Dark tiles (CartoDB Dark Matter)
      darkTiles = L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors &copy; CARTO"
      });

      lightTiles.addTo(map);

      // Marker + circle (created once)
      userMarker = L.marker([0, 0], { draggable: false });
      userMarker.bindPopup("You are here 😄");

      accuracyCircle = L.circle([0, 0], {
        radius: 0,
        color: "#60a5fa",
        fillColor: "#60a5fa",
        fillOpacity: 0.15,
        weight: 2
      });

      // Click map to drop pins
      map.on("click", (e) => {
        const pin = L.marker(e.latlng).addTo(map);
        pin.bindPopup(`📍 Pin<br>Lat: ${e.latlng.lat.toFixed(6)}<br>Lng: ${e.latlng.lng.toFixed(6)}`);
        droppedPins.push(pin);
      });

      // Buttons
      recenterBtn.addEventListener("click", () => {
        if (!lastPosition) return;
        const { latitude, longitude } = lastPosition.coords;
        map.setView([latitude, longitude], Math.max(map.getZoom(), 16), { animate: true });
      });

      toggleTilesBtn.addEventListener("click", () => {
        usingDark = !usingDark;
        if (usingDark) {
          map.removeLayer(lightTiles);
          darkTiles.addTo(map);
          toggleTilesBtn.textContent = "Light Map";
        } else {
          map.removeLayer(darkTiles);
          lightTiles.addTo(map);
          toggleTilesBtn.textContent = "Dark Map";
        }
      });

      clearPinsBtn.addEventListener("click", () => {
        while (droppedPins.length) {
          const pin = droppedPins.pop();
          map.removeLayer(pin);
        }
      });

      // Search button
      searchBtn.addEventListener("click", async () => {
        const q = (searchInput.value || "").trim();
        if (!q) return;

        statusTextEl.textContent = "Searching…";
        try {
          const result = await geocodeAddress(q);
          if (!result) {
            statusTextEl.textContent = "Not found 😢";
            return;
          }

          const { lat, lng, label } = result;
          map.setView([lat, lng], 15, { animate: true });

          const pin = L.marker([lat, lng]).addTo(map);
          pin.bindPopup(`🔎 ${label}`).openPopup();
          droppedPins.push(pin);

          statusTextEl.textContent = "Search complete ✅";
        } catch (err) {
          statusTextEl.textContent = "Search failed 😬";
          console.error(err);
        }
      });

      // Enter key triggers search
      searchInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") searchBtn.click();
      });

      // Geolocation watch
      if (!("geolocation" in navigator)) {
        statusTextEl.textContent = "Geolocation not supported by your browser.";
        return;
      }

      statusTextEl.textContent = "Waiting for location permission…";

      navigator.geolocation.watchPosition(
        onPosition,
        onPositionError,
        {
          enableHighAccuracy: true,
          maximumAge: 5000,
          timeout: 20000
        }
      );
    }

    function onPosition(pos) {
      lastPosition = pos;
      const { latitude, longitude, accuracy, speed, heading } = pos.coords;

      // Add marker/circle to map if first time
      if (!userMarker._map) {
        userMarker.addTo(map);
        accuracyCircle.addTo(map);

        // First fix: zoom in once
        map.setView([latitude, longitude], 16);
      }

      // Update marker and circle
      userMarker.setLatLng([latitude, longitude]);
      accuracyCircle.setLatLng([latitude, longitude]).setRadius(accuracy);

      // Update status
      statusTextEl.textContent = "Live position updating ✅";
      coordsEl.classList.remove("hidden");
      coordsEl.textContent =
        `Lat: ${latitude.toFixed(6)} • Lng: ${longitude.toFixed(6)} • ±${Math.round(accuracy)}m`;

      // Extra info (speed/heading may be null)
      extraEl.classList.remove("hidden");

      const speedKmh = (typeof speed === "number" && speed !== null)
        ? (speed * 3.6).toFixed(1)
        : "N/A";

      const headingDeg = (typeof heading === "number" && heading !== null)
        ? heading.toFixed(0) + "°"
        : "N/A";

      extraEl.textContent = `Speed: ${speedKmh} km/h • Heading: ${headingDeg}`;
    }

    function onPositionError(err) {
      const messages = {
        1: "Permission denied. Please allow location access.",
        2: "Position unavailable. Try moving to an open area.",
        3: "Timeout getting position. Please try again."
      };
      statusTextEl.textContent = messages[err.code] || ("Geolocation error: " + err.message);
    }
  </script>
</body>

</html>
