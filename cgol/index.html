<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conway's Game of Life</title>
    <link rel="stylesheet" href="style.css">
    <!-- Mobile Friendly -->
    <link rel="stylesheet" href="/mobile-friendly.css">
</head>
<body>
    <div class="container">
        <h1>Game of Life</h1>
        <div class="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
        </div>
        <div class="controls">
            <button id="startPauseBtn">Start</button>
            <button id="randomizeBtn">Randomize</button>
            <button id="clearBtn">Clear</button>
            <div class="speed-control">
                <label for="speedRange">Speed</label>
                <input type="range" id="speedRange" min="1" max="60" value="10">
            </div>
            <div class="stats">
                Generation: <span id="generationCount">0</span>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
    <script>(function(){const v=Date.now();document.write('<script src="/global-header.js?v='+v+'"><\/script>');})();</script>
    <script src="/accounts/account-widget.js" defer data-account-api="https://accounts-system.b4rjxr9lk.workers.dev"></script>
</body>
</html>
