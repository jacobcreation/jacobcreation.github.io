<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angry Fowl</title>
    <meta name="description" content="A dynamic angry birds style physics game">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>
    <div id="game-container">
        <div id="game-layer">
            <div id="slingshot-band"></div>
        </div>
    </div>
    
    <div id="ui-layer">
        <div class="logo">Angry Fowl</div>
        <div class="stats">
            <div class="birds-remaining">Birds: <span id="birds-count">3</span></div>
            <div class="score-board">Score: <span id="score">0</span></div>
        </div>
        <button id="reset-button">Reset Game</button>
    </div>

    <div id="end-screen" class="hidden">
        <h2 id="end-title">Level Cleared!</h2>
        <p>Final Score: <span id="final-score">0</span></p>
        <button id="reset-button-end" onclick="location.reload()">Play Again</button>
    </div>

    <!-- Audio effects could go here -->
    <script src="game.js"></script>
</body>
</html>
