name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Remove large puzzle data
        run: rm -rf chesspuzzle/puzzlelist

      - name: Prepare Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a ./ ./_site/ \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude "_site/" \
            --exclude "mg/**/venv/" \
            --exclude "downloads/apk_test/" \
            --exclude "*.keystore"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
