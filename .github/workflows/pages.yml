name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Remove large puzzle data
        run: rm -rf chesspuzzle/puzzlelist

      - name: Prepare Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site
          tar -cf - . \
            --exclude=.git \
            --exclude=.github \
            --exclude=_site \
            --exclude=downloads/apk_test \
            --exclude='*.keystore' \
            --exclude='*/venv' \
            --exclude='*/venv/*' \
            --exclude='*/__pycache__' \
            --exclude='*/__pycache__/*' \
            --exclude='*.pyc' \
            --exclude='*.pyo' \
            | tar -xf - -C _site

      - name: Inspect artifact contents
        run: |
          echo "Artifact directory size:"
          du -sh _site
          echo "Top 30 largest files:"
          find _site -type f -printf "%s %p\n" | sort -nr | head -30
          echo "File count:"
          find _site -type f | wc -l
          echo "Symlink count:"
          find _site -type l | wc -l

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
