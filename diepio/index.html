<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Battle geometric enemies, level up your tank, and spend upgrade points in Jacob's custom Diep.io-inspired arena.">
    <title>Diep.io Clone</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-project-subtitle="A custom arena shooter with upgrades, a minimap, and quick rounds built from scratch.">
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        
        <div id="ui-layer">
            <!-- Top Right: Score/Leaderboard -->
            <div id="leaderboard" class="ui-panel">
                <h3>Leaderboard</h3>
                <ol id="leaderboard-list"></ol>
            </div>

            <!-- Top Center: Server Info -->
            <div id="server-info">
                FPS: <span id="fps">60</span> | Ping: 12ms
            </div>

            <!-- Bottom Left: Upgrades -->
            <div id="upgrades-container">
                <div id="upgrade-points-display">x<span id="upgrade-points">0</span></div>
                <div class="upgrade-list" id="upgrade-list">
                    <!-- Upgrades generated by JS -->
                </div>
            </div>

            <!-- Bottom Center: Exp Bar and Level -->
            <div id="player-progress">
                <div id="level-display">Level <span id="level">1</span> <span id="class-name">Tank</span></div>
                <div id="exp-bar-container">
                    <div id="exp-bar"></div>
                </div>
            </div>

            <!-- Bottom Right: Minimap -->
            <div id="minimap-container" class="ui-panel">
                <canvas id="minimap"></canvas>
            </div>
            
            <!-- Death Screen -->
            <div id="death-screen" class="hidden overlay-screen">
                <h1>You Died</h1>
                <p>Score: <span id="final-score">0</span></p>
                <p>Level: <span id="final-level">1</span></p>
                <button id="respawn-btn">Respawn</button>
            </div>
            
            <!-- Start Screen -->
            <div id="start-screen" class="overlay-screen">
                <h1>Diep.io Clone</h1>
                <p>WASD to Move | Mouse to Aim | Left Click to Shoot</p>
                <input type="text" id="player-name-input" placeholder="Enter Name" maxlength="15" value="Player">
                <button id="start-btn">Play</button>
            </div>

            <div id="mobile-controls" aria-label="Mobile controls">
                <div class="touch-stick" id="move-stick">
                    <div class="touch-stick-base">
                        <div class="touch-stick-knob" id="move-stick-knob"></div>
                    </div>
                </div>
                <div class="mobile-actions">
                    <div class="touch-stick touch-stick--aim" id="aim-stick">
                        <div class="touch-stick-base">
                            <div class="touch-stick-knob" id="aim-stick-knob"></div>
                        </div>
                    </div>
                    <button id="fire-button" class="touch-fire-button" type="button">Fire</button>
                </div>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
