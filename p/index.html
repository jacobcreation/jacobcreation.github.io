<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Art Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Pixel Art Studio</h1>
        </header>
        
        <main>
            <section class="toolbar">
                <div class="tool-group">
                    <button id="pen-tool" class="tool active" title="Pen (P)">
                        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M3,17.25V21H6.75L17.81,9.94L14.06,6.19L3,17.25M20.71,7.04C21.1,6.65 21.1,6.02 20.71,5.63L18.37,3.29C17.98,2.9 17.35,2.9 16.96,3.29L15.13,5.12L18.88,8.87L20.71,7.04Z"/></svg>
                    </button>
                    <button id="eraser-tool" class="tool" title="Eraser (E)">
                        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M16.24,3.56L21.19,8.51C21.97,9.29 21.97,10.55 21.19,11.33L14.6,17.92L18.13,21.45L16.71,22.87L13.18,19.34L11.56,20.96C10.78,21.74 9.52,21.74 8.74,20.96L3.79,16.01C3.01,15.23 3.01,13.97 3.79,13.19L10.38,6.6L6.85,3.07L8.27,1.65L11.8,5.18L13.42,3.56C14.2,2.78 15.46,2.78 16.24,3.56M11.79,8.01L5.21,14.6L10.16,19.55L16.74,12.96L11.79,8.01Z"/></svg>
                    </button>
                    <button id="clear-tool" class="tool" title="Clear Canvas">
                        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M19,4H15.5L14.5,3H9.5L8.5,4H5V6H19V4M6,19A2,2 0 0,0 8,21H16A2,2 0 0,0 18,19V7H6V19Z"/></svg>
                    </button>
                    <div class="brush-size-control">
                        <label for="brush-size">Size: <span id="brush-size-val">1</span></label>
                        <input type="range" id="brush-size" min="1" max="4" value="1">
                    </div>
                </div>

                <div class="tool-group">
                    <input type="color" id="color-picker" value="#000000" title="Custom Color">
                    <div class="swatches">
                        <div class="swatch active" style="background-color: #000000;"></div>
                        <div class="swatch" style="background-color: #ffffff;"></div>
                        <div class="swatch" style="background-color: #ff0000;"></div>
                        <div class="swatch" style="background-color: #00ff00;"></div>
                        <div class="swatch" style="background-color: #0000ff;"></div>
                        <div class="swatch" style="background-color: #ffff00;"></div>
                        <div class="swatch" style="background-color: #ff00ff;"></div>
                        <div class="swatch" style="background-color: #00ffff;"></div>
                    </div>
                </div>

                <div class="tool-group actions">
                    <button id="grid-toggle" class="action-btn active">Grid: ON</button>
                    <button id="export-btn" class="action-btn primary">Export PNG</button>
                </div>

                <div class="tool-group templates">
                    <h3>Templates</h3>
                    <div class="template-btns">
                        <button class="tmpl-btn" data-template="heart">Heart</button>
                        <button class="tmpl-btn" data-template="star">Star</button>
                        <button class="tmpl-btn" data-template="ghost">Ghost</button>
                    </div>
                    <div class="import-actions">
                        <button id="import-trigger" class="action-btn">Import Image</button>
                        <input type="file" id="image-import" accept="image/*" style="display: none;">
                    </div>
                    <div class="custom-template-actions">
                        <button id="save-tmpl-btn" class="action-btn mini">Save Custom</button>
                        <button id="load-tmpl-btn" class="action-btn mini">Load Custom</button>
                    </div>
                    <div class="template-controls">
                        <label for="template-opacity">Template Opacity</label>
                        <input type="range" id="template-opacity" min="0" max="100" value="50">
                    </div>
                </div>
            </section>

            <section class="canvas-area">
                <div class="canvas-wrapper">
                    <canvas id="template-canvas" class="layer"></canvas>
                    <canvas id="paint-canvas" class="layer"></canvas>
                    <div id="grid-overlay" class="grid-overlay layer"></div>
                </div>
            </section>
        </main>

        <footer>
            <p>Use left-click to draw. Hold Shift to erase.</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
