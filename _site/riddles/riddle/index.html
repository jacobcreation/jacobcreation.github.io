<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Cache Busting Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riddle Battle - JacobCreation</title>

  <link rel="icon" href="/favicon.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

  <style>
    /* Design Tokens */
    :root {
      --bg1: #0b1020;
      --bg2: #0a1633;
      --card: rgba(255, 255, 255, 0.08);
      --card2: rgba(255, 255, 255, 0.12);
      --border: rgba(255, 255, 255, 0.14);
      --text: #eaf2ff;
      --muted: rgba(234, 242, 255, 0.75);
      --blue: #4ea1ff;
      --red: #ff4c4c;
      --green: #4ade80;
      --shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(1200px 600px at 20% 10%, rgba(78, 161, 255, 0.30), transparent 55%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 80px;
    }

    /* Game Layout */
    .game-container {
      width: 100%;
      max-width: 800px;
      padding: 0 20px 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    /* Level Indicator */
    .level-badge {
      background: linear-gradient(90deg, #ff8c00, #ff0055);
      padding: 6px 16px;
      border-radius: 99px;
      font-weight: 800;
      font-family: "Orbitron", sans-serif;
      font-size: 1.2rem;
      text-transform: uppercase;
      box-shadow: 0 0 15px rgba(255, 140, 0, 0.4);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }

      100% {
        transform: scale(1);
      }
    }

    /* Arena (Health Bars & Avatars) */
    .arena {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 0px;
      gap: 20px;
    }

    .fighter {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.05);
      padding: 15px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .avatar {
      font-size: 3rem;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
      transition: transform 0.2s;
    }

    .shake {
      animation: shake 0.5s;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-5px) rotate(-5deg);
      }

      75% {
        transform: translateX(5px) rotate(5deg);
      }
    }

    .health-track {
      width: 100%;
      height: 12px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .health-fill {
      height: 100%;
      background: var(--green);
      width: 100%;
      transition: width 0.5s ease, background 0.3s;
    }

    .health-fill.low {
      background: var(--red);
    }

    .health-fill.med {
      background: #ffaa00;
    }

    .name {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--muted);
    }

    /* Riddle Card */
    .card {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 30px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      position: relative;
      overflow: hidden;
    }

    #riddle-text {
      font-size: 1.3rem;
      line-height: 1.6;
      text-align: center;
      min-height: 60px;
      margin: 0;
    }

    .placeholder {
      font-style: italic;
      color: var(--muted);
      opacity: 0.7;
    }

    /* Input Area */
    .input-wrap {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 450px;
      transition: all 0.3s ease;
    }

    .input-wrap.hidden {
      opacity: 0.5;
      pointer-events: none;
      filter: blur(2px);
    }

    input {
      flex: 1;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 14px 24px;
      color: white;
      font-family: inherit;
      font-size: 1.1rem;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(78, 161, 255, 0.2);
    }

    .btn {
      border: none;
      padding: 12px 28px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      font-size: 1rem;
      transition: transform 0.2s;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: linear-gradient(135deg, #1e90ff, #ff2d2d);
      color: white;
      box-shadow: 0 4px 15px rgba(30, 144, 255, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(30, 144, 255, 0.5);
    }

    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* Feedback & Status */
    .status-msg {
      font-weight: 700;
      font-size: 1.2rem;
      height: 30px;
      text-align: center;
    }

    .game-over-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s;
    }

    .game-over-overlay.visible {
      opacity: 1;
      pointer-events: all;
    }

    .game-over-title {
      font-size: 3rem;
      font-family: "Orbitron";
      font-weight: 800;
    }

    .win-text {
      color: var(--green);
      text-shadow: 0 0 20px rgba(74, 222, 128, 0.5);
    }

    .lose-text {
      color: var(--red);
      text-shadow: 0 0 20px rgba(255, 76, 76, 0.5);
    }

    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
      margin: 10px auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading .spinner {
      display: block;
    }
  </style>
</head>

<body>

  <!-- Provides the sticky header -->
  <script>(function(){const v=Date.now();document.write('<script src="/global-header.js?v='+v+'"><\/script>');})();</script>

  <div class="game-container">

    <div class="level-badge">Level <span id="level-display">1</span></div>

    <div class="arena">
      <!-- Player -->
      <div class="fighter">
        <div class="name">YOU</div>
        <div class="avatar" id="player-avatar">😎</div>
        <div class="health-track">
          <div class="health-fill" id="player-health"></div>
        </div>
      </div>

      <!-- VS -->
      <div style="display:grid; place-items:center; font-weight:900; opacity:0.5; font-size:1.5rem">VS</div>

      <!-- Enemy -->
      <div class="fighter">
        <div class="name">RIDDLE BOT</div>
        <div class="avatar" id="enemy-avatar">🤖</div>
        <div class="health-track">
          <div class="health-fill" id="enemy-health"></div>
        </div>
      </div>
    </div>

    <!-- Main Game Card -->
    <div class="card" id="game-card">
      <div class="spinner"></div>

      <p id="riddle-text" class="placeholder">Press Start to battle!</p>

      <div class="status-msg" id="status-msg"></div>

      <div class="input-wrap hidden" id="input-area">
        <input type="text" id="answer-input" placeholder="Your answer..." autocomplete="off">
        <button class="btn btn-primary" id="submit-btn" disabled>Attack!</button>
      </div>

      <button class="btn btn-primary" id="start-btn">⚔️ Start Battle</button>

      <!-- Game Over / Win Screen Overlay -->
      <div class="game-over-overlay" id="overlay">
        <div class="game-over-title" id="overlay-title">VICTORY</div>
        <p id="overlay-msg">You defeated the bot!</p>
        <button class="btn btn-primary" id="next-level-btn">Next Level ➡️</button>
        <button class="btn btn-primary" id="restart-btn" style="display:none; background: #555;">Try Again ↺</button>
      </div>
    </div>

  </div>

  <script>
    const WORKER_URL = "https://riddle-ai.b4rjxr9lk.workers.dev/";

    // State
    let level = 1;
    let playerHealth = 100;
    let enemyHealth = 100;
    let currentRiddle = "";
    let currentAnswer = "";
    let seenAnswers = []; // Track past answers to avoid repeats
    let wrongAttempts = 0; // Track wrong guesses per riddle
    let isProcessing = false;

    // Elements
    const els = {
      level: document.getElementById('level-display'),
      pHealth: document.getElementById('player-health'),
      eHealth: document.getElementById('enemy-health'),
      pAvatar: document.getElementById('player-avatar'),
      eAvatar: document.getElementById('enemy-avatar'),
      riddle: document.getElementById('riddle-text'),
      status: document.getElementById('status-msg'),
      inputArea: document.getElementById('input-area'),
      input: document.getElementById('answer-input'),
      submit: document.getElementById('submit-btn'),
      startBtn: document.getElementById('start-btn'),
      card: document.getElementById('game-card'),
      overlay: document.getElementById('overlay'),
      overlayTitle: document.getElementById('overlay-title'),
      overlayMsg: document.getElementById('overlay-msg'),
      nextBtn: document.getElementById('next-level-btn'),
      restartBtn: document.getElementById('restart-btn')
    };

    // --- GAME LOGIC ---

    function updateHealthUI() {
      els.pHealth.style.width = playerHealth + '%';
      els.eHealth.style.width = enemyHealth + '%';

      // Color changes
      els.pHealth.className = `health-fill ${playerHealth < 40 ? 'low' : playerHealth < 70 ? 'med' : ''}`;
      els.eHealth.className = `health-fill ${enemyHealth < 40 ? 'low' : enemyHealth < 70 ? 'med' : ''}`;
    }

    function takeDamage(target) {
      if (target === 'player') {
        playerHealth = Math.max(0, playerHealth - 10); // 10 mistakes = game over
        els.pAvatar.classList.add('shake');
        setTimeout(() => els.pAvatar.classList.remove('shake'), 500);
      } else {
        enemyHealth = Math.max(0, enemyHealth - 10); // 10 correct = win level
        els.eAvatar.classList.add('shake');
        setTimeout(() => els.eAvatar.classList.remove('shake'), 500);
      }
      updateHealthUI();
      checkWinCondition();
    }

    function checkWinCondition() {
      if (playerHealth <= 0) {
        showGameOver(false);
      } else if (enemyHealth <= 0) {
        showGameOver(true);
      } else {
        // Continue game - fetch new riddle if the enemy was hit but not dead?
        // Actually, let's fetch a NEW riddle after every correct answer to keep fighting
        if (enemyHealth > 0 && playerHealth > 0) {
          // If we just hit the enemy, get the next riddle immediately
          // If we got hit, we can retry the SAME riddle
        }
      }
    }

    function showGameOver(isWin) {
      els.overlay.classList.add('visible');
      if (isWin) {
        els.overlayTitle.textContent = "VICTORY!";
        els.overlayTitle.className = "game-over-title win-text";
        els.overlayMsg.textContent = `You defeated the Level ${level} Bot!`;
        els.nextBtn.style.display = "inline-flex";
        els.restartBtn.style.display = "none";
      } else {
        els.overlayTitle.textContent = "DEFEATED";
        els.overlayTitle.className = "game-over-title lose-text";
        els.overlayMsg.textContent = "The Bot outsmarted you.";
        els.nextBtn.style.display = "none";
        els.restartBtn.style.display = "inline-flex";
      }
    }

    async function fetchRiddle() {
      if (isProcessing) return;
      isProcessing = true;

      const loadingMessages = [
        "Bot is thinking...",
        "Consulting the oracle...",
        "Reading ancient scrolls...",
        "Calculus is hard...",
        "Parsing the universe...",
        "Generating wit...",
        "Almost there..."
      ];
      let msgIdx = 0;

      els.card.classList.add('loading');
      els.riddle.textContent = loadingMessages[0];
      els.status.textContent = "";
      els.inputArea.classList.add('hidden');
      els.startBtn.style.display = "none";

      // Rotate messages every 2 seconds
      const loadingInterval = setInterval(() => {
        msgIdx = (msgIdx + 1) % loadingMessages.length;
        els.riddle.textContent = loadingMessages[msgIdx];
      }, 2000);

      // Randomize the request to prevent duplicates
      const themes = ["Animals", "Space", "Food", "Time", "Nature", "Household Objects", "Logic", "Words", "Mystery", "History", "Science"];
      const randomTheme = themes[Math.floor(Math.random() * themes.length)];

      // 20 Second Timeout (Increased slightly as 13s is common)
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 20000);

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          signal: controller.signal,
          body: JSON.stringify({
            action: "get_riddle",
            level: level,
            theme: randomTheme,
            avoid: seenAnswers.slice(-10)
          })
        });

        clearTimeout(timeoutId);

        if (!res.ok) {
          throw new Error(`Server returned ${res.status}`);
        }

        // Parse JSON response
        const data = await res.json().catch(() => {
          throw new Error("Worker returned invalid format. Did you update the worker code?");
        });

        const rawText = data.raw || "";
        let rText = "Could not parse riddle.";
        let aText = "";

        const upper = rawText.toUpperCase();
        const answerIndex = upper.lastIndexOf("ANSWER:");

        if (answerIndex !== -1) {
          rText = rawText.substring(0, answerIndex).replace(/RIDDLE:/i, '').trim();
          aText = rawText.substring(answerIndex).replace(/ANSWER:/i, '').trim();
        } else {
          rText = rawText;
          aText = "unknown";
          console.warn("Worker didn't return RIDDLE/ANSWER format:", rawText);
        }

        currentRiddle = rText;
        currentAnswer = aText;
        wrongAttempts = 0; // Reset wrong attempts for new riddle

        els.riddle.innerHTML = currentRiddle;
        els.riddle.classList.remove('placeholder');
        els.inputArea.classList.remove('hidden');
        els.input.value = "";
        els.input.focus();
        els.input.disabled = false;
        els.submit.disabled = true;

        // Answer hidden from console to prevent cheating
        // console.log("Answer Key:", currentAnswer);

      } catch (e) {
        console.error(e);
        if (e.name === 'AbortError') {
          els.riddle.textContent = "Request timed out. The Bot is asleep.";
        } else {
          els.riddle.textContent = `Error: ${e.message}`;
        }
        els.startBtn.style.display = "inline-block"; // Allow retry
        els.startBtn.textContent = "🔄 Retry";

      } finally {
        els.card.classList.remove('loading');
        isProcessing = false;
        clearTimeout(timeoutId);
        clearInterval(loadingInterval);
      }
    }

    async function checkAnswer() {
      const userAns = els.input.value.trim();
      if (!userAns) return;

      // LOCAL CHECK (Instant)
      // We check if:
      // 1. User answer is inside correct answer (e.g. "Piano" in "Use a Piano")
      // 2. Correct answer is inside user answer
      // 3. Exact match

      const cleanUser = userAns.toLowerCase().replace(/[^a-z0-9]/g, '');
      const cleanKey = currentAnswer.toLowerCase().replace(/[^a-z0-9]/g, '');

      // Basic validation to avoid empty matches
      if (cleanUser.length < 2) return;

      let isCorrect = false;
      if (cleanKey.includes(cleanUser) || cleanUser.includes(cleanKey)) {
        isCorrect = true;
      }

      // Extra check: edit distance could be added here later

      if (isCorrect) {
        els.status.textContent = "CRITICAL HIT! 💥";
        els.status.style.color = "var(--green)";
        takeDamage('enemy');

        seenAnswers.push(currentAnswer); // Remember this answer

        if (enemyHealth > 0) {
          els.input.disabled = true;
          els.submit.disabled = true;
          setTimeout(() => {
            els.status.textContent = "Next riddle coming...";
            setTimeout(fetchRiddle, 1000);
          }, 1000);
        }
      } else {
        els.status.textContent = "WRONG! YOU TAKE DAMAGE! 🛡️";
        els.status.style.color = "var(--red)";
        takeDamage('player');

        wrongAttempts++;

        if (playerHealth > 0) {

          // 3 Wrong Guesses -> Reveal Answer
          if (wrongAttempts >= 3) {
            els.status.textContent = `Too hard! Answer was: ${currentAnswer}`;
            els.input.disabled = true;
            els.submit.disabled = true;

            // Move to next riddle automatically
            setTimeout(() => {
              els.status.textContent = "Next riddle coming...";
              setTimeout(fetchRiddle, 2000);
            }, 2500); // Give user time to read answer

          } else {
            // Just let them retry
            els.input.value = "";
            els.input.focus();
            els.input.classList.add('shake');
            setTimeout(() => els.input.classList.remove('shake'), 500);
          }
        }
      }
    }

    // Controls
    els.startBtn.addEventListener('click', () => {
      fetchRiddle();
    });

    els.input.addEventListener('input', () => {
      els.submit.disabled = els.input.value.trim().length === 0;
    });

    els.input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !els.submit.disabled) checkAnswer();
    });
    els.submit.addEventListener('click', checkAnswer);

    // Level Managment
    els.nextBtn.addEventListener('click', () => {
      level++;
      els.level.textContent = level;
      resetGame();
    });

    els.restartBtn.addEventListener('click', () => {
      resetGame(); // Keep same level
    });

    function resetGame() {
      playerHealth = 100;
      enemyHealth = 100;
      updateHealthUI();
      els.overlay.classList.remove('visible');
      fetchRiddle();
    }

    // Init Visuals
    updateHealthUI();

  </script>
</body>

</html>
