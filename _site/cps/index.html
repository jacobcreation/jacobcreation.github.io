<!DOCTYPE html> 
<html lang="en">

<head>
    <!-- Cache Busting Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    
  <link rel="icon" href="/favicon.png" type="image/png" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">



  <style>
    :root {
      --bg1: #0b1020;
      --bg2: #0a1633;
      --card: rgba(255, 255, 255, 0.08);
      --card2: rgba(255, 255, 255, 0.12);
      --border: rgba(255, 255, 255, 0.14);
      --text: #eaf2ff;
      --muted: rgba(234, 242, 255, 0.75);
      --blue: #4ea1ff;
      --blue2: #2d6bff;
      --danger: #ff4e4e;
      --shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
      --shadow2: 0 10px 22px rgba(0, 0, 0, 0.28);
      --radius: 18px;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: "Poppins", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(1200px 600px at 20% 10%, rgba(78, 161, 255, 0.15), transparent 55%),
        radial-gradient(900px 600px at 90% 15%, rgba(45, 107, 255, 0.12), transparent 55%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      display: flex;
      flex-direction: column;
    }

    .hidden {
      display: none
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(10px);
      background: rgba(10, 16, 32, 0.65);
      border-bottom: 1px solid rgba(255, 255, 255, 0.10);
      margin-bottom: 20px;
    }

    .header-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: 0.2px;
      font-size: 1.15rem;
      white-space: nowrap;
      text-decoration: none;
    }

    .logo-badge {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, #1e90ff, #ff2d2d);
      box-shadow: 0 10px 24px rgba(30, 144, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.20);
      font-weight: 900;
      color: white;
    }

    .logo-text {
      font-family: "Orbitron", sans-serif;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #1e90ff, #ff2d2d);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 14px rgba(30, 144, 255, 0.35);
    }

    /* Layout */
    .wrapper {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 18px;
      width: 100%;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(12px);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }

    h2,
    h3 {
      margin-top: 0;
      color: var(--text);
    }

    /* Controls */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 10px;
    }

    button,
    input,
    select {
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 15px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    select {
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2212%22%20height%3D%2212%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23eaf2ff%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat;
      background-position: right 14px center;
      padding-right: 40px;
    }

    select option {
      background-color: #161f35;
      color: #eaf2ff;
      padding: 10px;
    }

    input::placeholder {
      color: rgba(234, 242, 255, 0.4);
    }

    input:focus,
    select:focus {
      border-color: var(--blue);
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 0 3px rgba(78, 161, 255, 0.15);
    }

    button {
      cursor: pointer;
      font-weight: 700;
      background: linear-gradient(135deg, var(--blue), var(--blue2));
      color: #071122;
      border: none;
      box-shadow: 0 4px 15px rgba(45, 107, 255, 0.2);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(45, 107, 255, 0.3);
    }

    button.secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: none;
    }

    button.secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
    }

    button.danger {
      background: linear-gradient(135deg, #ff4e4e, #d32f2f);
      color: white;
      box-shadow: 0 4px 15px rgba(255, 78, 78, 0.2);
    }

    /* Tables */
    .table-wrap {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
      background: rgba(255, 255, 255, 0.02);
    }

    th,
    td {
      padding: 14px;
      text-align: center;
      white-space: nowrap;
    }

    th {
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      font-weight: 600;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    tr:not(:last-child) td {
      border-bottom: 1px solid var(--border)
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.03);
    }

    /* Mobile */
    @media(max-width:720px) {
      .controls {
        flex-direction: column
      }

      button,
      input,
      select {
        width: 100%;
      }
    }

    /* Print */
    @media print {
      @page {
        margin: 1.5cm;
      }
      body {
        background: white !important;
        color: black !important;
        display: block;
        font-family: "Times New Roman", Times, serif !important;
      }
      header, .controls, .danger, #modeScreen, .logo-badge, #standings-card-regular, .result-col, .remove-col {
        display: none !important;
      }
      .wrapper {
        max-width: 100%;
        padding: 0;
        margin: 0;
      }
      .card {
        border: 1px solid #000 !important;
        padding: 30px !important;
        margin: 0 0 30px 0 !important;
        background: white !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        page-break-inside: avoid;
      }
      .card h2, .card h3 {
        color: black !important;
        border-bottom: 1px solid #000;
        padding-bottom: 10px;
        margin-bottom: 20px;
        text-transform: uppercase;
        letter-spacing: 2px;
        text-align: center;
      }
      .table-wrap {
        overflow-x: visible !important;
        border: none !important;
        border-radius: 0 !important;
      }
      table {
        border-collapse: collapse !important;
        width: 100% !important;
        min-width: 0 !important;
        background: transparent !important;
        border: 1px solid #000 !important;
      }
      th {
        background: #eee !important;
        color: black !important;
        border: 1px solid #000 !important;
        font-weight: bold !important;
        padding: 10px !important;
        text-transform: uppercase !important;
      }
      td {
        border: 1px solid #000 !important;
        color: black !important;
        padding: 10px !important;
      }
      tr:hover td {
        background: transparent !important;
      }
      .print-only {
        display: block !important;
      }
      .no-print {
        display: none !important;
      }
      #finalStandingsCard {
        display: block !important;
      }
      #pairingsCard.no-print {
        display: none !important;
      }
    }

    .print-only { display: none; }
  </style>
</head>

<body>
  <script>(function(){const v=Date.now();document.write('<script src="../global-header.js?v='+v+'"><\/script>');})();</script>


  <!-- MODE SELECT -->
  <div id="modeScreen" class="wrapper">
    <div class="card">
      <h2>Tournament Setup</h2>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <input id="tournamentName" placeholder="Tournament Name">
        <input id="maxRoundsInput" type="number" placeholder="Number of Rounds" min="1" value="5">
      </div>

      <div class="controls" style="margin-top: 20px;">
        <button onclick="start('swiss')">Swiss</button>
        <button class="secondary" onclick="start('rr')">Round Robin</button>
      </div>
    </div>
  </div>

  <!-- TOURNAMENT -->
  <div id="tournamentScreen" class="wrapper hidden">

    <div class="card no-print">
      <h2 id="title"></h2>
      <div class="controls">
        <input id="pName" placeholder="Player name">
        <input id="pRating" type="number" placeholder="Rating">

        <button onclick="addPlayer()">Add</button>
        <input type="file" id="fileInput" accept=".csv,.txt" style="display:none">
        <button class="secondary" onclick="document.getElementById('fileInput').click()">Upload CSV</button>
        <button onclick="nextRound()" id="nextRoundBtn">Next Round</button>
        <button class="secondary" onclick="finalize()" id="finalizeBtn">Finalize Round</button>
        <button class="secondary" onclick="printCurrent()">🖨 Print</button>
        <button class="secondary" onclick="exportTRF()">📤 TRF</button>
        <button class="secondary" onclick="undo()">Undo</button>
        <button class="danger" onclick="resetAll()">Reset</button>
      </div>
    </div>

    <!-- Final Standings (Visible after tournament ends or in print) -->
    <div id="finalStandingsCard" class="card hidden">
      <h2 style="text-align: center;">🏆 Final Standings 🏆</h2>
      <div class="table-wrap">
        <table id="finalStandingsTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Rating</th>
              <th>Score</th>
              <th>BH</th>
              <th>SB</th>
            </tr>
          </thead>
          <tbody id="finalStandingsBody"></tbody>
        </table>
      </div>
      <div class="print-only" style="margin-top: 40px; display: flex; justify-content: space-between;">
        <div>Date: _________________</div>
        <div>Arbiter: _________________</div>
      </div>
    </div>

    <!-- Regular Standings -->
    <div class="card no-print" id="standings-card-regular">
      <h3>Current Standings</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Rating</th>
              <th>Score</th>
              <th class="remove-col">Action</th>
            </tr>
          </thead>
          <tbody id="standings"></tbody>
        </table>
      </div>
    </div>

    <!-- Pairings -->
    <div class="card print-round" id="pairingsCard">
      <h3 id="roundTitle"></h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Board</th>
              <th>White</th>
              <th>Black</th>
              <th class="result-col">Result</th>
            </tr>
          </thead>
          <tbody id="pairings"></tbody>
        </table>
      </div>
      <div class="print-only" style="margin-top: 30px; font-size: 0.8rem; color: #666;">
        Tournament: <span class="print-tournament-name"></span> | Round: <span class="print-round-num"></span>
      </div>
    </div>

  </div>

  <script>
    const STORAGE_KEY = "cps_data_v1";
    let MODE = null, ROUND = 0, MAX_ROUNDS = 5, OPEN = false, FINISHED = false;
    let players = [], pairings = [], history = [];
    let TOURNAMENT = "Tournament";

    /* Persistence */
    function saveData() {
      const data = { players, pairings, history, MODE, ROUND, MAX_ROUNDS, OPEN, FINISHED, TOURNAMENT };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function loadData() {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (!data) return;

      players = data.players;
      pairings = data.pairings;
      history = data.history;
      MODE = data.MODE;
      ROUND = data.ROUND;
      MAX_ROUNDS = data.MAX_ROUNDS || 5;
      OPEN = data.OPEN;
      FINISHED = data.FINISHED || false;
      TOURNAMENT = data.TOURNAMENT;

      // Fix object references in pairings
      pairings.forEach(p => {
        p.a = players.find(x => x.id === p.a.id);
        p.b = players.find(x => x.id === p.b.id);
      });

      // Restore UI
      if (MODE) {
        modeScreen.classList.add("hidden");
        tournamentScreen.classList.remove("hidden");
        title.textContent = `${TOURNAMENT} (${MODE === "swiss" ? "Swiss" : "Round Robin"})`;
      }
      
      if (FINISHED) {
        showFinalStandings();
      } else {
        updateRoundTitle();
        render();
        if (OPEN || ROUND > 0) renderPairings();
      }
    }

    function updateRoundTitle() {
      const displayTitle = `${TOURNAMENT} — Round ${ROUND}`;
      roundTitle.textContent = ROUND > 0 ? `${displayTitle} ${OPEN ? "(In Progress)" : "(Finalized)"}` : "";
      
      document.querySelectorAll(".print-tournament-name").forEach(el => el.textContent = TOURNAMENT);
      document.querySelectorAll(".print-round-num").forEach(el => el.textContent = ROUND);
    }

    function pushHistory() {
      history.push(JSON.stringify({
        players: JSON.parse(JSON.stringify(players)),
        pairings: JSON.parse(JSON.stringify(pairings)),
        ROUND,
        OPEN,
        FINISHED
      }));
      if (history.length > 50) history.shift();
    }

    function undo() {
      if (!history.length) return;
      const h = JSON.parse(history.pop());
      players = h.players;
      pairings = h.pairings;
      ROUND = h.ROUND;
      OPEN = h.OPEN;
      FINISHED = h.FINISHED || false;

      // Restore references
      pairings.forEach(p => {
        p.a = players.find(x => x.id === p.a.id);
        p.b = players.find(x => x.id === p.b.id);
      });

      if (!FINISHED) {
        finalStandingsCard.classList.add("hidden");
        pairingsCard.classList.remove("no-print");
        nextRoundBtn.classList.remove("hidden");
        finalizeBtn.classList.remove("hidden");
      }

      updateRoundTitle();
      recalculateStandings();
      renderPairings();
      saveData();
    }

    function updateResult(i, val) {
      const p = pairings[i];
      p.res = val;

      if (!OPEN) {
        // Editing a finalized round
        const w = p.a, b = p.b;
        const wIdx = w.opp.lastIndexOf(b.id);
        const bIdx = b.opp.lastIndexOf(w.id);

        if (wIdx !== -1 && bIdx !== -1) {
          const scores = { "1-0": [1, 0], "0-1": [0, 1], "0.5": [0.5, 0.5], "": [0, 0] };
          const [wScore, bScore] = scores[val] || [0, 0];
          w.results[wIdx] = wScore;
          b.results[bIdx] = bScore;
          recalculateStandings();
        }
      }
      saveData();
    }

    /* Start */
    function start(m) {
      
      MODE = m;
      TOURNAMENT = tournamentName.value || "Tournament";
      MAX_ROUNDS = parseInt(maxRoundsInput.value) || 5;
      title.textContent = `${TOURNAMENT} (${m === "swiss" ? "Swiss" : "Round Robin"})`;
      modeScreen.classList.add("hidden");
      tournamentScreen.classList.remove("hidden");
      saveData();
    }

    /* Players */
    function addPlayer() {
      
      if (!pName.value.trim()) return;
      if (players.some(p => p.name.toLowerCase() === pName.value.toLowerCase())) return;
      players.push({
        id: crypto.randomUUID(),
        name: pName.value.trim(),
        rating: +pRating.value || 0,
        score: 0,
        opp: [],        // opponent IDs
        results: [],    // 1, 0.5, 0
        bye: false,
        bh: 0, bh1: 0, sb: 0
      });
      pName.value = ""; pRating.value = "";
      render();
      saveData();
    }

    function removePlayer(id) {
      if (ROUND > 0) return alert("Cannot remove after start");
      players = players.filter(p => p.id !== id);
      render();
      saveData();
    }

    function loadFile(e) {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        r.result.split(/\r?\n/).forEach(l => {
          const [n, rating] = l.split(",");
          if (n && !players.some(p => p.name.toLowerCase() === n.toLowerCase())) {
            players.push({
              id: crypto.randomUUID(),
              name: n.trim(),
              rating: +rating || 0,
              score: 0,
              opp: [],
              results: [],
              bye: false,
              bh: 0, bh1: 0, sb: 0
            });
          }
        });
        render();
        saveData();
      };
      r.readAsText(f);
    }
    
    document.getElementById('fileInput').addEventListener('change', loadFile);

    /* Swiss */
    function nextRound() {
      if (MODE !== "swiss") return;
      if (OPEN) return alert("Finalize current round first");
      if (ROUND >= MAX_ROUNDS) return alert("Tournament already reached max rounds!");

      pushHistory();
      ROUND++; OPEN = true; pairings = [];
      updateRoundTitle();

      let pool = [...players].sort((a, b) => b.score - a.score || b.rating - a.rating);
      let bye = null;

      if (pool.length % 2) {
        bye = pool.find(p => !p.bye);
        if (bye) {
          bye.bye = true;
          bye.score++;
          bye.opp.push(null);
          bye.results.push(1);
          pool = pool.filter(p => p !== bye);
        }
      }

      while (pool.length) {
        let a = pool.shift();
        let b = pool.find(x => !a.opp.includes(x.id)) || pool[0];
        pool = pool.filter(x => x !== b);
        pairings.push({ a, b, res: "" });
      }

      renderPairings();
      recalculateStandings();
      saveData();
    }

    function renderPairings() {
      pairingsEl.innerHTML = "";
      let board = 1;

      pairings.forEach((p, i) => {
        const val = p.res;
        pairingsEl.innerHTML += `
        <tr>
          <td>${board++}</td>
          <td>${p.a.name}</td>
          <td>${p.b.name}</td>
          <td class="result-col">
            <select onchange="updateResult(${i}, this.value)">
              <option value="" ${val === "" ? "selected" : ""}>—</option>
              <option value="1-0" ${val === "1-0" ? "selected" : ""}>1-0</option>
              <option value="0-1" ${val === "0-1" ? "selected" : ""}>0-1</option>
              <option value="0.5" ${val === "0.5" ? "selected" : ""}>½–½</option>
            </select>
          </td>
        </tr>`;
      });

      const byePlayer = players.find(p => !pairings.some(m => m.a.id === p.id || m.b.id === p.id) && p.opp.length === ROUND);
      if (byePlayer) {
        pairingsEl.innerHTML += `
        <tr>
          <td>—</td><td>${byePlayer.name}</td><td>BYE</td>
          <td class="result-col">+1</td>
        </tr>`;
      }
    }

    /* Finalize */
    function finalize() {
      if (!OPEN) return;
      if (pairings.some(p => !p.res)) return alert("Missing results");

      pushHistory();

      pairings.forEach(p => {
        const w = p.a, b = p.b;
        w.opp.push(b.id);
        b.opp.push(w.id);

        if (p.res === "1-0") {
          w.results.push(1); b.results.push(0);
        } else if (p.res === "0-1") {
          b.results.push(1); w.results.push(0);
        } else if (p.res === "0.5") {
          w.results.push(0.5); b.results.push(0.5);
        }
      });

      OPEN = false;
      updateRoundTitle();
      recalculateStandings();
      
      if (ROUND >= MAX_ROUNDS) {
        FINISHED = true;
        showFinalStandings();
      }
      
      saveData();
    }

    function showFinalStandings() {
      FINISHED = true;
      finalStandingsCard.classList.remove("hidden");
      pairingsCard.classList.add("no-print"); // Hide pairings from print in final view
      
      // Hide round control buttons
      nextRoundBtn.classList.add("hidden");
      finalizeBtn.classList.add("hidden");

      const sorted = [...players].sort((a, b) =>
        b.score - a.score ||
        b.bh - a.bh ||
        b.sb - a.sb ||
        b.rating - a.rating
      );

      finalStandingsBody.innerHTML = "";
      sorted.forEach((p, i) => {
        finalStandingsBody.innerHTML += `
          <tr>
            <td>${i + 1}</td>
            <td>${p.name}</td>
            <td>${p.rating}</td>
            <td>${p.score}</td>
            <td>${p.bh.toFixed(2)}</td>
            <td>${p.sb.toFixed(2)}</td>
          </tr>
        `;
      });
    }

    /* Recalculate */
    function recalculateStandings() {
      players.forEach(p => {
        p.score = p.results.reduce((a, b) => a + (b || 0), 0);
      });
      calculateTieBreaks();
      render();
    }

    /* Tie-breaks */
    function calculateTieBreaks() {
      players.forEach(p => {
        let oppScores = [], sb = 0;

        p.opp.forEach((oid, i) => {
          const o = players.find(x => x.id === oid);
          const os = o ? o.score : 0;
          oppScores.push(os);
          sb += os * (p.results[i] || 0);
        });

        p.bh = oppScores.reduce((a, b) => a + b, 0);
        p.bh1 = oppScores.length
          ? p.bh - Math.min(...oppScores)
          : 0;
        p.sb = sb;
      });
    }

    /* Render */
    function render() {
      standings.innerHTML = "";
      [...players].sort((a, b) =>
        b.score - a.score ||
        b.bh - a.bh ||
        b.rating - a.rating
      ).forEach((p, i) => {
        standings.innerHTML += `
    <tr>
      <td>${i + 1}</td>
      <td>${p.name}</td>
      <td>${p.rating}</td>
      <td>${p.score}</td>
      <td class="remove-col"><button class="danger" onclick="removePlayer('${p.id}')">🗑</button></td>
    </tr>`;
      });
    }

    /* Print */
    function printCurrent() {
      window.print();
    }

    /* TRF */
    function exportTRF() {
      let trf = `012 ${TOURNAMENT}\n022 Swiss\n062 ${ROUND}\n`;
      players.forEach((p, i) => {
        trf += `001 ${i + 1} ${p.name} ${p.rating}\n`;
      });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([trf], { type: "text/plain" }));
      a.download = TOURNAMENT.replace(/\s+/g, "_") + ".trf";
      a.click();
    }

    /* Reset */
    function resetAll() {
      if (confirm("Are you sure? This will delete all tournament data.")) {
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
      }
    }

    /* DOM */
    const standings = document.getElementById("standings");
    const pairingsEl = document.getElementById("pairings");

    /* Prevent Navigation */
    loadData();
  </script>

</body>

</html>
