  <rect x="4" y="4" width="1" height="1" class="light"/>
  <rect x="5" y="4" width="1" height="1" class="dark"/>
  <rect x="6" y="4" width="1" height="1" class="light"/>
  <rect x="7" y="4" width="1" height="1" class="dark"/>

  <rect x="0" y="5" width="1" height="1" class="dark"/>
  <rect x="1" y="5" width="1" height="1" class="light"/>
