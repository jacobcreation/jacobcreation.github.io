  <rect x="5" y="2" width="1" height="1" class="dark"/>
  <rect x="6" y="2" width="1" height="1" class="light"/>
  <rect x="7" y="2" width="1" height="1" class="dark"/>

  <rect x="0" y="3" width="1" height="1" class="dark"/>
  <rect x="1" y="3" width="1" height="1" class="light"/>
  <rect x="2" y="3" width="1" height="1" class="dark"/>
  <rect x="3" y="3" width="1" height="1" class="light"/>
