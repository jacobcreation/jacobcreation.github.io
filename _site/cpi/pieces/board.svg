      .light { fill: #f0d9b5; }
      .dark  { fill: #b58863; }
      .border { fill: none; stroke: #222; stroke-width: 0.06; }
    </style>
  </defs>

  <!-- 8x8 board -->
  <rect x="0" y="0" width="1" height="1" class="light"/>
  <rect x="1" y="0" width="1" height="1" class="dark"/>
  <rect x="2" y="0" width="1" height="1" class="light"/>
  <rect x="3" y="0" width="1" height="1" class="dark"/>
