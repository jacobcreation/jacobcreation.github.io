<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Puzzles</title>
    <link rel="icon" href="/favicon.png" type="image/png">
    <link href="/fonts/fonts.css" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.55);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --accent: #f43f5e;
            --glass-blur: blur(12px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top, #243449 0%, var(--bg-color) 78%);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .portal-wrapper {
            width: 100%;
            max-width: 520px;
            margin: 40px 0;
        }

        .portal-card {
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 40px 32px;
            box-shadow:
                0 20px 40px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .portal-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .portal-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 8vw, 2.8rem);
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), #a855f7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1px;
            margin-bottom: 10px;
            text-shadow: 0 10px 20px rgba(56, 189, 248, 0.15);
        }

        .portal-header p {
            color: var(--text-muted);
            font-size: 0.98rem;
            line-height: 1.5;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin: 22px 0 28px;
        }

        .stat-badge {
            background: rgba(15, 23, 42, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 12px 10px;
            text-align: center;
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .stat-badge strong {
            display: block;
            font-size: 1.25rem;
            color: var(--primary);
            margin-top: 2px;
        }

        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 52px;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            text-align: center;
        }

        .btn-secondary {
            background: #1e293b;
            color: #4fc3f7;
            border: 2px solid #4fc3f7;
        }

        .btn-accent {
            background: linear-gradient(135deg, var(--accent), #be123c);
            color: #fff;
            border: none;
            box-shadow: 0 10px 20px rgba(244, 63, 94, 0.2);
        }

        .btn:hover,
        .btn:focus {
            transform: translateY(-2px);
            filter: brightness(1.08);
            outline: none;
        }

        .note {
            margin-top: 18px;
            color: var(--text-muted);
            font-size: 0.85rem;
            line-height: 1.5;
            text-align: center;
        }
    </style>
    <!-- Mobile Friendly -->
    <link rel="stylesheet" href="/mobile-friendly.css">
</head>
<body>
    <div class="portal-wrapper">
        <main class="portal-card">
            <div class="portal-header">
                <h1>Chess Puzzles</h1>
                <p>Solve tactical puzzles, build your rating, and chase a new Puzzle Storm best.</p>
            </div>

            <div id="stats-summary" class="stats-grid" aria-label="Local puzzle progress"></div>

            <div class="menu-grid">
                <a href="puzzlenormal/" class="btn btn-secondary">Normal Puzzle</a>
                <a href="storm/" class="btn btn-accent">Puzzle Storm</a>
            </div>

            <p class="note">Progress is saved locally in this browser.</p>
        </main>
    </div>

    <script>(function(){const v=Date.now();document.write('<script src="global-header.js?v='+v+'"><\/script>');})();</script>
    <script>
        function renderStats(stats) {
            document.getElementById('stats-summary').innerHTML = `
                <div class="stat-badge">Elo Rating<strong>${stats.rating}</strong></div>
                <div class="stat-badge">Streak<strong>${stats.streak}</strong>Best: ${stats.bestStreak}</div>
                <div class="stat-badge">Storm PB<strong>${stats.stormPB}</strong>Runs: ${stats.stormPlayed}</div>
            `;
        }

        function localStats() {
            return {
                rating: Number(localStorage.getItem('chessPuzzleRating') || 1500),
                streak: Number(localStorage.getItem('chessPuzzleStreak') || 0),
                bestStreak: Number(localStorage.getItem('chessPuzzleBestStreak') || 0),
                stormPB: Number(localStorage.getItem('chessStormHighScore') || 0),
                stormPlayed: Number(localStorage.getItem('chessStormTotalPlayedCount') || 0),
            };
        }

        async function loadAccountStats() {
            const base = localStats();
            renderStats(base);
            const api = window.JacobAccounts;
            if (!api || !api.isSignedIn || !api.isSignedIn()) return;

            try {
                const remote = await api.getProgress('chesspuzzle');
                if (!remote) return;
                renderStats({
                    rating: Number(remote.rating || base.rating || 1500),
                    streak: Number(remote.streak || base.streak || 0),
                    bestStreak: Math.max(Number(remote.bestStreak || 0), Number(base.bestStreak || 0)),
                    stormPB: Math.max(Number(remote.stormPB || 0), Number(base.stormPB || 0)),
                    stormPlayed: Math.max(Number(remote.stormPlayed || 0), Number(base.stormPlayed || 0)),
                });
            } catch (error) {
                console.warn('Could not load account chess progress', error);
            }
        }

        renderStats(localStats());
        window.addEventListener('jacob-account-change', loadAccountStats);
        setTimeout(loadAccountStats, 400);
    </script>
    <script src="/accounts/account-widget.js" defer data-account-api="https://accounts-system.b4rjxr9lk.workers.dev" data-account-sync="chessPuzzleRating:rating:Puzzle rating:remote|chessPuzzleStreak:streak:Current streak:remote|chessPuzzleBestStreak:best-streak:Best streak:remote|chessStormHighScore:storm-best:Storm best:remote|chessStormTotalPlayedCount:storm-played:Storm games played:remote"></script>
</body>
</html>
