<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Solitaire - JacobCreation</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">
                <span class="logo-badge">J</span>
                <span class="logo-text">JacobCreation</span>
            </div>
            <nav>
                <a href="/">Home</a>
                <a href="#" id="new-game">New Game</a>
                <a href="#" id="undo">Undo</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="game-container">
            <div class="stats-bar">
                <div class="stat"><span>Score: </span><span id="score">0</span></div>
                <div class="stat"><span>Time: </span><span id="timer">00:00</span></div>
                <div class="stat"><span>Moves: </span><span id="moves">0</span></div>
            </div>

            <div class="solitaire-board">
                <div class="top-row">
                    <div class="stock-waste">
                        <div id="stock" class="pile stock"></div>
                        <div id="waste" class="pile waste"></div>
                    </div>
                    <div class="foundations">
                        <div id="foundation-0" class="pile foundation" data-suit="hearts"></div>
                        <div id="foundation-1" class="pile foundation" data-suit="diamonds"></div>
                        <div id="foundation-2" class="pile foundation" data-suit="clubs"></div>
                        <div id="foundation-3" class="pile foundation" data-suit="spades"></div>
                    </div>
                </div>

                <div class="tableau">
                    <div id="tableau-0" class="pile tableau-pile"></div>
                    <div id="tableau-1" class="pile tableau-pile"></div>
                    <div id="tableau-2" class="pile tableau-pile"></div>
                    <div id="tableau-3" class="pile tableau-pile"></div>
                    <div id="tableau-4" class="pile tableau-pile"></div>
                    <div id="tableau-5" class="pile tableau-pile"></div>
                    <div id="tableau-6" class="pile tableau-pile"></div>
                </div>
            </div>
        </div>
    </main>

    <div id="win-modal" class="modal">
        <div class="modal-content">
            <h2>Congratulations!</h2>
            <p>You solved the Solitaire!</p>
            <div class="final-stats">
                <p>Final Score: <span id="final-score">0</span></p>
                <p>Time Taken: <span id="final-time">00:00</span></p>
            </div>
            <button class="btn btn-primary" id="play-again">Play Again</button>
        </div>
    </div>

    <footer>
        © 2026 JacobCreation • Built by Jacob 💙
    </footer>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</body>
</html>
