<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Cache Busting Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
<meta charset="UTF-8">
<title>Neon Snake Arena</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="styles.css">
    <!-- Mobile Friendly -->
    <link rel="stylesheet" href="/mobile-friendly.css">
</head>
<body>

<div id="menu">
    <div class="menu-content">
        <h1>NEON ARENA</h1>
        <p class="subtitle">High-intensity tactical snake combat.</p>
        <div class="input-group">
            <input type="text" id="playerName" placeholder="ENTER YOUR CALLSIGN..." maxlength="12">
        </div>

        <button class="btn-primary" onclick="startGame()">INITIATE COMBAT</button>
    </div>
</div>

<div id="ui-layer">
    <div id="stats" class="glass-panel">
        SCORE: <span id="scoreVal">0</span>
    </div>
    
    <div id="leaderboard" class="glass-panel">
        <h3>Leaderboard</h3>
        <div id="lb-list"></div>
    </div>

    <div id="kill-feed"></div>

    <div id="minimap" class="glass-panel">
        <canvas id="minimap-canvas"></canvas>
    </div>
</div>

<canvas id="game"></canvas>

<script src="app.js"></script>

<script>(()=> {const v=Date.now();document.write('<script src="/global-header.js?v='+v+'"></script>');})();</script>
    <script src="/accounts/account-widget.js" defer data-account-api="https://accounts-system.b4rjxr9lk.workers.dev"></script>
</body>
</html>
