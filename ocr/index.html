<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OCR.space — Text Extraction</title>
<meta name="description" content="Extract text from any image instantly using OCR.space." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="/fonts/fonts.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
    <!-- Mobile Friendly -->
    <link rel="stylesheet" href="/mobile-friendly.css">
</head>
<body>
<div class="wrap">

  <header>
    <div class="badge">OCR.space</div>
    <h1>OCR.space</h1>
    <p class="subtitle">Extract text from any image instantly, with support for orientation and layout detection.</p>
  </header>



  <!-- Upload card -->
  <div class="card">
    <div class="card-title">📎 Upload Image</div>
    <div id="dropZone" role="button" tabindex="0" aria-label="Upload image">
      <svg aria-hidden="true" width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4-4 4 4 4-8 4 8" />
        <rect x="3" y="3" width="18" height="18" rx="3" stroke-width="1.2" />
      </svg>
      <div class="drop-label"><strong>Click to upload</strong> or drag & drop</div>
      <div class="drop-hint">PNG, JPG, WEBP supported</div>
      <img id="previewImg" alt="Preview" />
    </div>
    <div class="preview-actions" id="previewActions">
      <button class="btn btn-ghost" id="clearBtn" type="button">✕ Clear image</button>
    </div>
    <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp" />

    <div class="prompt-row">
      <label class="field-label" for="promptInput">OCR Prompt</label>
      <textarea id="promptInput" spellcheck="false">Extract all visible text from this image in any language or script. Preserve the original language, characters, line breaks, spacing, and reading order as much as possible. Do not translate, summarize, or explain. Return only the extracted text.</textarea>
    </div>

    <div class="run-row">
      <button class="btn btn-primary" id="runBtn" type="button" disabled>
        <svg aria-hidden="true" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 3l14 9-14 9V3z"/>
        </svg>
        Run OCR
      </button>
      <span id="status"></span>
    </div>
  </div>

  <!-- Result card -->
  <div class="card" id="resultCard">
    <div class="result-toolbar">
      <div class="card-title" style="margin-bottom:0">📄 Extracted Text</div>
      <div style="display:flex;gap:10px;align-items:center">
        <span id="charCount"></span>
        <button class="btn btn-ghost" id="copyBtn" type="button">Copy</button>
        <button class="btn btn-ghost" id="downloadBtn" type="button">Download .txt</button>
      </div>
    </div>
    <pre id="resultText"></pre>
  </div>

</div>

<div id="toast">✓ Copied to clipboard!</div>

<script src="app.js"></script>
    <script src="/accounts/account-widget.js" defer data-account-api="https://accounts-system.b4rjxr9lk.workers.dev"></script>
</body>
</html>
