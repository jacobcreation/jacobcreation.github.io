<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nemotron OCR — AI-Powered Text Extraction</title>
<meta name="description" content="Extract text from any image instantly using NVIDIA's Nemotron OCR AI model." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="/fonts/fonts.css" rel="stylesheet">
<style>
  :root {
    --bg: #080c14;
    --surface: #0d1520;
    --surface2: #121d2e;
    --border: rgba(99,179,237,0.12);
    --accent: #63b3ed;
    --accent2: #76e4f7;
    --green: #68d391;
    --red: #fc8181;
    --text: #e2e8f0;
    --muted: #718096;
    --glow: rgba(99,179,237,0.18);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(99,179,237,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(99,179,237,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Radial glow */
  body::after {
    content: '';
    position: fixed;
    top: -20%;
    left: 50%;
    transform: translateX(-50%);
    width: 900px;
    height: 500px;
    background: radial-gradient(ellipse, rgba(99,179,237,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* Header */
  header {
    text-align: center;
    margin-bottom: 52px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(99,179,237,0.1);
    border: 1px solid rgba(99,179,237,0.25);
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 100px;
    margin-bottom: 20px;
  }
  .badge::before { content: '▲'; font-size: 10px; }
  h1 {
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 700;
    background: linear-gradient(135deg, #e2e8f0 30%, var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.15;
    margin-bottom: 14px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 1.05rem;
    max-width: 500px;
    margin: 0 auto;
    line-height: 1.6;
  }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px;
    margin-bottom: 24px;
    transition: border-color 0.3s;
  }
  .card:hover { border-color: rgba(99,179,237,0.22); }

  .card-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Drop zone */
  #dropZone {
    border: 2px dashed rgba(99,179,237,0.25);
    border-radius: 14px;
    min-height: 220px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    cursor: pointer;
    transition: all 0.25s;
    background: rgba(99,179,237,0.02);
    position: relative;
    overflow: hidden;
  }
  #dropZone.drag-over {
    border-color: var(--accent);
    background: rgba(99,179,237,0.07);
    transform: scale(1.01);
  }
  #dropZone.has-image { border-style: solid; border-color: rgba(99,179,237,0.35); }
  #dropZone svg { color: var(--muted); transition: color 0.25s; }
  #dropZone:hover svg { color: var(--accent); }
  .drop-label { color: var(--muted); font-size: 0.95rem; text-align: center; }
  .drop-label strong { color: var(--accent); }
  .drop-hint { font-size: 0.78rem; color: var(--muted); opacity: 0.7; }
  #fileInput { display: none; }

  #previewImg {
    max-width: 100%;
    max-height: 400px;
    border-radius: 10px;
    object-fit: contain;
    display: none;
  }
  #previewImg.visible { display: block; }
  .preview-actions {
    display: none;
    gap: 10px;
    margin-top: 10px;
  }
  .preview-actions.visible { display: flex; }

  /* Prompt row */
  .prompt-row { margin-top: 20px; }
  label.field-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  textarea#promptInput {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    resize: vertical;
    min-height: 68px;
    outline: none;
    transition: border-color 0.2s;
  }
  textarea#promptInput:focus { border-color: var(--accent); }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 22px;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
  }
  .btn-primary {
    background: linear-gradient(135deg, #3182ce, #63b3ed);
    color: #fff;
    box-shadow: 0 0 24px rgba(99,179,237,0.25);
  }
  .btn-primary:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 0 36px rgba(99,179,237,0.4);
  }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-ghost {
    background: rgba(255,255,255,0.05);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { background: rgba(255,255,255,0.09); color: var(--text); }

  .run-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 24px;
    flex-wrap: wrap;
  }

  /* Status */
  #status {
    font-size: 0.85rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #status.error { color: var(--red); }
  #status.success { color: var(--green); }

  /* Spinner */
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.15);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Result */
  #resultCard { display: none; }
  #resultCard.visible { display: block; }

  .result-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 10px;
  }
  #charCount { font-size: 12px; color: var(--muted); }

  #resultText {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    line-height: 1.75;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 480px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  /* Copied toast */
  #toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--green);
    color: #000;
    font-weight: 600;
    font-size: 0.85rem;
    padding: 10px 22px;
    border-radius: 100px;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    z-index: 100;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* API key config */
  .config-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  input[type="text"]#workerUrl {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]#workerUrl:focus { border-color: var(--accent); }

  .section-sep {
    height: 1px;
    background: var(--border);
    margin: 8px 0 24px;
  }

  @media (max-width: 600px) {
    .card { padding: 20px; }
    .run-row { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="badge">NVIDIA NIM</div>
    <h1>Nemotron OCR</h1>
    <p class="subtitle">AI-powered text extraction from any image — powered by NVIDIA's Nemotron OCR v1 vision model.</p>
  </header>



  <!-- Upload card -->
  <div class="card">
    <div class="card-title">📎 Upload Image</div>
    <div id="dropZone" role="button" tabindex="0" aria-label="Upload image">
      <svg width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4-4 4 4 4-8 4 8" />
        <rect x="3" y="3" width="18" height="18" rx="3" stroke-width="1.2" />
      </svg>
      <div class="drop-label"><strong>Click to upload</strong> or drag & drop</div>
      <div class="drop-hint">PNG, JPG, WEBP supported</div>
      <img id="previewImg" alt="Preview" />
    </div>
    <div class="preview-actions" id="previewActions">
      <button class="btn btn-ghost" id="clearBtn">✕ Clear image</button>
    </div>
    <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp" />



    <div class="run-row">
      <button class="btn btn-primary" id="runBtn" disabled>
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 3l14 9-14 9V3z"/>
        </svg>
        Run OCR
      </button>
      <span id="status"></span>
    </div>
  </div>

  <!-- Result card -->
  <div class="card" id="resultCard">
    <div class="result-toolbar">
      <div class="card-title" style="margin-bottom:0">📄 Extracted Text</div>
      <div style="display:flex;gap:10px;align-items:center">
        <span id="charCount"></span>
        <button class="btn btn-ghost" id="copyBtn">Copy</button>
        <button class="btn btn-ghost" id="downloadBtn">Download .txt</button>
      </div>
    </div>
    <pre id="resultText"></pre>
  </div>

</div>

<div id="toast">✓ Copied to clipboard!</div>

<script>
  // Elements
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const previewImg = document.getElementById('previewImg');
  const previewActions = document.getElementById('previewActions');
  const clearBtn = document.getElementById('clearBtn');

  const runBtn = document.getElementById('runBtn');
  const status = document.getElementById('status');
  const resultCard = document.getElementById('resultCard');
  const resultText = document.getElementById('resultText');
  const charCount = document.getElementById('charCount');
  const copyBtn = document.getElementById('copyBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const toast = document.getElementById('toast');

  let imageDataUrl = null;
  const WORKER_URL = 'https://nemotron-ocr-proxy.b4rjxr9lk.workers.dev';

  // Drag & drop
  dropZone.addEventListener('click', () => !imageDataUrl && fileInput.click());
  dropZone.addEventListener('keydown', e => e.key === 'Enter' && !imageDataUrl && fileInput.click());
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) loadFile(file);
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) loadFile(fileInput.files[0]);
  });

  clearBtn.addEventListener('click', () => {
    imageDataUrl = null;
    previewImg.src = '';
    previewImg.classList.remove('visible');
    previewActions.classList.remove('visible');
    dropZone.classList.remove('has-image');
    fileInput.value = '';
    runBtn.disabled = true;
    resultCard.classList.remove('visible');
    setStatus('');
  });

  function loadFile(file) {
    const allowed = ['image/png', 'image/jpeg', 'image/webp'];
    if (!allowed.includes(file.type)) {
      setStatus('Unsupported file type. Use PNG, JPG, or WEBP.', 'error');
      return;
    }
    const reader = new FileReader();
    reader.onload = e => {
      imageDataUrl = e.target.result;
      previewImg.src = imageDataUrl;
      previewImg.classList.add('visible');
      previewActions.classList.add('visible');
      dropZone.classList.add('has-image');
      runBtn.disabled = false;
      setStatus('');
    };
    reader.readAsDataURL(file);
  }

  // Run OCR
  runBtn.addEventListener('click', async () => {
    const workerUrl = WORKER_URL.replace(/\/$/, '');

    if (!imageDataUrl) {
      setStatus('Please upload an image.', 'error');
      return;
    }

    runBtn.disabled = true;
    setStatus('Running OCR…', '', true);
    resultCard.classList.remove('visible');

    try {
      const res = await fetch(`${workerUrl}/ocr`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: imageDataUrl }),
      });

      const data = await res.json();
      if (!res.ok || data.error) {
        throw new Error(data.error || `HTTP ${res.status}`);
      }

      resultText.textContent = data.text;
      charCount.textContent = `${data.text.length.toLocaleString()} chars`;
      resultCard.classList.add('visible');
      resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
      setStatus('Done!', 'success');
    } catch (err) {
      setStatus(err.message, 'error');
    } finally {
      runBtn.disabled = false;
    }
  });

  function setStatus(msg, type = '', spinner = false) {
    status.className = type ? `${type}` : '';
    if (spinner) {
      status.innerHTML = `<span class="spinner"></span>${msg}`;
    } else {
      status.textContent = msg;
    }
  }

  // Copy
  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(resultText.textContent);
      showToast();
    } catch {
      const r = document.createRange();
      r.selectNode(resultText);
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(r);
      document.execCommand('copy');
      showToast();
    }
  });

  // Download
  downloadBtn.addEventListener('click', () => {
    const blob = new Blob([resultText.textContent], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ocr-result.txt';
    a.click();
  });

  function showToast() {
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
  }
</script>
</body>
</html>
