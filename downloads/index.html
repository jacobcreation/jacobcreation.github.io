<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Downloads</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      color: #333;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #0b74de;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      margin: 10px 0;
      padding: 12px;
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      transition: background 0.2s ease;
    }
    li:hover {
      background: #eaf6ff;
    }
    a {
      text-decoration: none;
      color: #0b74de;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>📂 Downloads</h1>
  <ul id="fileList">
    <li>Loading files.json…</li>
  </ul>

  <script>
    fetch('./files.json')
      .then(res => res.json())
      .then(files => {
        const list = document.getElementById('fileList');
        list.innerHTML = '';
        files.forEach(file => {
          const li = document.createElement('li');
          const link = document.createElement('a');
          link.href = file;
          link.textContent = file;
          link.setAttribute('download', ''); // ✅ forces download
          li.appendChild(link);
          list.appendChild(li);
        });
      })
      .catch(err => {
        document.getElementById('fileList').innerHTML =
          "<li style='color:red;'>⚠️ Could not load files.json</li>";
        console.error(err);
      });
  </script>
</body>
</html>
