<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Downloads</title>
  <style>
    body {
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: #f4f6f9;
      color: #333;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #0b74de;
      margin-bottom: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-align: center;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12);
    }

    .card .icon {
      font-size: 40px;
      color: #0b74de;
    }

    .card a {
      text-decoration: none;
      color: #0b74de;
      font-weight: bold;
      display: inline-block;
      margin-top: 10px;
      padding: 8px 14px;
      border: 1px solid #0b74de;
      border-radius: 6px;
      background: #f0f8ff;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .card a:hover {
      background: #0b74de;
      color: #fff;
    }
  </style>
</head>

<body>
  <h1>📂 Downloads</h1>
  <div id="fileGrid" class="grid">
    <p>Loading files.json…</p>
  </div>

  <script>
    fetch('./files.json')
      .then(res => res.json())
      .then(files => {
        const grid = document.getElementById('fileGrid');
        grid.innerHTML = '';
        files.forEach(file => {
          const card = document.createElement('div');
          card.className = 'card';

          // icon
          const icon = document.createElement('div');
          icon.className = 'icon';
          icon.textContent = "📄";

          // link
          const link = document.createElement('a');
          link.href = file;
          link.textContent = file.split("/").pop().replace(".html", ""); // ✅ show only filename, no path, no extension
          link.setAttribute('download', '');

          card.appendChild(icon);
          card.appendChild(link);
          grid.appendChild(card);
        });
      })
      .catch(err => {
        document.getElementById('fileGrid').innerHTML =
          "<p style='color:red;'>⚠️ Could not load files.json</p>";
        console.error(err);
      });
  </script>
  <script src="../global-header.js"></script>
</body>

</html>
