<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Downloads | JacobCreation</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg1: #0b1020;
      --bg2: #0a1633;
      --card: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(255, 255, 255, 0.12);
      --border: rgba(255, 255, 255, 0.14);
      --text: #eaf2ff;
      --muted: rgba(234, 242, 255, 0.75);
      --blue: #4ea1ff;
      --shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Poppins", system-ui, -apple-system, sans-serif;
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(1200px 600px at 20% 10%, rgba(78, 161, 255, 0.30), transparent 55%),
        radial-gradient(900px 600px at 90% 15%, rgba(45, 107, 255, 0.22), transparent 55%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      display: flex;
      flex-direction: column;
    }

    main {
      max-width: 1000px;
      margin: 80px auto 40px;
      padding: 20px;
      width: 100%;
      flex: 1;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 2.5rem;
      background: linear-gradient(135deg, #fff 0%, #4ea1ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 30px rgba(78, 161, 255, 0.3);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100%;
    }

    .card:hover {
      transform: translateY(-5px);
      background: var(--card-hover);
      box-shadow: var(--shadow);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .card .icon {
      font-size: 48px;
      margin-bottom: 15px;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
    }

    .card-title {
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 20px;
      color: var(--text);
    }

    .btn-download {
      text-decoration: none;
      color: #071122;
      background: linear-gradient(135deg, #4ea1ff, #2d6bff);
      font-weight: 700;
      padding: 10px 24px;
      border-radius: 999px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: none;
      cursor: pointer;
    }

    .btn-download:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(78, 161, 255, 0.5);
    }

    #installBtn {
      display: none;
      /* Hidden by default */
    }

    .ios-notice {
      background: rgba(45, 107, 255, 0.15);
      border: 1px solid var(--blue);
      border-radius: var(--radius);
      padding: 15px;
      margin-bottom: 20px;
      text-align: center;
      font-size: 0.95rem;
      display: none;
      /* Shown for iOS users */
    }

    .ios-notice strong {
      color: var(--blue);
    }

    .loading-text {
      text-align: center;
      font-size: 1.2rem;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <main>
    <h1>📂 Offline Downloads</h1>

    <!-- Install button & iOS Notice -->
    <div style="text-align:center; margin-bottom:20px;">
      <button id="installBtn" class="btn-download">
        📲 Install JacobCreation App
      </button>

      <div id="iosNotice" class="ios-notice">
        To install on iPhone: tap <strong>Share</strong> ( <span style="font-size: 1.2em;">⎋</span> ) then <strong>Add
          to Home Screen</strong>.
      </div>
    </div>

    <div id="fileGrid" class="grid">
      <p class="loading-text">Loading available games…</p>
    </div>
  </main>

  <script>
    fetch('/downloads/files.json')
      .then(res => {
        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
        return res.json();
      })
      .then(files => {
        const grid = document.getElementById('fileGrid');
        if (!grid) return;
        grid.innerHTML = '';
        files.forEach(file => {
          const card = document.createElement('div');
          card.className = 'card';

          const filename = file.split("/").pop().replace(".html", "");

          card.innerHTML = `
            <div class="icon">📄</div>
            <div class="card-title">${filename}</div>
            <a href="${file}" class="btn-download" download>
              Download
            </a>
          `;

          grid.appendChild(card);
        });
      })
      .catch(err => {
        const grid = document.getElementById('fileGrid');
        if (grid) {
          grid.innerHTML =
            `<p style='color:#ff6b6b; text-align:center;'>⚠️ Could not load file list.<br><small>${err.message}</small></p>`;
        }
        console.error(err);
      });
  </script>

  <script src="../global-header.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/service-worker.js");
    }

    let deferredPrompt;
    const installBtn = document.getElementById("installBtn");
    const iosNotice = document.getElementById("iosNotice");

    // Check if it's iOS
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches;

    if (isIOS && !isStandalone) {
      if (iosNotice) iosNotice.style.display = "block";
    }

    window.addEventListener("beforeinstallprompt", e => {
      e.preventDefault();
      deferredPrompt = e;
      if (installBtn) installBtn.style.display = "inline-flex";
    });

    if (installBtn) {
      installBtn.addEventListener("click", async () => {
        if (!deferredPrompt) return;

        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log(`User response to the install prompt: ${outcome}`);
        deferredPrompt = null;
        installBtn.style.display = "none";
      });
    }

    // Hide notice if already installed
    window.matchMedia('(display-mode: standalone)').addEventListener('change', (e) => {
      if (e.matches) {
        if (installBtn) installBtn.style.display = "none";
        if (iosNotice) iosNotice.style.display = "none";
      }
    });
  </script>

</body>

</html>
