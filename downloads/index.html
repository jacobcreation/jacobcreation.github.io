<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Cache Busting Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Downloads | JacobCreation</title>

  <!-- Google Fonts -->
  <link href="/fonts/fonts.css" rel="stylesheet">


  <style>
    :root {
      --bg1: #0b1020;
      --bg2: #0a1633;
      --card: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(255, 255, 255, 0.12);
      --panel: rgba(9, 15, 31, 0.72);
      --border: rgba(255, 255, 255, 0.14);
      --text: #eaf2ff;
      --muted: rgba(234, 242, 255, 0.75);
      --blue: #4ea1ff;
      --shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Poppins", system-ui, -apple-system, sans-serif;
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(1200px 600px at 20% 10%, rgba(78, 161, 255, 0.30), transparent 55%),
        radial-gradient(900px 600px at 90% 15%, rgba(45, 107, 255, 0.22), transparent 55%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      display: flex;
      flex-direction: column;
    }

    main {
      max-width: 1120px;
      margin: 64px auto 48px;
      padding: 24px;
      width: 100%;
      flex: 1;
    }

    .shell {
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
      margin-bottom: 32px;
    }

    h1 {
      text-align: center;
      margin: 0;
      font-size: clamp(2.1rem, 4vw, 3.4rem);
      line-height: 1.05;
      background: linear-gradient(135deg, #fff 0%, #4ea1ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 30px rgba(78, 161, 255, 0.3);
    }

    .lede {
      max-width: 640px;
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
    }

    .toolbar {
      display: flex;
      justify-content: center;
      margin-bottom: 28px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      text-align: left;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: space-between;
      gap: 14px;
      height: 100%;
    }

    .card:hover {
      transform: translateY(-5px);
      background: var(--card-hover);
      box-shadow: var(--shadow);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .card .icon {
      font-size: 34px;
      margin-bottom: 0;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .file-pill {
      flex-shrink: 0;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #9eccff;
      background: rgba(78, 161, 255, 0.14);
      border: 1px solid rgba(78, 161, 255, 0.25);
    }

    .card-title {
      font-weight: 600;
      font-size: 1rem;
      line-height: 1.35;
      margin: 0;
      color: var(--text);
    }

    .card-copy {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .btn-download {
      text-decoration: none;
      color: #071122;
      background: linear-gradient(135deg, #4ea1ff, #2d6bff);
      font-weight: 700;
      padding: 10px 16px;
      border-radius: 999px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      cursor: pointer;
      width: 100%;
    }

    .btn-download:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(78, 161, 255, 0.5);
    }

    #installBtn {
      display: none;
      /* Hidden by default */
    }

    .ios-notice {
      background: rgba(45, 107, 255, 0.15);
      border: 1px solid var(--blue);
      border-radius: var(--radius);
      padding: 15px;
      margin-top: 14px;
      text-align: center;
      font-size: 0.95rem;
      display: none;
      /* Shown for iOS users */
    }

    .ios-notice strong {
      color: var(--blue);
    }

    .loading-text {
      grid-column: 1 / -1;
      text-align: center;
      font-size: 1.2rem;
      color: var(--muted);
      padding: 36px 0 20px;
    }

    .alert-notice {
      background: rgba(255, 107, 107, 0.15);
      border: 1px solid #ff6b6b;
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 24px;
      text-align: center;
      font-size: 1rem;
      line-height: 1.5;
      color: #ff9b9b;
    }

    .alert-notice a {
      color: #fff;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .alert-notice a:hover {
      color: var(--blue);
    }

    @media (max-width: 720px) {
      main {
        margin: 28px auto 36px;
        padding: 16px;
      }

      .shell {
        padding: 22px 18px;
        border-radius: 22px;
      }

      .hero {
        margin-bottom: 24px;
      }

      .toolbar {
        margin-bottom: 22px;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="shell">
      <section class="hero">
        <h1>Offline Downloads</h1>
        <p class="lede">A cleaner place to grab the Android builds. Each app is packaged as a standalone APK, so you can install them one by one without digging through a crowded list.</p>
      </section>

      <div class="alert-notice">
        ⚠️ <strong>Note:</strong> All APKs have been moved to our new hosting mirror.<br>
        <a href="https://mega.nz/folder/5m1UAa6A#FzYMatDm60gYB8RmLVnG8g" target="_blank">Browse APKs on Mega.nz</a>
      </div>

      <div id="fileGrid" class="grid">
        <p class="loading-text">Loading available games…</p>
      </div>
    </div>
  </main>

  <script>
    fetch('./files.json')
      .then(res => {
        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
        return res.json();
      })
      .then(files => {
        const grid = document.getElementById('fileGrid');
        if (!grid) return;
        grid.innerHTML = '';
        files.forEach(file => {
          const card = document.createElement('div');
          card.className = 'card';

          const filename = file
            .split("/")
            .pop()
            .replace(/\.(html|apk)$/i, "");
          const isApk = /\.apk$/i.test(file);
          const icon = isApk ? "📱" : "📄";
          const typeLabel = isApk ? "APK" : "HTML";
          const actionLabel = isApk ? "Download APK" : "Download File";
          const blurb = isApk
            ? "Android install package for offline play."
            : "Source file available for download.";

          card.innerHTML = `
            <div class="card-top">
              <div class="icon">${icon}</div>
              <div class="file-pill">${typeLabel}</div>
            </div>
            <div class="card-title">${filename}</div>
            <p class="card-copy">${blurb}</p>
            <a href="${file}" class="btn-download" download>
              ${actionLabel}
            </a>
          `;

          grid.appendChild(card);
        });
      })
      .catch(err => {
        const grid = document.getElementById('fileGrid');
        if (grid) {
          grid.innerHTML =
            `<p style='color:#ff6b6b; text-align:center;'>⚠️ Could not load file list.<br><small>${err.message}</small></p>`;
        }
        console.error(err);
      });
  </script>

  <script>
    const loadOptionalScript = async src => {
      try {
        const res = await fetch(src, { method: "HEAD" });
        if (!res.ok) return false;
      } catch {
        return false;
      }

      return new Promise(resolve => {
        const script = document.createElement("script");
        script.src = src;
        script.onload = () => resolve(true);
        script.onerror = () => resolve(false);
        document.head.appendChild(script);
      });
    };

    loadOptionalScript("../global-header.js");
  </script>

    <script src="/accounts/account-widget.js" defer data-account-api="https://accounts-system.b4rjxr9lk.workers.dev"></script>
</body>

</html>
