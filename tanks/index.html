<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Battle online in Neon Tanks 3D with team scores, coins, shop upgrades, spells, and a fast arcade-style arena.">
  <title>Neon Tanks 3D - Online Multiplayer</title>
  <link rel="stylesheet" href="style.css">
</head>

<body data-project-subtitle="A fast multiplayer tank arena with coins, abilities, team scoring, and neon-styled combat.">
  <div id="ui-layer">
    <div id="scoreboard">
      <div class="team-score red-team">RED: <span id="red-score">0</span></div>
      <div class="team-score blue-team">BLUE: <span id="blue-score">0</span></div>
    </div>
    <div id="health-bar-container">
      <div id="health-bar"></div>
    </div>
    <div id="coins-container">Coins: <span id="coin-count">0</span></div>
    <div id="leaderboard">
      <h3>Leaderboard</h3>
      <div id="leaderboard-list"></div>
    </div>
    <div id="shop-hint">Press [B] to open Shop</div>
    <div id="crosshair">
      <div class="ch-h"></div>
      <div class="ch-v"></div>
      <div class="ch-dot"></div>
    </div>
    <canvas id="minimap" width="180" height="180"></canvas>
  </div>

  <div id="shop-modal" class="hidden">
    <h2>Spell Shop</h2>
    <div class="spell-buttons">
      <button id="buy-dash" class="spell-btn">Dash (50 Coins) [Q]</button>
      <button id="buy-shield" class="spell-btn">Shield (100 Coins) [E]</button>
      <button id="buy-blast" class="spell-btn">Big Blast (150 Coins) [F]</button>
      <button id="buy-teleport" class="spell-btn">Teleport (200 Coins) [R]</button>
    </div>
    <button id="close-shop">Close</button>
  </div>

  <div id="match-status">Connecting to server...</div>

  <div id="death-screen" class="hidden">
    <h1>YOU DIED</h1>
    <div class="death-buttons">
      <button id="respawn-btn">RESPAWN</button>
      <button id="quit-btn">QUIT</button>
    </div>
  </div>

  <div id="mobile-controls" aria-label="Mobile controls">
    <div class="touch-stick" id="drive-stick">
      <div class="touch-stick-base">
        <div class="touch-stick-knob" id="drive-stick-knob"></div>
      </div>
    </div>
    <div class="touch-actions">
      <button class="touch-btn touch-btn--fire" id="fire-btn" type="button">Fire</button>
      <button class="touch-btn" id="dash-btn" type="button">Dash</button>
      <button class="touch-btn" id="shield-btn" type="button">Shield</button>
      <button class="touch-btn" id="blast-btn" type="button">Blast</button>
    </div>
  </div>

  <!-- Game Source -->
  <script type="module" src="game.js?v=3"></script>
</body>

</html>
