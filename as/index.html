<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Lemon Asteroids</title>
<link rel="stylesheet" href="styles.css">
    <!-- Mobile Friendly -->
    <link rel="stylesheet" href="/mobile-friendly.css">
</head>
<body>
<div id="game-container">
  <canvas id="c"></canvas>
  <div id="ui">
    <span id="score">🍋 SCORE: 0</span>
    <span id="lives">❤️ LIVES: 3</span>
    <span id="level">⭐ LEVEL: 1</span>
  </div>
  <div id="game-over">
    <h1>GAME OVER</h1>
    <p>Press ENTER to restart</p>
  </div>
  <div id="mobile-controls">Drag to aim &amp; thrust • Tap 🔫 to shoot</div>
  <div id="shoot-btn">🔫</div>
  <div id="thrust-btn">▲<br>THRUST</div>
</div>
<script src="app.js"></script>
    <script>(function(){const v=Date.now();document.write('<script src="/global-header.js?v='+v+'"><\/script>');})();</script>
    <script src="/accounts/account-widget.js" defer data-account-api="https://accounts-system.b4rjxr9lk.workers.dev"></script>

</html>
