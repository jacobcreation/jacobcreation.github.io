<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appointment Reminder</title>
<style>
  :root {
    --primary: #4CAF50;
    --danger: #e74c3c;
    --bg: #f0f4f8;
    --card-bg: #ffffff;
    --text: #333;
    --radius: 12px;
  }

  body {
    font-family: "Segoe UI", Arial, sans-serif;
    margin: 0; padding: 0;
    background: var(--bg);
    display: flex; flex-direction: column; align-items: center;
  }

  h1 {
    margin: 20px;
    color: var(--primary);
    font-weight: 600;
    text-align: center;
  }

  .btn {
    background: var(--primary);
    color: white;
    padding: 12px 20px;
    border: none;
    border-radius: var(--radius);
    font-size: 16px;
    cursor: pointer;
    margin: 10px;
    width: 90%;
    transition: background 0.3s;
  }
  .btn:hover { background: #43a047; }

  .patient-list {
    width: 95%; max-width: 600px;
    margin-top: 20px;
  }

  .patient {
    background: var(--card-bg);
    padding: 16px;
    margin: 12px 0;
    border-radius: var(--radius);
    box-shadow: 0 4px 8px rgba(0,0,0,0.08);
    transition: transform 0.2s;
  }
  .patient:hover { transform: translateY(-2px); }

  .patient strong {
    color: var(--primary);
    font-size: 18px;
  }

  .countdown {
    color: var(--danger);
    font-weight: bold;
    margin-top: 8px;
    font-size: 16px;
  }

  .remove-btn {
    background: var(--danger);
    color: white;
    padding: 8px 14px;
    border: none;
    border-radius: var(--radius);
    font-size: 14px;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.3s;
  }
  .remove-btn:hover { background: #c0392b; }
</style>
</head>
<body>

<h1>Appointment Reminder</h1>
<button class="btn" onclick="requestNotificationPermission()">🔔 Enable Notifications</button>
<button class="btn" onclick="addAppointment()">➕ Add Appointment</button>

<div class="patient-list" id="patientList"></div>

<script>
let appointmentCounter = 0;
let appointments = [];

function requestNotificationPermission() {
  if ("Notification" in window) {
    Notification.requestPermission().then(permission => {
      if (permission === "granted") {
        alert("✅ Notifications enabled! You’ll get reminders when appointments are due.");
      } else {
        alert("⚠️ Notifications are blocked. Please enable them in site settings.");
      }
    });
  } else {
    alert("Notifications are not supported in this browser.");
  }
}

function addAppointment() {
  const name = prompt("Enter appointment name:");
  if (!name) return;
  const timeInput = prompt("Enter appointment time (HH:MM, 24h format):");
  if (!timeInput) return;

  appointmentCounter++;
  const appointmentId = appointmentCounter;
  const appointmentTime = new Date();
  const [hours, minutes] = timeInput.split(":");
  appointmentTime.setHours(hours, minutes, 0, 0);

  const appointment = { id: appointmentId, name, appointmentTime, interval: null };
  appointments.push(appointment);
  renderAppointments();
  startTimer(appointment);
}

function renderAppointments() {
  const list = document.getElementById("patientList");
  list.innerHTML = "";
  appointments.forEach(a => {
    const div = document.createElement("div");
    div.className = "patient";
    div.id = "appointment-" + a.id;
    div.innerHTML = `
      <strong>Appointment ${a.id}:</strong> ${a.name}<br>
      Time: ${a.appointmentTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
      <div class="countdown" id="countdown-${a.id}">Countdown: calculating...</div>
      <button class="remove-btn" onclick="removeAppointment(${a.id})">🗑 Remove Appointment</button>
    `;
    list.appendChild(div);
  });
}

function startTimer(appointment) {
  const countdownEl = document.getElementById("countdown-" + appointment.id);
  appointment.interval = setInterval(() => {
    const now = new Date();
    const diff = appointment.appointmentTime - now;

    if (diff <= 0) {
      clearInterval(appointment.interval);
      countdownEl.textContent = "Countdown: 00:00";
      notifyUser(appointment);
    } else {
      const minutes = Math.floor(diff / 1000 / 60);
      const seconds = Math.floor((diff / 1000) % 60);
      countdownEl.textContent = `Countdown: ${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
    }
  }, 1000);
}

function notifyUser(appointment) {
  if ("Notification" in window && Notification.permission === "granted") {
    new Notification("⏰ Appointment Reminder", {
      body: `It is time for appointment ${appointment.id}: ${appointment.name}`,
      icon: "https://cdn-icons-png.flaticon.com/512/2966/2966488.png"
    });
  } else {
    alert(`⏰ It is time for appointment ${appointment.id}: ${appointment.name}`);
  }
}

function removeAppointment(id) {
  const appointment = appointments.find(a => a.id === id);
  if (!appointment) return;

  if (confirm("Are you sure you want to remove this appointment?")) {
    clearInterval(appointment.interval);
    appointments = appointments.filter(a => a.id !== id);
    renderAppointments();
  }
}
</script>

</body>
</html>
