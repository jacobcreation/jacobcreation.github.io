<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" href="/favicon.png" type="image/png" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg1: #0b1020;
      --bg2: #0a1633;
      --card: rgba(255, 255, 255, 0.08);
      --card2: rgba(255, 255, 255, 0.12);
      --border: rgba(255, 255, 255, 0.14);
      --text: #eaf2ff;
      --muted: rgba(234, 242, 255, 0.75);
      --blue: #4ea1ff;
      --blue2: #2d6bff;
      --danger: #ff4e4e;
      --shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
      --shadow2: 0 10px 22px rgba(0, 0, 0, 0.28);
      --radius: 18px;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: "Poppins", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(1200px 600px at 20% 10%, rgba(78, 161, 255, 0.15), transparent 55%),
        radial-gradient(900px 600px at 90% 15%, rgba(45, 107, 255, 0.12), transparent 55%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      display: flex;
      flex-direction: column;
    }

    .hidden {
      display: none
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(10px);
      background: rgba(10, 16, 32, 0.65);
      border-bottom: 1px solid rgba(255, 255, 255, 0.10);
      margin-bottom: 20px;
    }

    .header-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: 0.2px;
      font-size: 1.15rem;
      white-space: nowrap;
      text-decoration: none;
    }

    .logo-badge {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, #1e90ff, #ff2d2d);
      box-shadow: 0 10px 24px rgba(30, 144, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.20);
      font-weight: 900;
      color: white;
    }

    .logo-text {
      font-family: "Orbitron", sans-serif;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #1e90ff, #ff2d2d);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 14px rgba(30, 144, 255, 0.35);
    }

    /* Layout */
    .wrapper {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 18px;
      width: 100%;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(12px);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }

    h2,
    h3 {
      margin-top: 0;
      color: var(--text);
    }

    /* Controls */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 10px;
    }

    button,
    input,
    select {
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 15px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    input::placeholder {
      color: rgba(234, 242, 255, 0.4);
    }

    input:focus,
    select:focus {
      border-color: var(--blue);
      background: rgba(255, 255, 255, 0.1);
    }

    button {
      cursor: pointer;
      font-weight: 700;
      background: linear-gradient(135deg, var(--blue), var(--blue2));
      color: #071122;
      border: none;
      box-shadow: 0 4px 15px rgba(45, 107, 255, 0.2);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(45, 107, 255, 0.3);
    }

    button.secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: none;
    }

    button.secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
    }

    button.danger {
      background: linear-gradient(135deg, #ff4e4e, #d32f2f);
      color: white;
      box-shadow: 0 4px 15px rgba(255, 78, 78, 0.2);
    }

    /* Tables */
    .table-wrap {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
      background: rgba(255, 255, 255, 0.02);
    }

    th,
    td {
      padding: 14px;
      text-align: center;
      white-space: nowrap;
    }

    th {
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      font-weight: 600;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    tr:not(:last-child) td {
      border-bottom: 1px solid var(--border)
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.03);
    }

    /* Mobile */
    @media(max-width:720px) {
      .controls {
        flex-direction: column
      }

      button,
      input,
      select {
        width: 100%;
      }
    }

    /* Print */
    @media print {
      body {
        background: #fff;
        color: #000;
      }

      header,
      .controls,
      .card:not(.print-round) {
        display: none
      }

      .card {
        background: #fff;
        border: 1px solid #000;
        box-shadow: none;
        color: #000;
      }

      .result-col {
        display: none
      }

      th,
      td {
        border: 1px solid #000;
        font-size: 14px;
        padding: 8px;
        color: #000;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-container">
      <a href="/" class="logo">
        <span class="logo-badge">J</span>
        <span class="logo-text">JacobCreation</span>
      </a>
    </div>
  </header>

  <!-- MODE SELECT -->
  <div id="modeScreen" class="wrapper">
    <div class="card">
      <h2>Tournament Setup</h2>
      <input id="tournamentName" placeholder="Tournament Name">
      <div class="controls">
        <button onclick="start('swiss')">Swiss</button>
        <button class="secondary" onclick="start('rr')">Round Robin</button>
      </div>
    </div>
  </div>

  <!-- TOURNAMENT -->
  <div id="tournamentScreen" class="wrapper hidden">

    <div class="card">
      <h2 id="title"></h2>
      <div class="controls">
        <input id="pName" placeholder="Player name">
        <input id="pRating" type="number" placeholder="Rating">
        <button onclick="addPlayer()">Add</button>
        <input type="file" id="fileInput" accept=".csv,.txt">
        <button class="secondary" onclick="loadFile()">Upload</button>
        <button onclick="nextRound()">Next Round</button>
        <button class="secondary" onclick="finalize()">Finalize</button>
        <button class="secondary" onclick="undo()">Undo</button>
        <button class="secondary" onclick="printCurrentRound()">🖨 Print Current Round</button>
        <button class="secondary" onclick="exportTRF()">📤 Export Chess-Results (TRF)</button>
        <button class="danger" onclick="resetAll()">Reset</button>
      </div>
    </div>

    <!-- Standings -->
    <div class="card">
      <h3>Standings</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Rating</th>
              <th>Score</th>
              <th>BH</th>
              <th>BH-1</th>
              <th>SB</th>
              <th>Remove</th>
            </tr>
          </thead>
          <tbody id="standings"></tbody>
        </table>
      </div>
    </div>

    <!-- Pairings -->
    <div class="card print-round">
      <h3 id="roundTitle"></h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Board</th>
              <th>White</th>
              <th>Black</th>
              <th class="result-col">Result</th>
            </tr>
          </thead>
          <tbody id="pairings"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const STORAGE_KEY = "cps_data_v1";
    let MODE = null, ROUND = 0, OPEN = false;
    let players = [], pairings = [], history = [];
    let TOURNAMENT = "Tournament";

    /* Persistence */
    function saveData() {
      const data = { players, pairings, history, MODE, ROUND, OPEN, TOURNAMENT };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function loadData() {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (!data) return;

      players = data.players;
      pairings = data.pairings;
      history = data.history;
      MODE = data.MODE;
      ROUND = data.ROUND;
      OPEN = data.OPEN;
      TOURNAMENT = data.TOURNAMENT;

      // Fix object references in pairings
      pairings.forEach(p => {
        p.a = players.find(x => x.id === p.a.id);
        p.b = players.find(x => x.id === p.b.id);
      });

      // Restore UI
      if (MODE) {
        modeScreen.classList.add("hidden");
        tournamentScreen.classList.remove("hidden");
        title.textContent = `${TOURNAMENT} (${MODE === "swiss" ? "Swiss" : "Round Robin"})`;
      }
      if (ROUND > 0) {
        roundTitle.textContent = `${TOURNAMENT} — Round ${ROUND}`;
      }

      render();
      if (OPEN || ROUND > 0) renderPairings();
      if (!OPEN && ROUND > 0) document.querySelectorAll(".result-col select").forEach(s => s.disabled = true);
    }

    function updateResult(i, val) {
      pairings[i].res = val;
      saveData();
    }

    /* Start */
    function start(m) {
      MODE = m;
      TOURNAMENT = tournamentName.value || "Tournament";
      title.textContent = `${TOURNAMENT} (${m === "swiss" ? "Swiss" : "Round Robin"})`;
      modeScreen.classList.add("hidden");
      tournamentScreen.classList.remove("hidden");
      saveData();
    }

    /* Players */
    function addPlayer() {
      if (!pName.value.trim()) return;
      if (players.some(p => p.name.toLowerCase() === pName.value.toLowerCase())) return;
      players.push({
        id: crypto.randomUUID(),
        name: pName.value.trim(),
        rating: +pRating.value || 0,
        score: 0,
        opp: [],        // opponent IDs
        results: [],    // 1, 0.5, 0
        bye: false,
        bh: 0, bh1: 0, sb: 0
      });
      pName.value = ""; pRating.value = "";
      render();
      saveData();
    }

    function removePlayer(id) {
      if (ROUND > 0) return alert("Cannot remove after start");
      players = players.filter(p => p.id !== id);
      render();
      saveData();
    }

    function loadFile() {
      const f = fileInput.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        r.result.split(/\r?\n/).forEach(l => {
          const [n, rating] = l.split(",");
          if (n && !players.some(p => p.name.toLowerCase() === n.toLowerCase())) {
            players.push({
              id: crypto.randomUUID(),
              name: n.trim(),
              rating: +rating || 0,
              score: 0,
              opp: [],
              results: [],
              bye: false,
              bh: 0, bh1: 0, sb: 0
            });
          }
        });
        render();
        saveData();
      };
      r.readAsText(f);
    }

    /* Swiss */
    function nextRound() {
      if (MODE !== "swiss") return;
      if (OPEN) return alert("Finalize current round first");

      history.push(JSON.stringify({ players, ROUND }));
      ROUND++; OPEN = true; pairings = [];
      roundTitle.textContent = `${TOURNAMENT} — Round ${ROUND}`;

      let pool = [...players].sort((a, b) => b.score - a.score || b.rating - a.rating);
      let bye = null;

      if (pool.length % 2) {
        bye = pool.find(p => !p.bye);
        if (bye) {
          bye.bye = true;
          bye.score++;
          bye.opp.push(null);
          bye.results.push(1);
          pool = pool.filter(p => p !== bye);
        }
      }

      while (pool.length) {
        let a = pool.shift();
        let b = pool.find(x => !a.opp.includes(x.id)) || pool[0];
        pool = pool.filter(x => x !== b);
        pairings.push({ a, b, res: "" });
      }

      renderPairings();
      saveData();
    }

    function renderPairings() {
      pairingsEl.innerHTML = "";
      let board = 1;

      pairings.forEach((p, i) => {
        const val = p.res;
        pairingsEl.innerHTML += `
        <tr>
          <td>${board++}</td>
          <td>${p.a.name}</td>
          <td>${p.b.name}</td>
          <td class="result-col">
            <select onchange="updateResult(${i}, this.value)">
              <option value="" ${val === "" ? "selected" : ""}>—</option>
              <option value="1-0" ${val === "1-0" ? "selected" : ""}>1-0</option>
              <option value="0-1" ${val === "0-1" ? "selected" : ""}>0-1</option>
              <option value="0.5" ${val === "0.5" ? "selected" : ""}>½–½</option>
            </select>
          </td>
        </tr>`;
      });

      const byePlayer = players.find(p => !pairings.some(m => m.a.id === p.id || m.b.id === p.id));
      if (byePlayer) {
        pairingsEl.innerHTML += `
        <tr>
          <td>—</td><td>${byePlayer.name}</td><td>BYE</td>
          <td class="result-col">+1</td>
        </tr>`;
      }
    }

    /* Finalize */
    function finalize() {
      if (!OPEN) return;
      if (pairings.some(p => !p.res)) return alert("Missing results");

      pairings.forEach(p => {
        const w = p.a, b = p.b;
        w.opp.push(b.id);
        b.opp.push(w.id);

        if (p.res === "1-0") {
          w.score++; w.results.push(1); b.results.push(0);
        }
        if (p.res === "0-1") {
          b.score++; b.results.push(1); w.results.push(0);
        }
        if (p.res === "0.5") {
          w.score += 0.5; b.score += 0.5;
          w.results.push(0.5); b.results.push(0.5);
        }
      });

      calculateTieBreaks();
      document.querySelectorAll(".result-col select").forEach(s => s.disabled = true);
      OPEN = false;
      render();
      saveData();
    }

    /* Tie-breaks */
    function calculateTieBreaks() {
      players.forEach(p => {
        let oppScores = [], sb = 0;

        p.opp.forEach((oid, i) => {
          const o = players.find(x => x.id === oid);
          const os = o ? o.score : 0;
          oppScores.push(os);
          sb += os * p.results[i];
        });

        p.bh = oppScores.reduce((a, b) => a + b, 0);
        p.bh1 = oppScores.length
          ? p.bh - Math.min(...oppScores)
          : 0;
        p.sb = sb;
      });
    }

    /* Render */
    function render() {
      standings.innerHTML = "";
      [...players].sort((a, b) =>
        b.score - a.score ||
        b.bh - a.bh ||
        b.bh1 - a.bh1 ||
        b.sb - a.sb ||
        b.rating - a.rating
      ).forEach((p, i) => {
        standings.innerHTML += `
    <tr>
      <td>${i + 1}</td>
      <td>${p.name}</td>
      <td>${p.rating}</td>
      <td>${p.score}</td>
      <td>${p.bh.toFixed(2)}</td>
      <td>${p.bh1.toFixed(2)}</td>
      <td>${p.sb.toFixed(2)}</td>
      <td><button class="danger" onclick="removePlayer('${p.id}')">🗑</button></td>
    </tr>`;
      });
    }

    /* Undo */
    function undo() {
      if (!history.length) return;
      const h = JSON.parse(history.pop());
      players = h.players;
      ROUND = h.ROUND;
      OPEN = false;
      calculateTieBreaks();
      render();
      saveData();
    }

    /* Print */
    function printCurrentRound() {
      if (!ROUND) return alert("No round yet");
      window.print();
    }

    /* TRF */
    function exportTRF() {
      let trf = `012 ${TOURNAMENT}\n022 Swiss\n062 ${ROUND}\n`;
      players.forEach((p, i) => {
        trf += `001 ${i + 1} ${p.name} ${p.rating}\n`;
      });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([trf], { type: "text/plain" }));
      a.download = TOURNAMENT.replace(/\s+/g, "_") + ".trf";
      a.click();
    }

    /* Reset */
    function resetAll() {
      if (confirm("Are you sure? This will delete all tournament data.")) {
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
      }
    }

    /* DOM */
    const standings = document.getElementById("standings");
    const pairingsEl = document.getElementById("pairings");

    /* Prevent Navigation */
    loadData();
  </script>

  <script src="../global-header.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.worker.register("/service-worker.js");
    }
  </script>

</body>

</html>
