<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chess Tournament Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
--bg:#0f172a;--panel:#111827;--line:#1f2937;
--ok:#22c55e;--ac:#38bdf8;--bad:#ef4444;
}
body{margin:0;font-family:Arial;background:var(--bg);color:#e5e7eb}
header{background:var(--panel);padding:14px;border-bottom:2px solid var(--line)}
h1{text-align:center;margin:0}
button,input,select{padding:8px;border-radius:8px;border:none}
button{cursor:pointer}
.ok{background:var(--ok);color:#fff}
.ac{background:var(--ac);color:#fff}
.bad{background:var(--bad);color:#fff}
.container{max-width:1100px;margin:auto;padding:12px}
.grid{display:flex;flex-wrap:wrap;gap:8px}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid var(--line);padding:6px;text-align:center}
th{background:#0c1424}
.notice{margin-top:8px;padding:8px;background:#0c1424;border-radius:8px}

/* PRINT STYLE */
@media print{
body{background:#fff;color:#000}
header,.no-print{display:none}
table{page-break-inside:avoid}
th{background:#eee;color:#000}
}
</style>
</head>

<body>

<header class="no-print">
<h1>Chess Tournament Manager</h1>
<div class="grid">
<button class="ac" onclick="setMode('swiss')">Swiss</button>
<button class="ac" onclick="setMode('rr')">Round Robin</button>
<button class="ok" onclick="nextRound()">Next Round</button>
<button class="ac" onclick="finalize()">Finalize</button>
<button class="bad" onclick="undoRound()">Undo</button>
</div>
<div class="notice" id="status">Idle</div>
</header>

<div class="container">

<div class="no-print">
<h3>Players</h3>
<div class="grid">
<input id="name" placeholder="Name">
<input id="rating" type="number" placeholder="Rating">
<button class="ok" onclick="addPlayer()">Add</button>
<input type="file" id="file" accept=".txt,.csv">
<button class="ac" onclick="loadPlayers()">Upload</button>
<button class="bad" onclick="clearAll()">Clear</button>
</div>
</div>

<h3>Standings</h3>
<div class="grid no-print">
<button class="ac" onclick="printStandings()">Print Standings</button>
</div>
<table id="standingsTable">
<thead>
<tr><th>#</th><th>Name</th><th>Score</th><th>Buchholz</th><th>Rating</th></tr>
</thead>
<tbody id="standings"></tbody>
</table>

<h3>Pairings</h3>
<div class="grid no-print">
<button class="ac" onclick="printPairings()">Print Pairings</button>
</div>
<table id="pairingsTable">
<thead>
<tr><th>Rd</th><th>Bd</th><th>White</th><th>Black</th><th>Result</th></tr>
</thead>
<tbody id="pairings"></tbody>
</table>

</div>

<script>
let uid=1,mode=null,history=[];
const S={players:[],round:0,pairings:[],finalized:true};
const norm=n=>n.trim().toLowerCase();

function addPlayer(n=name.value,r=rating.value){
if(!n)return;
if(S.players.some(p=>p.key===norm(n))){alert("Duplicate: "+n);return;}
S.players.push({id:uid++,name:n,key:norm(n),rating:+r||0,score:0,bh:0,opp:[],bye:false});
render();
}

function loadPlayers(){
const f=file.files[0]; if(!f)return;
const r=new FileReader();
r.onload=()=>r.result.split(/\r?\n/).forEach(l=>l.trim()&&addPlayer(l.trim(),0));
r.readAsText(f);
}

function calcBH(){
S.players.forEach(p=>{
p.bh=p.opp.reduce((s,id)=>s+(S.players.find(o=>o.id===id)?.score||0),0);
});
}

function render(){
calcBH();
const tb=standings; tb.innerHTML="";
[...S.players].sort((a,b)=>b.score-a.score||b.bh-a.bh||b.rating-a.rating)
.forEach((p,i)=>tb.innerHTML+=
`<tr><td>${i+1}</td><td>${p.name}</td><td>${p.score}</td><td>${p.bh}</td><td>${p.rating}</td></tr>`);
}

function setMode(m){mode=m;status.textContent="Mode: "+m}

function nextRound(){
if(!S.finalized){alert("Finalize first");return;}
history.push(JSON.stringify(S));
S.round++;S.finalized=false;S.pairings=[];pairings.innerHTML="";
let list=[...S.players].sort((a,b)=>b.score-a.score||b.rating-a.rating);
let used=new Set(),bd=1;

if(list.length%2){
let bye=list.slice().reverse().find(p=>!p.bye);
bye.bye=true;bye.score++;used.add(bye.id);
S.pairings.push({bye});
pairings.innerHTML+=`<tr><td>${S.round}</td><td>—</td><td>${bye.name}</td><td>BYE</td><td>+1</td></tr>`;
}

for(let p of list){
if(used.has(p.id))continue;
let o=list.find(x=>!used.has(x.id)&&!p.opp.includes(x.id)&&x.id!==p.id);
if(!o)continue;
used.add(p.id);used.add(o.id);
S.pairings.push({board:bd,white:p,black:o,result:"pending"});
pairings.innerHTML+=`
<tr><td>${S.round}</td><td>${bd}</td><td>${p.name}</td><td>${o.name}</td>
<td><select onchange="setRes(${bd},this.value)">
<option value="pending">Select</option>
<option value="1-0">1-0</option>
<option value="0-1">0-1</option>
<option value="0.5">½–½</option></select></td></tr>`;
bd++;
}
}

function setRes(b,v){S.pairings.find(p=>p.board===b).result=v}

function finalize(){
for(const p of S.pairings){
if(p.bye)continue;
if(p.result==="pending"){alert("Missing result");return;}
p.white.opp.push(p.black.id);p.black.opp.push(p.white.id);
if(p.result==="1-0")p.white.score++;
if(p.result==="0-1")p.black.score++;
if(p.result==="0.5"){p.white.score+=0.5;p.black.score+=0.5;}
}
S.finalized=true;render();
}

function undoRound(){
if(!history.length)return;
Object.assign(S,JSON.parse(history.pop()));
render();pairings.innerHTML="";
}

/* PRINT FUNCTIONS */
function printStandings(){
document.title="Standings - Round "+S.round;
window.print();
}
function printPairings(){
document.title="Pairings - Round "+S.round;
window.print();
}

function clearAll(){location.reload();}
</script>

</body>
</html>
