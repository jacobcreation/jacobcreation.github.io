<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Chess Pairing System | JacobCreation</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
/* ===== JacobCreation Base Style ===== */
body {
  margin: 0;
  font-family: "Segoe UI", system-ui, sans-serif;
  background: #eef6ff;
  color: #1f2937;
}

/* ===== Header (MATCHES SITE) ===== */
.site-header {
  background: linear-gradient(90deg, #1e7adf, #155fa0);
  color: white;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 20px;
  font-weight: 600;
  box-shadow: 0 4px 12px rgba(0,0,0,.15);
}

.site-header span {
  font-size: 22px;
}

/* ===== Page Wrapper ===== */
.wrapper {
  max-width: 1200px;
  margin: 30px auto;
  padding: 0 16px;
}

/* ===== Card Style ===== */
.card {
  background: white;
  border-radius: 14px;
  padding: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,.08);
  margin-bottom: 24px;
}

/* ===== Buttons ===== */
button, select, input {
  padding: 10px 14px;
  border-radius: 10px;
  border: none;
  font-size: 15px;
}

button {
  cursor: pointer;
  background: #1e7adf;
  color: white;
  font-weight: 500;
}

button.secondary {
  background: #e5eefc;
  color: #1e7adf;
}

button.danger {
  background: #ef4444;
}

/* ===== Tables ===== */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 12px;
}

th, td {
  padding: 10px;
  text-align: center;
}

th {
  background: #f1f5fb;
  font-weight: 600;
}

tr:not(:last-child) td {
  border-bottom: 1px solid #e5e7eb;
}

.round {
  background: #f0f7ff;
  font-weight: 600;
}

/* ===== Inputs Row ===== */
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
</style>
</head>

<body>

<!-- ✅ CORRECT HEADER (NO HERO TEXT HERE) -->
<div class="site-header">
  ⭐ <span>JacobCreation</span>
</div>

<div class="wrapper">

  <!-- Tournament Setup -->
  <div class="card">
    <h2>♟ Chess Pairing System</h2>
    <div class="controls">
      <input placeholder="Tournament Name" />
      <select>
        <option>Swiss</option>
        <option>Round Robin</option>
      </select>
      <button>Start Tournament</button>
    </div>
  </div>

  <!-- Players -->
  <div class="card">
    <h3>Players</h3>
    <div class="controls">
      <input placeholder="Player name" />
      <input type="number" placeholder="Rating" />
      <button>Add</button>
      <input type="file" />
      <button class="secondary">Upload</button>
    </div>
  </div>

  <!-- Standings -->
  <div class="card">
    <h3>Standings</h3>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Rating</th>
          <th>Score</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td><td>Jacob</td><td>1500</td><td>2.0</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pairings -->
  <div class="card">
    <h3>Pairings</h3>
    <table>
      <thead>
        <tr>
          <th>Board</th>
          <th>White</th>
          <th>Black</th>
          <th>Result</th>
        </tr>
      </thead>
      <tbody>
        <tr class="round"><td colspan="4">Round 1</td></tr>
        <tr>
          <td>1</td><td>Alice</td><td>Bob</td>
          <td>
            <select>
              <option>—</option>
              <option>1-0</option>
              <option>0-1</option>
              <option>½-½</option>
            </select>
          </td>
        </tr>
        <tr>
          <td>—</td><td>Jacob</td><td>BYE</td><td>+1</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

</body>
</html>
