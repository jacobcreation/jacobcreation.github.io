<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Chess Tournament System</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root{
  --bg:#020617;
  --panel:#0f172a;
  --panel-2:#111827;
  --border:#1f2937;
  --text:#e5e7eb;
  --muted:#9ca3af;
  --primary:#22c55e;
  --accent:#38bdf8;
  --danger:#ef4444;
}
*{ box-sizing:border-box }
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif;
  background:radial-gradient(1000px 600px at top,#0f172a,#020617);
  color:var(--text);
}
header{
  padding:22px;
  background:#020617;
  border-bottom:1px solid var(--border);
  text-align:center;
}
h1{ margin:0; font-size:26px }
.btn-bar{
  margin-top:12px;
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
}
button{
  padding:8px 12px;
  border-radius:10px;
  border:none;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
}
button:hover{ opacity:0.9 }
.btn-primary{ background:var(--primary); color:#052e16 }
.btn-accent{ background:var(--accent); color:#020617 }
.btn-danger{ background:var(--danger); color:white }

.container{
  max-width:1100px;
  margin:20px auto;
  padding:0 16px;
}
.card{
  background:linear-gradient(180deg,var(--panel),var(--panel-2));
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px;
  margin-bottom:16px;
}
.notice{
  margin-top:10px;
  padding:10px;
  background:#020617;
  border-radius:10px;
  border:1px dashed var(--border);
  font-size:13px;
  color:var(--muted);
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}
th,td{
  border-bottom:1px solid var(--border);
  padding:8px;
}
th{ color:#c7d2fe; text-align:left }
input{
  background:#020617;
  color:var(--text);
  border:1px solid var(--border);
  border-radius:8px;
  padding:7px;
}
.small{
  font-size:12px;
  color:var(--muted);
}
</style>
</head>

<body>

<header>
  <h1>♟ Chess Tournament System</h1>
  <div class="btn-bar">
    <button id="swissBtn" class="btn-primary">Swiss</button>
    <button id="nextRoundBtn" class="btn-primary">Next Round</button>
    <button id="clearPlayersBtn" class="btn-danger">Clear All</button>
  </div>
  <div class="notice" id="status">Ready</div>
</header>

<div class="container">

<div class="card">
  <input id="playerName" placeholder="Player name (AI will set rating)" />
  <button id="addPlayerBtn" class="btn-primary">➕ Add Player</button>
  <div id="warning" class="small"></div>
</div>

<div class="card">
<h2>Standings</h2>
<table>
<thead>
<tr>
  <th>#</th>
  <th>Name</th>
  <th>Rating</th>
  <th>Score</th>
  <th></th>
</tr>
</thead>
<tbody id="playersTbody"></tbody>
</table>
</div>

<div class="card">
<h2>Pairings</h2>
<table>
<thead>
<tr><th>Rnd</th><th>Board</th><th>White</th><th>Black</th></tr>
</thead>
<tbody id="pairingsTbody"></tbody>
</table>
</div>

</div>

<script>
/* =====================
   STATE
===================== */
const state={ players:[], round:0 };
let uid=1;
const playersTbody=document.getElementById("playersTbody");
const pairingsTbody=document.getElementById("pairingsTbody");
const warningEl=document.getElementById("warning");

/* =====================
   RENDER
===================== */
function renderPlayers(){
  const sorted=[...state.players].sort(
    (a,b)=>(b.score-a.score)||(b.rating-a.rating)
  );
  playersTbody.innerHTML="";
  sorted.forEach((p,i)=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${i+1}</td>
      <td>${p.name}</td>
      <td>${p.rating}</td>
      <td>${p.score.toFixed(1)}</td>
      <td>
        <button class="btn-danger" onclick="deletePlayer(${p.id})">🗑</button>
      </td>`;
    playersTbody.appendChild(tr);
  });
}

/* =====================
   DELETE PLAYER
===================== */
function deletePlayer(id){
  if(!confirm("Delete this player?")) return;
  state.players=state.players.filter(p=>p.id!==id);
  renderPlayers();
}

/* =====================
   AI AUTO ADD PLAYER
===================== */
async function addPlayerAI(){
  const name=playerName.value.trim();
  warningEl.textContent="";
  if(!name) return;

  playerName.value="Adding...";
  try{
    const res=await fetch(
      "https://chess-pairing-ai.b4rjxr9lk.workers.dev/lookup?name="+
      encodeURIComponent(name)
    );
    const data=await res.json();

    let rating=0;
    if(data.rating && data.rating<=2850 && data.rating>=800){
      rating=data.rating;
    }else{
      warningEl.textContent="⚠ Rating uncertain, set to 0";
    }

    state.players.push({
      id:uid++,
      name,
      rating,
      score:0
    });

    renderPlayers();
  }catch{
    warningEl.textContent="⚠ AI lookup failed, player added with rating 0";
    state.players.push({
      id:uid++,
      name,
      rating:0,
      score:0
    });
    renderPlayers();
  }

  playerName.value="";
}

/* =====================
   SWISS (simple)
===================== */
function generateSwiss(){
  if(state.players.length<2) return alert("Need at least 2 players");
  pairingsTbody.innerHTML="";
  const sorted=[...state.players].sort(
    (a,b)=>(b.score-a.score)||(b.rating-a.rating)
  );
  let board=1;

  for(let i=0;i<sorted.length;i+=2){
    if(!sorted[i+1]){
      pairingsTbody.innerHTML+=`
        <tr><td>${state.round+1}</td><td>${board++}</td>
        <td>${sorted[i].name}</td><td>(bye)</td></tr>`;
      sorted[i].score+=1;
    }else{
      pairingsTbody.innerHTML+=`
        <tr><td>${state.round+1}</td><td>${board++}</td>
        <td>${sorted[i].name}</td><td>${sorted[i+1].name}</td></tr>`;
    }
  }
  state.round++;
  renderPlayers();
}

/* =====================
   EVENTS
===================== */
addPlayerBtn.onclick=addPlayerAI;
swissBtn.onclick=generateSwiss;
nextRoundBtn.onclick=generateSwiss;
clearPlayersBtn.onclick=()=>location.reload();

renderPlayers();
</script>

</body>
</html>
