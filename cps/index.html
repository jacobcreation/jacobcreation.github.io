<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chess Tournament Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
--bg:#0f172a;--panel:#111827;--line:#1f2937;
--ok:#22c55e;--ac:#38bdf8;--bad:#ef4444;
}
body{margin:0;font-family:Arial;background:var(--bg);color:#e5e7eb}
header{background:var(--panel);padding:14px;border-bottom:2px solid var(--line)}
h1{text-align:center;margin:0}
button,input,select{padding:8px;border-radius:8px;border:none}
button{cursor:pointer}
.ok{background:var(--ok);color:#fff}
.ac{background:var(--ac);color:#fff}
.bad{background:var(--bad);color:#fff}
.container{max-width:1100px;margin:auto;padding:12px}
.grid{display:flex;flex-wrap:wrap;gap:8px}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid var(--line);padding:6px;text-align:center}
th{background:#0c1424}
.notice{margin-top:8px;padding:8px;background:#0c1424;border-radius:8px}

@media print{
body{background:#fff;color:#000}
header,.no-print{display:none}
table{page-break-inside:avoid}
th{background:#eee;color:#000}
}
</style>
</head>

<body>

<header class="no-print">
<h1>Chess Tournament Manager</h1>
<div class="grid">
<button class="ac" onclick="setMode('swiss')">Swiss</button>
<button class="ac" onclick="setMode('rr')">Round Robin</button>
<button class="ok" onclick="nextRound()">Next Round</button>
<button class="ac" onclick="finalize()">Finalize</button>
<button class="bad" onclick="undoRound()">Undo</button>
</div>
<div class="notice" id="status">Idle</div>
</header>

<div class="container">

<div class="no-print">
<h3>Players</h3>
<div class="grid">
<input id="nameInput" placeholder="Name">
<input id="ratingInput" type="number" placeholder="Rating">
<button class="ok" onclick="addPlayer()">Add</button>
<input type="file" id="fileInput" accept=".txt,.csv">
<button class="ac" onclick="loadPlayers()">Upload</button>
<button class="bad" onclick="clearAll()">Clear</button>
</div>
</div>

<h3>Standings</h3>
<div class="grid no-print">
<button class="ac" onclick="printStandings()">Print Standings</button>
</div>
<table>
<thead>
<tr><th>#</th><th>Name</th><th>Score</th><th>Buchholz</th><th>Rating</th></tr>
</thead>
<tbody id="standings"></tbody>
</table>

<h3>Pairings</h3>
<div class="grid no-print">
<button class="ac" onclick="printPairings()">Print Pairings</button>
</div>
<table>
<thead>
<tr><th>Rd</th><th>Bd</th><th>White</th><th>Black</th><th>Result</th></tr>
</thead>
<tbody id="pairings"></tbody>
</table>

</div>

<script>
/* DOM */
const nameInput = document.getElementById("nameInput");
const ratingInput = document.getElementById("ratingInput");
const fileInput = document.getElementById("fileInput");
const standingsBody = document.getElementById("standings");
const pairingsBody = document.getElementById("pairings");
const statusBox = document.getElementById("status");

/* STATE */
let uid = 1;
let mode = null;
let history = [];

const S = {
  players: [],
  round: 0,
  pairings: [],
  finalized: true
};

const norm = n => n.trim().toLowerCase();

/* PLAYERS */
function addPlayer(){
  const n = nameInput.value.trim();
  const r = Number(ratingInput.value) || 0;
  if(!n) return;

  if(S.players.some(p => p.key === norm(n))){
    alert("Duplicate player");
    return;
  }

  S.players.push({
    id: uid++,
    name: n,
    key: norm(n),
    rating: r,
    score: 0,
    bh: 0,
    opp: [],
    bye: false
  });

  nameInput.value = "";
  ratingInput.value = "";
  render();
}

function loadPlayers(){
  const f = fileInput.files[0];
  if(!f) return;

  const reader = new FileReader();
  reader.onload = () => {
    reader.result.split(/\r?\n/).forEach(l=>{
      if(l.trim()) addPlayerFromFile(l.trim());
    });
  };
  reader.readAsText(f);
}

function addPlayerFromFile(name){
  if(S.players.some(p=>p.key===norm(name))) return;
  S.players.push({
    id: uid++,
    name,
    key: norm(name),
    rating: 0,
    score: 0,
    bh: 0,
    opp: [],
    bye: false
  });
  render();
}

/* STANDINGS */
function calcBH(){
  S.players.forEach(p=>{
    p.bh = p.opp.reduce((s,id)=>{
      const o = S.players.find(x=>x.id===id);
      return s + (o ? o.score : 0);
    },0);
  });
}

function render(){
  calcBH();
  standingsBody.innerHTML = "";
  [...S.players]
    .sort((a,b)=>b.score-a.score||b.bh-a.bh||b.rating-a.rating)
    .forEach((p,i)=>{
      standingsBody.innerHTML +=
        `<tr><td>${i+1}</td><td>${p.name}</td><td>${p.score}</td><td>${p.bh}</td><td>${p.rating}</td></tr>`;
    });
}

/* TOURNAMENT */
function setMode(m){
  mode = m;
  statusBox.textContent = "Mode: " + m;
}

function nextRound(){
  if(!S.finalized){ alert("Finalize first"); return; }

  history.push(JSON.stringify(S));
  S.round++;
  S.finalized = false;
  S.pairings = [];
  pairingsBody.innerHTML = "";

  let list = [...S.players].sort((a,b)=>b.score-a.score||b.rating-a.rating);
  let used = new Set();
  let bd = 1;

  if(list.length % 2){
    let bye = [...list].reverse().find(p=>!p.bye);
    bye.bye = true;
    bye.score++;
    used.add(bye.id);
    pairingsBody.innerHTML +=
      `<tr><td>${S.round}</td><td>—</td><td>${bye.name}</td><td>BYE</td><td>+1</td></tr>`;
  }

  for(let p of list){
    if(used.has(p.id)) continue;
    let o = list.find(x=>!used.has(x.id)&&!p.opp.includes(x.id)&&x.id!==p.id);
    if(!o) continue;

    used.add(p.id); used.add(o.id);
    S.pairings.push({board:bd,white:p,black:o,result:"pending"});

    pairingsBody.innerHTML +=
      `<tr><td>${S.round}</td><td>${bd}</td><td>${p.name}</td><td>${o.name}</td>
      <td>
      <select onchange="setRes(${bd},this.value)">
        <option value="pending">Select</option>
        <option value="1-0">1-0</option>
        <option value="0-1">0-1</option>
        <option value="0.5">½–½</option>
      </select>
      </td></tr>`;
    bd++;
  }
}

function setRes(b,v){
  const p = S.pairings.find(x=>x.board===b);
  if(p) p.result = v;
}

function finalize(){
  for(const p of S.pairings){
    if(p.result==="pending"){ alert("Missing result"); return; }
    p.white.opp.push(p.black.id);
    p.black.opp.push(p.white.id);
    if(p.result==="1-0") p.white.score++;
    if(p.result==="0-1") p.black.score++;
    if(p.result==="0.5"){ p.white.score+=0.5; p.black.score+=0.5; }
  }
  S.finalized = true;
  render();
}

function undoRound(){
  if(!history.length) return;
  Object.assign(S, JSON.parse(history.pop()));
  render();
  pairingsBody.innerHTML = "";
}

/* PRINT */
function printStandings(){
  document.title = "Standings - Round " + S.round;
  window.print();
}
function printPairings(){
  document.title = "Pairings - Round " + S.round;
  window.print();
}

function clearAll(){
  location.reload();
}
</script>

</body>
</html>
