<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chess Pairing System | JacobCreation</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Segoe UI,system-ui,sans-serif;
  background:#eef6ff;
  color:#1f2937;
}
.hidden{display:none}

/* Header */
.site-header{
  background:#1e73c9;
  color:#fff;
  padding:14px 22px;
  font-size:20px;
  font-weight:600;
}

/* Layout */
.wrapper{max-width:1200px;margin:20px auto;padding:0 14px}
.card{
  background:#fff;
  border-radius:16px;
  padding:18px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
  margin-bottom:22px;
}

/* Controls */
.controls{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}
button,input,select{
  padding:10px 14px;
  border-radius:10px;
  border:none;
  font-size:15px;
}
button{
  cursor:pointer;
  background:#1e73c9;
  color:#fff;
}
button.secondary{
  background:#e6f0ff;
  color:#1e73c9;
}
button.danger{
  background:#ef4444;
}

/* Tables */
.table-wrap{overflow-x:auto}
table{
  width:100%;
  border-collapse:collapse;
  min-width:650px;
}
th,td{
  padding:10px;
  text-align:center;
  white-space:nowrap;
}
th{
  background:#f2f6fb;
}
tr:not(:last-child) td{
  border-bottom:1px solid #e5e7eb;
}
.round{
  background:#eef5ff;
  font-weight:600;
}

/* Mobile */
@media(max-width:720px){
  .controls{flex-direction:column}
  button,input,select{width:100%;font-size:16px}
}

/* Print (Swiss Manager style) */
@media print{
  body{background:#fff}
  .site-header,.controls,.card:not(.print-round){display:none}
  .result-col{display:none}
  th,td{
    border:1px solid #000;
    font-size:14px;
    padding:8px;
  }
}
</style>
</head>

<body>

<div class="site-header">⭐ JacobCreation</div>

<!-- MODE SELECT -->
<div id="modeScreen" class="wrapper">
  <div class="card">
    <h2>Tournament Setup</h2>
    <input id="tournamentName" placeholder="Tournament Name">
    <div class="controls">
      <button onclick="start('swiss')">Swiss</button>
      <button class="secondary" onclick="start('rr')">Round Robin</button>
    </div>
  </div>
</div>

<!-- TOURNAMENT -->
<div id="tournamentScreen" class="wrapper hidden">

  <div class="card">
    <h2 id="title"></h2>
    <div class="controls">
      <input id="pName" placeholder="Player name">
      <input id="pRating" type="number" placeholder="Rating">
      <button onclick="addPlayer()">Add</button>

      <input type="file" id="fileInput" accept=".csv,.txt">
      <button class="secondary" onclick="loadFile()">Upload</button>

      <button onclick="nextRound()">Next Round</button>
      <button class="secondary" onclick="finalize()">Finalize</button>
      <button class="secondary" onclick="undo()">Undo</button>
      <button class="secondary" onclick="printCurrentRound()">🖨 Print Current Round</button>
      <button class="danger" onclick="resetAll()">Reset</button>
    </div>
  </div>

  <!-- Standings -->
  <div class="card">
    <h3>Standings</h3>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th><th>Name</th><th>Rating</th><th>Score</th><th>Remove</th>
          </tr>
        </thead>
        <tbody id="standings"></tbody>
      </table>
    </div>
  </div>

  <!-- Pairings -->
  <div class="card print-round">
    <h3 id="roundTitle"></h3>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Board</th><th>White</th><th>Black</th>
            <th class="result-col">Result</th>
          </tr>
        </thead>
        <tbody id="pairings"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
let MODE=null, ROUND=0, OPEN=false;
let players=[], pairings=[], history=[];
let TOURNAMENT="Tournament";

/* Start */
function start(m){
  MODE=m;
  TOURNAMENT=tournamentName.value||"Tournament";
  title.textContent=`${TOURNAMENT} (${m==="swiss"?"Swiss":"Round Robin"})`;
  modeScreen.classList.add("hidden");
  tournamentScreen.classList.remove("hidden");
}

/* Players */
function addPlayer(){
  if(!pName.value.trim()) return;
  if(players.some(p=>p.name.toLowerCase()===pName.value.toLowerCase())) return;
  players.push({
    id:crypto.randomUUID(),
    name:pName.value,
    rating:+pRating.value||0,
    score:0,
    opp:[],
    bye:false
  });
  pName.value="";pRating.value="";
  render();
}

function removePlayer(id){
  if(ROUND>0) return alert("Cannot remove after start");
  players=players.filter(p=>p.id!==id);
  render();
}

function loadFile(){
  const f=fileInput.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    r.result.split(/\r?\n/).forEach(l=>{
      const [n,rt]=l.split(",");
      if(n && !players.some(p=>p.name.toLowerCase()===n.toLowerCase())){
        players.push({
          id:crypto.randomUUID(),
          name:n.trim(),
          rating:+rt||0,
          score:0,
          opp:[],
          bye:false
        });
      }
    });
    render();
  };
  r.readAsText(f);
}

/* Render */
function render(){
  standings.innerHTML="";
  [...players].sort((a,b)=>b.score-a.score||b.rating-a.rating)
  .forEach((p,i)=>{
    standings.innerHTML+=`
    <tr>
      <td>${i+1}</td>
      <td>${p.name}</td>
      <td>${p.rating}</td>
      <td>${p.score}</td>
      <td><button class="danger" onclick="removePlayer('${p.id}')">🗑</button></td>
    </tr>`;
  });
}

/* Swiss */
function nextRound(){
  if(MODE!=="swiss") return;
  if(OPEN) return alert("Finalize current round first");

  history.push(JSON.stringify({players,ROUND}));
  ROUND++; OPEN=true; pairings=[];
  pairingsEl.innerHTML="";
  roundTitle.textContent=`${TOURNAMENT} — Round ${ROUND}`;

  let pool=[...players].sort((a,b)=>b.score-a.score||b.rating-a.rating);
  let bye=null;

  if(pool.length%2){
    bye=pool.find(p=>!p.bye);
    if(bye){
      bye.bye=true;
      bye.score++;
      pool=pool.filter(p=>p!==bye);
    }
  }

  let board=1;
  while(pool.length){
    let a=pool.shift();
    let b=pool.find(x=>!a.opp.includes(x.id))||pool[0];
    if(!b){ break; }
    pool=pool.filter(x=>x!==b);

    pairings.push({a,b,res:""});
    pairingsEl.innerHTML+=`
    <tr>
      <td>${board}</td>
      <td>${a.name}</td>
      <td>${b.name}</td>
      <td class="result-col">
        <select onchange="pairings[${pairings.length-1}].res=this.value">
          <option value="">—</option>
          <option value="1-0">1-0</option>
          <option value="0-1">0-1</option>
          <option value="0.5">½–½</option>
        </select>
      </td>
    </tr>`;
    board++;
  }

  if(bye){
    pairingsEl.innerHTML+=`
    <tr>
      <td>—</td>
      <td>${bye.name}</td>
      <td>BYE</td>
      <td class="result-col">+1</td>
    </tr>`;
  }
}

/* Finalize */
function finalize(){
  if(!OPEN) return;
  if(pairings.some(p=>!p.res)) return alert("Missing results");

  pairings.forEach(p=>{
    p.a.opp.push(p.b.id);
    p.b.opp.push(p.a.id);
    if(p.res==="1-0") p.a.score++;
    if(p.res==="0-1") p.b.score++;
    if(p.res==="0.5"){ p.a.score+=0.5; p.b.score+=0.5; }
  });

  document.querySelectorAll(".result-col select").forEach(s=>s.disabled=true);
  OPEN=false;
  render();
}

/* Undo */
function undo(){
  if(!history.length) return;
  const h=JSON.parse(history.pop());
  players=h.players;
  ROUND=h.ROUND;
  OPEN=false;
  render();

  // Rebuild current round UI if it existed
  pairingsEl.innerHTML="";
  roundTitle.textContent=ROUND ? `${TOURNAMENT} — Round ${ROUND}` : "";
}

/* Print */
function printCurrentRound(){
  if(!ROUND) return alert("No round yet");
  window.print();
}

/* Reset */
function resetAll(){
  if(confirm("Are you sure you want to reset the tournament? This will remove all players and pairings.")){
    location.reload();
  }
}

/* DOM */
const standings=document.getElementById("standings");
const pairingsEl=document.getElementById("pairings");
const modeScreen=document.getElementById("modeScreen");
const tournamentScreen=document.getElementById("tournamentScreen");
const roundTitle=document.getElementById("roundTitle");
const title=document.getElementById("title");
const pName=document.getElementById("pName");
const pRating=document.getElementById("pRating");
const fileInput=document.getElementById("fileInput");
</script>

</body>
</html>
