<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chess Tournament System</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#e5e7eb}
header{padding:20px;background:#111827;text-align:center;border-bottom:2px solid #1f2937}
button{padding:10px 16px;border-radius:10px;border:none;cursor:pointer}
.btn-primary{background:#22c55e;color:#fff}
.btn-accent{background:#38bdf8;color:#fff}
.btn-danger{background:#ef4444;color:#fff}
.container{max-width:1000px;margin:20px auto;padding:0 16px}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{border:1px solid #1f2937;padding:8px}
th{background:#0c1424}
.notice{margin-top:10px;padding:10px;background:#0c1424;border-radius:8px}
.btn-bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
</style>
</head>

<body>

<header>
<h1>Chess Tournament System</h1>
<div class="btn-bar">
<button id="swissBtn" class="btn-primary">Swiss Mode</button>
<button id="nextBtn" class="btn-primary">Next Swiss Round</button>
<button id="finalizeBtn" class="btn-accent">Finalize Round</button>
</div>
<div class="notice" id="status">Idle</div>
</header>

<div class="container">

<input id="playerName" placeholder="Player name">
<input id="playerRating" type="number" placeholder="Rating">
<button id="addBtn" class="btn-primary">Add Player</button>
<button id="clearBtn" class="btn-danger">Clear</button>

<h2>Standings</h2>
<table>
<thead><tr><th>#</th><th>Name</th><th>Rating</th><th>Score</th></tr></thead>
<tbody id="playersTbody"></tbody>
</table>

<h2>Pairings</h2>
<table>
<thead><tr><th>Round</th><th>Board</th><th>White</th><th>Black</th><th>Result</th></tr></thead>
<tbody id="pairingsTbody"></tbody>
</table>

</div>

<script>
let nextId=1;
let mode=null;

const state={
players:[],
round:0,
pairings:[],
roundOpen:false
};

const playersTbody=document.getElementById("playersTbody");
const pairingsTbody=document.getElementById("pairingsTbody");
const statusEl=document.getElementById("status");

/* ---------- PLAYERS ---------- */
function addPlayer(name,rating){
state.players.push({
id:nextId++,
name,
rating:+rating||0,
score:0,
opponents:[]
});
renderPlayers();
}

function renderPlayers(){
playersTbody.innerHTML="";
[...state.players]
.sort((a,b)=>b.score-a.score||b.rating-a.rating)
.forEach((p,i)=>{
playersTbody.innerHTML+=
`<tr><td>${i+1}</td><td>${p.name}</td><td>${p.rating}</td><td>${p.score}</td></tr>`;
});
}

/* ---------- SWISS ---------- */
function nextSwissRound(){
if(state.roundOpen) return alert("Finalize current round first");

state.round++;
state.roundOpen=true;
state.pairings=[];
pairingsTbody.innerHTML="";

let pool=[...state.players].sort((a,b)=>b.score-a.score||b.rating-a.rating);
let used=new Set();
let board=1;

// BYE
if(pool.length%2){
const bye=pool.find(p=>!p.hadBye);
bye.hadBye=true;
bye.score+=1;
pairingsTbody.innerHTML+=
`<tr><td>${state.round}</td><td>—</td><td>${bye.name}</td><td>BYE</td><td>+1</td></tr>`;
used.add(bye.id);
}

// PAIRING
for(let i=0;i<pool.length;i++){
const p=pool[i];
if(used.has(p.id)) continue;

let o=pool.find(x=>!used.has(x.id)&&x.id!==p.id&&!p.opponents.includes(x.id));
if(!o){
o=pool.find(x=>!used.has(x.id)&&x.id!==p.id);
}
if(!o) continue;

used.add(p.id);
used.add(o.id);

const pairing={
id:crypto.randomUUID(),
round:state.round,
board,
white:p,
black:o,
result:null,
scored:false
};

state.pairings.push(pairing);

pairingsTbody.innerHTML+=
`<tr>
<td>${state.round}</td>
<td>${board}</td>
<td>${p.name}</td>
<td>${o.name}</td>
<td>
<select data-id="${pairing.id}">
<option value="">Select</option>
<option value="1-0">1-0</option>
<option value="0-1">0-1</option>
<option value="0.5">½–½</option>
</select>
</td>
</tr>`;

board++;
}

// RESULT HANDLERS
document.querySelectorAll("select[data-id]").forEach(sel=>{
sel.onchange=()=>{
const id=sel.dataset.id;
const pairing=state.pairings.find(p=>p.id===id);
if(pairing) pairing.result=sel.value;
};
});

statusEl.textContent=`Swiss Round ${state.round}`;
}

/* ---------- FINALIZE ---------- */
function finalizeSwiss(){
if(!state.roundOpen) return;

for(const p of state.pairings){
if(!p.result) return alert("Missing result");
if(p.scored) continue;

p.scored=true;
p.white.opponents.push(p.black.id);
p.black.opponents.push(p.white.id);

if(p.result==="1-0") p.white.score+=1;
if(p.result==="0-1") p.black.score+=1;
if(p.result==="0.5"){
p.white.score+=0.5;
p.black.score+=0.5;
}
}

state.roundOpen=false;
renderPlayers();
statusEl.textContent="Round finalized";
}

/* ---------- UI ---------- */
addBtn.onclick=()=>{
const n=playerName.value.trim();
if(n) addPlayer(n,playerRating.value);
playerName.value="";
playerRating.value="";
};

clearBtn.onclick=()=>{
state.players=[];
state.round=0;
state.roundOpen=false;
state.pairings=[];
pairingsTbody.innerHTML="";
renderPlayers();
statusEl.textContent="Cleared";
};

swissBtn.onclick=()=>{
mode="swiss";
state.round=0;
state.roundOpen=false;
state.pairings=[];
pairingsTbody.innerHTML="";
statusEl.textContent="Swiss mode ready";
};

nextBtn.onclick=()=>{
if(mode!=="swiss") alert("Swiss mode only");
else nextSwissRound();
};

finalizeBtn.onclick=()=>{
if(mode!=="swiss") alert("Swiss mode only");
else finalizeSwiss();
};
</script>

</body>
</html>
