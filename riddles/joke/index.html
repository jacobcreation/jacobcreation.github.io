<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Cache Busting Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Try Not To Laugh Challenge - JacobCreation</title>

  <link rel="icon" href="/favicon.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

  <style>
    /* Design Tokens */
    :root {
      --bg1: #1a0614;
      --bg2: #0d061f;
      --card: rgba(255, 255, 255, 0.08);
      --card2: rgba(255, 255, 255, 0.12);
      --border: rgba(255, 255, 255, 0.14);
      --text: #eaf2ff;
      --muted: rgba(234, 242, 255, 0.65);
      --purple: #ce4eff;
      --red: #ff4c4c;
      --green: #4ade80;
      --yellow: #ffd700;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(1200px 600px at 80% 90%, rgba(206, 78, 255, 0.12), transparent 50%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 25px;
      align-items: center;
    }

    .header {
      text-align: center;
      margin-bottom: 10px;
    }

    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      letter-spacing: 2px;
      background: linear-gradient(to right, var(--purple), #ff4e50);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      font-weight: 800;
    }

    /* Stats Row */
    .stats-bar {
      display: flex;
      width: 100%;
      justify-content: space-between;
      gap: 15px;
    }

    .stat-box {
      background: var(--card);
      padding: 10px 20px;
      border-radius: 99px;
      border: 1px solid var(--border);
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .combo-pill {
      color: var(--yellow);
      display: none;
      animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes pop {
      0% { transform: scale(0.5); }
      100% { transform: scale(1); }
    }

    /* Battle Arena */
    .arena {
      display: flex;
      justify-content: space-between;
      width: 100%;
      gap: 20px;
    }

    .fighter {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: var(--card);
      padding: 20px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      position: relative;
      transition: 0.3s;
    }

    .fighter.active {
      border-color: var(--purple);
      box-shadow: 0 0 20px rgba(206, 78, 255, 0.2);
    }

    .avatar {
      font-size: 3.5rem;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2));
      transition: transform 0.2s;
    }

    .health-track {
      width: 100%;
      height: 14px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .health-fill {
      height: 100%;
      background: linear-gradient(to right, #4ade80, #22c55e);
      width: 100%;
      transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .health-fill.low {
      background: linear-gradient(to right, #ff4c4c, #ef4444);
    }

    .name {
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 1px;
    }

    /* Joke Card */
    .card {
      width: 100%;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 25px;
      text-align: center;
      min-height: 300px;
      position: relative;
    }

    .setup {
      font-size: 1.5rem;
      font-weight: 600;
      line-height: 1.4;
      color: var(--text);
    }

    .punchline {
      font-size: 2rem;
      font-weight: 800;
      color: var(--yellow);
      opacity: 0;
      transform: scale(0.9);
      transition: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .punchline.visible {
      opacity: 1;
      transform: scale(1);
    }

    /* Difficulty Selector */
    .diff-selector {
      display: flex;
      gap: 10px;
      background: rgba(0,0,0,0.3);
      padding: 5px;
      border-radius: 99px;
      border: 1px solid var(--border);
    }

    .diff-btn {
      padding: 6px 15px;
      border-radius: 99px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 700;
      transition: 0.2s;
    }

    .diff-btn.selected {
      background: var(--purple);
      color: white;
    }

    /* Mic Meter */
    .mic-status {
      display: flex;
      gap: 12px;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      padding: 10px 20px;
      border-radius: 99px;
      border: 1px solid var(--border);
    }

    .mic-dot {
      width: 14px;
      height: 14px;
      background: #444;
      border-radius: 50%;
      transition: 0.3s;
    }

    .mic-dot.active {
      background: #ff4e50;
      box-shadow: 0 0 15px #ff4e50;
      animation: pulse-red 1s infinite;
    }

    .volume-meter {
      width: 120px;
      height: 8px;
      background: rgba(255,255,255,0.05);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .volume-fill {
      height: 100%;
      width: 0%;
      background: var(--green);
      transition: width 0.1s, background 0.2s;
    }

    @keyframes pulse-red {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    .btn {
      border: none;
      padding: 16px 40px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
      font-size: 1.1rem;
      background: linear-gradient(135deg, var(--purple), #ff4e50);
      color: white;
      box-shadow: 0 8px 25px rgba(206, 78, 255, 0.3);
      transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(206, 78, 255, 0.4);
    }

    .btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      filter: grayscale(1);
    }

    .shake {
      animation: shake 0.6s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: 0.6s cubic-bezier(0.23, 1, 0.32, 1);
      backdrop-filter: blur(10px);
    }

    .overlay.visible {
      opacity: 1;
      pointer-events: all;
    }

    .overlay h1 {
      font-family: 'Orbitron';
      font-size: 3.5rem;
      margin-bottom: 10px;
      text-align: center;
      padding: 0 20px;
    }

    #taunt-text {
      color: var(--muted);
      font-style: italic;
      margin-bottom: 30px;
      max-width: 400px;
      text-align: center;
    }
  </style>
</head>

<body>

  <script>(function(){const v=Date.now();document.write('<script src="/global-header.js?v='+v+'"><\/script>');})();</script>
  <div class="container">
    <div class="header">
      <div class="title">Don't Laugh 🤫</div>
      <div style="font-size: 0.8rem; color: var(--muted); margin-top: 5px;">TRY NOT TO CRACK UP CHALLENGE</div>
    </div>

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-box">
        <span style="opacity:0.6">SCORE:</span>
        <span id="score-val">0</span>
      </div>
      <div class="stat-box combo-pill" id="combo-pill">
        🔥 <span id="combo-val">0</span> COMBO
      </div>
      <div class="diff-selector">
        <button class="diff-btn" data-val="25">EASY</button>
        <button class="diff-btn selected" data-val="15">NORMAL</button>
        <button class="diff-btn" data-val="8">HARD</button>
      </div>
    </div>

    <!-- Battle Arena -->
    <div class="arena">
      <div class="fighter" id="p-fighter">
        <div class="name">PLAYER</div>
        <div class="avatar" id="p-avatar">😐</div>
        <div class="health-track">
          <div class="health-fill" id="p-health"></div>
        </div>
      </div>
      <div style="display:flex; flex-direction:column; justify-content:center; opacity:0.3; font-weight:900; font-family:'Orbitron';">VS</div>
      <div class="fighter" id="e-fighter">
        <div class="name">COMEDY BOT</div>
        <div class="avatar" id="e-avatar">🤡</div>
        <div class="health-track">
          <div class="health-fill" id="e-health"></div>
        </div>
      </div>
    </div>

    <!-- Mic -->
    <div class="mic-status" id="mic-ui">
      <div class="mic-dot" id="mic-dot"></div>
      <div style="font-size:0.75rem; font-weight:700; letter-spacing:1px;">MIC FEED</div>
      <div class="volume-meter">
        <div class="volume-fill" id="vol-fill"></div>
      </div>
    </div>

    <!-- Joke Card -->
    <div class="card">
      <div id="status-text" style="color:var(--muted); font-size:0.85rem; position:absolute; top:20px;">Ready to battle?</div>
      <div class="setup" id="setup">The ultimate battle of willpower...</div>
      <div class="punchline" id="punchline">Can you stay stone-faced?</div>
    </div>

    <button class="btn" id="start-btn">🎙️ Initialize & Start</button>
    <div id="game-controls" style="display:none; width:100%; justify-content:center;">
      <button class="btn" id="next-btn">Next Joke ➡️</button>
    </div>

  </div>

  <!-- Game Over Screen -->
  <div class="overlay" id="overlay">
    <h1 id="end-title">YOU LAUGHED!</h1>
    <p id="taunt-text">"Was it that funny? I didn't even try."</p>
    <div class="stat-box" style="margin-bottom: 30px;">
      FINAL SCORE: <span id="final-score" style="margin-left:10px; color:var(--yellow)">0</span>
    </div>
    <button class="btn" onclick="location.reload()">Re-Enter Arena</button>
  </div>

  <script>(function(){const v=Date.now();document.write('<script src="lold.js?v='+v+'"><\/script>');})();</script>
  <script>
    const WORKER_URL = "https://jokeai.b4rjxr9lk.workers.dev/";

    // --- Audio Synthesis ---
    const AudioEngine = {
      ctx: null,
      init() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      },
      play(freq, type = 'sine', duration = 0.1, vol = 0.1) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
      },
      hit() { this.play(150, 'square', 0.2, 0.15); },
      win() { this.play(800, 'sine', 0.3); setTimeout(() => this.play(1200, 'sine', 0.4), 100); },
      lose() { this.play(100, 'sawtooth', 0.5); },
      tick() { this.play(440, 'sine', 0.05, 0.05); }
    };

    // --- Game State ---
    let state = {
      playerHealth: 100,
      enemyHealth: 100,
      score: 0,
      combo: 0,
      difficulty: 15,
      isListening: false,
      laughDetected: false,
      seenJokes: [],
      roundActive: false
    };

    const taunts = [
      "Was it that funny? I didn't even try.",
      "My grandmother has a thicker skin than you.",
      "I've seen rocks with better self-control.",
      "Are you even trying to stay serious?",
      "That was my worst joke. And you still cracked.",
      "Pathetic. The comedy bot is disappointed.",
      "You're making this too easy for me."
    ];

    const els = {
      pHealth: document.getElementById('p-health'),
      eHealth: document.getElementById('e-health'),
      pAvatar: document.getElementById('p-avatar'),
      eAvatar: document.getElementById('e-avatar'),
      pFighter: document.getElementById('p-fighter'),
      eFighter: document.getElementById('e-fighter'),
      setup: document.getElementById('setup'),
      punchline: document.getElementById('punchline'),
      status: document.getElementById('status-text'),
      micDot: document.getElementById('mic-dot'),
      volFill: document.getElementById('vol-fill'),
      startBtn: document.getElementById('start-btn'),
      nextBtn: document.getElementById('next-btn'),
      controls: document.getElementById('game-controls'),
      overlay: document.getElementById('overlay'),
      endTitle: document.getElementById('end-title'),
      taunt: document.getElementById('taunt-text'),
      score: document.getElementById('score-val'),
      finalScore: document.getElementById('final-score'),
      comboPill: document.getElementById('combo-pill'),
      comboVal: document.getElementById('combo-val'),
      diffBtns: document.querySelectorAll('.diff-btn')
    };

    const detector = new LOLD({
      threshold: state.difficulty,
      onLaugh: (vol) => {
        if (state.isListening && !state.laughDetected) playerLaughed();
      }
    });

    // --- Difficulty Handling ---
    els.diffBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        if (state.roundActive) return;
        els.diffBtns.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        state.difficulty = parseInt(btn.dataset.val);
        detector.threshold = state.difficulty;
        AudioEngine.tick();
      });
    });

    // --- Core Logic ---

    async function initGame() {
      AudioEngine.init();
      const success = await detector.start();
      if (success) {
        els.startBtn.style.display = 'none';
        els.controls.style.display = 'flex';
        els.status.textContent = "System online. Prepare yourself.";

        detector.onVolumeChange = (avg, max) => {
          els.volFill.style.width = Math.min(100, avg * 4) + '%';
          if (avg > detector.threshold) {
            els.volFill.style.background = 'var(--red)';
          } else if (avg > detector.threshold * 0.6) {
            els.volFill.style.background = 'var(--yellow)';
          } else {
            els.volFill.style.background = 'var(--green)';
          }
        };

        fetchJoke();
      } else {
        alert("Microphone access is required for the challenge!");
      }
    }

    function playerLaughed() {
      state.laughDetected = true;
      state.isListening = false;
      detector.setListening(false);
      els.micDot.classList.remove('active');

      AudioEngine.lose();
      state.combo = 0;
      updateStats();

      els.status.textContent = "LAUGHTER DETECTED! ❌";
      els.status.style.color = "var(--red)";
      els.pAvatar.textContent = "🤣";
      els.eAvatar.textContent = "😎";

      takeDamage('player');
      els.nextBtn.disabled = false;
      els.nextBtn.textContent = "Try Again ➡️";
    }

    function botFailed() {
      if (state.laughDetected) return;
      state.laughDetected = true;
      state.isListening = false;
      detector.setListening(false);
      els.micDot.classList.remove('active');

      AudioEngine.win();
      state.combo++;
      state.score += (100 * state.combo) + (state.difficulty === 8 ? 50 : 0);
      updateStats();

      els.status.textContent = "SURVIVED! Bot takes damage. 🗿";
      els.status.style.color = "var(--green)";
      els.pAvatar.textContent = "🗿";
      els.eAvatar.textContent = "😰";

      takeDamage('enemy');
      els.nextBtn.disabled = false;
      els.nextBtn.textContent = "Next Joke ➡️";
    }

    function takeDamage(target) {
      AudioEngine.hit();
      if (target === 'player') {
        state.playerHealth = Math.max(0, state.playerHealth - 25);
        els.pAvatar.classList.add('shake');
        els.pFighter.classList.add('shake');
        setTimeout(() => {
            els.pAvatar.classList.remove('shake');
            els.pFighter.classList.remove('shake');
        }, 600);
      } else {
        state.enemyHealth = Math.max(0, state.enemyHealth - 20);
        els.eAvatar.classList.add('shake');
        els.eFighter.classList.add('shake');
        setTimeout(() => {
            els.eAvatar.classList.remove('shake');
            els.eFighter.classList.remove('shake');
        }, 600);
      }
      updateUI();

      if (state.playerHealth <= 0) endGame(false);
      else if (state.enemyHealth <= 0) endGame(true);
    }

    function updateStats() {
      els.score.textContent = state.score;
      if (state.combo > 1) {
        els.comboPill.style.display = 'flex';
        els.comboVal.textContent = state.combo;
      } else {
        els.comboPill.style.display = 'none';
      }
    }

    function updateUI() {
      els.pHealth.style.width = state.playerHealth + '%';
      els.eHealth.style.width = state.enemyHealth + '%';
      els.pHealth.className = `health-fill ${state.playerHealth <= 25 ? 'low' : ''}`;
      els.eHealth.className = `health-fill ${state.enemyHealth <= 20 ? 'low' : ''}`;
    }

    function endGame(win) {
      state.roundActive = false;
      els.overlay.classList.add('visible');
      els.finalScore.textContent = state.score;
      if (win) {
        els.endTitle.textContent = "BOT DEFEATED! 🤖";
        els.endTitle.style.color = "var(--green)";
        els.taunt.textContent = "Impossible. You are truly heartless.";
      } else {
        els.endTitle.textContent = "YOU CRACKED! 😂";
        els.endTitle.style.color = "var(--red)";
        els.taunt.textContent = taunts[Math.floor(Math.random() * taunts.length)];
      }
    }

    async function fetchJoke() {
      state.roundActive = true;
      state.laughDetected = false;
      state.isListening = false;
      detector.setListening(false);

      els.micDot.classList.remove('active');
      els.nextBtn.disabled = true;
      els.nextBtn.textContent = "Calculating Humor...";

      els.pAvatar.textContent = "😐";
      els.eAvatar.textContent = "🤡";
      els.status.style.color = "var(--muted)";
      els.status.textContent = "Bot is searching its database...";

      els.setup.textContent = "Wait for it...";
      els.punchline.textContent = "";
      els.punchline.classList.remove('visible');

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "get_joke",
            avoid: state.seenJokes.slice(-15)
          })
        });

        const data = await res.json();
        const raw = data.raw || "";

        let setup = "Unknown";
        let punchline = "...";
        const split = raw.toUpperCase().lastIndexOf("PUNCHLINE:");

        if (split !== -1) {
          setup = raw.substring(0, split).replace(/SETUP:/i, '').trim();
          punchline = raw.substring(split).replace(/PUNCHLINE:/i, '').trim();
        } else {
          setup = raw;
        }

        state.seenJokes.push(setup);
        els.setup.textContent = setup;

        // Delivery Timing
        setTimeout(() => {
          AudioEngine.tick();
          els.punchline.textContent = punchline;
          els.punchline.classList.add('visible');
          els.eAvatar.textContent = "😜";

          // START LISTENING
          state.isListening = true;
          detector.setListening(true);
          els.micDot.classList.add('active');
          els.status.textContent = "DON'T LAUGH! 🎙️ LISTENING...";

          els.eFighter.classList.add('active');

          setTimeout(() => {
            els.eFighter.classList.remove('active');
            if (!state.laughDetected && state.isListening) {
              botFailed();
            }
          }, 6000); // 6 seconds to survive

        }, 3000);

      } catch (e) {
        console.error(e);
        els.setup.textContent = "Connection lost to the Comedy Cloud.";
        els.nextBtn.disabled = false;
        els.nextBtn.textContent = "Retry Connection 🔄";
      }
    }

    els.startBtn.addEventListener('click', initGame);
    els.nextBtn.addEventListener('click', fetchJoke);

  </script>
  </body>

  </html>
