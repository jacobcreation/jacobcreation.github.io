<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Cache Busting Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riddle Battle - JacobCreation</title>

  <link rel="icon" href="/favicon.png" type="image/png" />
  <link href="/fonts/fonts.css" rel="stylesheet">
  <link href="/fonts/fonts.css" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
    <!-- Mobile Friendly -->
    <link rel="stylesheet" href="/mobile-friendly.css">
</head>

<body>

  <!-- Provides the sticky header -->
  <script>(function(){const v=Date.now();document.write('<script src="/global-header.js?v='+v+'"><\/script>');})();</script>

  <div class="game-container">

    <div class="level-badge">Level <span id="level-display">1</span></div>

    <div class="arena">
      <!-- Player -->
      <div class="fighter">
        <div class="name">YOU</div>
        <div class="avatar" id="player-avatar">😎</div>
        <div class="health-track">
          <div class="health-fill" id="player-health"></div>
        </div>
      </div>

      <!-- VS -->
      <div style="display:grid; place-items:center; font-weight:900; opacity:0.5; font-size:1.5rem">VS</div>

      <!-- Enemy -->
      <div class="fighter">
        <div class="name">RIDDLE BOT</div>
        <div class="avatar" id="enemy-avatar">🤖</div>
        <div class="health-track">
          <div class="health-fill" id="enemy-health"></div>
        </div>
      </div>
    </div>

    <!-- Main Game Card -->
    <div class="card" id="game-card">
      <div class="spinner"></div>

      <p id="riddle-text" class="placeholder">Press Start to battle!</p>

      <div class="status-msg" id="status-msg"></div>

      <div class="input-wrap hidden" id="input-area">
        <input type="text" id="answer-input" placeholder="Your answer..." autocomplete="off">
        <button class="btn btn-primary" id="submit-btn" disabled>Attack!</button>
      </div>

      <button class="btn btn-primary" id="start-btn">⚔️ Start Battle</button>

      <!-- Game Over / Win Screen Overlay -->
      <div class="game-over-overlay" id="overlay">
        <div class="game-over-title" id="overlay-title">VICTORY</div>
        <p id="overlay-msg">You defeated the bot!</p>
        <button class="btn btn-primary" id="next-level-btn">Next Level ➡️</button>
        <button class="btn btn-primary" id="restart-btn" style="display:none; background: #555;">Try Again ↺</button>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
    <script src="/accounts/account-widget.js" defer data-account-api="https://accounts-system.b4rjxr9lk.workers.dev"></script>
</body>

</html>
