<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#000000">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore fun riddles and jokes on JacobCreation!" />
    <script src="/project-polish.js" defer></script>

    <title>Riddles & Jokes - JacobCreation</title>

    <!-- ✅ Favicon setup -->
    <link rel="icon" href="/favicon.png" type="image/png" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg1: #0b1020;
            --bg2: #0a1633;
            --card: rgba(255, 255, 255, 0.08);
            --card2: rgba(255, 255, 255, 0.12);
            --border: rgba(255, 255, 255, 0.14);
            --text: #eaf2ff;
            --muted: rgba(234, 242, 255, 0.75);
            --blue: #4ea1ff;
            --blue2: #2d6bff;
            --shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
            --shadow2: 0 10px 22px rgba(0, 0, 0, 0.28);
            --radius: 18px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Poppins", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            color: var(--text);
            min-height: 100vh;
            background:
                radial-gradient(1200px 600px at 20% 10%, rgba(78, 161, 255, 0.30), transparent 55%),
                radial-gradient(900px 600px at 90% 15%, rgba(45, 107, 255, 0.22), transparent 55%),
                linear-gradient(135deg, var(--bg1), var(--bg2));
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
            background: rgba(10, 16, 32, 0.65);
            border-bottom: 1px solid rgba(255, 255, 255, 0.10);
        }

        .header-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            letter-spacing: 0.2px;
            font-size: 1.15rem;
            white-space: nowrap;
            text-decoration: none;
            color: inherit;
        }

        /* Badge */
        .logo-badge {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background: linear-gradient(135deg, #1e90ff, #ff2d2d);
            box-shadow: 0 10px 24px rgba(30, 144, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.20);
            font-weight: 900;
            color: white;
        }

        /* Text Logo (Blue + Red gradient) */
        .logo-text {
            font-family: "Orbitron", sans-serif;
            font-weight: 800;
            font-size: 1.15rem;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #1e90ff, #ff2d2d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow:
                0 0 14px rgba(30, 144, 255, 0.35),
                0 0 14px rgba(255, 45, 45, 0.25);
        }

        nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        nav a {
            text-decoration: none;
            color: var(--text);
            font-weight: 600;
            font-size: 0.92rem;
            padding: 9px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.06);
            transition: transform 0.18s ease, background 0.18s ease, border 0.18s ease;
        }

        nav a:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.10);
            border-color: rgba(255, 255, 255, 0.22);
        }

        /* Main */
        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 28px 18px 60px;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Hero */
        .hero {
            text-align: center;
            margin-bottom: 40px;
        }

        .hero h1 {
            margin: 0;
            font-size: 3rem;
            line-height: 1.1;
            letter-spacing: 0.2px;
            font-family: "Orbitron", sans-serif;
            background: linear-gradient(90deg, #4ea1ff, #ff2d2d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .hero p {
            margin: 15px auto 0;
            color: var(--muted);
            line-height: 1.55;
            font-size: 1.2rem;
            max-width: 60ch;
        }

        /* Selection Cards */
        .selection-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .selection-card {
            position: relative;
            height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            text-decoration: none;
            color: var(--text);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: var(--shadow);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }

        .selection-card:hover {
            transform: translateY(-10px) scale(1.02);
            background: rgba(255, 255, 255, 0.10);
            border-color: var(--blue);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .selection-card h2 {
            margin: 0;
            font-size: 2rem;
            font-weight: 800;
        }

        .selection-card p {
            margin: 10px 0 0;
            color: var(--muted);
            font-size: 1rem;
        }

        .icon-box {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        footer {
            border-top: 1px solid rgba(255, 255, 255, 0.10);
            background: rgba(10, 16, 32, 0.55);
            backdrop-filter: blur(10px);
            padding: 14px 18px;
            text-align: center;
            color: rgba(234, 242, 255, 0.70);
            font-size: 0.9rem;
        }

        /* Mobile */
        @media (max-width: 600px) {
            .hero h1 {
                font-size: 2.2rem;
            }

            .selection-card {
                height: 180px;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="header-container">
            <a href="/" class="logo">
                <span class="logo-badge">J</span>
                <span class="logo-text">JacobCreation</span>
            </a>

            <nav>
                <a href="/">Home</a>
                <a href="/about">About</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero">
            <h1>Riddles & Jokes</h1>
            <p>Ready for a laugh or a brain-teaser? Choose your path!</p>
        </section>

        <div class="selection-container">
            <a href="/riddles/joke" class="selection-card">
                <div class="icon-box">😂</div>
                <h2>Jokes</h2>
                <p>Laugh out loud with some funny jokes!</p>
            </a>

            <a href="/riddles/riddle" class="selection-card">
                <div class="icon-box">🧩</div>
                <h2>Riddles</h2>
                <p>Test your brain with tricky riddles!</p>
            </a>
        </div>
    </main>

    <footer>
        © 2026 JacobCreation • Built by Jacob 💙
    </footer>

</body>

</html>
