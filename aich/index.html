<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chaos - Prompt Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg1: #0b1020;
            --bg2: #0a1633;
            --card: rgba(255, 255, 255, 0.08);
            --card2: rgba(255, 255, 255, 0.12);
            --border: rgba(255, 255, 255, 0.14);
            --text: #eaf2ff;
            --muted: rgba(234, 242, 255, 0.75);
            --blue: #4ea1ff;
            --blue2: #2d6bff;
            --shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
            --shadow2: 0 10px 22px rgba(0, 0, 0, 0.28);
            --radius: 18px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Poppins", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            color: var(--text);
            min-height: 100vh;
            background:
                radial-gradient(1200px 600px at 20% 10%, rgba(78, 161, 255, 0.15), transparent 55%),
                radial-gradient(900px 600px at 90% 15%, rgba(45, 107, 255, 0.12), transparent 55%),
                linear-gradient(135deg, var(--bg1), var(--bg2));
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Main Layout */
        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Header / Hero */
        header {
            text-align: center;
            margin-bottom: 10px;
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff, var(--blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--muted);
            margin-top: 8px;
        }

        /* Settings Card */
        .settings-card {
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            padding: 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            box-shadow: var(--shadow2);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--blue);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select, textarea, input {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        select:focus, textarea:focus, input:focus {
            outline: none;
            border-color: var(--blue);
            background: rgba(255, 255, 255, 0.12);
        }

        /* Chat Container */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(8px);
            overflow: hidden;
            box-shadow: var(--shadow);
            min-height: 400px;
        }

        #chat {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        #chat::-webkit-scrollbar {
            width: 6px;
        }

        #chat::-webkit-scrollbar-thumb {
            background-color: var(--border);
            border-radius: 10px;
        }

        /* Message Bubbles */
        .msg {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 20px;
            line-height: 1.5;
            font-size: 0.95rem;
            position: relative;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--blue2), var(--blue));
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .msg.ai {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border);
            color: var(--text);
            border-bottom-left-radius: 4px;
        }

        .msg.error {
            align-self: center;
            background: rgba(255, 50, 50, 0.1);
            border: 1px solid rgba(255, 50, 50, 0.2);
            color: #ff8080;
            font-size: 0.85rem;
        }

        /* Input Area */
        .input-area {
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        #userInput {
            flex: 1;
            min-height: 50px;
            max-height: 150px;
            resize: none;
            padding: 14px;
            background: rgba(255, 255, 255, 0.08);
        }

        #sendBtn {
            background: var(--blue);
            color: #0b1020;
            border: none;
            border-radius: 12px;
            padding: 0 24px;
            height: 50px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #sendBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(78, 161, 255, 0.4);
            filter: brightness(1.1);
        }

        #sendBtn:active {
            transform: translateY(0);
        }

        #sendBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            cursor: pointer;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: rgba(255, 50, 50, 0.15);
            border-color: rgba(255, 50, 50, 0.3);
            color: #ff8080;
        }

        footer {
            padding: 24px;
            text-align: center;
            color: var(--muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border);
            margin-top: auto;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            main { padding: 20px 15px; }
            .settings-card { grid-template-columns: 1fr; }
            header h1 { font-size: 1.8rem; }
            .msg { max-width: 90%; }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>AI Chaos</h1>
            <p>Challenge the world's most powerful AI models</p>
        </header>

        <section class="settings-card">
            <div class="input-group">
                <label for="promptSelect">System Personality</label>
                <select id="promptSelect">
                    <option value="You are a helpful assistant.">Helpful Assistant</option>
                    <option value="You are a sarcastic AI.">Sarcastic AI</option>
                    <option value="You are a coding tutor.">Coding Tutor</option>
                    <option value="You are a mysterious storyteller.">Storyteller</option>
                    <option value="You are a pirate. Arrr!">Pirate</option>
                    <option value="CUSTOM">Custom...</option>
                </select>
            </div>
            <div class="input-group">
                <label for="modelSelect">AI Model</label>
                <div style="display: flex; gap: 10px;">
                    <select id="modelSelect" style="flex: 1;">
                        <optgroup label="── Text Generation ──">
                            <option value="@cf/meta/llama-4-scout-17b-16e-instruct">Llama 4 Scout 17B (Meta)</option>
                            <option value="@cf/meta/llama-3.3-70b-instruct-fp8-fast">Llama 3.3 70B Fast (Meta)</option>
                            <option value="@cf/meta/llama-3.2-3b-instruct">Llama 3.2 3B (Meta)</option>
                            <option value="@cf/meta/llama-3.2-1b-instruct">Llama 3.2 1B (Meta)</option>
                            <option value="@cf/meta/llama-3.1-8b-instruct-fp8" selected>Llama 3.1 8B FP8 (Meta)</option>
                            <option value="@cf/meta/llama-3.1-8b-instruct-fast">Llama 3.1 8B Fast (Meta)</option>
                            <option value="@cf/meta/llama-guard-3-8b">Llama Guard 3 8B (Meta)</option>
                            <option value="@cf/qwen/qwen3-30b-a3b-fp8">Qwen3 30B A3B (Qwen)</option>
                            <option value="@cf/qwen/qwq-32b">QwQ 32B Reasoning (Qwen)</option>
                            <option value="@cf/qwen/qwen2.5-coder-32b-instruct">Qwen2.5 Coder 32B (Qwen)</option>
                            <option value="@cf/deepseek-ai/deepseek-r1-distill-qwen-32b">DeepSeek R1 Distill Qwen 32B</option>
                            <option value="@cf/mistralai/mistral-small-3.1-24b-instruct">Mistral Small 3.1 24B (MistralAI)</option>
                            <option value="@cf/mistralai/mistral-7b-instruct-v0.2">Mistral 7B v0.2 (MistralAI)</option>
                            <option value="@cf/google/gemma-4-26b-a4b-it">Gemma 4 26B (Google)</option>
                            <option value="@cf/nvidia/nemotron-3-120b-a12b">Nemotron 3 120B (NVIDIA)</option>
                            <option value="@cf/openai/gpt-oss-120b">GPT-OSS 120B (OpenAI)</option>
                            <option value="@cf/openai/gpt-oss-20b">GPT-OSS 20B (OpenAI)</option>
                            <option value="@cf/moonshotai/kimi-k2.6">Kimi K2.6 (Moonshot AI)</option>
                            <option value="@cf/zhipuai/glm-4.7-flash">GLM-4.7 Flash (Zhipu AI)</option>
                            <option value="@cf/ibm/granite-4.0-h-micro">Granite 4.0 H Micro (IBM)</option>
                            <option value="@cf/nousresearch/hermes-2-pro-mistral-7b">Hermes 2 Pro Mistral 7B</option>
                            <option value="@cf/defog/sqlcoder-7b-2">SQLCoder 7B (Defog)</option>
                        </optgroup>
                        <optgroup label="── Vision / Multimodal ──">
                            <option value="@cf/meta/llama-3.2-11b-vision-instruct">Llama 3.2 11B Vision (Meta)</option>
                            <option value="@cf/moonshotai/kimi-k2.6">Kimi K2.6 Vision (Moonshot AI)</option>
                            <option value="@cf/llava-hf/llava-1.5-7b-hf">LLaVA 1.5 7B</option>
                        </optgroup>
                        <optgroup label="── Image Generation ──">
                            <option value="@cf/black-forest-labs/flux-1-schnell">FLUX.1 Schnell (Black Forest Labs)</option>
                            <option value="@cf/bytedance/stable-diffusion-xl-lightning">SDXL Lightning (ByteDance)</option>
                            <option value="@cf/lykon/dreamshaper-8-lcm">DreamShaper 8 LCM</option>
                            <option value="@cf/stabilityai/stable-diffusion-xl-base-1.0">Stable Diffusion XL 1.0</option>
                            <option value="@cf/runwayml/stable-diffusion-v1-5-img2img">SD v1.5 Img2Img</option>
                            <option value="@cf/runwayml/stable-diffusion-v1-5-inpainting">SD v1.5 Inpainting</option>
                        </optgroup>
                        <optgroup label="── Speech Recognition ──">
                            <option value="@cf/openai/whisper">Whisper (OpenAI)</option>
                            <option value="@cf/openai/whisper-large-v3-turbo">Whisper Large v3 Turbo (OpenAI)</option>
                            <option value="@cf/openai/whisper-tiny-en">Whisper Tiny EN (OpenAI)</option>
                        </optgroup>
                        <optgroup label="── Text Embeddings ──">
                            <option value="@cf/baai/bge-large-en-v1.5">BGE Large EN v1.5 (BAAI)</option>
                            <option value="@cf/baai/bge-base-en-v1.5">BGE Base EN v1.5 (BAAI)</option>
                            <option value="@cf/baai/bge-small-en-v1.5">BGE Small EN v1.5 (BAAI)</option>
                            <option value="@cf/baai/bge-m3">BGE M3 (BAAI)</option>
                            <option value="@cf/google/embeddinggemma-300m">EmbeddingGemma 300M (Google)</option>
                            <option value="@cf/qwen/qwen3-embedding-0.6b">Qwen3 Embedding 0.6B (Qwen)</option>
                            <option value="@cf/pfnet/plamo-embedding-1b">PLaMo Embedding 1B</option>
                        </optgroup>
                        <optgroup label="── Classification / Other ──">
                            <option value="@cf/baai/bge-reranker-base">BGE Reranker Base (BAAI)</option>
                            <option value="@cf/huggingface/distilbert-sst-2-int8">DistilBERT SST-2 (HuggingFace)</option>
                            <option value="@cf/microsoft/resnet-50">ResNet-50 Image Classification (Microsoft)</option>
                            <option value="@cf/meta/detr-resnet-50">DETR ResNet-50 Object Detection (Meta)</option>
                            <option value="@cf/meta/m2m100-1.2b">M2M100 1.2B Translation (Meta)</option>
                        </optgroup>
                    </select>
                    <button id="clearBtn" class="btn-secondary" title="Clear Chat">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
                    </button>
                </div>
            </div>
            <div id="customPromptGroup" class="input-group" style="grid-column: 1 / -1; display: none;">
                <label for="customPrompt">Custom System Prompt</label>
                <textarea id="customPrompt" placeholder="Describe how the AI should behave..." rows="2"></textarea>
            </div>
        </section>

        <section class="chat-container">
            <div id="chat">
                <div class="msg ai">Hello! Choose a personality and model above, then send me a message to start the chaos.</div>
            </div>
            <div class="input-area">
                <textarea id="userInput" placeholder="Type your message..." rows="1"></textarea>
                <button id="sendBtn">
                    <span>Send</span>
                </button>
            </div>
        </section>
    </main>

    <footer>
        &copy; 2026 AI Chaos &bull; Powered by Cloudflare Workers AI
    </footer>

    <script>
        const workerUrl = "https://ai-chaos.b4rjxr9lk.workers.dev";
        const chatDiv = document.getElementById('chat');
        const sendBtn = document.getElementById('sendBtn');
        const userInput = document.getElementById('userInput');
        const promptSelect = document.getElementById('promptSelect');
        const modelSelect = document.getElementById('modelSelect');
        const clearBtn = document.getElementById('clearBtn');
        const customPromptGroup = document.getElementById('customPromptGroup');
        const customPromptInput = document.getElementById('customPrompt');

        promptSelect.addEventListener('change', () => {
            customPromptGroup.style.display = promptSelect.value === 'CUSTOM' ? 'flex' : 'none';
        });

        function appendMessage(text, className) {
            const div = document.createElement('div');
            div.className = 'msg ' + className;
            div.textContent = text;
            chatDiv.appendChild(div);
            chatDiv.scrollTop = chatDiv.scrollHeight;
            return div;
        }

        // Auto-resize textarea
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        async function sendMessage() {
            const userMsg = userInput.value.trim();
            if (!userMsg || sendBtn.disabled) return;

            let systemPrompt = promptSelect.value;
            if (systemPrompt === 'CUSTOM') {
                systemPrompt = customPromptInput.value.trim() || 'You are a helpful assistant.';
            }
            const model = modelSelect.value;

            appendMessage(userMsg, 'user');
            userInput.value = '';
            userInput.style.height = 'auto';
            
            sendBtn.disabled = true;
            const loadingMsg = appendMessage('...', 'ai');

            try {
                const response = await fetch(workerUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        system: systemPrompt, 
                        prompt: userMsg, 
                        model: model 
                    })
                });

                if (!response.ok) throw new Error('Failed to connect to AI');

                const data = await response.json();
                const aiReply = data.reply || data.result || (data.response ? data.response : JSON.stringify(data));
                
                loadingMsg.textContent = aiReply;
            } catch (e) {
                loadingMsg.className = 'msg error';
                loadingMsg.textContent = 'Error: ' + e.message;
            } finally {
                sendBtn.disabled = false;
                chatDiv.scrollTop = chatDiv.scrollHeight;
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        clearBtn.addEventListener('click', () => {
            if (confirm('Are you sure you want to clear the chat?')) {
                chatDiv.innerHTML = '<div class="msg ai">Chat cleared. Ready for more chaos?</div>';
            }
        });
        userInput.addEventListener('keydown', (e) => { 
            if (e.key === 'Enter' && !e.shiftKey) { 
                e.preventDefault(); 
                sendMessage(); 
            } 
        });
    </script>
</body>
</html>
