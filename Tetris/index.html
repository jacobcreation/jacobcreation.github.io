<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tetris</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="game-card">
      <div class="board-wrap">
        <canvas id="game" width="300" height="600" aria-label="Tetris game board"></canvas>
        <div id="overlay" class="overlay hidden">
          <div class="overlay-card">
            <h2 id="overlay-title">Paused</h2>
            <p id="overlay-message">Press P to resume.</p>
          </div>
        </div>
      </div>

      <aside class="sidebar">
        <div class="brand">
          <p class="eyebrow">Arcade Stack</p>
          <h1>Tetris</h1>
          <p class="tagline">Rotate fast, place clean, and chase long combo clears.</p>
        </div>

        <div class="panel stats">
          <div>
            <span class="label">Score</span>
            <strong id="score">0</strong>
          </div>
          <div>
            <span class="label">Level</span>
            <strong id="level">1</strong>
          </div>
          <div>
            <span class="label">Lines</span>
            <strong id="lines">0</strong>
          </div>
        </div>

        <div class="panel next-panel">
          <span class="label">Next Piece</span>
          <canvas id="next" width="120" height="120" aria-label="Next Tetris piece preview"></canvas>
        </div>

        <div class="panel controls">
          <span class="label">Controls</span>
          <ul>
            <li><kbd>&larr;</kbd> <kbd>&rarr;</kbd> move</li>
            <li><kbd>&darr;</kbd> soft drop</li>
            <li><kbd>&uarr;</kbd> rotate</li>
            <li><kbd>Space</kbd> hard drop</li>
            <li><kbd>P</kbd> pause</li>
          </ul>
        </div>

        <div class="actions">
          <button id="start-button" type="button">New Game</button>
          <button id="pause-button" type="button">Pause</button>
        </div>
      </aside>
        <div class="mobile-controls">
      <button data-action="move-left">←</button>
      <button data-action="move-right">→</button>
      <button data-action="soft-drop">↓</button>
      <button data-action="rotate">⟳</button>
      <button data-action="hard-drop">⏭</button>
    </div>
  </section>
</main>


  <script src="script.js"></script>
    <script src="/accounts/account-widget.js" defer data-account-api="https://accounts-system.b4rjxr9lk.workers.dev"></script>
</body>
</html>
