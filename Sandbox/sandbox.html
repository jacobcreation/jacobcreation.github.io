<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>City Life Sandbox Simulator — Save/Load Edition</title>
<style>
  body { background:#87ceeb; font-family:sans-serif; text-align:center; }
  #toolbar, #controls { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:10px auto; }
  canvas { border:2px solid #333; background:#f0f8ff; display:block; margin:10px auto; cursor:default; }
  #stats { font:13px monospace; margin:8px auto; width:900px; text-align:left; }
</style>
</head>
<body>
<h1>🌍 City Life Sandbox Simulator — Save/Load Edition</h1>

<div id="toolbar">
  <button onclick="spawn('adult')">👤 Adult</button>
  <button onclick="spawn('kid')">🧒 Kid</button>
  <button onclick="spawn('elderly')">👴 Elderly</button>
  <button onclick="spawn('car')">🚗 Car</button>
  <button onclick="spawn('police')">👮 Police</button>
  <button onclick="spawn('policecar')">🚓 Police Car</button>
  <button onclick="spawn('criminal')">🦹 Criminal</button>
  <button onclick="spawn('park')">🌳 Park</button>
  <button onclick="spawn('bench')">🪑 Bench</button>
  <button onclick="spawn('streetlight')">💡 Streetlight</button>
  <button onclick="spawn('restaurant')">🍽️ Restaurant</button>
  <button onclick="spawn('mall')">🏬 Mall</button>
  <button onclick="spawn('hospital')">🏥 Hospital</button>
  <button onclick="spawn('doctor')">👨‍⚕️ Doctor</button>
  <button onclick="spawn('school')">🏫 School</button>
  <button onclick="spawn('teacher')">👩‍🏫 Teacher</button>
  <button onclick="spawn('workplace')">🏭 Workplace</button>
  <button onclick="spawn('home')">🏠 Home</button>
</div>

<div id="controls">
  <button onclick="saveWorld()">💾 Save World</button>
  <input type="file" id="loadFile" style="display:none" onchange="loadWorld(event)">
  <button onclick="document.getElementById('loadFile').click()">📂 Load World</button>
</div>

<div id="stats"><div id="statsText"></div></div>

<canvas id="world" width="900" height="560"></canvas>

<script>
const canvas = document.getElementById("world");
const ctx = canvas.getContext("2d");
const entities = [];
let time = 0;          // ticks
let day = 1;           // day counter
let raining = false;   // simple toggle

// Utility
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
function isNight(){ return (time % 1200) >= 600; } // 1200 ticks/day; night in second half
function vecTo(a,b){
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.sqrt(dx*dx + dy*dy) || 1;
  return [dx, dy, len];
}
function nearestOf(entity, type){
  let best = null, bestD = Infinity;
  for(const e of entities){
    if(e.type !== type) continue;
    const d = dist(entity, e);
    if(d < bestD){ bestD = d; best = e; }
  }
  return best;
}

// Background (day/night)
function drawBackground(){
  const t = time % 1200;
  const phase = t / 1200; // 0..1
  // Simple gradient sky shifting brightness
  const dayColor = {r:135,g:206,b:235};   // #87ceeb
  const nightColor = {r:10,g:20,b:40};
  const factor = isNight() ? (t-600)/600 : 1 - (t/600); // blend intensity
  const f = clamp(factor, 0, 1);
  const r = Math.round(dayColor.r*(1-f) + nightColor.r*f);
  const g = Math.round(dayColor.g*(1-f) + nightColor.g*f);
  const b = Math.round(dayColor.b*(1-f) + nightColor.b*f);
  ctx.fillStyle = `rgb(${r},${g},${b})`;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Subtle stars at night
  if(isNight()){
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    for(let i=0;i<40;i++){
      const sx = (i*97 % canvas.width);
      const sy = (i*53 % (canvas.height/2));
      ctx.fillRect(sx, sy, 2, 2);
    }
  }

  // Light rain visual
  if(raining){
    ctx.strokeStyle = "rgba(120,160,255,0.5)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for(let i=0;i<60;i++){
      const rx = (i*41 + time*3) % canvas.width;
      const ry = (i*71 + (time%200)) % canvas.height;
      ctx.moveTo(rx, ry);
      ctx.lineTo(rx+4, ry+10);
    }
    ctx.stroke();
  }
}

// Entity
class Entity{
  constructor(type, x, y, speed){
    this.type = type;
    this.x = x; this.y = y;
    this.speed = speed || 1;
    this.age = 0;
    this.parent = null; this.partner = null;
    this.hunger = Math.random()*50;
    this.energy = 70 + Math.random()*30;
    this.dessertsToday = 0;
    this.needsDoctor = false;
    this.wallet = 100 + Math.random()*200;
    this.happiness = 60 + Math.random()*20;
  }
  draw(){
    ctx.font = "20px sans-serif";
    let emoji =
      this.type==="adult"      ? "👤" :
      this.type==="kid"        ? (this.needsDoctor ? "🤒" : "🧒") :
      this.type==="elderly"    ? "👴" :
      this.type==="car"        ? "🚗" :
      this.type==="police"     ? "👮" :
      this.type==="policecar"  ? "🚓" :
      this.type==="criminal"   ? "🦹" :
      this.type==="park"       ? "🌳" :
      this.type==="bench"      ? "🪑" :
      this.type==="streetlight"? "💡" :
      this.type==="restaurant" ? "🍽️" :
      this.type==="mall"       ? "🏬" :
      this.type==="hospital"   ? "🏥" :
      this.type==="doctor"     ? "👨‍⚕️" :
      this.type==="school"     ? "🏫" :
      this.type==="teacher"    ? "👩‍🏫" :
      this.type==="workplace"  ? "🏭" :
      this.type==="home"       ? "🏠" : "❓";
    ctx.fillText(emoji, this.x, this.y);
  }
  keepInBounds(){
    // Allow a small margin so emojis stay visible
    this.x = clamp(this.x, 5, canvas.width - 25);
    this.y = clamp(this.y, 20, canvas.height - 5);
  }
  move(){
    // Static types don't move
    if(["park","bench","streetlight","restaurant","mall","hospital","school","workplace","home"].includes(this.type)) return;

    // Basic needs drift
    this.hunger = clamp(this.hunger + 0.02, 0, 100);
    this.energy = clamp(this.energy - (isNight() ? 0.015 : 0.005), 0, 100);

    // Type-specific behavior
    if(this.type === "car"){
      this.x += this.speed * 1.5;
      if(this.x > canvas.width) this.x = 0;
      this.keepInBounds();
      return;
    }

    if(this.type === "doctor"){
      const hosp = nearestOf(this, "hospital");
      if(hosp){
        let [dx,dy,len] = vecTo(this, hosp);
        this.x += (dx/len)*this.speed;
        this.y += (dy/len)*this.speed;
      }
      this.keepInBounds();
      return;
    }

    if(this.type === "teacher"){
      const sch = nearestOf(this, "school");
      if(sch){
        let [dx,dy,len] = vecTo(this, sch);
        this.x += (dx/len)*this.speed;
        this.y += (dy/len)*this.speed;
      }
      this.keepInBounds();
      return;
    }

    if(this.type === "kid"){
      if(this.needsDoctor){
        const hosp = nearestOf(this, "hospital");
        if(hosp){
          let [dx,dy,len] = vecTo(this, hosp);
          this.x += (dx/len)*this.speed;
          this.y += (dy/len)*this.speed;
          if(dist(this, hosp) < 20){
            this.needsDoctor = false;
            this.dessertsToday = 0;
          }
        }
        this.keepInBounds();
        return;
      }
      // Occasional dessert attempt if a restaurant exists and an adult is nearby
      const rest = nearestOf(this, "restaurant");
      if(rest && Math.random() < 0.01){
        const adult = nearestOf(this, "adult");
        if(adult){
          const allow = Math.random() < 0.5;
          if(allow){
            this.dessertsToday++;
            if(this.dessertsToday >= 5) this.needsDoctor = true;
          }
        }
      }
      // Wander
      this.x += (Math.random()-0.5)*this.speed;
      this.y += (Math.random()-0.5)*this.speed;
      this.keepInBounds();
      return;
    }

    if(this.type === "adult" || this.type === "elderly"){
      // Seek hospital if in poor condition
      if(this.hunger > 80 || this.energy < 20){
        const hosp = nearestOf(this, "hospital");
        if(hosp){
          let [dx,dy,len] = vecTo(this, hosp);
          this.x += (dx/len)*this.speed;
          this.y += (dy/len)*this.speed;
          if(dist(this, hosp) < 20){
            this.hunger = 30;
            this.energy = 60;
          }
          this.keepInBounds();
          return;
        }
      }
      // Wander
      this.x += (Math.random()-0.5)*this.speed;
      this.y += (Math.random()-0.5)*this.speed;
      this.keepInBounds();
      return;
    }

    // Fallback wander
    this.x += (Math.random()-0.5)*this.speed;
    this.y += (Math.random()-0.5)*this.speed;
    this.keepInBounds();
  }
}

// Spawning (global for buttons)
function spawn(type){
  const x = Math.random()*canvas.width;
  const y = Math.random()*canvas.height;
  const speed =
    type==="car"     ? 2.4 :
    type==="kid"     ? 1.2 :
    type==="doctor"  ? 1.2 :
    type==="teacher" ? 1.2 :
    type==="elderly" ? 0.9 : 1.0;
  entities.push(new Entity(type, x, y, speed));
}
window.spawn = spawn; // ensure global

// Save/Load (global)
function saveWorld(){
  const data = {
    day, time, raining,
    entities: entities.map(e => ({
      type:e.type, x:e.x, y:e.y, speed:e.speed, age:e.age,
      hunger:e.hunger, energy:e.energy, dessertsToday:e.dessertsToday,
      needsDoctor:e.needsDoctor, wallet:e.wallet, happiness:e.happiness
    }))
  };
  const blob = new Blob([JSON.stringify(data)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "sandbox_world.json";
  a.click();
}
window.saveWorld = saveWorld;

function loadWorld(event){
  const file = event.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = function(){
    const data = JSON.parse(reader.result);
    day = data.day || 1;
    time = data.time || 0;
    raining = !!data.raining;
    entities.length = 0;
    (data.entities || []).forEach(ed => {
      const e = new Entity(ed.type, ed.x, ed.y, ed.speed);
      Object.assign(e, ed);
      entities.push(e);
    });
  };
  reader.readAsText(file);
}
window.loadWorld = loadWorld;

// Environment
function environment(){
  time++;
  // Flip rain on/off occasionally
  if(time % 600 === 0){
    raining = Math.random() < 0.3; // 30% chance to rain each half-day
  }
  // New day: reset kids' desserts
  if(time % 1200 === 0){
    day++;
    for(const e of entities){
      if(e.type === "kid") e.dessertsToday = 0;
    }
  }
}

// Main loop
function loop(){
  environment();
  drawBackground();
  for(const e of entities){
    e.move();
    e.draw();
  }
  // Stats
  const counts = {};
  for(const e of entities){ counts[e.type] = (counts[e.type]||0)+1; }
  const summary = Object.entries(counts).map(([k,v])=>`${k}:${v}`).join("  ");
  document.getElementById("statsText").textContent =
    `Day ${day} | Time ${time} | ${entities.length} entities | ${isNight()?'Night':'Day'} | ${raining?'Rain':'Clear'}${summary ? ' | '+summary : ''}`;

  requestAnimationFrame(loop);
}

// Start
loop();
</script>
</body>
</html>
