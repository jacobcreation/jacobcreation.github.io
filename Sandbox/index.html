<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Web Sandbox v2 — AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#0f1220;--panel:#161a2e;--text:#e7eaf6;--muted:#9aa3c7;
  --accent:#6ee7ff;--ok:#9bf8a0;--warn:#ffd166;--err:#ff6b6b;
}
*{box-sizing:border-box}
body{
  margin:0;font-family:system-ui,ui-monospace,monospace;
  background:linear-gradient(135deg,var(--bg),#101639);
  color:var(--text);
  min-height:100vh;
  display:grid;
  grid-template-rows:auto 1fr auto;
}
header,footer{
  padding:10px 14px;
  background:rgba(255,255,255,.05);
  border-bottom:1px solid rgba(255,255,255,.08)
}
footer{
  border-top:1px solid rgba(255,255,255,.08);
  font-size:12px;color:var(--muted)
}
header{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
main{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  padding:14px
}
.panel{
  background:var(--panel);
  border-radius:12px;
  display:flex;
  flex-direction:column;
  overflow:hidden
}
button{
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2);
  color:var(--text);
  border-radius:8px;
  padding:4px 10px;
  cursor:pointer
}
button.primary{
  background:linear-gradient(135deg,#6ee7ff,#9bf8a0);
  color:#0f1220;
  font-weight:600
}
.tabs{display:flex;gap:4px;padding:4px;border-bottom:1px solid rgba(255,255,255,.1)}
.tab{
  padding:4px 10px;border-radius:6px;
  cursor:pointer;font-size:13px;
  background:rgba(255,255,255,.05)
}
.tab.active{background:rgba(110,231,255,.25)}
textarea{
  flex:1;background:transparent;border:none;
  color:var(--text);padding:12px;
  font-family:ui-monospace,monospace;
  resize:none;outline:none
}
.console{
  background:#0b1024;
  font-size:12px;height:140px;
  overflow:auto
}
.line{padding:3px 6px;border-bottom:1px solid rgba(255,255,255,.05)}
.log{color:var(--accent)}
.warn{color:var(--warn)}
.err{color:var(--err)}
.ok{color:var(--ok)}
iframe,canvas{flex:1;border:0;background:#fff}
#aiPanel{
  border-top:1px solid rgba(255,255,255,.1);
  padding:8px;
  font-size:13px;
  white-space:pre-wrap;
  max-height:160px;
  overflow:auto;
}
@media(max-width:900px){
  main{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
  <button class="primary" onclick="run()">▶ Run</button>
  <button onclick="toggleCanvas()">🧪 Canvas</button>
  <button onclick="toggleAudio()">🎵 Audio</button>
  <button onclick="uploadFiles()">📂 Upload</button>
  <button onclick="downloadZip()">⬇ Download ZIP</button>
  <button onclick="askAI()">🤖 Ask AI</button>
  <strong>Web Sandbox v2</strong>
  <span style="margin-left:auto" id="status">Ready</span>
</header>

<main>
<section class="panel">
  <div class="tabs" id="tabs"></div>
  <textarea id="editor"></textarea>
  <div class="console" id="console"></div>
</section>

<section class="panel">
  <iframe id="frame" sandbox="allow-scripts"></iframe>
  <canvas id="canvas" hidden></canvas>
  <div id="aiPanel">AI help will appear here…</div>
</section>
</main>

<footer>Upload • Split • Run • AI • Download ZIP</footer>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<script>
const WORKER_URL="https://sandbox-ai.b4rjxr9lk.workers.dev/";

const DEFAULT={
  html:"<h1>Hello Sandbox</h1>",
  css:"body{text-align:center}",
  js:"console.log('Ready')"
};

let files=JSON.parse(localStorage.v2files||"null")||DEFAULT;
let current="html";
let mode="dom";

const editorEl=document.getElementById("editor");
const tabsEl=document.getElementById("tabs");
const frameEl=document.getElementById("frame");
const canvasEl=document.getElementById("canvas");
const ctx=canvasEl.getContext("2d");
const consoleEl=document.getElementById("console");
const aiPanelEl=document.getElementById("aiPanel");
const statusEl=document.getElementById("status");

function renderTabs(){
  tabsEl.innerHTML="";
  ["html","css","js"].forEach(t=>{
    const el=document.createElement("div");
    el.className="tab"+(t===current?" active":"");
    el.textContent=t.toUpperCase();
    el.onclick=()=>switchTab(t);
    tabsEl.appendChild(el);
  });
}
function switchTab(t){
  save();current=t;
  editorEl.value=files[t]||"";
  renderTabs();
}
function save(){
  files[current]=editorEl.value;
  localStorage.v2files=JSON.stringify(files);
}
editorEl.oninput=save;

function log(type,msg){
  const d=document.createElement("div");
  d.className="line "+type;
  d.textContent=msg;
  consoleEl.appendChild(d);
  consoleEl.scrollTop=consoleEl.scrollHeight;
}

function run(){
  save();consoleEl.textContent="";
  if(mode==="dom") runDOM();
  if(mode==="canvas") runCanvas();
  if(mode==="audio") runAudio();
}

function runDOM(){
  const safeJS = files.js.replace(/`/g,"\\`");
  canvasEl.hidden=true;frameEl.hidden=false;
  frameEl.srcdoc=`
<!DOCTYPE html>
<html>
<head><style>${files.css}</style></head>
<body>
${files.html}
<script>
const send=(t,m)=>parent.postMessage({t,m},'*');
console.log=(...a)=>send('log',a.join(' '));
try{(()=>{${safeJS}})();send('ok','Done')}
catch(e){send('err',e.toString())}
<\/script>
</body>
</html>`;
}

function runCanvas(){
  frameEl.hidden=true;canvasEl.hidden=false;
  canvasEl.width=canvasEl.clientWidth;
  canvasEl.height=canvasEl.clientHeight;
  function loop(){
    ctx.clearRect(0,0,canvasEl.width,canvasEl.height);
    try{eval(files.js)}catch(e){log("err",e.toString())}
    requestAnimationFrame(loop);
  }
  loop();
}

function runAudio(){
  const a=new AudioContext();
  const o=a.createOscillator();
  o.connect(a.destination);
  o.start();setTimeout(()=>o.stop(),500);
}

function toggleCanvas(){mode="canvas"}
function toggleAudio(){mode="audio"}

async function askAI(){
  aiPanelEl.textContent="Thinking…";
  const res=await fetch(WORKER_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({prompt:JSON.stringify(files)})
  });
  const data=await res.json();
  aiPanelEl.textContent=data.reply||"No response";
}

renderTabs();
switchTab("html");
run();
</script>

</body>
</html>
