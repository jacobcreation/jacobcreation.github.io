<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>🧪 JacobCreation</title>
  <link rel="icon" href="data:,">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      background: #020617;
      color: #e5e7eb;
      font-family: system-ui, monospace;
    }

    header {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: #0f172a;
      border-bottom: 1px solid #1f2937;
    }

    button {
      background: #1f2937;
      color: #e5e7eb;
      border: 1px solid #374151;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    #layout {
      display: grid;
      grid-template-columns: 50% 6px 50%;
      height: 100%;
    }

    #divider {
      background: #1f2937;
      cursor: col-resize;
    }

    #left {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    #tabs {
      display: flex;
      border-bottom: 1px solid #1f2937;
    }

    .tab {
      padding: 8px 14px;
      cursor: pointer;
      font-size: 12px;
      color: #9ca3af;
    }

    .tab.active {
      background: #0f172a;
      color: #38bdf8;
    }

    textarea {
      flex: 1;
      background: #020617;
      color: #e5e7eb;
      border: none;
      padding: 12px;
      resize: none;
      outline: none;
    }

    iframe {
      border: none;
      width: 100%;
      height: 100%;
      background: white;
    }

    #aiPanel {
      display: none;
      flex: 1;
      flex-direction: column;
    }

    #aiChat {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ai-user {
      align-self: flex-end;
      background: #2563eb;
      padding: 8px 10px;
      border-radius: 12px 12px 0 12px;
    }

    .ai-bot {
      align-self: flex-start;
      background: #1f2937;
      padding: 8px 10px;
      border-radius: 12px 12px 12px 0;
    }

    #aiInput {
      height: 42px;
      border: none;
      padding: 10px;
      background: #0f172a;
      color: #e5e7eb;
    }

    #console {
      display: none;
      height: 120px;
      border-top: 1px solid #1f2937;
      overflow: auto;
      font-size: 12px;
      padding: 6px;
    }

    .console-log {
      color: #9ca3af;
    }

    .console-warn {
      color: #facc15;
    }

    .console-error {
      color: #f87171;
    }
  </style>
</head>

<body>

  <header>
    <button id="run">▶ Run</button>
    <button id="downloadZip">⬇ ZIP</button>
    <button id="uploadZipBtn">⬆ Upload</button>
    <button id="copyLink">🔗 Copy</button>
    <button id="clearConsole">🧹 Console</button>
    <button id="clearChat">🧹 Chat</button>
    <input type="file" id="uploadZip" hidden />
  </header>

  <div id="layout">
    <div id="left">
      <div id="tabs">
        <div class="tab active" data-tab="html">HTML</div>
        <div class="tab" data-tab="css">CSS</div>
        <div class="tab" data-tab="js">JS</div>
        <div class="tab" data-tab="ai">AI</div>
      </div>

      <textarea id="code"></textarea>

      <div id="aiPanel">
        <div id="aiChat">
          <div class="ai-bot">Hi! I’m PoliteBot 🤗</div>
        </div>
        <input id="aiInput" placeholder="Ask AI and press Enter…" />
      </div>
    </div>

    <div id="divider"></div>
    <iframe id="preview"></iframe>
  </div>

  <div id="console"></div>

  <script type="module" src="./app.js"></script>
</body>

</html>
