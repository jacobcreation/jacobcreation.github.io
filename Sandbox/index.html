<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Web Sandbox</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
<header>
  <button id="run">▶ Run</button>

  <div id="tabs">
    <button data-file="html" class="active">HTML</button>
    <button data-file="css">CSS</button>
    <button data-file="js">JS</button>
  </div>

  <strong style="margin-left:auto">Web Sandbox</strong>
</header>

<main>
  <section id="editor">
    <textarea id="code"></textarea>
    <div id="console"></div>
  </section>

  <section id="preview">
    <iframe id="frame"></iframe>

    <div id="ai">
      <div id="aiLog">🤖 AI ready. Ask about your code.</div>
      <input id="aiInput" placeholder="Ask AI…" />
    </div>
  </section>
</main>

<script type="module" src="./app.js"></script>
</body>
</html>
