<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Web Sandbox — AI Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>

<body>
<header>
  <button id="run">▶ Run</button>
  <button id="fix">🧠 Fix with AI</button>
  <button id="explain">❓ Explain Error</button>
  <button id="zip">⬇ ZIP</button>
  <strong>Web Sandbox AI</strong>
</header>

<main>
  <aside id="files"></aside>

  <section id="editor">
    <textarea id="code"></textarea>
    <div id="console"></div>
  </section>

  <section id="preview">
    <iframe id="frame"></iframe>
    <canvas id="canvas"></canvas>
    <div id="ai">
      <div id="aiLog"></div>
      <input id="aiInput" placeholder="Ask AI…" />
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
