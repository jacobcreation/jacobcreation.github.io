<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Write HTML, CSS, and JavaScript side by side with live preview, ZIP import/export, console tools, and a built-in helper chat." />
  <title>Jacob Sandbox</title>
  <link rel="icon" href="data:,">
  <script src="/project-polish.js" defer></script>

  <style>
    :root {
      --bg: #020617;
      --panel: rgba(15, 23, 42, 0.9);
      --panel-2: rgba(15, 23, 42, 0.74);
      --border: rgba(148, 163, 184, 0.18);
      --text: #e5eefc;
      --muted: rgba(226, 232, 240, 0.72);
      --accent: #38bdf8;
      --accent-2: #60a5fa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.18), transparent 28%),
        radial-gradient(circle at top right, rgba(96, 165, 250, 0.12), transparent 34%),
        linear-gradient(180deg, #020617, #020817 55%, #02050f);
      color: var(--text);
      font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 18px 14px;
      background: rgba(2, 6, 23, 0.72);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px);
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.15rem;
      letter-spacing: 0.01em;
    }

    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button {
      background: rgba(148, 163, 184, 0.12);
      color: var(--text);
      border: 1px solid rgba(148, 163, 184, 0.2);
      padding: 9px 13px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease;
    }

    button:hover {
      transform: translateY(-1px);
      background: rgba(148, 163, 184, 0.18);
      border-color: rgba(148, 163, 184, 0.34);
    }

    #run {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #031120;
      border-color: rgba(96, 165, 250, 0.55);
      box-shadow: 0 12px 24px rgba(56, 189, 248, 0.2);
    }

    #layout {
      display: grid;
      grid-template-columns: 50% 6px 50%;
      min-height: 0;
      flex: 1;
    }

    #divider {
      background: linear-gradient(180deg, rgba(56, 189, 248, 0.22), rgba(96, 165, 250, 0.1));
      cursor: col-resize;
    }

    #left {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--panel-2);
    }

    #tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(2, 6, 23, 0.46);
    }

    .tab {
      padding: 10px 14px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #94a3b8;
      border-radius: 999px;
      transition: background 0.16s ease, color 0.16s ease;
    }

    .tab.active {
      background: rgba(56, 189, 248, 0.14);
      color: #7dd3fc;
    }

    textarea {
      flex: 1;
      min-height: 0;
      background: transparent;
      color: var(--text);
      border: none;
      padding: 16px 18px;
      resize: none;
      outline: none;
      font: 500 14px/1.6 "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    iframe {
      border: none;
      width: 100%;
      height: 100%;
      background: white;
    }

    #aiPanel {
      display: none;
      flex: 1;
      flex-direction: column;
      min-height: 0;
    }

    #aiChat {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ai-user {
      align-self: flex-end;
      max-width: min(80%, 520px);
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      padding: 8px 10px;
      border-radius: 12px 12px 0 12px;
    }

    .ai-bot {
      align-self: flex-start;
      max-width: min(80%, 520px);
      background: rgba(30, 41, 59, 0.92);
      padding: 8px 10px;
      border-radius: 12px 12px 12px 0;
    }

    #aiInput {
      min-height: 48px;
      border: none;
      padding: 12px 14px;
      background: rgba(15, 23, 42, 0.95);
      color: var(--text);
      border-top: 1px solid var(--border);
    }

    #console {
      display: none;
      height: 120px;
      border-top: 1px solid var(--border);
      overflow: auto;
      font-size: 12px;
      padding: 10px 12px;
      background: rgba(2, 6, 23, 0.92);
    }

    .console-log {
      color: #9ca3af;
    }

    .console-warn {
      color: #facc15;
    }

    .console-error {
      color: #f87171;
    }

    @media (max-width: 900px) {
      header {
        flex-direction: column;
        align-items: stretch;
      }

      .toolbar {
        justify-content: flex-start;
      }

      #layout {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(320px, 1fr) 6px minmax(280px, 1fr);
      }

      #divider {
        cursor: row-resize;
      }
    }
  </style>
</head>

<body data-project-subtitle="A browser-based coding sandbox with live preview, tabbed editors, and helper chat.">
  <header>
    <div class="brand">
      <h1>Jacob Sandbox</h1>
      <p>Build little web experiments live, then preview, zip, share, or ask the helper panel for ideas.</p>
    </div>
    <div class="toolbar">
      <button id="run">▶ Run</button>
      <button id="downloadZip">⬇ ZIP</button>
      <button id="uploadZipBtn">⬆ Upload</button>
      <button id="copyLink">🔗 Copy</button>
      <button id="clearConsole">🧹 Console</button>
      <button id="clearChat">🧹 Chat</button>
      <input type="file" id="uploadZip" hidden />
    </div>
  </header>

  <div id="layout">
    <div id="left">
      <div id="tabs">
        <div class="tab active" data-tab="html">HTML</div>
        <div class="tab" data-tab="css">CSS</div>
        <div class="tab" data-tab="js">JS</div>
        <div class="tab" data-tab="ai">AI</div>
      </div>

      <textarea id="code"></textarea>

      <div id="aiPanel">
        <div id="aiChat">
          <div class="ai-bot">Hi! I’m PoliteBot. Ask for layout ideas, debugging help, or a starter snippet.</div>
        </div>
        <input id="aiInput" placeholder="Ask AI and press Enter…" />
      </div>
    </div>

    <div id="divider"></div>
    <iframe id="preview"></iframe>
  </div>

  <div id="console"></div>

  <script type="module" src="./app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/service-worker.js");
    }
  </script>
</body>

</html>
