<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Advanced JavaScript Sandbox</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --bg:#0f1220; --panel:#161a2e; --text:#e7eaf6; --muted:#9aa3c7;
  --accent:#6ee7ff; --success:#9bf8a0; --danger:#ff6b6b; --warn:#ffd166;
}
*{box-sizing:border-box}
body{
  margin:0;font-family:system-ui,monospace;
  background:linear-gradient(135deg,#0f1220,#101639);
  color:var(--text);min-height:100vh;
  display:grid;grid-template-rows:auto 1fr auto
}

/* HEADER */
header{
  padding:12px 16px;
  background:rgba(255,255,255,.05);
  border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;
  align-items:center;
  gap:12px
}

/* HOME BUTTON */
.home-btn{
  background:linear-gradient(135deg,#6ee7ff,#9bf8a0);
  color:#0f1220;
  border:none;
  border-radius:999px;
  padding:6px 14px;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 0 12px rgba(110,231,255,.4);
  transition:transform .15s ease, box-shadow .15s ease;
}
.home-btn:hover{
  transform:translateY(-1px) scale(1.05);
  box-shadow:0 0 18px rgba(155,248,160,.6);
}
.home-btn:active{
  transform:scale(.97);
}

/* FOOTER */
footer{
  padding:12px 16px;
  background:rgba(255,255,255,.05);
  border-top:1px solid rgba(255,255,255,.08);
  font-size:12px;
  color:var(--muted)
}

/* LAYOUT */
main{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  padding:16px
}
.panel{
  background:var(--panel);
  border-radius:12px;
  display:flex;
  flex-direction:column;
  overflow:hidden
}
.toolbar{
  display:flex;
  gap:8px;
  padding:8px;
  border-bottom:1px solid rgba(255,255,255,.08)
}
button{
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2);
  color:var(--text);
  border-radius:8px;
  padding:6px 12px;
  cursor:pointer
}
button:disabled{
  opacity:.4;
  cursor:not-allowed
}
textarea{
  flex:1;
  background:transparent;
  border:none;
  color:var(--text);
  font-family:ui-monospace,monospace;
  padding:12px;
  resize:none;
  outline:none
}
.output{
  background:#0b1024;
  font-family:ui-monospace,monospace;
  font-size:12px;
  height:180px;
  overflow:auto;
  border-top:1px solid rgba(255,255,255,.08)
}
.line{
  display:flex;
  gap:8px;
  padding:2px 6px
}
.ts{color:var(--muted);min-width:80px}
.tag{min-width:50px;font-weight:bold}
.log{color:var(--accent)}
.info{color:var(--success)}
.warn{color:var(--warn)}
.error{color:var(--danger)}
iframe{
  flex:1;
  border:0;
  background:#fff
}

@media(max-width:900px){
  main{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
  <button class="home-btn" onclick="goHome()">🏠 Back to Home</button>
  <strong>🧪 JavaScript Sandbox</strong>
</header>

<main>

<section class="panel">
  <div class="toolbar">
    <button id="runBtn">Run</button>
    <button id="resetBtn">Reset</button>
    <button id="clearBtn">Clear console</button>
  </div>
  <textarea id="editor"></textarea>
  <div class="output" id="console"></div>
</section>

<section class="panel">
  <iframe id="frame" sandbox="allow-scripts"></iframe>
</section>

</main>

<footer>
  Safe iframe sandbox • Auto-save • Empty editor = silent
</footer>

<script>
function goHome(){
  window.location.href = "index.html"; // change if needed
}

const editor = document.getElementById('editor');
const consoleEl = document.getElementById('console');
const frame = document.getElementById('frame');
const runBtn = document.getElementById('runBtn');
const resetBtn = document.getElementById('resetBtn');
const clearBtn = document.getElementById('clearBtn');

const SAMPLE = `console.log("Hello sandbox!");

const btn = document.createElement("button");
btn.textContent = "Click me";
btn.onclick = () => console.log("Clicked!");
document.body.appendChild(btn);`;

editor.value = localStorage.getItem('sandbox_code') || SAMPLE;
updateRunState();

function ts(){return new Date().toLocaleTimeString();}
function addLine(type,msg){
  const d=document.createElement('div');
  d.className='line '+type;
  d.innerHTML=\`<span class="ts">\${ts()}</span>
               <span class="tag">\${type.toUpperCase()}</span>
               <span>\${msg}</span>\`;
  consoleEl.appendChild(d);
  consoleEl.scrollTop=consoleEl.scrollHeight;
}

function clearAll(){
  consoleEl.textContent='';
  frame.srcdoc='<!DOCTYPE html><html><body></body></html>';
}

function updateRunState(){
  runBtn.disabled=!editor.value.trim();
}

editor.addEventListener('input',()=>{
  localStorage.setItem('sandbox_code',editor.value);
  updateRunState();
  if(!editor.value.trim()) clearAll();
});

window.addEventListener('message',e=>{
  if(e.data?.__sandbox) addLine(e.data.type,e.data.text);
});

runBtn.onclick=()=>runCode(editor.value);
clearBtn.onclick=()=>consoleEl.textContent='';
resetBtn.onclick=()=>{
  editor.value=SAMPLE;
  localStorage.setItem('sandbox_code',SAMPLE);
  updateRunState();
  runCode(SAMPLE);
};

function runCode(code){
  if(!code.trim()){clearAll();return;}
  consoleEl.textContent='';
  frame.srcdoc=\`
<!DOCTYPE html>
<html><body>
<script>
const send=(type,text)=>parent.postMessage({__sandbox:1,type,text},'*');
console.log=(...a)=>send('log',a.join(' '));
console.warn=(...a)=>send('warn',a.join(' '));
console.error=(...a)=>send('error',a.join(' '));
window.onerror=(m,s,l,c,e)=>send('error',e?.stack||m);
try{(function(){\${code}})();send('info','Execution finished');}
catch(e){console.error(e.stack||e);}
<\/script>
</body></html>\`;
}

runCode(editor.value);
</script>

</body>
</html>
