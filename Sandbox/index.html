<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>🧪 JacobCreation</title>
  <link rel="icon" href="data:,">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: #020617;
      color: #e5e7eb;
      font-family: system-ui, monospace;
    }

    header {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: #0f172a;
      border-bottom: 1px solid #1f2937;
    }

    button {
      background: #1f2937;
      color: #e5e7eb;
      border: 1px solid #374151;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    #layout {
      display: grid;
      grid-template-columns: 50% 6px 50%;
    }

    #divider {
      background: #1f2937;
    }

    #left {
      display: flex;
      flex-direction: column;
    }

    #tabs {
      display: flex;
      background: #020617;
      border-bottom: 1px solid #1f2937;
    }

    .tab {
      padding: 8px 14px;
      cursor: pointer;
      font-size: 12px;
      color: #9ca3af;
    }

    .tab.active {
      background: #0f172a;
      color: #38bdf8;
    }

    textarea {
      flex: 1;
      background: #020617;
      color: #e5e7eb;
      border: none;
      padding: 12px;
      resize: none;
      outline: none;
    }

    iframe {
      border: none;
      width: 100%;
      height: 100%;
      background: white;
    }

    #console {
      height: 120px;
      background: #020617;
      border-top: 1px solid #1f2937;
      overflow: auto;
      font-size: 12px;
      padding: 6px;
    }

    .console-log {
      color: #9ca3af;
    }

    .console-warn {
      color: #facc15;
    }

    .console-error {
      color: #f87171;
    }

    #aiLog {
      height: 140px;
      overflow: auto;
      padding: 6px;
      background: #020617;
      border-top: 1px solid #1f2937;
    }

    .chat-user {
      color: #38bdf8;
    }

    .chat-ai {
      color: #e5e7eb;
    }
  </style>
</head>

<body>

  <header>
    <button id="run">▶ Run</button>
    <button id="downloadZip">⬇ ZIP</button>
    <button id="clearConsole">🧹 Console</button>
  </header>

  <div id="layout">
    <div id="left">
      <div id="tabs">
        <div class="tab active" data-tab="html">HTML</div>
        <div class="tab" data-tab="css">CSS</div>
        <div class="tab" data-tab="js">JS</div>
      </div>
      <textarea id="code"></textarea>
    </div>

    <div id="divider"></div>
    <iframe id="preview"></iframe>
  </div>

  <div id="console"></div>

  <div id="aiLog">🤖 AI ready. Ask about your code.</div>
  <input id="aiInput" placeholder="Ask AI and press Enter…" />

  <script type="module" src="./app.js"></script>
</body>

</html>
