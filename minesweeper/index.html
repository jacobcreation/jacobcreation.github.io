<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Minesweeper - JacobCreation</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo" onclick="window.location.href='/'" style="cursor: pointer;">
                <span class="logo-badge">J</span>
                <span class="logo-text">JacobCreation</span>
            </div>
            <nav>
                <a href="/">Back to Home</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="game-container">
            <div class="game-header">
                <h1>Minesweeper</h1>
                <div class="stats-bar">
                    <div class="stat-box">
                        <span class="label">Mines</span>
                        <span id="mine-count" class="value">000</span>
                    </div>
                    <div class="stat-box">
                        <span class="label">Time</span>
                        <span id="timer" class="value">000</span>
                    </div>
                </div>
                <div class="controls">
                    <select id="difficulty">
                        <option value="beginner">Beginner</option>
                        <option value="intermediate">Intermediate</option>
                        <option value="expert">Expert</option>
                        <option value="custom">Custom</option>
                    </select>
                    <button id="new-game-btn" class="btn btn-primary">New Game</button>
                </div>
                <div id="mobile-controls" class="mobile-only">
                    <button id="toggle-flag" class="btn btn-secondary">
                        <span class="icon">🔍</span> Reveal Mode
                    </button>
                </div>
            </div>

            <div id="game-board-wrapper">
                <div id="game-board" class="beginner">
                    <!-- Grid will be generated here -->
                </div>
            </div>

            <div id="custom-settings" class="hidden">
                <div class="input-group">
                    <label>Width: <input type="number" id="custom-width" min="5" max="50" value="10"></label>
                    <label>Height: <input type="number" id="custom-height" min="5" max="50" value="10"></label>
                    <label>Mines: <input type="number" id="custom-mines" min="1" max="2499" value="10"></label>
                </div>
            </div>
            
            <div class="game-footer">
                <p id="game-status"></p>
                <div class="instructions desktop-only">
                    <span>Left Click: Reveal</span> | <span>Right Click: Flag</span> | <span>Middle Click/Double Click: Chord</span>
                </div>
                <div class="instructions mobile-only">
                    <span>Tap to Reveal/Flag</span> | <span>Long Press to Toggle</span>
                </div>
            </div>
        </section>
    </main>

    <footer>
        © 2026 JacobCreation • Built by Jacob 💙
    </footer>

    <script src="/project-polish.js" defer></script>
    <script src="script.js"></script>
</body>
</html>
