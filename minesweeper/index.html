<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Cache Busting Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Minesweeper - JacobCreation</title>
    <link href="/fonts/fonts.css" rel="stylesheet">
    <link href="/fonts/fonts.css" rel="stylesheet">
    <script>(function(){const v=Date.now();document.write('<link rel="stylesheet" href="style.css?v='+v+'">');})();</script>
</head>
<body>

    <main>
        <section class="game-container">
            <div class="game-header">
                <h1>Minesweeper</h1>
                <div class="stats-bar">
                    <div class="stat-box">
                        <span class="label">Mines</span>
                        <span id="mine-count" class="value">000</span>
                    </div>
                    <div class="stat-box">
                        <span class="label">Time</span>
                        <span id="timer" class="value">000</span>
                    </div>
                </div>
                <div class="controls">
                    <select id="difficulty">
                        <option value="beginner">Beginner</option>
                        <option value="intermediate">Intermediate</option>
                        <option value="expert">Expert</option>
                        <option value="custom">Custom</option>
                    </select>
                    <button id="new-game-btn" class="btn btn-primary">New Game</button>
                </div>
                <div id="mobile-controls" class="mobile-only">
                    <button id="toggle-flag" class="btn btn-secondary">
                        <span class="icon">🔍</span> Reveal Mode
                    </button>
                </div>
            </div>

            <div id="game-board-wrapper">
                <div id="game-board" class="beginner">
                    <!-- Grid will be generated here -->
                </div>
            </div>

            <div id="custom-settings" class="hidden">
                <div class="input-group">
                    <label>Width: <input type="number" id="custom-width" min="5" max="50" value="10"></label>
                    <label>Height: <input type="number" id="custom-height" min="5" max="50" value="10"></label>
                    <label>Mines: <input type="number" id="custom-mines" min="1" max="2499" value="10"></label>
                </div>
            </div>
            
            <div class="game-footer">
                <p id="game-status"></p>
                <div class="instructions desktop-only">
                    <span>Left Click: Reveal</span> | <span>Right Click: Flag</span> | <span>Middle Click/Double Click: Chord</span>
                </div>
                <div class="instructions mobile-only">
                    <span>Tap to Reveal/Flag</span> | <span>Long Press to Toggle</span>
                </div>
            </div>
        </section>
    </main>

    <footer>
        © 2026 JacobCreation • Built by Jacob 💙
    </footer>

    <script>(function(){const v=Date.now();document.write('<script src="script.js?v='+v+'"><\/script>');})();</script>
<script>(function(){const v=Date.now();document.write('<script src="/global-header.js?v='+v+'"><\/script>');})();</script>
    <script src="/accounts/account-widget.js" defer data-account-api="https://accounts-system.b4rjxr9lk.workers.dev"></script>
</body>
</html>
